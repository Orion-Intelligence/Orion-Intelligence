services:
  web:
    build:
      context: .
      dockerfile: dockerFiles/api_docker_dev
    volumes:
      - ./backend/sitecustomize.py:/app/sitecustomize.py:ro
      - ./backend/main.py:/app/main.py:cached
      - ./backend/interface.py:/app/interface.py:cached
      - ./backend/configs:/app/configs:cached
      - ./backend/orion:/app/orion:cached
      - ./backend/routes:/app/routes:cached
      - ./backend/static:/app/static:cached
      - ./backend/migrations:/app/migrations:cached
      - ./client/build:/app/build:delegated
      - ./client/src/assets:/app/build/assets:ro
    command: >
      sh -c "python3 /app/cronjobs.py & exec uvicorn main:app --host 0.0.0.0 --port 8070 --reload --reload-dir /app"

  frontend:
    container_name: trusted-web-frontend
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./client:/app:cached
      - client_node_modules:/app/node_modules
    command: >
      sh -c "npm ci && npx ng serve --configuration development --host 0.0.0.0 --port 4200 --poll 2000 --proxy-config proxy.docker.conf.json"
    ports:
      - "4200:4200"
    networks:
      - backend
    depends_on:
      - web

  nginx:
    depends_on:
      - web
      - frontend

volumes:
  client_node_modules:
