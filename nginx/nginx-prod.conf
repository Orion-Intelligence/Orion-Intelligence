worker_processes auto;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    open_file_cache off;
    server_tokens off;
    server_names_hash_bucket_size 128;
    autoindex off;
    resolver 127.0.0.11 ipv6=off;

    map $request_method $upstream_method {
        default $request_method;
        HEAD GET;
    }

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m use_temp_path=off;

    brotli on;
    brotli_comp_level 8;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        text/xml
        application/xml
        image/svg+xml
        application/x-javascript
        text/x-js;
    brotli_min_length 20;

    gzip on;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        text/xml
        application/xml
        image/svg+xml
        application/x-javascript
        text/x-js;
    gzip_min_length 20;
    gzip_vary on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Server "Secure Gateway" always;

    map $request_uri $bad_traversal {
        default 0;
        ~*"\.\./" 1;
        ~*"%2e%2e/" 1;
        ~*"\.%2e/" 1;
        ~*"%2e\./" 1;
        ~*"%2f\.\.%2f" 1;
        ~*"%5c\.\.%5c" 1;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;
    client_body_buffer_size 8m;

    server {
        listen 80;
        server_name try.orionintelligence.org tor2web.orionintelligence.org;
        client_max_body_size 16m;

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        server_name "~^(?:[a-z0-9-]+\\.)*[a-z2-7]{16,56}\\.onion\\.tor2web\\.orionintelligence\\.org$";
        client_max_body_size 16m;

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        client_max_body_size 16m;
        server_name "~^(?:[a-z0-9-]+\\.)*[a-z2-7]{16,56}\\.onion\\.tor2web\\.orionintelligence\\.org$";

        if ($bad_traversal) { return 403; }

        ssl_certificate /etc/letsencrypt/live/tor2web.orionintelligence.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tor2web.orionintelligence.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 127.0.0.11 ipv6=off valid=300s;
        resolver_timeout 10s;

        location / {
            proxy_pass http://tor2web-official:38080;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            sub_filter_once off;
            sub_filter_types text/html application/javascript application/x-javascript text/javascript;
            sub_filter "window[_0x46f2a6(0x195)](host)['indexOf']('.onion')>-0x1?window['location'][_0x46f2a6(0x18f)]=window[_0x46f2a6(0x195)](_0x46f2a6(0x19e)):window[_0x46f2a6(0x1a1)][_0x46f2a6(0x18f)]=window['atob'](_0x46f2a6(0x19f))" "void(0)";
            gzip off;
            brotli off;
            add_header X-Accel-Buffering no always;
        }
    }

    server {
        listen 443 ssl;
        client_max_body_size 16m;
        server_name try.orionintelligence.org tor2web.orionintelligence.org;

        if ($bad_traversal) { return 403; }

        ssl_certificate /etc/letsencrypt/live/try.orionintelligence.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/try.orionintelligence.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 127.0.0.11 ipv6=off valid=300s;
        resolver_timeout 10s;

        error_page 404 /404.html;
        error_page 403 /403.html;
        error_page 405 500 502 503 504 /500.html;

        location = /robots.txt {
            alias /app/static/robots.txt;
            add_header Cache-Control "public, max-age=1";
        }

        location ~ /\.(?!well-known/) {
            deny all;
        }

        location ^~ /api/s/static/system/ {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://trusted-web-main:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;

            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /api/s/static/favicon {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://trusted-web-main:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;

            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /api/public {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://trusted-web-main:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;

            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /api/insight {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://trusted-web-main:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;

            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location /api/ {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://trusted-web-main:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /admin/ {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://trusted-web-main:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors on;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        location ~* ^/(?:runtime|polyfills|main|styles|common|[0-9]+)\.[^/]+\.(?:js|css|map)$ {
            root /client_build;
            try_files $uri =404;

            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /assets/ {
            root /client_build;
            try_files $uri =404;

            access_log off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /tor2web {
            set $target_input $arg_url;
            set $extra_args "";
            if ($args ~* '^url=[^&]*&(.*)$') {
                set $extra_args $1;
            }
            error_page 418 = @tor2web_redirect;
            return 418;
        }

        location = /tor2web/ {
            set $target_input $arg_url;
            set $extra_args "";
            if ($args ~* '^url=[^&]*&(.*)$') {
                set $extra_args $1;
            }
            error_page 418 = @tor2web_redirect;
            return 418;
        }

        location @tor2web_redirect {
            if ($target_input = "") {
                return 400 "Missing url query parameter.\n";
            }

            set $target_host "";
            set $target_scheme http;
            set $target_path "";
            set $target_query "";

            if ($target_input ~* '^(https?)(?::|%3[aA])') {
                set $target_scheme $1;
            }

            if ($target_input ~* '((?:[a-z0-9-]+\.)*[a-z2-7]{16,56}\.onion)') {
                set $target_host $1;
            }

            if ($target_input ~* '^(?:[a-z]+:)?(?:(?:%2[fF]|/)+)?[^/?#]+(/[^?#]*)?(\?[^#]*)?$') {
                set $target_path $1;
                set $target_query $2;
            }

            if ($target_host !~* '^(?:[a-z0-9-]+\.)*[a-z2-7]{16,56}\.onion$') {
                return 400 "Official Tor2web only supports onion targets.\n";
            }

            if ($target_path = "") {
                set $target_path /;
            }

            set $query_joiner "";
            if ($extra_args != "") {
                set $query_joiner ?;
            }
            if ($target_query != "") {
                set $query_joiner &;
            }
            if ($extra_args != "") {
                set $target_query $target_query$query_joiner$extra_args;
            }

            return 302 https://$target_host.tor2web.orionintelligence.org$target_path$target_query;
        }

        location / {
            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_intercept_errors on;
            proxy_pass http://trusted-web-main:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;
            add_header Cache-Control "private, max-age=15, must-revalidate";
        }

        location /static/ {
            alias /app/static/;
            index index.html;

            proxy_cache static_cache;
            proxy_cache_valid 200 302 30d;
            proxy_cache_valid 404 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;
            proxy_cache_lock on;

            brotli_static on;
            gzip_static on;

            types {
                image/svg+xml svg;
                text/javascript js;
                text/css css;
                font/ttf ttf;
                font/woff woff;
                font/woff2 woff2;
                image/webp webp;
            }

            try_files $uri =404;

            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /403.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location = /404.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location = /500.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    server {
        listen 80;
        client_max_body_size 16m;
        server_name o2k3sgzqpl3o6kmx22uqxhcz2bgb34kor46wmbqvsn7vzikfxn6y66ad.onion;

        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }

            proxy_method $upstream_method;
            proxy_request_buffering on;
            proxy_pass http://trusted-web-main:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_hide_header X-AspNet-Version;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;
        }
    }
}
