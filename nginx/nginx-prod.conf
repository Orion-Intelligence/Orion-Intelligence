worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    open_file_cache off;
    server_tokens off;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m use_temp_path=off;

    brotli on;
    brotli_comp_level 8;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        text/xml
        application/xml
        image/svg+xml
        application/x-javascript
        text/x-js;
    brotli_min_length 20;

    gzip on;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        text/xml
        application/xml
        image/svg+xml
        application/x-javascript
        text/x-js;
    gzip_min_length 20;
    gzip_vary on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server {
        listen 80;
        server_name orion.genesistechnologies.org;

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name orion.genesistechnologies.org;

        ssl_certificate /etc/letsencrypt/live/orion.genesistechnologies.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orion.genesistechnologies.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 10s;

        error_page 404 /404.html;
        error_page 403 /403.html;
        error_page 405 500 502 503 504 /500.html;

        location = /robots.txt {
            alias /app/static/robots.txt;
            add_header Cache-Control "public, max-age=86400";
        }

        location /api/ {
            proxy_pass http://trusted-web-main:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_intercept_errors off;
            proxy_hide_header Strict-Transport-Security;  # Prevent backend override
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location / {
            proxy_intercept_errors on;
            proxy_pass http://trusted-web-main:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "br,gzip,deflate";
            proxy_pass_request_headers on;
            proxy_hide_header Strict-Transport-Security;  # Prevent backend override
            add_header Cache-Control "private, max-age=0, must-revalidate";
        }

        location /static/ {
            root /app/;
            index index.html;
            include /etc/nginx/mime.types;

            proxy_cache static_cache;
            proxy_cache_valid 200 302 30d;
            proxy_cache_valid 404 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;
            proxy_cache_lock on;

            brotli_static on;
            gzip_static on;

            types {
                image/svg+xml svg;
                text/javascript js;
                text/css css;
                font/ttf ttf;
                font/woff woff;
                font/woff2 woff2;
                image/webp webp;
            }

            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /403.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location = /404.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location = /500.html {
            root /app/static;
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}