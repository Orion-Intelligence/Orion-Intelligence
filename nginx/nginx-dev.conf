worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    open_file_cache off;
    resolver 127.0.0.11 ipv6=off;

    server {
        listen 8080;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/local-certs/localhost-cert.pem;
        ssl_certificate_key /etc/nginx/local-certs/localhost-key.pem;
        client_max_body_size 10m;
        error_page 404 403 405 500 502 503 504 = @fastapi_errors;

        location = /tor2web {
            set $target_input $arg_url;
            set $extra_args "";
            if ($args ~* '^url=[^&]*&(.*)$') {
                set $extra_args $1;
            }
            error_page 418 = @tor2web_proxy;
            return 418;
        }

        location = /tor2web/ {
            set $target_input $arg_url;
            set $extra_args "";
            if ($args ~* '^url=[^&]*&(.*)$') {
                set $extra_args $1;
            }
            error_page 418 = @tor2web_proxy;
            return 418;
        }

        location @tor2web_proxy {
            if ($target_input = "") {
                return 400 "Missing url query parameter.\n";
            }

            set $target_host "";
            set $target_onion_id "";
            set $target_tor2web_host "";
            set $target_scheme http;
            set $target_path "";
            set $target_query "";

            if ($target_input ~* '^(https?)(?::|%3[aA])') {
                set $target_scheme $1;
            }

            if ($target_input ~* '((?:[a-z0-9-]+\.)*[a-z2-7]{16,56}\.onion)') {
                set $target_host $1;
            }

            if ($target_input ~* '^(?:[a-z]+:)?(?:(?:%2[fF]|/)+)?[^/?#]+(/[^?#]*)?(\?[^#]*)?$') {
                set $target_path $1;
                set $target_query $2;
            }

            if ($target_host !~* '^(?:[a-z0-9-]+\.)*[a-z2-7]{16,56}\.onion$') {
                return 400 "Official Tor2web only supports onion targets.\n";
            }

            if ($target_host ~* '^((?:[a-z0-9-]+\.)*)([a-z2-7]{16,56})\.onion$') {
                set $target_tor2web_host $1$2;
            }

            if ($target_host ~* '([a-z2-7]{16,56})\.onion$') {
                set $target_onion_id $1;
            }

            if ($target_path = "") {
                set $target_path /;
            }

            set $query_joiner "";
            if ($extra_args != "") {
                set $query_joiner ?;
            }
            if ($target_query != "") {
                set $query_joiner &;
            }
            if ($extra_args != "") {
                set $target_query $target_query$query_joiner$extra_args;
            }

            set $target_request_uri $target_path$target_query;

            proxy_pass http://tor2web-official:38080$target_request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $target_tor2web_host.tor2web.local;
            proxy_set_header X-Onion-Scheme $target_scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_connect_timeout 15s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_intercept_errors off;

            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript application/x-javascript text/javascript;
            sub_filter 'href="/' 'href="/tor2web?url=$target_scheme://$target_host/';
            sub_filter "href='/" "href='/tor2web?url=$target_scheme://$target_host/";
            sub_filter 'href="images/' 'href="/tor2web?url=$target_scheme://$target_host/images/';
            sub_filter "href='images/" "href='/tor2web?url=$target_scheme://$target_host/images/";
            sub_filter 'href="img/' 'href="/tor2web?url=$target_scheme://$target_host/img/';
            sub_filter "href='img/" "href='/tor2web?url=$target_scheme://$target_host/img/";
            sub_filter 'href="css/' 'href="/tor2web?url=$target_scheme://$target_host/css/';
            sub_filter "href='css/" "href='/tor2web?url=$target_scheme://$target_host/css/";
            sub_filter 'href="js/' 'href="/tor2web?url=$target_scheme://$target_host/js/';
            sub_filter "href='js/" "href='/tor2web?url=$target_scheme://$target_host/js/";
            sub_filter 'href="assets/' 'href="/tor2web?url=$target_scheme://$target_host/assets/';
            sub_filter "href='assets/" "href='/tor2web?url=$target_scheme://$target_host/assets/";
            sub_filter 'href="static/' 'href="/tor2web?url=$target_scheme://$target_host/static/';
            sub_filter "href='static/" "href='/tor2web?url=$target_scheme://$target_host/static/";
            sub_filter 'src="/' 'src="/tor2web?url=$target_scheme://$target_host/';
            sub_filter "src='/" "src='/tor2web?url=$target_scheme://$target_host/";
            sub_filter 'src="images/' 'src="/tor2web?url=$target_scheme://$target_host/images/';
            sub_filter "src='images/" "src='/tor2web?url=$target_scheme://$target_host/images/";
            sub_filter 'src="img/' 'src="/tor2web?url=$target_scheme://$target_host/img/';
            sub_filter "src='img/" "src='/tor2web?url=$target_scheme://$target_host/img/";
            sub_filter 'src="css/' 'src="/tor2web?url=$target_scheme://$target_host/css/';
            sub_filter "src='css/" "src='/tor2web?url=$target_scheme://$target_host/css/";
            sub_filter 'src="js/' 'src="/tor2web?url=$target_scheme://$target_host/js/';
            sub_filter "src='js/" "src='/tor2web?url=$target_scheme://$target_host/js/";
            sub_filter 'src="assets/' 'src="/tor2web?url=$target_scheme://$target_host/assets/';
            sub_filter "src='assets/" "src='/tor2web?url=$target_scheme://$target_host/assets/";
            sub_filter 'src="static/' 'src="/tor2web?url=$target_scheme://$target_host/static/';
            sub_filter "src='static/" "src='/tor2web?url=$target_scheme://$target_host/static/";
            sub_filter 'action="/' 'action="/tor2web?url=$target_scheme://$target_host/';
            sub_filter "action='/" "action='/tor2web?url=$target_scheme://$target_host/";
            sub_filter 'content="/' 'content="/tor2web?url=$target_scheme://$target_host/';
            sub_filter 'url(/' 'url(/tor2web?url=$target_scheme://$target_host/';
            sub_filter 'url("/' 'url("/tor2web?url=$target_scheme://$target_host/';
            sub_filter "url('/" "url('/tor2web?url=$target_scheme://$target_host/";
            sub_filter 'url(images/' 'url(/tor2web?url=$target_scheme://$target_host/images/';
            sub_filter 'url(img/' 'url(/tor2web?url=$target_scheme://$target_host/img/';
            sub_filter 'url(css/' 'url(/tor2web?url=$target_scheme://$target_host/css/';
            sub_filter 'url(js/' 'url(/tor2web?url=$target_scheme://$target_host/js/';
            sub_filter 'url(assets/' 'url(/tor2web?url=$target_scheme://$target_host/assets/';
            sub_filter 'url(static/' 'url(/tor2web?url=$target_scheme://$target_host/static/';

            error_page 400 401 403 404 405 406 500 502 503 504 = @tor2web_errors;
        }

        location / {
            proxy_intercept_errors on;
            proxy_pass http://web:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
            add_header Access-Control-Allow-Credentials true;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=31536000";
            add_header Pragma "no-cache";
            add_header Expires 0;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
                add_header Access-Control-Allow-Credentials true;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location /static/ {
            alias /backend/static/;
            include /etc/nginx/mime.types;

            types {
                image/svg+xml svg;
                text/javascript js;
                text/css css;
                font/ttf ttf;
                font/woff woff;
                font/woff2 woff2;
            }

            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=31536000";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }

        location @fastapi_errors {
            proxy_pass http://web:8070;
        }

        location @tor2web_errors {
            internal;
            default_type text/plain;
            return 502 "Tor proxy request failed.\n";
        }
    }
}
