<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orion Backup</title>
<style>
:root{color-scheme:dark;--bg:#151513;--panel:#1d1d1a;--panel2:#252521;--line:#34342e;--text:#eeeee5;--muted:#aaa99b;--accent:#e7b96a;--good:#a9c28b;--warn:#e7b96a;--bad:#ef9690;--shadow:0 12px 36px #00000014}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:12px;font-weight:600;transition:background .15s,border-color .15s}button:hover{border-color:var(--muted);background:var(--line)}button:disabled{opacity:.4;cursor:default}button.on{color:var(--accent);border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:4px}::selection{background:var(--accent);color:var(--bg)}
.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,calc((100vw - 1320px)/2));gap:20px;background:var(--panel)}.brand{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:.12em}.brand-mark{width:32px;height:32px;border:1px solid var(--accent);border-radius:8px;display:grid;place-items:center;color:var(--accent);font-size:21px}.brand small{color:var(--muted);font-size:11px;font-weight:400;letter-spacing:.02em;border-left:1px solid var(--line);padding-left:16px;margin-left:8px}.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}.primary:hover{background:var(--accent);filter:brightness(1.08);border-color:var(--accent)}
.wrap{max-width:1376px;margin:0 auto;padding:42px 28px 28px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:28px}h1{font-size:34px;line-height:1.2;letter-spacing:-1.3px;font-weight:600;margin:0 0 12px}h2{font-size:17px;letter-spacing:-.3px;margin:0;font-weight:600}h3{font-size:14px;margin:0 0 16px;font-weight:600}.sub{color:var(--muted);font-size:12px}
.summary{display:grid;grid-template-columns:1.2fr 2fr;gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 30px;margin-bottom:22px;box-shadow:var(--shadow)}.summary-label{font-size:11px;color:var(--muted)}.summary-number{font-size:44px;letter-spacing:-2px;line-height:1.25;font-weight:500;font-variant-numeric:tabular-nums;margin:5px 0}.summary-caption{color:var(--muted);font-size:11px}.distribution{align-self:center}.distribution-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:12px}.stack{display:flex;height:12px;gap:4px;border-radius:4px;overflow:hidden}.stack span{min-width:3px}.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:2px}.legend b{font-weight:500;color:var(--text);margin-left:7px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:32px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}.card .k{color:var(--muted);font-size:11px}.card .v{font-size:25px;font-weight:500;letter-spacing:-.6px;margin-top:5px;font-variant-numeric:tabular-nums}.card .hint{font-size:10px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}.tabs button{background:transparent;border-color:transparent;color:var(--muted);padding:10px 15px}.tabs button:hover{background:var(--panel2);color:var(--text)}.tabs button.on{background:var(--panel2);color:var(--accent);border-color:var(--line)}#tabs{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:24px}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}.section-heading p{margin:4px 0 0;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px}.search-wrap{position:relative;flex:1;max-width:420px}.search-wrap:before{content:'⌕';position:absolute;left:14px;top:4px;font-size:23px;color:var(--muted)}input[type=search]{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px 10px 40px;color:var(--text);font-size:12px}input::placeholder{color:var(--muted)}.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px;overflow:auto;box-shadow:var(--shadow)}.panel h3{margin-bottom:16px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.05em;white-space:nowrap;background:var(--panel2)}th:first-child{border-radius:5px 0 0 5px}th:last-child{border-radius:0 5px 5px 0}th button{font:inherit;letter-spacing:inherit;border:0;background:none;padding:0;color:inherit;white-space:nowrap}th button:hover{background:none;color:var(--text)}td:first-child{font-weight:500}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tbody tr:last-child td{border-bottom:0}tr.zero td{color:var(--muted)}tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}tr.click td:first-child:after{content:'↗';display:inline-block;margin-left:10px;color:var(--muted);font-size:11px}.tag{font-size:10px;font-weight:500;padding:3px 8px;border-radius:5px;border:1px solid var(--line);white-space:nowrap}.tag.direct{color:var(--good)}.tag.transitive{color:var(--accent)}.tag.global{color:var(--muted)}.tag.preserved{color:var(--muted)}
.hide{display:none!important}pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto;max-height:480px;font-size:12px;margin:12px 0}.rec{border-bottom:1px solid var(--line);padding:12px 0}.rec summary{cursor:pointer;font-size:12px;overflow-wrap:anywhere}.muted{color:var(--muted)}.bar{height:3px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:6px;min-width:72px}.bar i{display:block;height:100%;background:var(--accent)}.bar.good i{background:var(--good)}.bar.warn i{background:var(--warn)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.chip{display:inline-block;font-size:10px;padding:4px 8px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}.chip b{color:var(--text);font-weight:500;margin-left:4px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.pager{display:flex;gap:8px;align-items:center;margin:16px 0;flex-wrap:wrap;font-size:12px}.crumb{color:var(--muted);font-size:12px;margin:18px 0;overflow-wrap:anywhere}.crumb b{color:var(--text);display:block;font-size:18px;margin-bottom:3px}.type{display:inline-block;font-size:9px;padding:2px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin:2px}.val{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}.empty{text-align:center;padding:42px 20px;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:6px}
@media(min-width:1100px){#view.overview{display:grid;grid-template-columns:1fr 1.15fr;gap:20px}#view.overview .panel{margin-bottom:0}}
@media(max-width:850px){.summary{grid-template-columns:1fr;gap:24px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:0 20px}.wrap{padding:28px 20px}h1{font-size:29px}.panel{padding:16px}}
@media(max-width:480px){.topbar{padding:0 14px;height:64px}.brand{font-size:11px;gap:8px}.wrap{padding:25px 14px}.summary{padding:22px}.cards{gap:10px;margin-bottom:24px}.card{padding:15px}.card .v{font-size:23px}.legend{gap:12px}.tabs{gap:2px}.tabs button{padding:8px 10px;font-size:11px}header{gap:12px}h1{font-size:27px}.summary-number{font-size:39px}.toolbar{gap:8px}.toolbar button{white-space:nowrap;padding:10px}.panel{padding:12px}th,td{padding:12px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.orion-logo{display:block;width:192px;height:auto;filter:brightness(0) invert(.94)}.friendly-name{display:block}.file-location{font-size:10px;color:var(--muted);font-weight:400;overflow-wrap:anywhere}.plain-help{font-size:12px;color:var(--muted);margin:0 0 18px}.brand{flex-shrink:0}@media(max-width:600px){.orion-logo{width:146px}.topbar{gap:10px}}@media(max-width:380px){.orion-logo{width:120px}.topbar{padding:0 10px}}</style>
</head>

const FRIENDLY_NAMES={MongoDB:'Account details',ArangoDB:'Connections',Elasticsearch:'Findings',direct:'Organization',transitive:'Linked account',global:'Shared',preserved:'Kept as saved',inferred:'Automatically matched',fallback:'Default',explicit:'Set in advance',db_graph_sessions_model:'Saved connection views',db_audit_log:'Activity history',alert_connectors:'Alert connections',scheduler_runs:'Scheduled activity',db_twofa_state:'Two-step verification',db_system_model:'System settings',chat_shares:'Shared conversations',persona_posts:'Profile posts',db_keys:'Access keys',scan_jobs:'Scans',db_backup_model:'Backup settings',db_user_account:'User accounts',db_alert_model:'Alerts',social:'Social activity',db_document_feedback_model:'Feedback',takedown_requests:'Removal requests',social_profile_management:'Social profiles',backup_jobs:'Backup tasks',social_automation_result:'Automated social activity',db_url_data_model:'Saved web addresses',cases:'Cases',db_feeder_script_model:'Data feeds',db_tenant_model:'Organizations',db_social_session_model:'Social sessions',cti_vertices:'Entities',cti_edges:'Relationships',apt_model:'Threat groups',chat_model:'Conversations',defacement_model:'Website changes',exploit_model:'Exploits',generic_model:'Other findings',geo_fencing_model:'Location activity',leak_model:'Data leaks',malware_model:'Malware',sanction_model:'Sanctions',siem_model:'Security events',social_model:'Social findings',tenant_id:'Organization',user_id:'User account',user_uuid:'User account',_id:'Identifier',objectId:'Identifier',object:'Grouped details',array:'List',string:'Text',number:'Number',boolean:'Yes / no',null:'No value',date:'Date'};
function displayName(value){
  const name=String(value??'');
  if(FRIENDLY_NAMES[name])return FRIENDLY_NAMES[name];
  if(/^[a-f0-9]{24}$/.test(name))return 'Organization · '+name.slice(-6).toUpperCase();
  if(name.includes('/')||name.includes('.'))return name;
  return name.replace(/^db_/,'').replace(/_model$/,'').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
}
const MAX_READ = 4*1024*1024;

const SRC = { mode:null, files:new Map(), manifest:null };
function embedded(){
  try{
    const raw=document.getElementById('embedded').textContent.trim();
    if(!raw||raw==='null') return null;
    return JSON.parse(raw.replace(/<\//g,'</'));
  }catch(e){ return null; }
}
let TAB='overview', QUERY='', HIDE_ZERO=false;
let LOAD_ID=0;
const SORTS=new Map();
const SIZES=new Map();

let LAST_TRUNCATED=false, LAST_FULL=0;

async function readText(key){
  if(!SRC.files.has(key)) throw new Error('not in export');
  const r=await fetch(key,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const full=await r.text();
  LAST_FULL=full.length;
  SIZES.set(key,full.length);
  LAST_TRUNCATED=full.length>MAX_READ;
  return LAST_TRUNCATED?full.slice(0,MAX_READ):full;
}

function registerFromManifest(){
  const m = SRC.manifest || {};
  const add = k => SRC.files.set(k,k);
  Object.keys(m.mongo||{}).forEach(n=>add('mongo/'+n+'.ndjson'));
  Object.keys(m.arango||{}).forEach(n=>add('arango/'+n+'.json'));
  Object.keys(m.elastic||{}).forEach(n=>add('elastic/'+n+'.ndjson'));
  const per=(m.tenants||{}).tenants||{};
  Object.entries(per).forEach(([tid,s])=>{
    Object.keys(s.mongo||{}).forEach(n=>add('tenants/'+tid+'/mongo/'+n+'.ndjson'));
    Object.keys(s.elastic||{}).forEach(n=>add('tenants/'+tid+'/elastic/'+n+'.ndjson'));
  });
  add('manifest.json');
}

async function probe(){
  try{
    const r = await fetch('manifest.json', {cache:'no-store'});
    if(r.ok){ SRC.mode='fetch'; SRC.manifest = await r.json(); registerFromManifest(); return true; }
  }catch(e){}
  try{
    const r = await fetch('mongo/', {cache:'no-store'});
    if(r.ok){ SRC.mode='fetch'; SRC.manifest={}; return true; }
  }catch(e){}
  return false;
}

function sumCounts(o){
  return Object.values(o||{}).reduce((a,b)=>a+(b&&typeof b==='object'?(b.count||0):(b||0)),0);
}

function inferredStores(){
  const m = SRC.manifest||{};
  if(m.mongo||m.elastic||m.arango) return m;
  const built = {mongo:{}, elastic:{}, arango:{}};
  [...SRC.files.keys()].forEach(k=>{
    const parts=k.split('/');
    if(parts.length===2 && parts[0]==='mongo') built.mongo[parts[1].replace(/\.ndjson$/,'')]=0;
    if(parts.length===2 && parts[0]==='elastic') built.elastic[parts[1].replace(/\.ndjson$/,'')]=0;
    if(parts.length===2 && parts[0]==='arango') built.arango[parts[1].replace(/\.json$/,'')]=0;
  });
  ['mongo','elastic','arango'].forEach(k=>{ if(!Object.keys(built[k]).length) delete built[k]; });
  return Object.assign({}, m, built);
}

function totals(){
  const m=inferredStores(), stores=['mongo','arango','elastic'].filter(k=>m[k]);
  const collections=stores.reduce((a,k)=>a+Object.keys(m[k]).length,0);
  const empty=stores.reduce((a,k)=>a+Object.values(m[k]).filter(v=>!(typeof v==='object'?v.count:v)).length,0);
  const per=(m.tenants||{}).tenants||{};
  return [{k:'Types of information',v:stores.length,hint:'Account details, connections & findings'},
    {k:'Categories',v:collections,hint:empty+' categories have no saved items'},
    {k:'Organizations',v:Object.keys(per).length,hint:num(Object.values(per).reduce((a,t)=>a+(t.users||0),0))+' people included in this backup'},
    {k:'Listed files',v:SRC.files.size,hint:'Files listed in the backup summary'}];
}
function drawSummary(){
  const m=inferredStores(), stores=[['mongo','Account details','#b2bd92'],['arango','Connections','#b7ac94'],['elastic','Findings','#e7b96a']].filter(([k])=>m[k]);
  const total=stores.reduce((a,[k])=>a+sumCounts(m[k]),0);
  $('summary').innerHTML='<div><div class="summary-label">Saved items</div><div class="summary-number">'+num(total)+'</div><div class="summary-caption">Across '+stores.length+' types of information · organization copies counted once</div></div><div class="distribution"><div class="distribution-head"><span>What is in your backup</span><span>'+stores.length+' types</span></div><div class="stack" aria-label="What is in your backup">'+stores.map(([k,n,c])=>'<span title="'+n+': '+num(sumCounts(m[k]))+'" style="background:'+c+';width:'+(total?sumCounts(m[k])/total*100:0)+'%"></span>').join('')+'</div><div class="legend">'+stores.map(([k,n,c])=>'<span><i style="background:'+c+'"></i>'+n+'<b>'+(total?(sumCounts(m[k])/total*100).toFixed(1):0)+'%</b></span>').join('')+'</div></div>';
}

function bytes(n){
  if(!n && n!==0) return '-';
  const u=['B','KB','MB','GB','TB']; let i=0; let v=n;
  while(v>=1024 && i<u.length-1){ v/=1024; i++; }
  return (i?v.toFixed(1):v)+' '+u[i];
}

function typeOf(v){
  if(v===null) return 'null';
  if(Array.isArray(v)) return 'array';
  if(typeof v==='object'){
    const k=Object.keys(v);
    if(k.length===1 && k[0]==='$oid') return 'objectId';
    if(k.length===1 && k[0]==='$date') return 'date';
    return 'object';
  }
  return typeof v;
}

function preview(v){
  if(v===null||v===undefined) return '';
  if(typeof v==='object'){
    if(v.$oid) return v.$oid;
    if(v.$date) return String(v.$date);
    return JSON.stringify(v).slice(0,60);
  }
  return String(v).slice(0,60);
}

function fieldStats(records){
  const total=records.length, fields=new Map();
  records.forEach(r=>{
    if(!r || typeof r!=='object') return;
    Object.entries(r).forEach(([k,v])=>{
      let f=fields.get(k);
      if(!f){ f={name:k,present:0,types:new Map(),values:new Map(),empty:0,min:null,max:null}; fields.set(k,f); }
      f.present++;
      const t=typeOf(v);
      f.types.set(t,(f.types.get(t)||0)+1);
      if(v===''||v===null||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&v&&!Array.isArray(v)&&!Object.keys(v).length)) f.empty++;
      if(typeof v==='number'){ f.min=f.min===null?v:Math.min(f.min,v); f.max=f.max===null?v:Math.max(f.max,v); }
      const p=preview(v);
      if(p!=='' && t!=='object' && t!=='array'){ f.values.set(p,(f.values.get(p)||0)+1); }
    });
  });
  return [...fields.values()].map(f=>({
    name:f.name,
    present:f.present,
    coverage: total?Math.round(f.present/total*100):0,
    empty:f.empty,
    unique:f.values.size,
    types:[...f.types.entries()].sort((a,b)=>b[1]-a[1]),
    top:[...f.values.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5),
    min:f.min, max:f.max,
  })).sort((a,b)=>b.coverage-a.coverage||a.name.localeCompare(b.name));
}


function barCell(value, max, cls){
  const td=el('td','num');
  td.appendChild(el('div',null,num(value)));
  const b=el('div','bar '+(cls||'')); const i=el('i'); i.style.width=(max?Math.max(1,Math.round(value/max*100)):0)+'%';
  b.appendChild(i); td.appendChild(b);
  return td;
}

function storeRows(obj, layout){
  return Object.entries(obj||{}).map(([n,v])=>{
    const r=(layout||{})[n]||{};
    return {name:n, count:(v&&typeof v==='object')?(v.count||0):(v||0), ownership:r.ownership||'', field:r.field||'', source:r.source||''};
  }).sort((a,b)=>b.count-a.count);
}

function table(rows, cols, onRow){
  const wrap=el('div','table-scroll'), t=el('table'), th=el('thead'), hr=el('tr'), tb=el('tbody');
  const id=TAB+':'+cols.map(c=>c.key).join(',');
  const render=()=>{
    tb.replaceChildren();
    const sort=SORTS.get(id);
    let shown=rows.filter(r=>!QUERY||(JSON.stringify(r)+' '+Object.values(r).map(displayName).join(' ')).toLowerCase().includes(QUERY)).filter(r=>!HIDE_ZERO||r.count!==0);
    if(sort) shown.sort((a,b)=>sort.direction*(sort.numeric?(Number(a[sort.key])-Number(b[sort.key])):String(a[sort.key]).localeCompare(String(b[sort.key]))));
    const peak=rows.reduce((max,r)=>Math.max(max,Number(r[(cols.find(c=>c.bar)||{}).key])||0),1);
    shown.forEach(r=>{
      const tr=el('tr',(r.count===0?'zero ':'')+(onRow?'click':''));
      cols.forEach(c=>{
        if(c.bar){tr.appendChild(barCell(r[c.key],peak));return;}
        const td=el('td',c.num?'num':null);
        if(c.tag&&r[c.key]){const tag=el('span','tag '+r[c.key]);tag.textContent=displayName(r[c.key]);tag.title=r[c.key];td.appendChild(tag);}
        else td.textContent=c.bytes?(r[c.key]?bytes(r[c.key]):'—'):(c.num?num(r[c.key]):(r[c.key]?displayName(r[c.key]):'—'));
        if(!c.num)td.title=String(r[c.key]??'');
        tr.appendChild(td);
      });
      if(onRow){tr.tabIndex=0;tr.setAttribute('aria-label','Open '+r.name);tr.onclick=()=>onRow(r);tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onRow(r);}};}
      tb.appendChild(tr);
    });
    if(!shown.length){const tr=el('tr'),td=el('td','empty','<strong>No matching results</strong>Try another search or show empty categories.');td.colSpan=cols.length;tr.appendChild(td);tb.appendChild(tr);}
    [...hr.children].forEach((h,i)=>{const active=sort&&sort.key===cols[i].key;h.setAttribute('aria-sort',active?(sort.direction===1?'ascending':'descending'):'none');h.firstChild.textContent=cols[i].label+(active?(sort.direction===1?' ↑':' ↓'):' ↕');});
  };
  cols.forEach(c=>{const h=el('th',c.num?'num':null),button=el('button');h.scope='col';button.onclick=()=>{const prev=SORTS.get(id);SORTS.set(id,{key:c.key,numeric:!!c.num,direction:prev&&prev.key===c.key?-prev.direction:(c.num?-1:1)});render();};h.appendChild(button);hr.appendChild(h);});
  th.appendChild(hr);t.append(th,tb);wrap.appendChild(t);render();return wrap;
}

const DRILL = { key:null, title:null, records:[], page:0, mode:'fields', q:'', truncated:false };

async function showRecords(key,title){
  if(SRC.mode!=='fetch')return;
  const load=++LOAD_ID;
  QUERY=''; $('q').value=''; $('view').classList.remove('overview');
  DRILL.key=key; DRILL.title=title; DRILL.page=0; DRILL.mode='fields'; DRILL.q='';
  const view=$('view'); view.innerHTML='';
  const box=el('div','panel'); box.appendChild(el('div','muted','Opening your saved items…')); view.appendChild(box);
  try{
    const text=await readText(key);
    if(load!==LOAD_ID)return;
    const trimmed=text.trim();
    let records=[];
    if(trimmed.startsWith('[')){ try{ records=JSON.parse(trimmed); }catch(e){ throw new Error(LAST_TRUNCATED?'This JSON array exceeds the 4 MB preview limit. Open the file in a local editor.':'Invalid JSON array'); } }
    else { const lines=trimmed.split('\n').filter(l=>l.trim()); if(LAST_TRUNCATED) lines.pop(); records=lines.map(l=>{ try{ return JSON.parse(l); }catch(e){ return {unparsed:l.slice(0,200)}; } }); }
    DRILL.records=records;
    DRILL.truncated = LAST_TRUNCATED;
    DRILL.bytes = LAST_FULL;
    DRILL.read = text.length;
    drawDrill();
  }catch(e){
    if(load!==LOAD_ID)return;
    DRILL.key=null;
    view.innerHTML=''; const b=el('div','panel');
    const back=el('button',null,'← Back');back.onclick=()=>redraw();b.appendChild(back); b.appendChild(el('div','muted','Could not read this file: '+escapeHTML(e.message))); view.appendChild(b);
  }
}

function drawDrill(){
  const view=$('view'); view.innerHTML=''; view.classList.remove('overview');
  const box=el('div','panel');
  const back=el('button',null,'← Back'); back.onclick=()=>{DRILL.key=null;QUERY='';$('q').value='';redraw();}; box.appendChild(back);
  box.appendChild(el('div','crumb','<b>'+escapeHTML(displayName(DRILL.title))+'</b><span class="file-location">'+escapeHTML(DRILL.key)+'</span>'));

  const recs=DRILL.records;
  const stats=fieldStats(recs);
  const avg=recs.length?Math.round(DRILL.read/recs.length):0;
  const chips=el('div','chips');
  [['items shown',num(recs.length)],['details per item',num(stats.length)],['file size',bytes(DRILL.bytes)],['average item size',bytes(avg)]]
    .forEach(([k,v])=>chips.appendChild(el('span','chip',escapeHTML(k)+' <b>'+escapeHTML(v)+'</b>')));
  if(DRILL.truncated) chips.appendChild(el('span','chip','Previewing <b>'+bytes(DRILL.read)+'</b> of file'));
  box.appendChild(chips);

  const tabs=el('div','tabs');
  [['fields','Details overview'],['records','Saved items ('+num(recs.length)+')']].forEach(([id,label])=>{
    const b=el('button',DRILL.mode===id?'on':null,label); b.onclick=()=>{DRILL.mode=id;DRILL.page=0;drawDrill();}; tabs.appendChild(b);
  });
  box.appendChild(tabs);

  if(DRILL.mode==='fields'){
    if(!stats.length){ box.appendChild(el('div','muted','There are no item details to show in this file.')); }
    else{
      const t=el('table');
      t.appendChild(el('thead',null,'<tr><th>Detail</th><th class="num">Filled in %</th><th class="num">Included</th><th class="num">Empty</th><th class="num">Different values</th><th>Value formats</th><th>Common values</th></tr>'));
      const tb=el('tbody');
      stats.filter(f=>!DRILL.q||f.name.toLowerCase().includes(DRILL.q)).forEach(f=>{
        const tr=el('tr');
        tr.appendChild(el('td',null,escapeHTML(displayName(f.name))));
        const cov=el('td','num'); cov.appendChild(el('div',null,f.coverage+'%'));
        const bar=el('div','bar '+(f.coverage===100?'good':(f.coverage<50?'warn':''))); const i=el('i'); i.style.width=f.coverage+'%'; bar.appendChild(i); cov.appendChild(bar);
        tr.appendChild(cov);
        tr.appendChild(el('td','num',num(f.present)));
        tr.appendChild(el('td','num',num(f.empty)));
        tr.appendChild(el('td','num',num(f.unique)));
        const ty=el('td'); f.types.forEach(([t,c])=>ty.appendChild(el('span','type',displayName(t)+' '+Math.round(c/f.present*100)+'%'))); tr.appendChild(ty);
        const tv=el('td','val');
        if(f.min!==null && f.max!==null) tv.textContent='min '+num(f.min)+' · max '+num(f.max);
        else tv.innerHTML=f.top.map(([v,c])=>'<span class="chip">'+escapeHTML(String(v).slice(0,28))+' <b>'+num(c)+'</b></span>').join(' ');
        tr.appendChild(tv);
        tb.appendChild(tr);
      });
      t.appendChild(tb); box.appendChild(t);
    }
  } else {
    const PAGE=100;
    const filtered = DRILL.q ? recs.filter(r=>JSON.stringify(r).toLowerCase().includes(DRILL.q)) : recs;
    const pages=Math.max(1,Math.ceil(filtered.length/PAGE));
    DRILL.page=Math.min(DRILL.page,pages-1);
    const pager=el('div','pager');
    const prev=el('button',null,'Previous'); prev.disabled=DRILL.page===0; prev.onclick=()=>{DRILL.page--;drawDrill();};
    const next=el('button',null,'Next'); next.disabled=DRILL.page>=pages-1; next.onclick=()=>{DRILL.page++;drawDrill();};
    pager.appendChild(prev); pager.appendChild(next);
    pager.appendChild(el('span','muted','page '+(DRILL.page+1)+' of '+num(pages)+' · '+num(filtered.length)+' matching'));
    box.appendChild(pager);
    const list=el('div');
    if(!filtered.length)list.appendChild(el('div','empty','<strong>No matching items</strong>Try another search to explore this file.'));
    filtered.slice(DRILL.page*PAGE,(DRILL.page+1)*PAGE).forEach((obj,i)=>{
      const d=el('details','rec');
      const head=Object.keys(obj||{}).slice(0,4).map(k=>displayName(k)+': '+preview(obj[k]).slice(0,34)).join('   ');
      d.appendChild(el('summary',null,'<span class="muted">#'+(DRILL.page*PAGE+i+1)+'</span> '+head.replace(/</g,'&lt;')));
      d.appendChild(el('pre',null,JSON.stringify(obj,null,2).replace(/</g,'&lt;')));
      list.appendChild(d);
    });
    box.appendChild(list);
  }
  $('view').appendChild(box);
}

  const m=inferredStores();
  drawSummary();
  const labels={overview:['Backup overview','See what you saved and how it is shared across organizations.'],mongo:['Account details','Browse saved accounts, activity, settings, and other information.'],arango:['Connections','Explore saved entities and the relationships between them.'],elastic:['Findings','Browse saved findings, reports, and monitored activity.'],tenants:['Organizations','See the saved information, people, and files for each organization.'],files:['Backup files','Open a file to explore its saved contents.']};

      const trows=Object.entries(per).map(([tid,s])=>({name:tid,count:sumCounts(s.mongo),share:Math.round(sumCounts(s.mongo)/total*1000)/10,users:s.users||0}))
        .sort((a,b)=>b.count-a.count);

      view.appendChild(panel); view.appendChild(box); return;
    }
  }
  else if(TAB==='mongo'||TAB==='elastic'||TAB==='arango'){

    rows.forEach(r=>{ r.share=Math.round(r.count/grand*1000)/10; });

    const chips=el('div','chips');
    [['categories',num(rows.length)],['saved items',num(rows.reduce((a,r)=>a+r.count,0))],['largest category',rows[0]?displayName(rows[0].name):'—'],['empty',num(rows.filter(r=>!r.count).length)]]
      .forEach(([k,v])=>chips.appendChild(el('span','chip',escapeHTML(k)+' <b>'+escapeHTML(v)+'</b>')));
    panel.appendChild(chips);
    panel.appendChild(table(rows,cols,SRC.mode==='fetch' ? r=>showRecords(TAB+'/'+r.name+ext,r.name) : null));
  }
  else if(TAB==='tenants'){
    const per=(m.tenants||{}).tenants||{};
    const rows=Object.entries(per).map(([tid,s])=>({
      name:tid, count:sumCounts(s.mongo), users:s.users||0, files:s.files||0, elastic:sumCounts(s.elastic)
    }));
    panel.appendChild(table(rows,
      [{key:'name',label:'Organization'},{key:'count',label:'Saved items',num:true},{key:'users',label:'People',num:true},{key:'files',label:'Files',num:true},{key:'elastic',label:'Findings',num:true}],
      r=>{
        const s=per[r.name];
        const v=$('view'); v.innerHTML=''; QUERY='';$('q').value='';
        const box=el('div','panel');
        const back=el('button',null,'← Back'); back.onclick=()=>{TAB='tenants';redraw();};
        box.appendChild(back);
        box.appendChild(el('h3',null,displayName(r.name)));
        box.appendChild(table(storeRows(s.mongo,layout),
          [{key:'name',label:'Category'},{key:'count',label:'Saved items',num:true},{key:'ownership',label:'Belongs to',tag:true},{key:'field',label:'Linked by'}],
          SRC.mode==='fetch' ? x=>showRecords('tenants/'+r.name+'/mongo/'+x.name+'.ndjson',x.name) : null));
        v.appendChild(box);
      }));
  }
  else {
    const rows=[...SRC.files.keys()].sort().map(k=>({name:k,count:SIZES.get(k)||0}));
    panel.appendChild(table(rows,[{key:'name',label:'File'},{key:'count',label:'Size (bytes)',num:true}],SRC.mode==='fetch' ? r=>showRecords(r.name,r.name.split('/').pop()) : null));
  }
  view.appendChild(panel);
}

function setSubtitle(){
  const m=SRC.manifest||{};
  let date='';
  if(m.created_at){const parsed=new Date(m.created_at.replace(' ','T'));date=isNaN(parsed)?m.created_at:new Intl.DateTimeFormat('en',{dateStyle:'medium',timeStyle:'short',timeZone:'UTC'}).format(parsed)+' UTC';}
  $('subtitle').textContent=date?'Created '+date:'';
}

function boot(){
  const m=SRC.manifest||{};
  $('app').classList.remove('hide');
  $('title').textContent = 'Orion Backup';
  setSubtitle();
  redraw();
}

$('q').oninput = e => { const v=e.target.value.toLowerCase(); if(DRILL.key && $('view').querySelector('.crumb')){ DRILL.q=v; drawDrill(); } else { QUERY=v; redraw(); } };
$('zeros').onclick = e => { HIDE_ZERO=!HIDE_ZERO; e.target.classList.toggle('on',HIDE_ZERO); e.target.setAttribute('aria-pressed',String(HIDE_ZERO)); e.target.textContent=HIDE_ZERO?'Show empty':'Hide empty'; if(DRILL.key)drawDrill();else redraw(); };

const EMBED = embedded();
if(EMBED){
  SRC.mode='embedded'; SRC.manifest=EMBED; registerFromManifest();
  boot();
  if(location.protocol!=='file:')probe().then(ok=>{ if(ok){ SRC.mode='fetch'; setSubtitle(); redraw(); } });
}else{
  probe().then(ok=>{
    if(ok) boot();
    else { $('subtitle').textContent='No backup summary is available in this page.'; }
  });
}
</script>
</body>
</html>
