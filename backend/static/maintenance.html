<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="noindex, nofollow" name="robots">
    <title>Orion Intelligence Maintenance</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            align-items: center;
            background: #f6f8fb;
            color: #18212f;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            max-width: 640px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            margin: 0 0 14px;
        }

        p {
            color: #526173;
            font-size: 17px;
            line-height: 1.6;
            margin: 0;
        }

        .status {
            color: #0b6bcb;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 18px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<main>
    <div class="status">Maintenance</div>
    <h1>Orion Intelligence is temporarily unavailable</h1>
    <p>We are applying updates or restarting services. Please try again shortly.</p>
</main>
</body>
</html>
