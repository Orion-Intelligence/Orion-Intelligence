<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="noindex, nofollow" name="robots">
    <link href="/maintenance-assets/logo_url_default.png" rel="icon" type="image/png">
    <link href="/maintenance-assets/logo_url_default.png" rel="apple-touch-icon">
    <title>Orion Intelligence Maintenance</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            align-items: flex-start;
            background:
                repeating-linear-gradient(0deg, rgb(255 255 255 / 0.9%) 0px, rgb(255 255 255 / 0.9%) 1px, transparent 1px, transparent 26px),
                repeating-linear-gradient(90deg, rgb(255 255 255 / 0.9%) 0px, rgb(255 255 255 / 0.9%) 1px, transparent 1px, transparent 26px),
                linear-gradient(180deg, #0e1626 0%, #0e1626 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding: 26svh 28px max(28px, env(safe-area-inset-bottom));
        }

        main {
            align-items: center;
            display: flex;
            flex-direction: column;
            max-width: 620px;
            padding: 0 4px;
            text-align: center;
            width: 100%;
        }

        .logo {
            display: block;
            height: 82px;
            margin: 0 0 28px;
            opacity: 0.98;
            width: 82px;
        }

        .status {
            color: #57a5eb;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(26px, 5vw, 38px);
            font-weight: 800;
            line-height: 1.15;
            margin: 0 0 16px;
            max-width: 100%;
            white-space: nowrap;
        }

        p {
            color: #d0d0d0;
            font-size: 18px;
            line-height: 1.6;
            margin: 0;
            max-width: 540px;
            overflow-wrap: anywhere;
        }

        .meta {
            border-top: 1px solid #ffffff14;
            color: #9fb3c8;
            font-size: 14px;
            margin-top: 28px;
            padding-top: 18px;
        }

        @media (max-width: 560px) {
            body {
                padding: 16svh 18px max(22px, env(safe-area-inset-bottom));
            }

            .logo {
                height: 68px;
                margin-bottom: 22px;
                width: 68px;
            }

            h1 {
                font-size: clamp(22px, 6.5vw, 30px);
            }

            p {
                font-size: 15px;
                max-width: 320px;
            }

            .meta {
                font-size: 13px;
                max-width: 320px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 14svh 14px max(20px, env(safe-area-inset-bottom));
            }

            .logo {
                height: 60px;
                width: 60px;
            }

            h1 {
                font-size: clamp(19px, 6vw, 23px);
            }

            p,
            .meta {
                font-size: 13px;
            }
        }

        @media (max-width: 340px) {
            body {
                padding-left: 10px;
                padding-right: 10px;
            }

            .logo {
                height: 54px;
                margin-bottom: 18px;
                width: 54px;
            }

            .status {
                font-size: 11px;
                margin-bottom: 12px;
            }

            h1 {
                font-size: clamp(17px, 5.8vw, 20px);
            }
        }

        @media (max-height: 520px) and (orientation: landscape) {
            body {
                padding-top: 8svh;
            }

            .logo {
                height: 52px;
                margin-bottom: 14px;
                width: 52px;
            }

            .status {
                margin-bottom: 10px;
            }

            h1 {
                font-size: clamp(22px, 4vw, 30px);
                margin-bottom: 10px;
            }

            p {
                font-size: 14px;
                line-height: 1.45;
            }

            .meta {
                font-size: 12px;
                margin-top: 16px;
                padding-top: 12px;
            }
        }
    </style>
</head>
<body>
<main>
    <img alt="Orion" class="logo" src="/maintenance-assets/logo_url_default.png">
    <div class="status">Maintenance</div>
    <h1>Orion is temporarily unavailable</h1>
    <p>Services are restarting or temporarily unreachable. Please try again in a few moments.</p>
    <div class="meta">The gateway is online and will reconnect automatically when the application is ready.</div>
</main>
</body>
</html>
