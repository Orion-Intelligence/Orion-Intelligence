<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="noindex, nofollow" name="robots">
    <link href="/maintenance-assets/logo_url_default.png" rel="icon" type="image/png">
    <link href="/maintenance-assets/logo_url_default.png" rel="apple-touch-icon">
    <title>Orion Intelligence — Maintenance</title>
    <!-- Adapt /assets/libs/error-handler.component.css from the 404 page inline:
         this page must render even when the frontend asset server is offline. -->
    <style>
:root {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
  margin: 0;
}

body {
  background: #111315;
  color: #f4f6f8;
  font-family: Inter, Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.notice_container {
  position: relative;
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
  flex-direction: column;
  overflow: hidden;
  background:
    repeating-linear-gradient(0deg, rgb(255 255 255 / 1%) 0, rgb(255 255 255 / 1%) 1px, transparent 1px, transparent 56px),
    repeating-linear-gradient(90deg, rgb(255 255 255 / 1%) 0, rgb(255 255 255 / 1%) 1px, transparent 1px, transparent 56px),
    #111315;
}

.notice_container *,
.notice_container *::before,
.notice_container *::after {
  animation: none !important;
}

.notice_header {
  display: flex;
  height: 76px;
  flex-shrink: 0;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #1f2022;
  padding: 0 clamp(24px, 6vw, 80px);
}

.notice_brand {
  display: inline-flex;
  align-items: center;
  border-radius: 8px;
  outline: none;
}

.notice_brand:hover {
  opacity: 80%;
}

.notice_brand:focus-visible,
.notice_menu a:focus-visible {
  outline: 2px solid #ff8b96;
  outline-offset: 2px;
}

.notice_brand img {
  display: block;
  width: auto;
  max-width: 190px;
  height: 30px;
  object-fit: contain;
}

.notice_header-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #858b91;
  font-family: "Roboto Mono", "SFMono-Regular", Consolas, monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.notice_header-status::before {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #d9858c;
  content: "";
}

.notice_main {
  display: flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  padding: clamp(48px, 10vh, 108px) 20px;
}

.notice_layout {
  position: relative;
  top: -24px;
  display: grid;
  width: 100%;
  max-width: 1180px;
  grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
  gap: clamp(48px, 8vw, 112px);
  align-items: center;
}

.notice_error {
  min-width: 0;
}

.notice_symbol {
  width: clamp(128px, 16vw, 188px);
  height: clamp(128px, 16vw, 188px);
  margin: 0;
  color: #d9858c;
}

.notice_symbol svg {
  display: none;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.25;
}

.notice_symbol[data-operation="maintenance"] .symbol-maintenance,
.notice_symbol[data-operation="backup"] .symbol-backup,
.notice_symbol[data-operation="restore"] .symbol-restore {
  display: block;
}

.notice_eyebrow {
  margin: 28px 0 0;
  color: #d9858c;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.notice_title {
  max-width: 500px;
  margin: 8px 0 0;
  color: #f4f6f8;
  font-size: clamp(32px, 4vw, 46px);
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.08;
  text-wrap: balance;
}

.notice_message {
  max-width: 460px;
  margin: 20px 0 0;
  color: #c1c8ce;
  font-size: 14px;
  line-height: 1.7;
}

.notice_menu {
  min-width: 0;
  border-left: 1px solid #202123;
  padding-left: clamp(32px, 4vw, 52px);
}

.notice_menu-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 0 0 20px;
  color: #858b91;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.notice_menu-count {
  flex-shrink: 0;
  color: #555b61;
  font-family: "Roboto Mono", "SFMono-Regular", Consolas, monospace;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: normal;
  text-transform: none;
}

.notice_menu a {
  display: grid;
  min-height: 76px;
  grid-template-columns: 28px minmax(0, 1fr) 20px;
  align-items: center;
  gap: 16px;
  border-top: 1px solid #282a2d;
  padding: 16px 12px;
  color: #f4f6f8;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: background-color 150ms ease, border-color 150ms ease;
}

.notice_menu a:first-of-type {
  border-top-color: rgb(217 133 140 / 55%);
}

.notice_menu a:last-child {
  border-bottom: 1px solid #282a2d;
}

.notice_menu a:hover,
.notice_menu a:focus-visible {
  background: #191b1d;
  border-top-color: #282a2d;
  border-bottom-color: #9b6268;
  color: #f0b1b6;
}

.notice_menu a:last-child:hover,
.notice_menu a:last-child:focus-visible {
  border-bottom-color: #9b6268;
}

.notice_menu a > span:first-child {
  color: #555b61;
  font-family: "Roboto Mono", "SFMono-Regular", Consolas, monospace;
  font-size: 11px;
  font-weight: 400;
}

.notice_menu a > span:nth-child(2) {
  min-width: 0;
}

.notice_menu a:first-of-type > span:first-child {
  color: #d9858c;
}

.notice_menu a:hover > span:first-child,
.notice_menu a:focus-visible > span:first-child {
  color: #f0b1b6;
}

.notice_menu a > span:last-child {
  color: #858b91;
  font-size: 20px;
  font-weight: 400;
}

.notice_menu a:hover span:last-child,
.notice_menu a:focus-visible span:last-child {
  color: #ff9aa3;
}

.notice_menu small {
  display: block;
  margin-top: 4px;
  color: #858b91;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

@media (width < 768px) {
  .notice_header {
    height: 64px;
  }

  .notice_header-status {
    font-size: 0;
  }

  .notice_layout {
    top: -12px;
    grid-template-columns: 1fr;
    gap: 40px;
  }

  .notice_menu {
    border-top: 1px solid #202123;
    border-left: 0;
    padding-top: 28px;
    padding-left: 0;
  }

  .notice_symbol {
    width: clamp(104px, 26vw, 144px);
    height: clamp(104px, 26vw, 144px);
  }
}

.notice_progress {
  max-width: 460px;
  margin-top: 24px;
}

.progress-track {
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: #282a2d;
}

.progress-value {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: #d9858c;
  transition: width 400ms ease;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-top: 10px;
  color: #858b91;
  font-size: 12px;
  line-height: 1.5;
}

#progress-message {
  min-width: 0;
  overflow-wrap: anywhere;
}

#progress-percent {
  flex-shrink: 0;
  color: #d9858c;
  font-family: "Roboto Mono", "SFMono-Regular", Consolas, monospace;
}

.notice_meta {
  margin: 20px 0 0;
  color: #858b91;
  font-size: 12px;
  line-height: 1.7;
}

[hidden] {
  display: none !important;
}

@media (prefers-reduced-motion: reduce) {
  .progress-value {
    transition: none;
  }
}
    </style>
</head>

        </section>
    </main>
</div>
<script>
    const title = document.getElementById('notice-title');
    const status = document.getElementById('status');
    const headerStatus = document.getElementById('header-status');
    const symbol = document.getElementById('notice-symbol');
    const progressTrack = document.getElementById('progress-track');
    const summary = document.getElementById('summary');
    const progress = document.getElementById('progress');
    const progressValue = document.getElementById('progress-value');
    const progressMessage = document.getElementById('progress-message');
    const progressPercent = document.getElementById('progress-percent');

    const OPERATION_LABEL = {backup: 'Backup in progress', restore: 'Restore in progress'};
    const OPERATION_DESCRIPTION = {
        backup: 'Orion is creating a backup. Please wait while your data is saved.',
        restore: 'Orion is restoring a backup. Please wait while your data is restored.'
    };

    const renderJob = (job) => {
        if (!job || job.status !== 'running') {
            title.textContent = 'Temporarily unavailable';
            status.textContent = 'Maintenance';
            headerStatus.textContent = 'Maintenance';
            symbol.dataset.operation = 'maintenance';
            document.title = 'Orion Intelligence — Maintenance';
            summary.textContent = 'Maintenance or update in progress. Please try again in a few moments.';
            progress.hidden = true;
            return false;
        }
        const percent = Math.max(0, Math.min(100, Number(job.progress) || 0));
        const label = OPERATION_LABEL[job.operation] || 'Maintenance in progress';
        title.textContent = label;
        status.textContent = label;
        headerStatus.textContent = label;
        symbol.dataset.operation = ['backup', 'restore'].includes(job.operation) ? job.operation : 'maintenance';
        document.title = 'Orion Intelligence — ' + label;
        summary.textContent = OPERATION_DESCRIPTION[job.operation] || 'Maintenance is in progress. Please try again in a few moments.';
        progressTrack.setAttribute('aria-label', label);
        progressTrack.setAttribute('aria-valuenow', String(percent));
        progressMessage.textContent = job.message || '';
        progressPercent.textContent = percent + '%';
        progressValue.style.width = percent + '%';
        progress.hidden = false;
        return true;
    };

    const readJob = async () => {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 5000);
        try {
            const response = await fetch('/api/admin/backups/status', {
                cache: 'no-store', credentials: 'include', signal: controller.signal
            });
            if (!response.ok) {
                return null;
            }
            return await response.json();
        } catch (_) {
            return null;
        } finally {
            window.clearTimeout(timeout);
        }
    };

    const tick = async () => {
        renderJob(await readJob());
        window.setTimeout(tick, 5000);
    };

    tick();
</script>
</body>
</html>
