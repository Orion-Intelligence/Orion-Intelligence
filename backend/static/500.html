<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="/assets/images/shared/logo-wide-light.svg" rel="icon" type="image/svg+xml">
    <link href="/assets/libs/error-handler.component.css" rel="stylesheet">
    <title>Orion Intelligence — Server Error</title>
</head>
<body>
<div class="notice_container">
    <header class="notice_header">
        <a class="notice_brand" href="/" aria-label="Go to homepage">
            <img alt="Orion Intelligence" src="/assets/images/sidebar/search_nav_logo.png">
        </a>
        <span class="notice_header-status">500 / Server error</span>
    </header>
    <main class="notice_main" aria-labelledby="error-title" aria-describedby="error-description">
        <section class="notice_layout">
            <div class="notice_error">
                <p class="notice_code" aria-hidden="true">500</p>
                <p class="notice_eyebrow">Server error · 500</p>
                <h1 class="notice_title" id="error-title">Something went wrong</h1>
                <p class="notice_message" id="error-description">We are currently unable to handle this request.</p>
            </div>
            <nav class="notice_menu" aria-label="Error page navigation">
                <p class="notice_menu-label"><span>Where would you like to go?</span><span class="notice_menu-count">01—02</span></p>
                <a href="/"><span aria-hidden="true">01</span><span>Homepage<small>Return to the main page</small></span><span aria-hidden="true">→</span></a>
                <a href="https://github.com/msmannan00/Orion-Search" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">02</span><span>Explore Project<small>View on GitHub · opens in a new tab</small></span><span aria-hidden="true">↗</span></a>
            </nav>
        </section>
    </main>
</div>
</body>
</html>
