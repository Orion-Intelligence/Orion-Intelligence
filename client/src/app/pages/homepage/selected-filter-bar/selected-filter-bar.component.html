<div *ngIf="entityFiltersCount() || sidebarFilterCount()" [ngClass]="{ 'top-space': showSorting, '': !showSorting }">
    <div class="selected-filter-bar left-space">
        <div class="top-row">
            <div class="title">Filters</div>
            <div class="title">Sidebar
                <div class="filter-count">
                    {{sidebarFilterCount()}}
                </div>
            </div>
            <div class="title">Entity
                <div class="filter-count">
                    {{entityFiltersCount()}}
                </div>
            </div>
            <div class="actions">
                <button class="clear-btn" (click)="clearAllFilters()">Clear Selection</button>
                <div class="expand-icon" [ngClass]="{ 'expand': isFilterBarExpanded }"
                    (click)="toggleFilterBarCollapse()">
                    <img src="../../../../assets/images/shared/searchFilter_rightButton.svg" alt="Toggle Icon" />
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="isFilterBarExpanded" @searchFilterAnimation>
        <div class="selected-filter-bar left-space top-space">
            <div class="top-row">
                <div class="title">Filters</div>
                <div class="actions">
                    <button class="clear-btn" (click)="clearAllFilters()">Clear Selection</button>
                    <div class="expand-icon" [ngClass]="{ 'expand': isFilterExpanded }"
                        (click)="toggleFilterCollapse()">
                        <img src="../../../../assets/images/shared/searchFilter_rightButton.svg" alt="Toggle Icon" />
                    </div>
                </div>
            </div>

            <div *ngIf="isFilterExpanded">
                <div class="primary-filters-wrap">
                    <ng-container *ngFor="let filterKey of (filterModel.filters | keyvalue)">
                        <div class="filter-item" *ngIf="isFilterSelected(filterKey.value)">
                            <div class="filter-label-edit">
                                {{ filterKey.value.title }}
                            </div>
                            <span *ngIf="filterKey.value.type !== 'multiSelection'" class="filter-tag">
                                {{ getSelectedLabel(filterKey.value) }}
                            </span>
                        </div>
                    </ng-container>
                </div>
                <div class="divider" *ngIf="entityFiltersCount() && sidebarFilterCount()"></div>
                <div class="filter-item" *ngIf="entityFiltersCount()">
                    <div class="filter-label-edit">
                        Entity Type
                    </div>
                    <div class="entity_filter_wrap">
                        <ng-container *ngIf="getVisibleTags(categories).length > 0">
                            <div class="filter-tag" *ngFor="let tag of getVisibleTags(categories)">
                                {{ tag.value }}
                                <img src="../../../../assets/images/shared/searchFilter_clossButton.svg"
                                    class="remove-x" (click)="removeEntityTypeFilterTag(tag.id)" />
                            </div>

                            <div class="filter-tag more-tag" *ngIf="getHiddenTagCount(categories) > 0">
                                +{{ getHiddenTagCount(categories) }}
                            </div>
                        </ng-container>
                    </div>


                </div>
            </div>
        </div>
    </div>
</div>
