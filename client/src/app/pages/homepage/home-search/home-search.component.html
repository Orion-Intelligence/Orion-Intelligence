<form (submit)="onSearchSubmit()" class="flex items-center mt-[24px] mx-[32px] max-[1200px]:m-[15px] max-[943px]:mx-[10px] max-[550px]:grid">
  <div class="flex w-full flex-wrap items-start justify-between">
    <div class="w-full">
      <div class="fixed inset-0 z-[1] hidden max-[550px]:block bg-[rgba(0,0,0,0.7)]" *ngIf="homeSearchService.showFiltersOverlay"></div>

      <ng-container *ngIf="app_service.userSessionData().user.role === 'admin' || licenseService.isMaintainer() || licenseService.getLicenses().includes('enterprise') ||
        app_service.userSessionData().user.role === 'analyst'">
        <div class="relative">
          <div class="mb-[8px] flex h-[42px] w-full max-w-[910px] flex-nowrap" [ngClass]="{ 'max-[550px]:fixed max-[550px]:left-0 max-[550px]:w-full max-[550px]:px-[10px] max-[550px]:z-[2]': homeSearchService.showFiltersOverlay, 'max-[550px]:relative max-[550px]:left-auto max-[550px]:w-full max-[550px]:px-0 max-[550px]:mr-0': !homeSearchService.showFiltersOverlay }">

            <button class="flex w-[45px] items-center justify-center rounded-l-[8px] border border-r-0 border-[var(--color-border)] bg-white transition-colors hover:bg-white" (click)="onSearchSubmit()" type="submit">
              <img alt="Search" height="16" class="ml-[6px] mb-[1px] opacity-80" ngSrc="../../../../assets/images/shared/theme/magnifyingglassblack.svg" priority width="16">
            </button>

            <input #searchInput [(ngModel)]="searchQuery" autocapitalize="none" autocomplete="off" class="h-[42px] flex-1 border-y border-[var(--color-border)] bg-white text-[16px] text-[#3C3C43] outline-none placeholder:font-[Roboto] placeholder:text-[15px] placeholder:text-[rgba(0,0,0,0.38)]" data-cy="dashboard-general-input" maxlength="350" name="q" placeholder="Search ..." type="search" (focus)="setFilterOverlay(true)" (input)="onSearchInput($event)">
            <input type="hidden" value="1">

            <button type="button" class="ui-search-clear-btn group flex h-[42px] w-[38px] items-center justify-center border-y border-[var(--color-border)] bg-white px-0 transition-colors hover:bg-[#f3f4f6]" aria-label="Clear input" title="Clear input" (click)="clearSearchInput()" [disabled]="!searchQuery">
              <i class="bi bi-x-circle-fill text-[14px] text-[#374151] transition-colors group-hover:text-[#111827]" [ngClass]="{ 'invisible': !searchQuery }"></i>
            </button>

            <div class="flex shrink-0 items-center whitespace-nowrap rounded-r-[8px] border-y border-r border-[var(--color-border)] bg-white font-[Roboto] text-[15px] font-normal text-[#292828] max-[550px]:w-0 max-[550px]:px-0 max-[550px]:overflow-hidden" [ngClass]="hideToolsSection ? 'pr-[5px]' : ''">
              <ng-container>
                <hr class="mx-[12px] my-[3px] h-[23px] w-px border-0 bg-[rgba(0,0,0,0.12)]">
                <span class="inline-flex items-center">Advance&nbsp;&nbsp;</span>
                <label class="relative inline-flex cursor-pointer items-center rounded-full bg-white p-[1px]">
                  <input type="checkbox" class="sr-only peer" [checked]="app_service.configData().localSettings.advance_setting_toggle" (change)="onAdvanceSettingToggle()">
                  <span class="relative h-[20px] w-[32px] rounded-full border border-[var(--color-border)] bg-white transition peer-checked:border-[#57A5EB] peer-checked:bg-[#57A5EB]">
                    <span class="absolute left-[1px] top-0 mt-[2px] h-[14px] w-[14px] rounded-full bg-white transition peer-checked:translate-x-[10px]"></span>
                  </span>
                </label>

                <ng-container *ngIf="!hideToolsSection">
                  <hr class="mx-[12px] my-[3px] h-[23px] w-px border-0 bg-[rgba(0,0,0,0.12)]">
                  <button type="button" (click)="onToolToggle($event)" class="inline-flex items-center cursor-pointer">
                    Tools
                    <img src="assets/images/shared/theme/cheveron-right.svg" width="27" height="27" alt="Toggle Icon" [ngClass]="{ 'rotate-90': app_service.configData().localSettings.enable_advanced_tools }" class="mt-[-1px] px-[10px] transition-transform duration-300">
                  </button>
                </ng-container>
              </ng-container>
            </div>
          </div>

          <div *ngIf="homeSearchService.showFiltersOverlay" class="hidden max-[550px]:block h-[43px]"></div>

          <div #filtersWrapper class="absolute z-[1] w-full max-w-[910px]" *ngIf="homeSearchService.showFiltersOverlay && app_service.configData().localSettings.advance_setting_toggle">
            <app-search-filters
              [showSorting]="app_service.configData().localSettings.enable_advanced_tools"
              [homePage]="true"></app-search-filters>
          </div>
        </div>

        <ng-container *ngIf="app_service.configData().localSettings.enable_advanced_tools;">
          <details #matchTypeDropdown class="relative mt-[8px] w-fit">
            <summary class="flex items-center gap-[6px] cursor-pointer list-none text-[13px] font-[Roboto] font-medium text-[var(--color-text1)]" [ngClass]="{ '[&::-webkit-details-marker]:hidden': true }">
              search by <b>({{ getMatchType() }})</b>
              <img src="/assets/images/shared/theme/search_side_dropdown_icon_dark.svg" alt="chevron" width="16" height="16">
            </summary>

            <div class="ui-result-dropdown-panel absolute z-[10] mt-[12px] w-[260px] rounded-[7px] border p-[7px_12px]">
              <button type="button" class="ui-result-dropdown-item block w-full rounded-[6px] px-[8px] py-[6px] text-left text-[13px]" (click)="selectedSearchBy = 'Match any term';onSetMatchType('or');onSearchSubmit();closeMatchTypeDropdown();">Match any term (OR)</button>
              <div class="ui-result-dropdown-divider mx-[8px] my-[6px] h-px"></div>
              <button type="button" class="ui-result-dropdown-item block w-full rounded-[6px] px-[8px] py-[6px] text-left text-[13px]" (click)="selectedSearchBy = 'Match indivisual terms';onSetMatchType('and');onSearchSubmit();closeMatchTypeDropdown();">Match indivisual terms (AND)</button>
              <div class="ui-result-dropdown-divider mx-[8px] my-[6px] h-px"></div>
              <button type="button" class="ui-result-dropdown-item block w-full rounded-[6px] px-[8px] py-[6px] text-left text-[13px]" (click)="selectedSearchBy = 'Match full query';onSetMatchType('full');onSearchSubmit();closeMatchTypeDropdown();">Match full query (AND)</button>
              <div class="ui-result-dropdown-divider mx-[8px] my-[6px] h-px"></div>
              <button type="button" class="ui-result-dropdown-item block w-full rounded-[6px] px-[8px] py-[6px] text-left text-[13px]" (click)="selectedSearchBy = 'Match semantic query';onSetMatchType('or');onSearchSubmit();closeMatchTypeDropdown();">Match semantic query (semantic)</button>
            </div>
          </details>
        </ng-container>
      </ng-container>

      <ng-container *ngIf="isRoleAdmin">
        <div>
          <app-world-heatmap></app-world-heatmap>
        </div>

<div class="relative will-change-transform transition-transform duration-300 ease-out" [class.transition-none]="insightDragging" [style.transform]="getInsightTransform()">
<div class="absolute left-1/2 top-[-54px] z-[30] -translate-x-1/2 touch-none select-none" (click)="onInsightToggleClick($event)" (pointerdown)="onInsightPointerDown($event)">
  <button type="button" aria-label="Drag Panel" class="ui-home-insight-drag-btn group flex items-center gap-2 rounded-full border border-[var(--color-border)] bg-[var(--color-consolidated-primary)] px-4 py-2 text-xs font-semibold text-[var(--color-text1)] shadow-[0_12px_28px_rgba(0,0,0,0.28)] transition hover:border-[rgba(148,163,184,0.6)] hover:shadow-[0_16px_36px_rgba(0,0,0,0.32)] active:scale-[0.97]">
    <svg class="ui-home-insight-drag-icon h-4 w-4 opacity-80 transition-transform duration-200 group-hover:-translate-y-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14" />
      <path d="M8 9l4-4 4 4" />
      <path d="M16 15l-4 4-4-4" />
    </svg>

    Drag Panel
  </button>
</div>
  <app-home-insight></app-home-insight>
</div>
      </ng-container>
    </div>
  </div>
</form>
