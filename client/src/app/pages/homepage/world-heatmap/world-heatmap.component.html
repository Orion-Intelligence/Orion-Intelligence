<div class="block w-full">
  <div data-testid="world-heatmap-map" class="map-container relative aspect-[100/52] max-h-[80vh] min-h-[400px] w-[calc(100%+60px)] -ml-[30px] -mr-[30px] [mask-image:linear-gradient(to_bottom,transparent_0%,black_12%,black_88%,transparent_100%)] max-[768px]:w-screen max-[768px]:max-w-screen [body.light-theme_&]:[mask-image:none]">
    <div #mapContainer class="absolute inset-0" [attr.aria-busy]="isMapLoading()"></div>
    @if (isMapLoading() && showMapLoader()) {
      <div @mapLoaderFade class="pointer-events-none absolute inset-0 z-[10] flex items-center justify-center px-6" role="status" aria-live="polite" aria-atomic="true" data-testid="world-heatmap-loader">
        <div class="map-loading-panel flex min-w-[168px] max-w-full flex-col items-center gap-4 rounded-[22px] border border-[var(--color-border)] bg-[rgba(8,16,27,0.88)] px-7 py-6 text-center shadow-[0_16px_48px_rgba(2,6,23,0.16)] backdrop-blur-md [body.light-theme_&]:bg-white/90 [body.light-theme_&]:shadow-[0_12px_36px_rgba(15,23,42,0.07)]">
          <span class="map-loading-indicator relative flex h-16 w-16 shrink-0 items-center justify-center rounded-full text-[var(--color-blue-640)]" aria-hidden="true">
            <svg class="map-loading-ring absolute inset-0 h-full w-full" viewBox="0 0 64 64" fill="none">
              <circle cx="32" cy="32" r="29" stroke="currentColor" stroke-opacity="0.12" stroke-width="2"></circle>
              <circle class="map-loading-arc" cx="32" cy="32" r="29" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="52 183"></circle>
            </svg>
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
              <path d="M3 12h18"></path>
            </svg>
          </span>
          <span class="text-[13px] font-medium leading-5 text-[var(--color-text1)]">{{ 'Loading map...' | translate }}</span>
        </div>
      </div>
    } @else if (!isMapLoading() && appService.backendWarmingUp()) {
      <app-map-loading-badges [items]="[('Indexing data...' | translate)]"></app-map-loading-badges>
    }
  </div>

  @if (isOpenCountryReport()) {
    <app-heatmap-report data-testid="heatmap-report" [reports]="selectedCountryReports()" [loading]="isCountryReportLoading()" [loadingMore]="isCountryReportLoadingMore()" [hasMore]="hasMoreCountryReports()" (loadMore)="loadMoreCountryReports()" (close)="closeCountryReport()"></app-heatmap-report>
  }
</div>
