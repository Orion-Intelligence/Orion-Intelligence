<div data-testid="heatmap-report-overlay" class="fixed inset-0 z-[1000] flex items-center justify-center bg-[rgba(2,6,23,0.72)] backdrop-blur-[4px] max-[768px]:items-start max-[768px]:p-4" (click)="closePopup()">
  <div class="flex max-h-[82vh] w-[760px] flex-col overflow-hidden rounded-[12px] border border-[var(--tenant-line)] bg-[var(--tenant-row-bg)] max-[768px]:mt-2 max-[768px]:w-full max-[768px]:max-w-full" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between border-b border-[var(--tenant-line)] px-4 py-3.5">
      <div class="flex items-center gap-2">
        <h3 class="m-0 text-[18px] font-semibold text-[var(--color-text1)]">Reports</h3>
        <span class="inline-flex rounded-full border border-[var(--tenant-line)] bg-[var(--tenant-chip-bg)] px-2 py-0.5 text-[11px] font-semibold text-[var(--color-text2)]">{{ reports.length || 0 }}</span>
      </div>
      <button data-testid="heatmap-report-close" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-[var(--tenant-line)] bg-[var(--tenant-chip-bg)] text-[18px] leading-none text-[var(--color-text2)] transition hover:bg-[var(--tenant-chip-hover)]" (click)="closePopup()" aria-label="Close">&times;</button>
    </div>

    <div class="overflow-y-auto p-4 max-[768px]:p-3">
      <div class="mb-3 rounded-[10px] border border-[var(--tenant-line)] bg-[var(--tenant-expand-bg)] last:mb-0" *ngFor="let report of reports">
        <div class="border-b border-[var(--tenant-line)] px-3.5 py-2.5">
          <h4 class="m-0 text-[15px] font-semibold text-[var(--color-text1)]">{{ report?.m_title || 'Untitled Report' }}</h4>
        </div>

        <div class="px-3.5 py-3">
          <div class="grid grid-cols-3 gap-3 max-[768px]:grid-cols-1">
            <div>
              <span class="mb-0.5 block text-[10px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">Company</span>
              <span class="text-[13px] font-semibold text-[var(--color-text1)]">{{ report?.m_company_name || 'N/A' }}</span>
            </div>
            <div>
              <span class="mb-0.5 block text-[10px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">Team</span>
              <span class="text-[13px] font-semibold text-[var(--color-text1)]">{{ report?.m_team || 'N/A' }}</span>
            </div>
            <div>
              <span class="mb-0.5 block text-[10px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">Network</span>
              <span class="text-[13px] font-semibold text-[var(--color-text1)]">{{ report?.m_network || 'N/A' }}</span>
            </div>
          </div>

          <div class="mt-3 border-t border-[var(--tenant-line)] pt-3" *ngIf="report?.m_domain?.length">
            <span class="block text-[10px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">Domains</span>
            <div class="mt-2 flex flex-wrap gap-1.5">
              <span class="rounded-full border border-[var(--tenant-line)] bg-[var(--tenant-chip-bg)] px-2.5 py-1 text-[11px] font-semibold text-[var(--color-text2)]" *ngFor="let domain of report.m_domain">
                {{ domain }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
