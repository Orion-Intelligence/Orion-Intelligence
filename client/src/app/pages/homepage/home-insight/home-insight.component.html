<div id="analytics">
  <div *ngFor="let modelKey of consolidatedModelKeys">
    <div class="home_insight__container">
      <div *ngFor="let item of getResultItems(modelKey) let first = first" class="card-container">
        <div *ngIf="first" class="home_insight__header">
          {{ formatModelKey(modelKey) }} Index
        </div>
        <div class="header-section">
          <div class="company-info">
            <div class="label">Company Name</div>
            <div class="value">{{ getDisplayTitle(item) }}</div>
          </div>
          <div class="attacker-info">
            <div class="label">Source</div>
            <div class="value">{{ getSource(modelKey, item) }}</div>
          </div>
        </div>

        <div class="detail-row">
          <div class="country-info">
            <div class="label">Location</div>
            <div class="value"> {{ getLocationSummary(modelKey, item) }}</div>
          </div>
        </div>

        <div class="detail-row">
          <div class="date-time-info">
            <div class="label">Date</div>
            <div class="value">{{ getDisplayDate(item) || '-' }}</div>
          </div>
        </div>

        <div class="home_insight__divider"></div>

        <div class="footer-section">
          <button (click)="scrollService.saveSession(item.m_hash??item.m_message_id??'')" appTooltip="Open Report"
            [queryParams]="getQueryParams(modelKey)"
            [routerLink]="[getModelRoute(modelKey), item.m_hash??item.m_message_id??'']"
            class="view-details-button">View
            Details</button>
        </div>
      </div>
    </div>
    <br><br><br>
  </div>

</div>
