<div class="filter-panel" [ngClass]="{ 'filter-panel_sorting-extend-margin': showSorting, 'filter-panel_sorting-shrink-margin': !showSorting }">

    <div class="top-row">
        <div class="title">Filters</div>
        <div class="actions">
            <button class="clear-btn" (click)="clearSelection()">Clear Selection</button>
        </div>
    </div>

    <div class="filter-panel__category-scroll-container">
        <div class="fade-left" *ngIf="showLeftFade"></div>

        <div class="scroll-btn show" (click)="scrollLeft()">
            <img src="../../../../assets/images/shared/searchFilter_leftButton.svg" />
        </div>

        <div class="filter-panel__category-scroll" #categoryScroll>
            <div *ngFor="let category of categories; let i = index" class="category-tab"
                [class.selected]="i === selectedCategoryIndex" (click)="onCategoryClick(i, category.id)">
                {{ category.name }}
                <div *ngIf="category.tags.length > 0" class="filter-panel__category-count">
                    {{ category.tags.length }}
                </div>
            </div>
        </div>

        <div class="scroll-btn show" (click)="scrollRight()">
            <img src="../../../../assets/images/shared/cheveron-right.svg" />
        </div>

        <div class="fade-right" *ngIf="showRightFade"></div>
    </div>
    <div class="input-row">
        <input type="text" [(ngModel)]="newValue" placeholder="Enter Value" class="tag-input"
            (keydown.enter)="addTag()" />
        <div class="add-btn" (click)="addTag()">
            <img src="../../../../assets/images/shared/searchFilter_addButton.svg" />
        </div>
        <label class="toggle-switch">
            <input type="checkbox" [(ngModel)]="entityFilterCondition" />
            <span class="slider"></span>
        </label>
        <div class="entity-condition">{{ entityFilterCondition ? 'Exact Match' : 'Partial Match' }}</div>
    </div>

    <div class="selected-filters">
        <div class="section-title">All Selected Filters</div>
        <ng-container *ngIf="hasAnyTags(); else noFilters">
            <div class="tag-list">
                <ng-container *ngFor="let category of categories">
                    <div *ngFor="let tag of category.tags" class="filter-tag">
                        {{ tag.value }}
                        <img src="../../../../assets/images/shared/searchFilter_clossButton.svg" class="remove-x"
                            (click)="removeTag(category, tag.id)" />
                    </div>
                </ng-container>
            </div>
        </ng-container>
        <ng-template #noFilters>
            <div class="no-filters-text">No filter selected</div>
        </ng-template>
    </div>

    <div class="divider"></div>

    <div class="expand-header">
        <div class="expand-label">IOC’s</div>
        <div class="expand-icon" [ngClass]="{ 'expand': iocExpanded }" (click)="toggleExpand()">
            <img src="../../../../assets/images/shared/searchFilter_expand.svg" alt="Toggle Icon" />
        </div>

    </div>
    <div *ngIf="iocExpanded" class="summary-section">
        <ng-container *ngIf="hasAnyTags(); else noFilters">
            <ng-container *ngFor="let category of categories">
                <div *ngIf="category.tags.length > 0" class="summary-category">
                    <div class="category-title">{{ category.name }}</div>
                    <div class="tag-list">
                        <div *ngFor="let tag of category.tags" class="filter-tag">
                            {{ tag.value }}
                            <img src="../../../../assets/images/shared/searchFilter_clossButton.svg" class="remove-x"
                                (click)="removeTag(category, tag.id)"  alt=""/>
                        </div>
                    </div>
                </div>
            </ng-container>
        </ng-container>

        <ng-template #noFilters>
            <div class="no-filters-text">No filter selected</div>
        </ng-template>
    </div>

</div>
