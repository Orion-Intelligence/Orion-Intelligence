<div class="relative h-full w-full overflow-hidden rounded-none bg-[#08101b]">
  <div #mapContainer class="h-full w-full"></div>
  <div class="pointer-events-none absolute inset-x-0 top-0 z-[15] h-16 bg-gradient-to-b from-[rgba(8,16,27,0.78)] via-[rgba(8,16,27,0.42)] to-transparent"></div>
  <div class="pointer-events-none absolute inset-x-0 bottom-0 z-[15] h-16 bg-gradient-to-t from-[rgba(8,16,27,0.78)] via-[rgba(8,16,27,0.42)] to-transparent"></div>
  <div class="pointer-events-none absolute bottom-3 left-3 z-[20] rounded-md border border-white/10 bg-[rgba(8,16,27,0.88)] px-3 py-2 text-[11px] text-[#bfdbfe] shadow-[0_8px_28px_rgba(2,6,23,.3)] backdrop-blur-sm">
    <div>{{ zoomLabel }}</div>
    <div class="mt-1 text-[#94a3b8]">{{ aircraftCount }} aircraft · {{ shipCount }} ships</div>
  </div>
</div>
