<div class="relative h-full w-full">
  <div #mapContainer class="h-full w-full bg-[#0a0e1a]"></div>

  <div class="pointer-events-none absolute bottom-7 left-3 z-[900] rounded border border-white/10 bg-[rgba(13,21,37,.88)] px-[10px] py-1 font-mono text-[10px] text-white/35">
    {{ zoomLabel }}
  </div>

  @if (isScanning) {
    <div class="absolute left-3 right-3 top-3 z-[900] max-w-[min(520px,calc(100%-24px))] rounded-lg border border-white/10 bg-[rgba(13,21,37,.9)] px-3 py-[10px]">
      <div class="mb-[6px] flex justify-between">
        <span class="text-[12px] font-medium text-[#f0f4ff]">{{ loadingStepLabel }}</span>
        <span class="text-[12px] font-semibold text-sky-400">{{ progressValue }}%</span>
      </div>
      <div class="h-[6px] overflow-hidden rounded-full bg-white/5">
        <div class="h-full rounded-full bg-[#3b82f6] transition-[width] duration-300 ease-out" [ngClass]="'ui-wpct-' + progressValue"></div>
      </div>
    </div>
  }

  @if (errorMessage && !isScanning) {
    <div class="absolute left-3 right-3 top-3 z-[900] max-w-[min(520px,calc(100%-24px))] rounded-lg border border-red-500/30 bg-red-500/12 px-[14px] py-[10px] text-[12px] text-red-300">
      <i class="bi bi-exclamation-triangle-fill"></i>
      {{ errorMessage }}
    </div>
  }
</div>
