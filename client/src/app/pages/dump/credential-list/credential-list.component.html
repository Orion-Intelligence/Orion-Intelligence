<div class="default-notification-banner default-notification-banner-stealer">
  <span>
    <img
      alt="Info Icon"
      class="default-notification-banner-icon"
      src="../../../../assets/images/shared/hint.svg"
    />
    <span>
      Parsed Stealer Logs: URL, Username/Email, and Password from matched patterns.
    </span>
  </span>
</div>

<div class="directory-list__container stealer-log-table">
  <table class="table table-striped directory-list__table clear-paddings">
    <thead>
      <tr>
        <th class="directory-list__column-id-min w-auto">#</th>
        <th class="directory-list__column-service-url">URL</th>
        <th class="directory-list__column-service-url">Username / Email</th>
        <th class="directory-list__column-category">Password</th>
        <th class="directory-list__column-url-status">Timestamp</th>
      </tr>
    </thead>
    <tbody *ngIf="stealerData$ as stealerData">
      <ng-container *ngFor="let item of stealerData.Result; let i = index">
        <tr>
          <td>{{ i + 1 }}</td>

          <td class="copy_url text-break" (click)="copyRowData(item.url)">
            {{ item.url }}
          </td>

          <td class="copy_url text-break" (click)="copyRowData(item.username + (item.domain ? '@' + item.domain : ''))">
            {{ item.username + (item.domain ? '@' + item.domain : '') }}
          </td>

          <td class="copy_url text-break" (click)="copyRowData(item.password)">
            {{ item.password }}
          </td>

          <td class="text-break">
            {{ item.timestamp | date: 'dd MMM yyyy' }}
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
