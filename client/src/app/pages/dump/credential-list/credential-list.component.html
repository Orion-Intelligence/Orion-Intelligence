<div class="directory-list__container credential-list-table">
  <table class="table table-striped directory-list__table clear-paddings">
    <thead>
      <tr>
        <th>#</th>
        <th>Email Provider</th>
        <th>Source</th>
        <th>Group</th>
        <th>Link</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody *ngIf="credentialData$ as credentialData">
      <ng-container *ngFor="let item of credentialData.Result; let i = index">
        <ng-container *ngFor="let link of item.l; let j = index">
          <tr>
            <td>{{ i + j + 1 }}</td>
            <td (click)="copyRowData(item.u)" class="copy_url">{{ item.u }}</td>
            <td>{{ dumpSourceMap[+item.s]?.name || 'Unknown' }}</td>
            <td>{{ dumpGroupMap[+item.g]?.name || 'Unknown' }}</td>
            <td (click)="copyRowData(link)" class="copy_url text-truncate" style="max-width: 300px;">
              {{ link }}
            </td>
            <td>{{ item.c | date: 'MMM yyyy' }}</td>
          </tr>
        </ng-container>
      </ng-container>
    </tbody>
  </table>
</div>
