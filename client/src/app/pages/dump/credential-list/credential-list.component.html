<div class="default-notification-banner default-notification-banner-stealer">
  <span>
    <img
      alt="Info Icon"
      class="default-notification-banner-icon"
      src="../../../../assets/images/shared/hint.svg"
    />
    <span>
      Parsed Stealer Logs: URL, Username/Email, and Password from matched patterns.
    </span>
  </span>
</div>

<div class="directory-list__container stealer-log-table">
  <table class="table table-striped directory-list__table clear-paddings">
    <thead>
      <tr>
        <th class="directory-list__column-id-min">#</th>
        <th>URL</th>
        <th>Username / Email</th>
        <th>Password</th>
      </tr>
    </thead>
    <tbody *ngIf="stealerData$ as stealerData">
      <ng-container *ngFor="let item of stealerData.Result; let i = index">
        <tr>
          <td>{{ i + 1 }}</td>

          <td class="copy_url text-break" (click)="copyRowData(getParsedLog(item.log, 0))">
            {{ getParsedLog(item.log, 0) }}
          </td>

          <td class="copy_url text-break" (click)="copyRowData(getParsedLog(item.log, 1))">
            {{ getParsedLog(item.log, 1) }}
          </td>

          <td class="copy_url text-break" (click)="copyRowData(getParsedLog(item.log, 2))">
            {{ getParsedLog(item.log, 2) }}
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
