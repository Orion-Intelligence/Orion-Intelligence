<div class="ui-table-shell">
  <table class="ui-table" id="main-responsive-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Leak URL</th>
        <th>Source</th>
        <th>Group</th>
        <th>Parsed</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody *ngIf="!isLoading && (dumpData$ | async) as dumpData" @fadeInDashboardItem>
      <tr *ngFor="let item of dumpData.mDumpCallbackLinks; let i = index" [hidden]="(item.leak_url.length || 0) <= 5">
        <td data-label="ID"><span class="block text-right">{{ (i + 1) + ((currentPage$ | async)! - 1) * 100 }}</span></td>
        <td data-label="Leak URL" [attr.title]="item.leak_url" (click)="copyRowData(item.leak_url)" class="max-w-[480px] cursor-pointer text-[var(--color-text1)] hover:underline">
          <span class="block w-full truncate text-right">{{ item.leak_url }}</span>
        </td>
        <td data-label="Source" [attr.title]="item.source">
          <span class="block w-full truncate text-right">{{ item.source }}</span>
        </td>
        <td data-label="Group" [attr.title]="item.group">
          <span class="block w-full truncate text-right">{{ item.group }}</span>
        </td>
        <td data-label="Parsed">
          <span class="inline-flex w-full items-center justify-end gap-[6px]">
            <span class="inline-block h-[8px] w-[8px] rounded-full" [ngClass]="item.parsed_status ? 'bg-[#4caf50]' : 'bg-[#cbd5e1]'"></span>
            <span class="truncate">{{ item.parsed_status ? 'parsed' : 'unparsed' }}</span>
          </span>
        </td>
        <td data-label="Created"><span class="block w-full truncate text-right">{{ item.created_at | date: 'MMM yyyy' }}</span></td>
      </tr>

      <tr *ngIf="dumpData.mDumpCallbackLinks?.length === 0">
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
      </tr>
    </tbody>

    <tbody *ngIf="isLoading" @fadeInDashboardItem>
      <tr *ngFor="let _ of [1,2,3,4,5]">
        <td><div class="h-[12px] w-[75%] rounded-[4px] bg-[var(--color-placeholder)] animate-pulse"></div></td>
        <td><div class="h-[12px] w-full rounded-[4px] bg-[var(--color-placeholder)] animate-pulse"></div></td>
        <td><div class="h-[12px] w-[75%] rounded-[4px] bg-[var(--color-placeholder)] animate-pulse"></div></td>
        <td><div class="h-[12px] w-[50%] rounded-[4px] bg-[var(--color-placeholder)] animate-pulse"></div></td>
        <td><div class="h-[12px] w-[50%] rounded-[4px] bg-[var(--color-placeholder)] animate-pulse"></div></td>
        <td><div class="h-[12px] w-[50%] rounded-[4px] bg-[var(--color-placeholder)] animate-pulse"></div></td>
      </tr>
    </tbody>
  </table>
</div>
