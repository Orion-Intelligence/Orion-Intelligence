<div class="directory-list__container">
  <table class="table table-striped directory-list__table clear-paddings">
    <thead>
    <tr>
      <th class="directory-list__column-id-min">ID</th>
      <th class="directory-list__column-service-url">Leak URL</th>
      <th class="directory-list__column-category">Source</th>
      <th class="directory-list__column-url-status">Group</th>
      <th class="directory-list__column-leak-status">Parsed</th>
      <th class="directory-list__column-network-type">Created</th>
    </tr>
    </thead>
    <tbody *ngIf="(dumpData$ | async) as dumpData">
    <tr *ngFor="let item of dumpData.mDumpCallbackLinks; let i = index">
      <td>{{ (i + 1) + ((currentPage$ | async)! - 1) * 100 }}</td>
      <td (click)="copyRowData(item.leak_url)" class="copy_url">{{ item.leak_url }}</td>
      <td>{{ item.source }}</td>
      <td>{{ item.group }}</td>
      <td>
          <span [class.directory-list__status-inactive-pointer]="!item.parsed_status"
                class="directory-list__status-default-pointer">
          </span>{{ item.parsed_status ? 'parsed' : 'unparsed' }}
      </td>
      <td>{{ item.created_at | date: 'MMM yyyy' }}</td>
    </tr>
    </tbody>
  </table>
</div>
