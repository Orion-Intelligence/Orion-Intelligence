<div class="list__container">
  <table class="table table-striped directory-list__table clear-paddings">
    <thead>
    <tr>
      <th class="list__column-id-min">ID</th>
      <th class="list__column-service-url">Leak URL</th>
      <th class="list__column-category">Source</th>
      <th class="list__column-url-status">Group</th>
      <th class="list__column-leak-status">Parsed</th>
      <th class="list__column-network-type">Created</th>
    </tr>
    </thead>

    <tbody *ngIf="!isLoading && (dumpData$ | async) as dumpData" @fadeInDashboardItem>
      <tr *ngFor="let item of dumpData.mDumpCallbackLinks; let i = index">
        <td>{{ (i + 1) + ((currentPage$ | async)! - 1) * 100 }}</td>
        <td (click)="copyRowData(item.leak_url)" class="cursor-pointer">{{ item.leak_url }}</td>
        <td>{{ item.source }}</td>
        <td>{{ item.group }}</td>
        <td>
          <span [class.directory-list__status-inactive-pointer]="!item.parsed_status"
                class="list__status-default-pointer">
          </span>{{ item.parsed_status ? 'parsed' : 'unparsed' }}
        </td>
        <td>{{ item.created_at | date: 'MMM yyyy' }}</td>
      </tr>

      <tr *ngIf="dumpData.mDumpCallbackLinks?.length === 0">
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
      </tr>
    </tbody>

    <tbody *ngIf="isLoading" @fadeInDashboardItem>
      <tr *ngFor="let _ of [1,2,3,4,5]">
        <td><div class="skeleton_shimmer shimmer-line w-75"></div></td>
        <td><div class="skeleton_shimmer shimmer-line w-100"></div></td>
        <td><div class="skeleton_shimmer shimmer-line w-75"></div></td>
        <td><div class="skeleton_shimmer shimmer-line w-50"></div></td>
        <td><div class="skeleton_shimmer shimmer-line w-50"></div></td>
        <td><div class="skeleton_shimmer shimmer-line w-50"></div></td>
      </tr>
    </tbody>
  </table>
</div>
