<div class="w-full p-3 md:p-4">
  <span id="top"></span>

  <div class="ui-page-container w-full max-w-[2400px]">
    <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
      <div>
        <h1 class="ui-page-title">Dump Listing</h1>
        <p class="ui-page-description">Track and search monitored leak dump records.</p>
      </div>

      <button type="button" (click)="openSidebar()" class="ui-btn ui-btn-secondary gap-2">
        <img alt="Filter Icon" height="16" ngSrc="/assets/images/shared/theme/filter_icon.svg" width="16" class="ui-filter-icon">
        Filter
      </button>

      <div *ngIf="isFilterOpen$ | async" class="fixed inset-0 z-50 bg-[#0b1220]/55 backdrop-blur-[1px]" (click)="closeSidebar()"></div>
      <div class="ui-filter-drawer fixed right-0 top-0 z-[60] h-screen w-[320px] max-w-[92vw] bg-[#2A5784] shadow-[0_12px_32px_rgba(0,0,0,0.35)] transition-transform duration-200 max-[450px]:w-screen" [ngClass]="(isFilterOpen$ | async) ? 'translate-x-0' : 'translate-x-full'">
        <app-filters (filterChanged)="applyFilters($event)" (filterClose)="closeSidebar()"
          (filterReset)="resetFilters()" [filterModel]="filterModel"
          [isFilterOpen]="isFilterOpen$ | async"></app-filters>
      </div>
    </div>

    <form (submit)="onSearchSubmit()" action="" enctype="multipart/form-data" method="GET" class="rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-700)] p-3">
      <div class="w-full">
        <div class="flex h-[42px] w-full overflow-hidden rounded-[8px] border border-[var(--color-border)] bg-white">
          <div class="flex w-[45px] items-center justify-center bg-white">
            <img alt="Search" height="20" ngSrc="/assets/images/shared/domain.svg" priority width="20" class="brightness-0 opacity-80">
          </div>
          <input [(ngModel)]="searchQuery" autocapitalize="none" autocomplete="off" class="h-full min-w-0 flex-1 bg-white px-3 text-[15px] text-[#172235] outline-none placeholder:text-[14px] placeholder:text-[rgba(23,34,53,0.52)]" maxlength="150" name="username" placeholder="Search leak URL" type="text">
          <input type="hidden" value="1">
          <button class="ui-btn ui-btn-primary h-full min-w-[112px] shrink-0 rounded-none rounded-r-[8px] border-l border-sky-300/20 px-5">Search</button>
        </div>
      </div>
    </form>

    <dump-list [isLoading]="isLoading()"></dump-list>
  </div>

  <app-pagination (pageChange)="onPageChange($event)" [maxPages]="totalPages"></app-pagination>
  <span id="bottom"></span>
</div>
