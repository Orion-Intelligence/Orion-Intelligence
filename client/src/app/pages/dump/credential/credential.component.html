<app-result (reloadData)="fetchSearchResults()"
            [disableScroll]="true"
            (updateQuery)="onUpdateQuery($event)"
            [isLoading]="isLoading" [result_count]=currentResultCount [shrinkmenu] = true
            [searchQuery]="query" ></app-result>

<div *ngIf="!isLoading && credentialCallbackModel.Result.length>0" @fadeInDashboardItem>
  <app-credential-list></app-credential-list>
</div>
