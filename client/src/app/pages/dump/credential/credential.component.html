<app-result (onToggleSort)="onToggleSort($event)"
            (reloadData)="fetchSearchResults()"
            [disableScroll]="true"
            (updateQuery)="onUpdateQuery($event)"
            [isLoading]="isLoading" [result_count]=currentResultCount [shrinkmenu] = true
            [searchQuery]="query" ></app-result>

<div *ngIf="!isLoading && stealerlogCallbackModel.Result.length>0" @fadeInDashboardItem class="stealer-log-table-padding">
  <app-credential-list></app-credential-list>
</div>
