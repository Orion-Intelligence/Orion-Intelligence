<app-result (onToggleSort)="onToggleSort($event)"
            (reloadData)="fetchSearchResults()"
            [disableScroll]="true"
            [filterModel]="filters"
            (resetFilter)="resetFilters($event)"
            (reloadFilters)="reloadFilters($event)"
            (updateQuery)="onUpdateQuery($event)"
            [isLoading]="isLoading" [result_count]=currentResultCount
            [searchQuery]="query" ></app-result>

<div *ngIf="!isLoading && stealerlogCallbackModel.Result && stealerlogCallbackModel.Result.length>0" @fadeInDashboardItem class="stealer-log-table-padding">
  <app-credential-list></app-credential-list>
</div>
