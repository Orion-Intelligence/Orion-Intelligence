<div *ngIf="isVisible">
  <ng-container *ngIf="!(error$ | async) && showHeaderFooter()">
    <app-header></app-header>
  </ng-container>

  <app-loader></app-loader>

  <div [@fadeIn]="currentRoute()">
    <router-outlet></router-outlet>
  </div>

  <ng-container *ngIf="!(error$ | async) && showHeaderFooter()">
    <app-footer></app-footer>
  </ng-container>
</div>
