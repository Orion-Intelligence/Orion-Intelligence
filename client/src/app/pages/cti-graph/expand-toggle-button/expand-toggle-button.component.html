<button data-testid="cti-expand-groups-toggle" type="button" [attr.aria-label]="(isExpanded() ? 'Collapse Groups' : 'Expand Groups') | translate" [title]="(isExpanded() ? 'Collapse Groups' : 'Expand Groups') | translate" (click)="toggled.emit(undefined)" class="cti-toolbar-action cti-toolbar-action--icon inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border-0 bg-[var(--color-blue-750)] p-[5px] text-xs text-[var(--color-text3)] transition-colors duration-300 hover:bg-[var(--color-blue-810)] hover:text-[var(--color-text1)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[rgba(255,255,255,0.34)] [&>i]:inline-flex [&>i]:items-center [&>i]:justify-center [&>i]:text-[1.1rem] [&>i]:leading-none [&>i_.ui-bootstrap-icon]:h-[1.1rem] [&>i_.ui-bootstrap-icon]:w-[1.1rem]">
  <i [class]="'bi ' + (isExpanded() ? 'bi-arrows-angle-contract' : 'bi-arrows-angle-expand')"></i>
</button>
