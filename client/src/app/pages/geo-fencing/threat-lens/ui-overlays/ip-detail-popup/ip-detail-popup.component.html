<div class="fixed inset-0 z-[1250] pointer-events-none">
  <div class="map-overlay-menu pointer-events-auto absolute bottom-3 right-3 top-16 flex w-[min(860px,calc(100%-24px))] flex-col overflow-hidden rounded-[10px] border-0 bg-[rgba(28,39,53,0.94)] text-[#C4D4E6] shadow-lg ring-1 ring-inset ring-[rgba(143,166,190,0.20)] backdrop-blur-sm animate-[ui-popup-panel-in_180ms_ease-out_both] [body.light-theme_&]:!bg-white max-[640px]:left-2 max-[640px]:right-2 max-[640px]:top-auto max-[640px]:bottom-2 max-[640px]:h-[78dvh] max-[640px]:w-auto max-[640px]:rounded-[12px]">
    <div class="flex items-center justify-between gap-3 border-b border-[rgba(143,166,190,0.20)] px-4 py-3">
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <span class="h-2.5 w-2.5 shrink-0 rounded-full bg-[#8FAECC]"></span>
          <span class="text-[13px] font-semibold uppercase tracking-[0.14em] text-[var(--color-text3)]">{{ 'IP Detail' | translate }}</span>
        </div>
        <div class="mt-1 truncate font-mono text-[12px] text-[var(--color-text3)]">{{ ip }}</div>
      </div>
      <button type="button" class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-full bg-[rgba(22,34,48,0.88)] text-[#C4D4E6] ring-1 ring-inset ring-[rgba(143,166,190,0.20)] transition-colors hover:bg-[rgba(65,86,110,0.64)] hover:text-white [body.light-theme_&]:!bg-white [body.light-theme_&]:hover:!bg-white" [attr.aria-label]="'Close IP detail' | translate" (click)="onClose()">
        <i class="bi bi-x-lg text-[13px]"></i>
      </button>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto">
      @if (isLoading) {
        <div class="flex min-h-full items-center justify-center p-4">
          <div class="w-full max-w-[420px] rounded-[10px] bg-[rgba(22,34,48,0.88)] p-4 text-center ring-1 ring-inset ring-[rgba(143,166,190,0.20)] [body.light-theme_&]:!bg-white">
            <div class="mx-auto flex h-11 w-11 items-center justify-center rounded-full bg-[rgba(28,39,53,0.94)] ring-1 ring-inset ring-[rgba(143,166,190,0.20)] [body.light-theme_&]:!bg-white">
              <div class="h-5 w-5 animate-spin rounded-full border-2 border-[var(--color-border)] border-t-[#8FAECC]"></div>
            </div>
            <div class="mt-3">
              <div class="text-[12px] font-semibold uppercase tracking-[0.16em] text-[var(--color-text1)]">{{ 'Loading IP Detail' | translate }}</div>
              <div class="mt-1 truncate text-[12px] text-[var(--color-text3)]">{{ currentStep }}</div>
            </div>
            <div class="mt-4 flex items-center gap-3">
              <progress class="h-1.5 min-w-0 flex-1 overflow-hidden rounded-full [&::-webkit-progress-bar]:bg-[rgba(28,39,53,0.94)] [&::-webkit-progress-value]:rounded-full [&::-webkit-progress-value]:bg-[#8FAECC] [&::-moz-progress-bar]:rounded-full [&::-moz-progress-bar]:bg-[#8FAECC]" max="100" [value]="progress"></progress>
              <span class="w-10 text-right font-mono text-[11px] text-[var(--color-text4)]">{{ progress }}%</span>
            </div>
          </div>
        </div>
      } @else if (errorMessage) {
        <div class="m-4 rounded-[8px] border border-red-400/25 bg-red-500/10 px-4 py-3">
          <div class="text-[12px] font-semibold uppercase tracking-[0.14em] text-red-300">{{ 'Unable to load detail' | translate }}</div>
          <p class="mt-1 text-[13px] text-red-200 [body.light-theme_&]:text-red-700">{{ errorMessage }}</p>
        </div>
      } @else if (detail) {
        <app-ip-detail [detail]="detail"></app-ip-detail>
      } @else {
        <div class="m-4 rounded-[10px] bg-[rgba(22,34,48,0.88)] px-4 py-8 text-center text-[13px] text-[var(--color-text3)] ring-1 ring-inset ring-[rgba(143,166,190,0.20)] [body.light-theme_&]:!bg-white">{{ 'No IP detail available.' | translate }}</div>
      }
    </div>
  </div>
</div>
