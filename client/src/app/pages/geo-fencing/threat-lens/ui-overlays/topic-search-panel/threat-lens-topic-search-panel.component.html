<div data-testid="threat-lens-topic-search-panel" class="map-overlay-menu relative w-full shrink-0">
  <div class="pointer-events-none absolute inset-y-0 left-0 z-10 flex items-center pl-4">
    <i class="bi bi-search h-5 w-5 leading-none text-[var(--color-text4)]" aria-hidden="true"></i>
  </div>
  <input data-testid="threat-lens-topic-search-input" [ngModel]="term" (ngModelChange)="onTermChange($event)" (keyup.enter)="onSearch()" (keydown.arrowleft)="$event.stopPropagation()" (keydown.arrowright)="$event.stopPropagation()" (keydown.home)="$event.stopPropagation()" (keydown.end)="$event.stopPropagation()" type="text" [placeholder]="'Search topic' | translate" class="relative z-0 block h-10 w-full rounded-[10px] border-0 bg-[rgba(24,36,51,0.90)] pl-11 pr-28 text-[#C4D4E6] shadow-[0_8px_22px_rgba(5,12,22,0.24)] ring-1 ring-inset ring-[rgba(143,166,190,0.18)] backdrop-blur-sm placeholder:text-[var(--color-text4)] focus:outline-none focus:ring-2 focus:ring-[rgba(124,154,186,0.48)] [body.light-theme_&]:!bg-white [body.light-theme_&]:text-[var(--color-gray-900)] [body.light-theme_&]:shadow-[0_8px_22px_rgba(15,23,42,0.08)] [body.light-theme_&]:ring-[#d7e2ef] sm:text-sm sm:leading-6" />
  <div class="absolute inset-y-1 right-1 flex items-center rounded-[10px]">
    <button data-testid="threat-lens-topic-search-submit" type="button" (click)="onSearch()" [disabled]="isLoading" class="flex h-8 items-center rounded-[9px] bg-[rgba(65,86,110,0.94)] px-3.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-[rgba(78,102,130,0.98)] disabled:cursor-not-allowed disabled:bg-[rgba(38,53,68,0.80)] disabled:text-[var(--color-text4)] [body.light-theme_&]:!bg-[var(--color-blue-640)] [body.light-theme_&]:hover:!bg-[var(--color-blue-630)] [body.light-theme_&]:disabled:!bg-[#dbe5f0] [body.light-theme_&]:disabled:!text-[#5f738f]">
      {{ 'Search' | translate }}
    </button>
  </div>
</div>
