<div data-testid="threat-lens-topic-search-panel" class="map-overlay-menu shrink-0 rounded-[14px] border border-white/15 bg-[rgba(8,16,27,0.94)] p-3 shadow-[0_20px_48px_rgba(2,6,23,.55)] backdrop-blur-md [body.light-theme_&]:border-[#d2deec] [body.light-theme_&]:bg-[#f7fbff]/95 [body.light-theme_&]:shadow-[0_18px_44px_rgba(15,23,42,.14)] max-[640px]:rounded-[12px]">
  <div class="min-w-0">
    <p class="text-[13px] font-semibold uppercase tracking-[0.14em] text-[var(--color-text3)]">{{ 'Topic Search' | translate }}</p>
    <p class="mt-1 truncate text-[11px] text-[var(--color-text4)]">
      {{ 'Semantic search across threat records' | translate }}
    </p>
  </div>
  <div class="mt-3 flex items-center gap-2 max-[520px]:flex-col">
    <input data-testid="threat-lens-topic-search-input" [ngModel]="term" (ngModelChange)="onTermChange($event)" (keyup.enter)="onSearch()" type="text" [placeholder]="'Search topic (e.g. ransomware attack)' | translate" class="h-[34px] w-full rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-790)] px-3 text-[12px] text-[var(--color-text1)] outline-none ring-0 transition focus:border-[var(--color-blue-640)] placeholder:text-[var(--color-text3)] [body.light-theme_&]:bg-[var(--color-white)] [body.light-theme_&]:text-[var(--color-gray-900)]" />
    <button data-testid="threat-lens-topic-search-submit" type="button" (click)="onSearch()" [disabled]="isLoading" class="h-[34px] rounded-[8px] border border-[var(--color-blue-640)] bg-[var(--color-blue-640)] px-3 text-[12px] font-semibold text-[var(--color-white)] transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60 max-[520px]:w-full">
      {{ 'Search' | translate }}
    </button>
  </div>
  @if (currentTopicQuery) {
    <p data-testid="threat-lens-active-topic" class="mt-2 text-[12px] text-[var(--color-text2)]">{{ 'Active topic' | translate }}: <span class="font-semibold">{{ currentTopicQuery }}</span></p>
  }
</div>
