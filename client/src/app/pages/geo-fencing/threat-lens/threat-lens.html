<section data-testid="threat-lens-page" class="ui-consolidated-theme relative flex h-full min-h-0 w-full flex-1 flex-col overflow-hidden bg-black">
	<div class="flex min-h-0 flex-1 flex-col overflow-hidden max-[1100px]:overflow-x-hidden max-[1100px]:overflow-y-auto max-[1100px]:pb-3">
		<div class="relative grid min-h-0 flex-1 grid-cols-1 grid-rows-[minmax(0,1fr)] overflow-hidden max-[1100px]:block max-[1100px]:overflow-visible">
			<div class="relative min-h-0 min-w-0 overflow-hidden max-[1100px]:min-h-[380px]">

	<app-threat-lens-map-renderer
		data-testid="threat-lens-map-renderer"
		class="absolute inset-0 block h-full min-h-0 min-w-0 overflow-hidden"
		(mapReady)="onMapReady()"
		(mapError)="onMapError($event)"
		(countrySelected)="onCountrySelected($event)"
		(emptySelection)="onMapEmptySelection()"
		(ipSelected)="onIpSelected($event)"
		(arcSelected)="onArcSelected($event)"
		(viewportIpScanRequested)="onViewportIpScanRequested($event)"
		(arcCountChange)="onArcCountChange($event)"
		(arcBatchStatusChange)="onArcBatchStatusChange($event)">
	</app-threat-lens-map-renderer>

	<div class="pointer-events-none absolute inset-0 bg-[var(--color-mono)] opacity-15 max-[1100px]:hidden"></div>

	<app-map-loading-badges [items]="loadingBadges" [topControlsInset]="!showFilterButton"></app-map-loading-badges>

	@if (isLoading) {
		<div data-testid="threat-lens-loading" class="absolute inset-0 z-[960] flex items-center justify-center bg-[rgba(8,16,27,0.58)] px-4 backdrop-blur-[2px] [body.light-theme_&]:bg-white/50">
			<div class="map-overlay-menu w-[min(360px,calc(100%-2rem))] rounded-[14px] border border-white/15 bg-[rgba(8,16,27,0.94)] p-4 shadow-[0_20px_48px_rgba(2,6,23,.55)] backdrop-blur-md [body.light-theme_&]:border-[#d2deec] [body.light-theme_&]:bg-[#f7fbff]/95 [body.light-theme_&]:shadow-[0_18px_44px_rgba(15,23,42,.14)]">
				<div class="flex items-center gap-3">
					<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-790)]">
						<div class="h-5 w-5 animate-spin rounded-full border-2 border-[var(--color-border)] border-t-[var(--color-blue-640)]"></div>
					</div>
					<div class="min-w-0">
						<p class="text-[12px] font-semibold uppercase tracking-[0.14em] text-[var(--color-text1)]">{{ 'Loading Threat Lens' | translate }}</p>
						<p class="mt-1 truncate text-[12px] text-[var(--color-text3)]">{{ statusMessage }}</p>
					</div>
				</div>
				<div class="ui-progress-track mt-4 h-[5px] rounded-full border border-[var(--color-border)] bg-[var(--color-blue-790)]">
					<div class="ui-progress-indeterminate-bar"></div>
				</div>
			</div>
		</div>
	}
			</div>

	<div class="absolute left-4 top-4 bottom-4 z-20 flex min-h-0 w-[min(24rem,calc(100%-5rem))] flex-col gap-3 overflow-visible max-[1100px]:relative max-[1100px]:left-auto max-[1100px]:top-auto max-[1100px]:bottom-auto max-[1100px]:z-10 max-[1100px]:w-full max-[1100px]:px-3 max-[1100px]:pt-3">
		<div class="h-[40px] shrink-0 max-[1100px]:hidden"></div>
		<app-threat-lens-topic-search-panel
			[isLoading]="isLoading"
			(search)="onTopicSearch($event)">
		</app-threat-lens-topic-search-panel>

		<app-threat-lens-country-search-panel
			[isLoading]="isLoading"
			[topCountries]="topCountries"
			[categoryLegend]="categoryLegend"
			[selectedArcCategoryKey]="selectedArcCategoryKey"
			[arcBatchSize]="arcBatchSize"
			[arcBatchSizeOptions]="arcBatchSizeOptions"
			[selectedArcRangeIndex]="selectedArcRangeIndex"
			[arcRangeOptions]="arcRangeOptions"
			[arcBatchStatus]="arcBatchStatus"
			(search)="onCountrySearch($event)"
			(topCountrySelect)="onTopCountrySelect($event)"
			(arcCategorySelect)="onArcCategorySelect($event)"
			(arcBatchSizeChange)="onArcBatchSizeChange($event)"
			(arcRangeChange)="onArcRangeChange($event)">
		</app-threat-lens-country-search-panel>

		<app-threat-lens-summary-panel
			[selectedCountryName]="selectedCountryName"
			[selectedCountryBreakdown]="selectedCountryBreakdown"
			[isLoading]="isLoading"
			[statusMessage]="statusMessage"
			[arcCount]="arcCount"
			[arcBatchStatus]="arcBatchStatus"
			[isIpScanRunning]="isIpScanRunning"
			[ipScanErrorMessage]="ipScanErrorMessage"
			[ipScanScopeLabel]="ipScanScopeLabel"
			[ipScanResultCount]="ipScanResultCount"
			[ipScanRangeLabel]="ipScanRangeLabel"
			[ipScanStatusMessage]="ipScanStatusMessage"
			[hasIpScanResult]="hasIpScanResult"
			[hasIpScanCompleted]="hasIpScanCompleted"
			[ipScanProgress]="ipScanProgress">
		</app-threat-lens-summary-panel>
	</div>

	<div class="absolute right-4 top-4 bottom-4 z-20 flex min-h-0 w-[min(25rem,calc(100%-2rem))] flex-col gap-0 overflow-hidden max-[1100px]:relative max-[1100px]:left-auto max-[1100px]:right-auto max-[1100px]:top-auto max-[1100px]:bottom-auto max-[1100px]:z-10 max-[1100px]:mt-3 max-[1100px]:w-full max-[1100px]:overflow-visible max-[1100px]:px-3 max-[1100px]:pb-3">
		@if (showFilterButton) {
		<div class="flex justify-end gap-2 max-[550px]:flex-col">
				<label data-testid="side-filter-open" (click)="sidebarService.openSidebar()" [appTooltip]="'Customize Results' | translate" class="map-overlay-menu inline-flex h-[40px] cursor-pointer items-center gap-[8px] rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-770)] px-[12px] text-[13px] font-medium text-[var(--color-text1)] shadow-[0_8px_24px_rgba(2,6,23,.35)] transition hover:bg-[var(--color-blue-710)] [body.light-theme_&]:shadow-[0_8px_22px_rgba(15,23,42,.12)] max-[550px]:w-full max-[550px]:justify-center">
					<img alt="Filter Icon" height="20" src="assets/images/shared/theme/filter_icon.svg" priority width="20" class="ui-filter-icon">
					<span>{{ 'Filter' | translate }}</span>
				</label>
		</div>
		}

		<div class="min-h-0 flex-1 space-y-3 overflow-hidden max-[1100px]:min-h-[unset] max-[1100px]:overflow-visible">
      <div class="shrink-0 max-[1100px]:hidden" [ngClass]="{ 'h-[40px]': !showFilterButton }"></div>
				<app-threat-lens-feed-panel
					[title]="'News Feed' | translate"
					[description]="'Live news stream from threat records.' | translate"
					[searchPlaceholder]="'Search news feed...' | translate"
					[emptyMessage]="'No news records found for the selected time window.' | translate"
					feedType="news"
					[items]="feedItems"
				></app-threat-lens-feed-panel>

			<app-threat-lens-feed-panel
				[title]="'Archive' | translate"
				[description]="'Defacement, social, exploit, leak and other activity.' | translate"
				[searchPlaceholder]="'Search archive...' | translate"
				[emptyMessage]="'No archive activity found for the selected time window.' | translate"
				feedType="archive"
				[items]="feedItems"
			></app-threat-lens-feed-panel>
		</div>
	</div>
		</div>
	</div>
</section>


 @if (filterModel && (isFilterOpen$ | async)) {
    <div class="ui-filter-sidebar-overlay fixed inset-0 z-[1190]" (click)="sidebarService.closeSidebar()">
    </div>
  }

  @if (filterModel) {
    <div class="ui-filter-sidebar-panel fixed top-0 right-0 z-[1200] h-screen w-[300px] overflow-hidden rounded-tl-[15px] border-l border-l-[var(--color-border)] bg-[var(--color-blue-700)] shadow-lg transition-transform duration-200 max-[450px]:w-full" [ngClass]="{ 'translate-x-full': !(isFilterOpen$ | async), 'translate-x-0': (isFilterOpen$ | async) }">
      <app-filters (filterClose)="sidebarService.closeSidebar()" (filterChanged)="onSearch()" [filterModel]="filterModel" [isFilterOpen]="isFilterOpen$ | async"></app-filters>
    </div>
  }

@if (selectedIp) {
	<app-threat-lens-ip-detail-popup
		[ip]="selectedIp"
		(close)="onIpDetailPopupClose()">
	</app-threat-lens-ip-detail-popup>
}

@if (selectedArc; as arc) {
	<app-threat-lens-arc-report-popup
		[arc]="arc"
		[items]="feedItems"
		(close)="onArcReportPanelClose()">
	</app-threat-lens-arc-report-popup>
}
