<div class="ip-detail-popup-backdrop fixed inset-0 z-[1250] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm max-[640px]:items-end">
  <div class="relative flex max-h-[86dvh] w-full max-w-[980px] flex-col overflow-hidden rounded-2xl border border-[var(--color-border)] bg-[var(--color-blue-790)] shadow-2xl max-[640px]:max-h-[90dvh] max-[640px]:rounded-[16px]" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between gap-3 border-b border-[var(--color-border)] px-5 py-4">
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <i class="bi bi-hdd-network text-[15px] text-sky-400"></i>
          <span class="text-[14px] font-semibold text-[var(--color-text1)]">IP Detail</span>
        </div>
        <div class="mt-1 truncate font-mono text-[12px] text-[var(--color-text3)]">{{ ip }}</div>
      </div>
      <button type="button" class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg text-[var(--color-text3)] transition-colors hover:bg-[var(--color-blue-720)] hover:text-[var(--color-text1)]" aria-label="Close IP detail" (click)="onClose()">
        <i class="bi bi-x-lg text-[13px]"></i>
      </button>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto">
      @if (isLoading) {
        <div class="flex min-h-[260px] flex-col items-center justify-center gap-3 px-6 py-10 text-center">
          <div class="h-10 w-10 animate-spin rounded-full border-4 border-sky-400/20 border-t-sky-400"></div>
          <div>
            <div class="text-[13px] font-semibold uppercase tracking-[0.16em] text-[var(--color-text1)]">Loading IP Detail</div>
            <div class="mt-1 text-[12px] text-[var(--color-text3)]">{{ currentStep }}</div>
          </div>
          <progress class="h-1.5 w-full max-w-[320px] overflow-hidden rounded-full [&::-webkit-progress-bar]:bg-[var(--color-blue-720)] [&::-webkit-progress-value]:rounded-full [&::-webkit-progress-value]:bg-sky-400 [&::-moz-progress-bar]:rounded-full [&::-moz-progress-bar]:bg-sky-400" max="100" [value]="progress"></progress>
        </div>
      } @else if (errorMessage) {
        <div class="m-5 rounded-xl border border-red-400/25 bg-red-500/10 px-4 py-3 text-[13px] text-red-200">
          {{ errorMessage }}
        </div>
      } @else if (detail) {
        <app-ip-detail [detail]="detail"></app-ip-detail>
      } @else {
        <div class="px-6 py-10 text-center text-[13px] text-[var(--color-text3)]">No IP detail available.</div>
      }
    </div>
  </div>
</div>
