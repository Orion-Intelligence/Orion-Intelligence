@if (isPanelMenuOpen) {
  <div data-testid="geo-fencing-panel-menu" class="map-overlay-menu absolute right-3 top-16 z-[999] flex w-[230px] flex-col overflow-hidden rounded-[12px] border border-white/15 bg-[rgba(8,16,27,0.94)] shadow-[0_16px_40px_rgba(2,6,23,.45)] backdrop-blur-md animate-[ui-popup-flyout-in_160ms_ease-out_both] [body.light-theme_&]:border-[#d2deec] [body.light-theme_&]:bg-[#f7fbff]/95 [body.light-theme_&]:shadow-[0_16px_38px_rgba(15,23,42,.14)] max-[943px]:right-2 max-[943px]:top-[88px] max-[520px]:top-[136px] max-[520px]:w-[min(230px,calc(100%-16px))]">
    @if (isThreatView) {
      <button data-testid="geo-fencing-panel-menu-filter" class="border-b border-white/10 px-3 py-2 text-left text-[12px] font-semibold text-[var(--color-text3)] transition-colors last:border-b-0 hover:bg-white/5 hover:text-[var(--color-text1)] [body.light-theme_&]:border-[#d8e3f0] [body.light-theme_&]:hover:bg-[#eef5ff]" (click)="threatFiltersOpened.emit()">
        {{ 'Filter' | translate }}
      </button>
    } @else {
      @for (tab of panelTabs; track tab.id) {
        <button [attr.data-testid]="'geo-fencing-panel-tab-' + tab.id" class="border-b border-white/10 px-3 py-2 text-left text-[12px] font-semibold text-[var(--color-text3)] transition-colors last:border-b-0 hover:bg-white/5 hover:text-[var(--color-text1)] [body.light-theme_&]:border-[#d8e3f0] [body.light-theme_&]:hover:bg-[#eef5ff]" (click)="panelOpened.emit(tab.id)">
          {{ tab.label }}
        </button>
      }
    }
  </div>
}

@if (isMapView && isPanelPopupOpen) {
  <div data-testid="geo-fencing-panel-popup" class="map-overlay-menu absolute bottom-3 right-3 top-16 z-[930] flex w-[min(380px,calc(100%-24px))] flex-col overflow-hidden rounded-[14px] border border-white/15 bg-[rgba(8,16,27,0.94)] shadow-[0_20px_48px_rgba(2,6,23,.55)] backdrop-blur-md animate-[ui-popup-panel-in_180ms_ease-out_both] [body.light-theme_&]:border-[#d2deec] [body.light-theme_&]:bg-[#f7fbff]/95 [body.light-theme_&]:shadow-[0_18px_44px_rgba(15,23,42,.14)] max-[640px]:left-2 max-[640px]:right-2 max-[640px]:top-auto max-[640px]:bottom-2 max-[640px]:h-[72dvh] max-[640px]:w-auto max-[640px]:rounded-[12px]">
    <div class="flex shrink-0 items-center justify-between border-b border-white/10 px-3 py-2 [body.light-theme_&]:border-[#d8e3f0] max-[420px]:px-2">
      <div data-testid="geo-fencing-panel-title" class="text-[18px] font-semibold uppercase tracking-[0.08em] text-[var(--color-text3)] max-[420px]:text-[14px]">{{ activePanelLabel }}</div>
      <button data-testid="geo-fencing-panel-close" type="button" class="ui-popup-close right-5 top-5 h-[42px] w-[42px] rounded-[8px] border-none bg-transparent text-[28px] leading-none text-[#ccc] transition-[color,background-color] duration-200 hover:bg-[var(--color-blue-700)] hover:text-[var(--color-blue-640)] [body.light-theme_&]:text-[#667085] [body.light-theme_&]:hover:bg-[#eef5ff] [body.light-theme_&]:hover:text-[#1f2e47] max-[420px]:h-9 max-[420px]:w-9" (click)="panelClosed.emit()" [attr.aria-label]="'Close popup' | translate">×</button>
    </div>
    <div class="min-h-0 flex-1 overflow-y-auto">
      <ng-content></ng-content>
    </div>
  </div>
}
