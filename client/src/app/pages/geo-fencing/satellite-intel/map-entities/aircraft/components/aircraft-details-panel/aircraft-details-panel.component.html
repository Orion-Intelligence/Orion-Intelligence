<div class="rounded-[12px] border border-[var(--color-border)] bg-[var(--color-blue-760)] p-3 [body.light-theme_&]:border-[#cfdbe8] [body.light-theme_&]:bg-white [body.light-theme_&]:shadow-[0_6px_18px_rgba(15,23,42,0.07)]">
  <div class="text-[16px] font-semibold leading-[1.25] text-[var(--color-text1)]">{{ 'Aircraft' | translate }}</div>
  <div class="mt-1 text-[12px] font-normal text-[var(--color-text6)]">{{ 'Live transponder identity, movement, and position.' | translate }}</div>
  <div class="mt-3 grid gap-3 sm:grid-cols-2">
    @for (field of fields; track field.label) {
      <div>
        <label class="mb-1 block text-xs font-semibold uppercase text-[var(--color-text6)]">{{ field.label }}</label>
        <div class="rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-790)] px-3 py-2 min-w-0 break-words [overflow-wrap:anywhere] text-sm text-[var(--color-text1)] [body.light-theme_&]:border-[#d8e2ee] [body.light-theme_&]:bg-[#f6faff]" [class.font-mono]="field.mono">{{ field.value }}</div>
      </div>
    }
  </div>
  <div class="mt-3">
    <label class="mb-1 block text-xs font-semibold uppercase text-[var(--color-text6)]">{{ 'categoryAlerts.form.description' | translate }}</label>
    <div class="rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-790)] px-3 py-2 min-w-0 break-words [overflow-wrap:anywhere] text-sm text-[var(--color-text1)] [body.light-theme_&]:border-[#d8e2ee] [body.light-theme_&]:bg-[#f6faff]">{{ description }}</div>
  </div>
  <div class="mt-3">
    <label class="mb-1 block text-xs font-semibold uppercase text-[var(--color-text6)]">{{ 'Coordinates' | translate }}</label>
    <div class="rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-790)] px-3 py-2 min-w-0 break-words [overflow-wrap:anywhere] text-sm text-[var(--color-text1)] [body.light-theme_&]:border-[#d8e2ee] [body.light-theme_&]:bg-[#f6faff]">{{ coordinates }}</div>
  </div>
</div>
