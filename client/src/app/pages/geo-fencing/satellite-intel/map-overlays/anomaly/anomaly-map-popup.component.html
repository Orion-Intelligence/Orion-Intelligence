<div class="w-[180px] rounded-lg bg-slate-950 px-2.5 py-2 text-white">
  <div class="text-xs font-bold leading-snug">Anomaly zone</div>
  <div class="mt-2 flex items-start justify-between gap-2 border-t border-white/10 pt-1 text-[11px] leading-snug">
    <span class="text-[10px] font-semibold uppercase tracking-wide text-white/65">Alert</span>
    <span class="font-semibold uppercase" [ngClass]="alertClass">{{ alertLevel }}</span>
  </div>
  <div class="mt-1 flex items-start justify-between gap-2 border-t border-white/10 pt-1 text-[11px] leading-snug">
    <span class="text-[10px] font-semibold uppercase tracking-wide text-white/65">NDVI delta</span>
    <span class="font-semibold text-white">{{ deltaScore }}</span>
  </div>
</div>
