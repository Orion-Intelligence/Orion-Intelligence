<div class="w-[180px] rounded-lg bg-slate-950 px-2.5 py-2 text-white [body.light-theme_&]:border [body.light-theme_&]:border-[#d2deec] [body.light-theme_&]:bg-[#f7fbff] [body.light-theme_&]:text-[var(--color-text1)] [body.light-theme_&]:shadow-[0_10px_28px_rgba(15,23,42,.14)]">
  <div class="text-xs font-bold leading-snug">{{ 'Anomaly zone' | translate }}</div>
  <div class="mt-2 flex items-start justify-between gap-2 border-t border-white/10 pt-1 text-[11px] leading-snug [body.light-theme_&]:border-[#d8e3f0]">
    <span class="text-[10px] font-semibold uppercase tracking-wide text-white/65 [body.light-theme_&]:text-[var(--color-text4)]">{{ 'Alert' | translate }}</span>
    <span class="font-semibold uppercase" [ngClass]="alertClass">{{ alertLevel }}</span>
  </div>
  <div class="mt-1 flex items-start justify-between gap-2 border-t border-white/10 pt-1 text-[11px] leading-snug [body.light-theme_&]:border-[#d8e3f0]">
    <span class="text-[10px] font-semibold uppercase tracking-wide text-white/65 [body.light-theme_&]:text-[var(--color-text4)]">{{ 'NDVI delta' | translate }}</span>
    <span class="font-semibold text-white [body.light-theme_&]:text-[var(--color-text1)]">{{ deltaScore }}</span>
  </div>
</div>
