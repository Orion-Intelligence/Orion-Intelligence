<div class="fixed inset-0 z-[1301]">

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50 transition-opacity duration-300"
        [ngClass]="isOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'" (click)="closePopup()">
    </div>

    <!-- Right Side Drawer -->
    <div class="absolute right-0 top-0 h-full w-full max-w-2xl bg-[var(--color-blue-700)] shadow-2xl flex flex-col
        transform transition-transform duration-300 ease-out"
        [ngClass]="isOpen ? 'translate-x-0' : 'translate-x-full'">

        <!-- Header -->
        <div
            class="relative flex items-center justify-between px-6 py-4 border-b border-[var(--color-border)]">
            <h2 class="text-2xl font-bold text-[var(--color-text1)]">
                Add New Case
            </h2>

            <button type="button" (click)="closePopup()"
                class="relative text-[var(--color-text4)] hover:text-[var(--color-text1)] text-xl">
                ✕
            </button>
        </div>

        <!-- Body (scrollable) -->
        <div class="flex-1 overflow-y-auto p-6">

            <form (ngSubmit)="onSubmit()" class="space-y-5">

                <!-- Case ID -->
                <div>
                    <label class="block text-sm font-semibold text-[var(--color-text4)] uppercase">Case ID</label>
                    <input type="text" [value]="caseForm.caseId" disabled
                        class="mt-1 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-760)] px-3 py-2 text-[var(--color-text1)] cursor-not-allowed" />
                </div>

                <!-- Officer Name -->
                <div>
                    <label class="block text-sm font-semibold text-[var(--color-text4)] uppercase">
                        Officer Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" [(ngModel)]="caseForm.owner" name="owner" required
                        class="mt-1 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 py-2 text-[var(--color-text1)] outline-none focus:border-sky-400/40"
                        placeholder="Enter officer name" />
                </div>

                <!-- Creation Date -->
                <div>
                    <label class="block text-sm font-semibold text-[var(--color-text4)] uppercase">
                        Creation Date & Time
                    </label>
                    <input type="text" [value]="getFormattedDateTime(caseForm.createdDate)" disabled
                        class="mt-1 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-760)] px-3 py-2 text-[var(--color-text1)] cursor-not-allowed" />
                </div>

                <!-- Modification Date -->
                <div>
                    <label class="block text-sm font-semibold text-[var(--color-text4)] uppercase">
                        Modification Date & Time
                    </label>
                    <input type="text" [value]="getFormattedDateTime(caseForm.modifiedDate)" disabled
                        class="mt-1 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-760)] px-3 py-2 text-[var(--color-text1)] cursor-not-allowed" />
                </div>

                <!-- Intake Source -->
                <div>
                    <label class="block text-sm font-semibold text-[var(--color-text4)] uppercase">Intake Source</label>
                    <input type="text" [(ngModel)]="caseForm.intakeSource" name="intakeSource"
                        class="mt-1 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 py-2 text-[var(--color-text1)] outline-none focus:border-sky-400/40"
                        placeholder="e.g. API Alert, Email, etc." />
                </div>

                <!-- Case Type -->
                <div>
                    <label class="block text-sm font-semibold text-[var(--color-text4)] uppercase">Case Type</label>
                    <select [(ngModel)]="caseForm.caseType" name="caseType"
                        class="mt-1 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 py-2 text-[var(--color-text1)]">
                        @for (type of caseTypeOptions; track type) {
                        <option [value]="type">{{ type }}</option>
                        }
                    </select>
                </div>

                <!-- Priority -->
                <div>
                    <label class="block text-sm font-semibold text-[var(--color-text4)] uppercase">Priority</label>
                    <select [(ngModel)]="caseForm.priority" name="priority"
                        class="mt-1 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 py-2 text-[var(--color-text1)]">
                        @for (p of priorityOptions; track p) {
                        <option [value]="p" class="capitalize">{{ p }}</option>
                        }
                    </select>
                </div>

                <!-- Status -->
                <div>
                    <label class="block text-sm font-semibold text-[var(--color-text4)] uppercase">Status</label>
                    <select [(ngModel)]="caseForm.status" name="status"
                        class="mt-1 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 py-2 text-[var(--color-text1)]">
                        @for (s of statusOptions; track s) {
                        <option [value]="s" class="capitalize">{{ s }}</option>
                        }
                    </select>
                </div>

            </form>
        </div>

        <!-- Footer Buttons -->
        <div class="px-6 py-4 border-t border-[var(--color-border)] flex justify-end gap-3 bg-[var(--color-blue-700)]">

            <button type="button" (click)="closePopup()" class="ui-btn border border-[var(--color-border)]">
                Cancel
            </button>

            <button type="button" (click)="onSubmit()" class="ui-btn ui-btn-primary">
                Save Case
            </button>

        </div>

    </div>
</div>
