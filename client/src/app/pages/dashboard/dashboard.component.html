<div *ngIf="!isCtiGraph()">
  <div id="top"></div>
  <div class="row dashboard__sidebar-main" id="dashboard__sidebar-main">
    <input class="dashboard__menu-toggle" id="dashboard__menu-toggle" name="menu-input" type="radio">

    <div [ngClass]="{ 'show-menu': isMenuOpen, 'collapsed': !isMenuOpen }" class="dashboard__sidebar">
      <app-dashboard-sidebar (menuToggle)="toggleNavigation()"></app-dashboard-sidebar>
    </div>

    <div class="dashboard_container">
      <div class="dashboard dashboard-content-scroll" id="dashboard-container">
        <app-dashboard-header></app-dashboard-header>
        <span [@dashboard-global-animation]="prepareRoute(routerOutlet)" class="dashboard-body">
          <router-outlet #routerOutlet="outlet"></router-outlet>
        </span>
      </div>
    </div>
  </div>
</div>

<div *ngIf="isCtiGraph()">
  <router-outlet></router-outlet>
</div>
