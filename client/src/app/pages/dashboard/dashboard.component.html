@if (dashboardService.showSubscription()) {
  <app-pro-subscription
    (close)="hideSubscription()"
    data-cy="pro-subscription">
  </app-pro-subscription>
}

@if (!isCtiGraph()) {
  <div data-cy="dashboard-main" data-testid="dashboard-main">
    <div id="top" data-cy="top" class="block h-px w-full"></div>
    <div class="flex h-screen min-h-[800px] overflow-x-hidden overflow-y-visible bg-[var(--color-blue-900)]" id="dashboard__sidebar-main" data-cy="dashboard-sidebar-main">
      <input class="hidden" id="dashboard__menu-toggle" name="menu-input" type="radio" data-cy="menu-toggle">
      <div [ngClass]="{ 'w-[300px] max-[900px]:w-full p-0 overflow-y-auto': isMenuOpen, 'w-[70px] max-[900px]:w-[56px] px-[7px] py-[8px] overflow-hidden': !isMenuOpen, 'transition-[width,padding] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] max-[900px]:transition-none': isMenuOpen, 'transition-none': !isMenuOpen }" class="h-full border-r border-[rgba(255,255,255,0.08)] bg-[var(--color-blue-900)] [scrollbar-color:var(--color-blue-880)_transparent]" data-cy="dashboard-sidebar">
        <app-dashboard-sidebar
          (menuToggle)="toggleNavigation()"
          data-cy="dashboard-sidebar-component">
        </app-dashboard-sidebar>
      </div>
      <div [ngClass]="{ 'max-[900px]:hidden': isMenuOpen }" class="relative m-0 h-auto max-h-full min-w-0 flex-1 overflow-hidden overflow-x-hidden bg-[var(--color-blue-850)] z-[1]" data-cy="dashboard-container">
        <div class="pointer-events-none absolute inset-x-0 top-0 h-[220px] bg-[var(--color-mono)]"></div>
        <div class="relative z-[1] flex h-[1vh] min-h-full min-w-0 flex-col overflow-y-auto overflow-x-hidden" id="dashboard-container" data-cy="dashboard-sub-container" data-testid="dashboard-container">
          <app-dashboard-header data-cy="dashboard-header"></app-dashboard-header>
          <span [@dashboard-global-animation]="prepareRoute(routerOutlet)" class="ui-dashboard-grid-bg m-0 block flex-1 overflow-x-hidden" [style.width]="authService.getIsMobileDemo() ? '100vw' : null" data-cy="dashboard-body" data-testid="dashboard-body">
            <router-outlet #routerOutlet="outlet" data-cy="router-outlet"></router-outlet>
          </span>
        </div>
      </div>
    </div>
  </div>
}

@if (isCtiGraph()) {
  <div data-cy="cti-graph-container">
    <router-outlet data-cy="cti-router-outlet"></router-outlet>
  </div>
}
