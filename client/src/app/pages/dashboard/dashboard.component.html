<div id="top"></div>
<div class="row dashboard__sidebar-main" id="dashboard__sidebar-main">
  <input type="radio" name="menu-input" class="dashboard__menu-toggle" id="dashboard__menu-toggle">

  <div class="dashboard__sidebar" [ngClass]="{'show-menu': isMenuOpen}">
    <app-dashboard-sidebar (menuClosed)="hideSideNav()"></app-dashboard-sidebar>
  </div>

  <div class="dashboard_container">
    <div class="dashboard dashboard-content-scroll">
      <app-dashboard-header (menuClicked)="toggleSideNav()"></app-dashboard-header>
      <div [@fadeIn]="prepareRoute(routerOutlet)">
        <router-outlet #routerOutlet="outlet"></router-outlet>
      </div>
    </div>
  </div>
</div>
