<div id="top"></div>
<div class="row dashboard__sidebar-main" id="dashboard__sidebar-main">
  <input type="radio" name="menu-input" class="dashboard__menu-toggle" id="dashboard__menu-toggle">

  <div class="dashboard__sidebar" [ngClass]="{'show-menu': isMenuOpen, 'collapsed': !isMenuOpen}">
    <app-dashboard-sidebar (menuToggle)="toggleNavigation()"></app-dashboard-sidebar>
  </div>

  <div class="dashboard_container">
    <div id="dashboard-container" class="dashboard dashboard-content-scroll">
      <app-dashboard-header></app-dashboard-header>
      <span class="dashboard-body" [@dashboard-global-animation]="prepareRoute(routerOutlet)">
        <router-outlet #routerOutlet="outlet"></router-outlet>
      </span>
    </div>
  </div>
</div>
