<app-pro-subscription
  *ngIf="dashboardService.showSubscription()"
  (close)="hideSubscription()"
  data-cy="pro-subscription">
</app-pro-subscription>

<div *ngIf="!isCtiGraph()" data-cy="dashboard-main-container">
  <div id="top" data-cy="top"></div>

  <div
    class="flex h-screen min-h-[800px] overflow-x-hidden overflow-y-visible bg-[var(--color-blue-900)]"
    id="dashboard__sidebar-main"
    data-cy="dashboard-sidebar-main">

    <input
      class="hidden"
      id="dashboard__menu-toggle"
      name="menu-input"
      type="radio"
      data-cy="menu-toggle">

    <div
      *ngIf="!authService.getIsMobileDemo()"
      [ngClass]="{
        'w-[300px] p-0 overflow-y-auto': isMenuOpen,
        'w-[70px] px-[7px] py-[8px] overflow-hidden': !isMenuOpen
      }"
      class="h-full border-r border-[rgba(255,255,255,0.08)] bg-[var(--color-blue-900)] transition-[width,padding] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] [scrollbar-color:var(--color-blue-880)_transparent]"
      data-cy="dashboard-sidebar">

      <app-dashboard-sidebar
        (menuToggle)="toggleNavigation()"
        data-cy="dashboard-sidebar-component">
      </app-dashboard-sidebar>
    </div>

    <div class="m-0 h-auto max-h-full flex-1 overflow-hidden bg-[var(--color-blue-850)] z-[1]" data-cy="dashboard-container">
      <div
        class="h-[1vh] min-h-full overflow-y-auto bg-[var(--color-blue-830)] pb-[100px]"
        id="dashboard-container"
        data-cy="dashboard-sub-container">

        <app-dashboard-header data-cy="dashboard-header"></app-dashboard-header>

        <span
          [@dashboard-global-animation]="prepareRoute(routerOutlet)"
          class="m-0"
          data-cy="dashboard-body">

          <router-outlet #routerOutlet="outlet" data-cy="router-outlet"></router-outlet>
        </span>
      </div>
    </div>

  </div>
</div>

<div *ngIf="isCtiGraph()" data-cy="cti-graph-container">
  <router-outlet data-cy="cti-router-outlet"></router-outlet>
</div>
