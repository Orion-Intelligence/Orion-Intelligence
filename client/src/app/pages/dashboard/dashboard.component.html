@if (dashboardService.showSubscription()) {
  <app-pro-subscription
    (close)="hideSubscription()"
    data-testid="pro-subscription">
  </app-pro-subscription>
}

@if (!isCtiGraph()) {
  <div data-testid="dashboard-main">
    <span id="top"></span>
    <div class="flex h-screen min-h-[800px] overflow-x-hidden overflow-y-visible bg-[var(--color-blue-900)]" id="dashboard__sidebar-main" data-testid="dashboard-sidebar-main">
      <input class="hidden" id="dashboard__menu-toggle" name="menu-input" type="radio" data-testid="menu-toggle">
      <div [ngClass]="{ 'p-0 overflow-y-auto': isMenuOpen, 'px-[7px] py-[8px] overflow-hidden': !isMenuOpen, 'transition-[width,padding] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] max-[900px]:transition-none': isMenuOpen, 'transition-none': !isMenuOpen, 'w-screen min-w-screen': isMenuOpen && isCompactViewport(), 'w-[300px] min-w-[300px]': isMenuOpen && !isCompactViewport(), 'w-[68px] min-w-[68px]': !isMenuOpen && isCompactViewport(), 'w-[70px] min-w-[70px]': !isMenuOpen && !isCompactViewport() }" class="h-full border-r border-[rgba(255,255,255,0.08)] bg-[var(--color-blue-900)] [scrollbar-color:var(--color-blue-880)_transparent]" data-testid="dashboard-sidebar">
        <app-dashboard-sidebar
          (menuToggle)="toggleNavigation()"
          data-testid="dashboard-sidebar-component">
        </app-dashboard-sidebar>
      </div>
      <div [ngClass]="{ 'max-[900px]:hidden': isMenuOpen }" class="relative m-0 h-auto max-h-full min-w-0 flex-1 overflow-hidden overflow-x-hidden bg-[var(--color-blue-850)] z-[1]" data-testid="dashboard-shell">
        <div class="pointer-events-none absolute inset-x-0 top-0 h-[220px] bg-[var(--color-mono)]"></div>
        <div class="relative z-[1] flex h-[1vh] min-h-full min-w-0 flex-col overflow-y-auto overflow-x-hidden" id="dashboard-container" data-testid="dashboard-container">
          @if (!isCompactViewport()) {
            <app-dashboard-header data-testid="dashboard-header"></app-dashboard-header>
          }
          <span [@dashboard-global-animation]="prepareRoute(routerOutlet)" [ngClass]="{ 'w-screen': authService.getIsMobileDemo() }" class="ui-dashboard-grid-bg m-0 block flex-1 overflow-y-auto overflow-x-hidden [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden" data-testid="dashboard-body">
            <router-outlet #routerOutlet="outlet" data-testid="router-outlet"></router-outlet>
          </span>
        </div>
      </div>
    </div>
  </div>
}

@if (isCtiGraph()) {
  <div data-testid="cti-graph-container">
    <router-outlet data-testid="cti-router-outlet"></router-outlet>
  </div>
}

@if (demoTourMounted && shouldShowDemoTour()) {
  <app-demo-tour></app-demo-tour>
}
