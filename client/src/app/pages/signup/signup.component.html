<div class="login-page-container">
  <div class="login-form-side">
    <div class="header-links">
        <a href="https://drive.google.com/file/d/16NQysXxTdEg5Jx6KNok-rqHvdeM-YOJO/view?usp=sharing" target="_blank" class="header-link">Privacy Policy</a> <a href="https://orionintelligence.org/service/" target="_blank" class="header-link">Our Services</a> <a href="https://orionintelligence.org" target="_blank" class="header-link">About Us</a>
    </div>

    <div class="center-content-wrapper">
      <div class="login-content">
        <img src="assets/images/shared/orion-Intelligence-logo.svg" alt="ORION intelligence logo" class="orion-logo"/>
        <div class="login-heading">Sign Up to get started!</div>

        <form #signUpForm="ngForm" (ngSubmit)="onSubmit(signUpForm)" class="login-form">
          <label class="input-label">Username</label>
          <input [(ngModel)]="user.username" placeholder="Enter your username" class="login-input username" name="username" required type="text"/>

          <label class="input-label mt-2">Company Mail</label>
          <input [(ngModel)]="user.mail" placeholder="Enter your company mail" class="login-input email" name="companymail" required type="email"/>

          <label class="input-label mt-2 ">Password</label>
          <input [(ngModel)]="user.password" (input)="onPasswordInput(user.password)" id="id_password" type="password" placeholder="Enter your password" class="login-input password mb-4" name="password" required/>

          <div *ngIf="showPasswordMeter">
            <div class="password-strength-bar">
              <div class="strength-fill" [ngClass]="{
                'bg-danger bg-opacity-50': passwordStrength === 'weak',
                'bg-warning bg-opacity-50': passwordStrength === 'medium',
                'bg-success bg-opacity-50': passwordStrength === 'strong'
              }" [style.width.%]="passwordStrength === 'weak' ? 33 : passwordStrength === 'medium' ? 66 : 100"></div>
            </div>
            <ul class="password-checklist">
              <li *ngIf="currentUnmetCheck">{{ currentUnmetCheck }}</li>
            </ul>
          </div>

          <p *ngIf="errorMessage" [ngClass]="{'login-error-message': errorMessage}">
            {{ errorMessage }} </p>

          <div>
            <input [disabled]="!signUpForm.valid || !allPasswordRequirementsMet" [class.login-button]="signUpForm.valid && allPasswordRequirementsMet" [class.login-button-disable]="!signUpForm.valid || !allPasswordRequirementsMet" type="submit" value="Sign Up"/>
          </div>
        </form>

        <p class="signup-text">
          Already have an account? <span (click)="goToLogin()" class="signup-link cursor-pointer"> Login</span>
        </p>
      </div>
    </div>

    <div class="footer-copyright">
      <p>Copyright &copy; 2025. Powered by</p>
      <p>Orion Technologies</p>
    </div>
  </div>

  <div class="dashboard-preview-side">
    <img src="/assets/images/shared/auth_dashboard_icon.svg" alt="Dashboard Preview" class="dashboard-visual"/>
  </div>
</div>
