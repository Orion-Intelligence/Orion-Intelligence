<div class="add-tenant_wrapper" (click)="onClose()">
    <div class="add-tenant_container" (click)="$event.stopPropagation()">
        <div class="add-tenant_header">
            <div class="add-tenant_heading">Add Tenant</div>
            <button class="add-tenant_close-btn" (click)="onClose()">×</button>
        </div>

        <form class="add-tenant_form">

            <label class="add-tenant_label">Username</label>
            <input type="text" class="add-tenant_input" placeholder="Enter username" [(ngModel)]="model.username"
                name="username" />

            <label class="add-tenant_label">Email</label>
            <input type="email" class="add-tenant_input" placeholder="Enter email" [(ngModel)]="model.email"
                name="email" />

            <label class="add-tenant_label">Password</label>
            <input type="password" class="add-tenant_input" placeholder="Enter password" [(ngModel)]="model.password"
                name="password" />

            <div class="add-tenant_two-column">
                <div>
                    <label class="add-tenant_label">Role</label>
                    <select class="add-tenant_select" [(ngModel)]="model.role" name="role">
                        <option [ngValue]="isAdmin ? 'demo' : 'profile'">
                            {{ isAdmin ? 'Demo' : 'Profile' }}
                        </option>
                    </select>
                </div>

                <div>
                    <label class="add-tenant_label">Status</label>
                    <select class="add-tenant_select" [(ngModel)]="model.status" name="status">
                        <option [ngValue]="'active'">Active</option>
                        <option [ngValue]="'disable'">Disable</option>
                    </select>
                </div>
            </div>

            <div class="add-tenant_two-column">
                <div>
                    <label class="add-tenant_label">Subscription</label>
                    <select class="add-tenant_select" [(ngModel)]="model.subscription" name="subscription">
                        <option [value]="true">Paid</option>
                        <option [value]="false">Free</option>
                    </select>
                </div>
            </div>

            <div class="add-tenant_label">Licenses</div>

            <div class="license-grid">
                <ng-container *ngFor="let license of licenseList">
                    <div class="license-card" *ngIf="getLicenseLabel(license) !== 'maintainer'"
                        [class.license-selected]="model.licenses?.includes(license)"
                        (click)="toggleTenantLicense(model, license)">

                        <input type="checkbox" class="license-checkbox" [checked]="model.licenses?.includes(license)" />

                        <span class="license-label">
                            {{ getLicenseLabel(license) }}
                        </span>

                    </div>
                </ng-container>
            </div>

            <hr class="tenant-divider">

        </form>

        <div class="add-tenant_footer">
            <button class="add-tenant_btn-outline" (click)="onClose()">Cancel</button>
            <button class="add-tenant_btn-primary" (click)="onSubmit()">Add Tenant</button>
        </div>

    </div>
</div>
