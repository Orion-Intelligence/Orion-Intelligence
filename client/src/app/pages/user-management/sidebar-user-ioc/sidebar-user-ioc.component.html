<div class="relative m-[30px] overflow-hidden rounded-[16px] border border-[var(--color-border)] bg-[#172235] px-[20px] pb-[20px] pt-[12px] max-[1024px]:m-[15px]">
  <div class="pointer-events-none absolute inset-0 bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.014)_0px,rgba(255,255,255,0.014)_1px,transparent_1px,transparent_12px)]"></div>
  <div class="relative z-[1]">
    @if (onboardingData?.iocs) {
      <app-tenant-ioc-selector
        [iocs]="onboardingData.iocs"
        [disabled]="isPrivilegedIoc()"
        [permissionWarning]="iocPermissionWarning"
        (iocsChanged)="update()"></app-tenant-ioc-selector>
    }
  </div>
</div>
