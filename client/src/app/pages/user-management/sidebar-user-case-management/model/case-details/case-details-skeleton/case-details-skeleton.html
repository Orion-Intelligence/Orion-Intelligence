<div class="ui-page-container p-3 sm:p-5" data-testid="case-details-page">
    <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
        <div class="min-w-0 flex-1">
            <div class="ui-shimmer h-7 w-56 max-w-full rounded bg-[var(--color-blue-720)]"></div>
            <div class="ui-shimmer mt-2 h-3 w-44 rounded bg-[var(--color-blue-720)]"></div>
        </div>
        <div class="flex shrink-0 flex-wrap items-center gap-2 sm:justify-end">
            @for (action of [1, 2, 3]; track action) {
            <div class="ui-shimmer h-9 w-9 rounded-lg bg-[var(--color-blue-720)]"></div>
            }
        </div>
    </div>

    <div class="my-5 hidden h-px w-full bg-[var(--color-divider)] md:block"></div>

    <div class="space-y-5">
        <div class="overflow-hidden rounded-[8px] border border-[var(--color-border)] bg-[var(--tenant-expand-bg)] bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.014)_0px,rgba(255,255,255,0.014)_1px,transparent_1px,transparent_12px)]">
            <div class="flex h-12 items-center justify-between gap-3 border-b border-[var(--color-border)] bg-[var(--color-blue-820-light)] px-4">
                <div class="flex items-center gap-1.5">
                    <div class="ui-shimmer h-4 w-16 rounded bg-[var(--color-blue-720)]"></div>
                    <div class="ui-shimmer h-4 w-4 rounded-full bg-[var(--color-blue-720)]"></div>
                </div>
                <div class="ui-shimmer h-8 w-24 rounded-[8px] bg-[var(--color-blue-720)]"></div>
            </div>
            <div class="p-4">
                <div class="ui-shimmer h-3 w-40 max-w-full rounded bg-[var(--color-blue-720)]"></div>
            </div>
        </div>

        <div class="overflow-hidden rounded-[8px] border border-[var(--color-border)] bg-[var(--tenant-expand-bg)] bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.014)_0px,rgba(255,255,255,0.014)_1px,transparent_1px,transparent_12px)]">
            <div class="flex flex-col gap-3 border-b border-[var(--color-border)] bg-[var(--color-blue-820-light)] p-3 lg:flex-row lg:items-center lg:justify-between">
                <div class="min-w-0">
                    <div class="ui-shimmer h-4 w-28 rounded bg-[var(--color-blue-720)]"></div>
                    <div class="ui-shimmer mt-2 h-3 w-64 max-w-full rounded bg-[var(--color-blue-720)]"></div>
                </div>
                <div class="flex w-full flex-col gap-2 sm:flex-row sm:items-center sm:justify-end lg:w-auto">
                    <div class="grid w-full grid-cols-3 overflow-hidden rounded-[8px] border border-[var(--tenant-line)] bg-[var(--color-blue-830)]/60 sm:w-[420px] xl:w-[480px]">
                        @for (metric of [1, 2, 3]; track metric) {
                        <div class="min-w-0 border-r border-[var(--tenant-line)] px-3 py-2 last:border-r-0">
                            <div class="ui-shimmer h-2.5 w-12 rounded bg-[var(--color-blue-720)]"></div>
                            <div class="mt-1 flex items-center gap-1.5">
                                <div class="ui-shimmer h-1.5 w-1.5 shrink-0 rounded-full bg-[var(--color-blue-720)]">
                                </div>
                                <div class="ui-shimmer h-3 w-16 rounded bg-[var(--color-blue-720)]"></div>
                            </div>
                        </div>
                        }
                    </div>
                    <div class="ui-shimmer h-8 w-16 shrink-0 rounded-[8px] bg-[var(--color-blue-720)]"></div>
                </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,55%)_minmax(0,45%)]">
                <div class="min-w-0 p-4">
                    <div class="ui-shimmer h-5 w-64 max-w-full rounded bg-[var(--color-blue-720)]"></div>
                    <div class="mt-4 space-y-2">
                        <div class="ui-shimmer h-3 w-full rounded bg-[var(--color-blue-720)]"></div>
                        <div class="ui-shimmer h-3 w-10/12 rounded bg-[var(--color-blue-720)]"></div>
                        <div class="ui-shimmer h-3 w-7/12 rounded bg-[var(--color-blue-720)]"></div>
                    </div>
                    <div class="mt-4 flex gap-2">
                        <div class="ui-shimmer h-7 w-24 rounded-full bg-[var(--color-blue-720)]"></div>
                        <div class="ui-shimmer h-7 w-32 rounded-full bg-[var(--color-blue-720)]"></div>
                    </div>
                </div>
                <div class="border-t border-[var(--color-border)] bg-[var(--color-blue-830)]/35 p-4 lg:border-l lg:border-t-0">
                    <div class="grid grid-cols-1 gap-x-5 gap-y-4 xl:grid-cols-2">
                        @for (field of [1, 2]; track field) {
                        <div>
                            <div class="ui-shimmer h-2.5 w-16 rounded bg-[var(--color-blue-720)]"></div>
                            <div class="ui-shimmer mt-2 h-3.5 w-28 rounded bg-[var(--color-blue-720)]"></div>
                        </div>
                        }
                    </div>
                </div>
            </div>
        </div>

        <div class="overflow-hidden rounded-[8px] border border-[var(--color-border)] bg-[var(--tenant-expand-bg)] bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.014)_0px,rgba(255,255,255,0.014)_1px,transparent_1px,transparent_12px)]">
            <div class="flex flex-col gap-1 border-b border-[var(--color-border)] bg-[var(--color-blue-820-light)] px-4 py-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-1.5">
                        <div class="ui-shimmer h-4 w-32 rounded bg-[var(--color-blue-720)]"></div>
                        <div class="ui-shimmer h-4 w-4 rounded-full bg-[var(--color-blue-720)]"></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="ui-shimmer h-7 w-20 rounded-full bg-[var(--color-blue-720)]"></div>
                        <div class="ui-shimmer h-8 w-16 rounded-[8px] bg-[var(--color-blue-720)]"></div>
                    </div>
                </div>
                <div class="ui-shimmer h-3 w-40 max-w-full rounded bg-[var(--color-blue-720)]"></div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,55%)_minmax(0,45%)]">
                <div class="min-w-0 p-4">
                    <div class="ui-shimmer h-3 w-16 rounded bg-[var(--color-blue-720)]"></div>
                    <div class="ui-shimmer mt-2 h-5 w-48 rounded bg-[var(--color-blue-720)]"></div>
                    <div class="ui-shimmer mt-3 h-3 w-56 max-w-full rounded bg-[var(--color-blue-720)]"></div>
                </div>
                <div class="border-t border-[var(--color-border)] bg-[var(--color-blue-830)]/35 p-4 lg:border-l lg:border-t-0">
                    <div class="grid grid-cols-2 gap-4">
                        @for (field of [1, 2, 3, 4, 5]; track field) {
                        <div>
                            <div class="ui-shimmer h-2.5 w-14 rounded bg-[var(--color-blue-720)]"></div>
                            <div class="ui-shimmer mt-2 h-3.5 w-20 rounded bg-[var(--color-blue-720)]"></div>
                        </div>
                        }
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
