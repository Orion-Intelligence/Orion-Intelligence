<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
    <div class="min-w-0">
        <h1 class="ui-page-title">{{ caseData.title || ('Case ' + caseData.caseId) }}</h1>
        <p class="ui-page-description">
            {{ caseData.caseId }} · {{ getDisplayLabel(caseData.caseType, caseData.caseTypeOtherValue) }}
        </p>
    </div>

    <div class="flex flex-wrap items-center gap-2 sm:justify-end">
        @if (!isEditing) {
        @if (canManageCases() && caseData.closure && !caseData.isArchived) {
        <button @caseInlineMotion (click)="store.openArchiveConfirmation()" type="button" aria-label="Archive case | translate" appTooltip="Archive case | translate" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-820-light)] text-[var(--color-text2)] transition hover:bg-[var(--color-blue-810)] hover:text-amber-300 disabled:cursor-not-allowed disabled:opacity-60" data-testid="case-details-archive" [disabled]="isArchivingCase">
            <img src="assets/images/shared/archive-icon.svg" alt="Archive" class="h-4 w-4" />
        </button>
        }
        <button @caseInlineMotion (click)="store.exportPdf()" type="button" aria-label="Export PDF | translate" appTooltip="Export PDF | translate" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-820-light)] text-[var(--color-text2)] transition hover:bg-[var(--color-blue-810)] hover:text-[var(--color-text1)] disabled:cursor-not-allowed disabled:opacity-60" data-testid="case-details-export-pdf" [disabled]="isPdfExporting">
            <i class="bi text-sm leading-none [body.light-theme_&]:text-emerald-700" [ngClass]="isPdfExporting ? 'bi-arrow-repeat animate-spin' : 'bi-download text-emerald-300'"></i>
        </button>
        @if (canManageCases()) {
        <button @caseInlineMotion (click)="store.openShareConfirmation()" type="button" [attr.aria-label]="'Create share link' | translate" [appTooltip]="'Create share link' | translate" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-820-light)] text-[var(--color-text2)] transition hover:bg-[var(--color-blue-810)] disabled:cursor-not-allowed disabled:opacity-60" data-testid="case-details-share" [disabled]="isShareCreating">
            <i class="bi text-[15px] leading-none [body.light-theme_&]:text-slate-700 [&_.ui-bootstrap-icon]:overflow-visible" [ngClass]="isShareCreating ? 'bi-arrow-repeat animate-spin' : 'bi-share-fill'"></i>
        </button>
        }
        @if (canManageCases()) {
        <button @caseInlineMotion (click)="store.openRevokeShareConfirmation()" type="button" [attr.aria-label]="'Revoke all share links' | translate" [appTooltip]="'Revoke all share links' | translate" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-820-light)] text-[var(--color-text2)] transition hover:bg-red-500/10 hover:text-red-300 disabled:cursor-not-allowed disabled:opacity-60" data-testid="case-details-revoke-shares" [disabled]="isShareRevoking">
            <i class="bi text-sm leading-none [body.light-theme_&]:text-red-700" [ngClass]="isShareRevoking ? 'bi-arrow-repeat animate-spin' : 'bi-trash3 text-red-300'"></i>
        </button>
        }
        }
    </div>
</div>
