<div class="fixed inset-0 z-[1301]">
    <div class="absolute inset-0 bg-black/50 transition-opacity duration-300" [ngClass]="isOpen ? 'opacity-100' : 'pointer-events-none opacity-0'" (click)="requestCancel()"></div>
    <div class="absolute right-0 top-0 flex h-full w-full max-w-2xl transform-gpu flex-col overflow-y-auto border-l border-[var(--color-border)] bg-[var(--color-blue-830)] shadow-[-18px_0_40px_rgba(0,0,0,0.34)] transition-transform duration-300 ease-[cubic-bezier(0.22,1,0.36,1)]" [class.translate-x-0]="isOpen" [class.translate-x-[102%]]="!isOpen" [attr.data-testid]="drawerTestId || null">
        <div class="border-b border-[var(--color-border)] bg-[var(--color-blue-830)]/95 px-6 py-3 backdrop-blur">
            <div class="min-w-0">
                <h2 class="text-[16px] font-semibold leading-tight text-[var(--color-text1)]">{{ title }}</h2>
                @if (subtitle) {
                <p class="mt-1 text-[11px] font-medium text-[var(--color-text4)]">{{ subtitle }}</p>
                }
            </div>
        </div>

        <ng-content></ng-content>

        <div class="sticky bottom-0 mt-auto flex justify-end gap-3 border-t border-[var(--color-border)] bg-[var(--color-blue-830)]/95 px-6 py-4 backdrop-blur">
            <button type="button" (click)="requestCancel()" [attr.data-testid]="cancelTestId || null" class="ui-btn border border-[var(--color-border)] text-[var(--color-text1)]">
                {{ 'common.actions.cancel' | translate }}
            </button>
            <button type="button" (click)="save.emit()" [attr.data-testid]="saveTestId || null" class="ui-btn ui-btn-primary">
                {{ saveLabel }}
            </button>
        </div>
    </div>
</div>
