<div class="w-full p-5">
  <div class="ui-page-container p-5" data-testid="case-tracking-board-settings-page">
    <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
      <div class="min-w-0">
        <h1 class="ui-page-title">Status Tracking Board Settings</h1>
        <p class="ui-page-description">{{ scopeLabel }}</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" class="ui-btn ui-btn-secondary inline-flex h-10 items-center gap-2" (click)="goBack()">
          <i class="bi bi-arrow-left text-sm"></i>
          Back
        </button>
        <button type="button" class="ui-btn ui-btn-primary inline-flex h-10 items-center gap-2" [disabled]="isSaving || isLoading" (click)="save()">
          <i class="bi bi-check2 text-sm"></i>
          {{ isSaving ? 'Saving' : 'Save' }}
        </button>
      </div>
    </div>

    @if (errorText) {
    <div class="mb-4 rounded-[8px] border border-rose-400/30 bg-rose-400/10 px-3 py-2 text-sm text-rose-300">
      {{ errorText }}
    </div>
    }

    @if (isLoading) {
    <div class="grid min-h-[360px] place-items-center rounded-[10px] border border-dashed border-[var(--tenant-line)] bg-[var(--color-blue-820-light)]/60">
      <span class="h-6 w-6 animate-spin rounded-full border-2 border-[var(--tenant-line)] border-t-sky-400"></span>
    </div>
    } @else {
    <div class="space-y-3">
      @for (status of config.statuses; track status.value; let i = $index) {
      <div cdkDrag class="rounded-[10px] border border-[var(--tenant-line)] bg-[var(--color-blue-830)] p-4 shadow-[0_8px_18px_var(--color-shadow-light)]" [attr.data-testid]="'status-board-setting-' + status.value">
        <div class="grid grid-cols-1 gap-3 lg:grid-cols-[auto_1fr_auto_auto_auto_auto] lg:items-center">
          <div class="flex items-center gap-2 text-[var(--color-text4)]">
            <span class="flex h-8 w-8 items-center justify-center text-white"> {{ i + 1 }} </span>
            <span class="rounded-[6px] bg-[var(--tenant-chip-bg)] px-2 py-1 text-xs font-semibold">{{ status.value }}</span>
          </div>

          <input class="h-10 rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 text-sm font-medium text-[var(--color-text1)] outline-none focus:border-sky-400/35 focus:ring-2 focus:ring-sky-400/20" [(ngModel)]="status.label" (ngModelChange)="errorText = validate()" />

          <label class="inline-flex items-center gap-3 text-sm font-semibold text-[var(--color-text3)]">
            <span class="relative h-6 w-11 shrink-0">
              <input type="checkbox" class="peer sr-only" [(ngModel)]="status.enabled" [disabled]="isRequiredStatus(status)" />
              <span class="absolute inset-0 cursor-pointer rounded-[20px] bg-[var(--color-button-secondary)] transition-colors duration-300 peer-checked:bg-[var(--color-button-primary)] peer-disabled:cursor-not-allowed peer-disabled:opacity-50 before:absolute before:bottom-[3px] before:left-[3px] before:h-[18px] before:w-[18px] before:rounded-full before:bg-white before:transition-transform before:duration-300 before:content-[''] peer-checked:before:translate-x-[20px]"></span>
            </span>
            <span>Enabled</span>
          </label>
            <label class="inline-flex items-center gap-3 text-sm font-semibold text-[var(--color-text3)]">
              <span class="relative h-6 w-11 shrink-0">
                <input type="checkbox" class="peer sr-only" [(ngModel)]="status.skippable" [disabled]="status.value === 'new' || status.value === 'closed'" />
                <span class="absolute inset-0 cursor-pointer rounded-full bg-[var(--color-button-secondary)] transition-colors duration-300 peer-checked:bg-[var(--color-button-primary)] peer-disabled:cursor-not-allowed peer-disabled:opacity-50 before:absolute before:bottom-[3px] before:left-[3px] before:h-[18px] before:w-[18px] before:rounded-full before:bg-white before:transition-transform before:duration-300 before:content-[''] peer-checked:before:translate-x-[20px]"></span>
              </span>
              <span>Skippable</span>
            </label>
        </div>
      </div>
      }
    </div>
    }
  </div>
</div>
