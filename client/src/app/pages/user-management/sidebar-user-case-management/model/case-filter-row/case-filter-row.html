<div class="mb-4 rounded-[8px] border border-[var(--tenant-line)] bg-[var(--color-blue-820-light)]/45 p-3" data-testid="case-filter-row">
    <button type="button" class="flex h-10 w-full items-center justify-between rounded-[8px] border border-[var(--tenant-line)] bg-[var(--tenant-chip-bg)] px-3 text-sm font-semibold text-[var(--color-text2)] transition hover:bg-[var(--tenant-chip-hover)] md:hidden" data-testid="case-filter-mobile-toggle" [attr.aria-expanded]="isMobileFiltersOpen" (click)="toggleMobileFilters()">
        <span>{{ 'Filters' | translate }}</span>
        <span class="ml-3 h-2 w-2 shrink-0 border-b-2 border-r-2 border-[var(--color-text3)] transition-transform duration-150" [ngClass]="isMobileFiltersOpen ? 'rotate-[225deg] translate-y-1' : 'rotate-45'"></span>
    </button>

    <div class="mt-3 flex-col gap-3 md:mt-0 xl:flex-row xl:items-end" [ngClass]="isMobileFiltersOpen ? 'flex' : 'hidden md:flex'">
        @if (canManage) {
        <div class="flex shrink-0 flex-col gap-1.5 xl:min-w-[140px]">
            <label class="text-[11px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">{{ 'Case List' | translate }}</label>
            <app-ui-dropdown
                testId="case-filter-view"
                menuId="case-filter-view-menu"
                optionTestIdPrefix="case-filter-view-option-"
                [options]="viewOptions"
                [selected]="selectedView"
                [searchable]="false"
                [placeholder]="'Open' | translate"
                (valueChange)="setCaseView($event)"></app-ui-dropdown>
        </div>
        }

        <div class="grid min-w-0 flex-1 grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-[minmax(220px,1.35fr)_minmax(140px,0.75fr)_minmax(130px,0.7fr)_minmax(130px,0.7fr)_minmax(160px,0.85fr)_minmax(150px,0.8fr)]">
            <label class="min-w-0">
                <span class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">{{ 'Search' | translate }}</span>
                <input [ngModel]="filters.searchText" (ngModelChange)="updateSearchText($event)" type="search" class="h-10 w-full rounded-[8px] border border-[var(--tenant-line)] bg-[var(--color-blue-700)] px-3 text-sm text-[var(--color-text1)] outline-none placeholder:text-[var(--color-text4)] focus:border-sky-400/35 focus:ring-2 focus:ring-sky-400/20" [placeholder]="'Case ID, title, description' | translate" data-testid="case-filter-search" />
            </label>

            <label>
                <span class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">{{ 'Status' | translate }}</span>
                <app-ui-dropdown
                    testId="case-filter-status"
                    menuId="case-filter-status-menu"
                    [options]="statusFilterOptions"
                    [selected]="filters.status"
                    [searchable]="false"
                    [placeholder]="'All Statuses' | translate"
                    (valueChange)="setStatusFilter($event)"></app-ui-dropdown>
            </label>

            <label>
                <span class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">{{ 'Severity' | translate }}</span>
                <app-ui-dropdown
                    testId="case-filter-severity"
                    menuId="case-filter-severity-menu"
                    [options]="severityFilterOptions"
                    [selected]="filters.severity"
                    [searchable]="false"
                    [placeholder]="'All Severities' | translate"
                    (valueChange)="setSeverityFilter($event)"></app-ui-dropdown>
            </label>

            <label>
                <span class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">{{ 'Priority' | translate }}</span>
                <app-ui-dropdown
                    testId="case-filter-priority"
                    menuId="case-filter-priority-menu"
                    [options]="priorityFilterOptions"
                    [selected]="filters.priority"
                    [searchable]="false"
                    [placeholder]="'All Priorities' | translate"
                    (valueChange)="setPriorityFilter($event)"></app-ui-dropdown>
            </label>

            <label>
                <span class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">{{ 'Case Type' | translate }}</span>
                <app-ui-dropdown
                    testId="case-filter-type"
                    menuId="case-filter-type-menu"
                    [options]="caseTypeFilterOptions"
                    [selected]="filters.caseType"
                    [searchable]="true"
                    [placeholder]="'All Types' | translate"
                    [searchPlaceholder]="'Search case types' | translate"
                    (valueChange)="setCaseTypeFilter($event)"></app-ui-dropdown>
            </label>

            <label>
                <span class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-[var(--color-text4)]">{{ 'Sort' | translate }}</span>
                <app-ui-dropdown
                    testId="case-filter-sort"
                    menuId="case-filter-sort-menu"
                    [options]="sortOptions"
                    [selected]="filters.sort"
                    [searchable]="false"
                    [placeholder]="'Newest Updated' | translate"
                    (valueChange)="setCaseSort($event)"></app-ui-dropdown>
            </label>
        </div>
    </div>
</div>
