<div class="ui-graph-popup-overlay fixed inset-0 z-50 flex items-center justify-center p-4" (click)="closed.emit()">
    <div data-testid="case-analyst-dialog" class="ui-graph-popup-panel ui-popup-shell w-full max-w-[620px] rounded-xl p-6" (click)="$event.stopPropagation()">

        <div class="ui-popup-title text-lg font-semibold">
            {{ 'Assign Case Analyst' | translate }}
        </div>

        <div class="ui-popup-subtitle mt-1 text-sm">
            {{ 'Assign analyst to this case.' | translate }}
        </div>

        <div class="mt-3 rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-700)] p-3 text-sm [body.light-theme_&]:bg-white">
            <div>
                <span class="text-[var(--color-text4)]">{{ 'Case Title' | translate }}:</span>
                <span class="ml-1 font-semibold text-[var(--color-text1)]">{{ caseItem?.title }}</span>
            </div>

            <div class="mt-1">
                <span class="text-[var(--color-text4)]">{{ 'Case Number' | translate }}:</span>
                <span class="ml-1 font-semibold text-[var(--color-text1)]">{{ caseItem?.caseId }}</span>
            </div>
        </div>

        @if (isLoading) {
        <div class="mt-4">
            <div class="ui-shimmer h-[42px] w-full rounded-[10px] bg-[var(--color-divider)]"></div>
        </div>
        } @else {
        <div class="mt-4">
            <label class="ui-popup-label mb-1.5 block text-sm font-medium">
                {{ 'Analyst' | translate }}
            </label>

            <select data-testid="case-analyst-select" [(ngModel)]="selectedAnalystId" class="ui-popup-select w-full rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 py-2.5 text-sm text-[var(--color-text1)] outline-none [body.light-theme_&]:bg-white">

                <option value="">{{ 'Select analyst' | translate }}</option>

                @for (analyst of analysts; track analyst.id) {
                <option [attr.data-testid]="'case-analyst-option-' + analyst.username" [value]="analyst.id">
                    {{ analyst.username }}{{ analyst.email ? ' (' + analyst.email + ')' : '' }}
                </option>
                }
            </select>
        </div>
        }

        <div class="ui-popup-footer mt-5 flex items-center justify-end gap-2">
            <button data-testid="case-analyst-cancel" type="button" class="ui-popup-btn-secondary px-4 py-2 text-sm font-semibold" (click)="closed.emit()">
                {{ 'common.actions.cancel' | translate }}
            </button>

            <button data-testid="case-analyst-submit" type="button" class="ui-popup-btn-primary px-4 py-2 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-60" [disabled]="isLoading || isSaving || !selectedAnalystId" (click)="confirmAssignAnalyst()">
                {{ (isSaving ? 'Assigning...' : 'Assign Analyst') | translate }}
            </button>
        </div>
    </div>
</div>
