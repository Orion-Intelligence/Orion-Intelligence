<div class="fixed inset-0 z-[1400] flex items-center justify-center bg-black/60 px-4" (click)="close()">
  <div class="w-full rounded-[12px] border border-[var(--color-border)] bg-[var(--color-blue-800)] p-5 shadow-2xl" [class.max-w-[620px]]="mode() === 'persona'" [class.max-w-[520px]]="mode() === 'profile'" (click)="$event.stopPropagation()">
    <div class="mb-4 flex items-center justify-between gap-3">
      <h2 class="text-[18px] font-semibold text-[var(--color-text1)]">{{ title() }}</h2>
      <button type="button" (click)="close()" class="text-[22px] leading-none text-[var(--color-text4)] hover:text-[var(--color-text1)]">×</button>
    </div>

    @if (formError) {
      <div class="mb-4 rounded-[10px] border border-[rgba(239,68,68,0.28)] bg-[rgba(127,29,29,0.28)] px-4 py-3 text-sm text-[var(--color-text1)]">
        {{ formError }}
      </div>
    }

    @if (mode() === 'persona') {
      <div class="grid grid-cols-2 gap-3 max-[640px]:grid-cols-1">
        <label class="block">
          <span class="mb-1 block text-xs font-semibold text-[var(--color-text4)]">Persona Name</span>
          <input [(ngModel)]="personaForm.name" class="h-10 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 text-[13px] text-[var(--color-text1)] outline-none" />
        </label>
        <div>
          <span class="mb-1 block text-xs font-semibold text-[var(--color-text4)]">Age Group</span>
          <app-ui-dropdown [options]="ageGroups" [selected]="personaForm.age_group" [searchable]="false" (valueChange)="onAgeGroupChange($event)"></app-ui-dropdown>
        </div>
        <div>
          <span class="mb-1 block text-xs font-semibold text-[var(--color-text4)]">Gender</span>
          <app-ui-dropdown [options]="genders" [selected]="personaForm.gender" [searchable]="false" (valueChange)="onGenderChange($event)"></app-ui-dropdown>
        </div>
        <label class="block">
          <span class="mb-1 block text-xs font-semibold text-[var(--color-text4)]">Country</span>
          <input [(ngModel)]="personaForm.country" class="h-10 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 text-[13px] text-[var(--color-text1)] outline-none" />
        </label>
        <label class="block">
          <span class="mb-1 block text-xs font-semibold text-[var(--color-text4)]">City</span>
          <input [(ngModel)]="personaForm.city" class="h-10 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 text-[13px] text-[var(--color-text1)] outline-none" />
        </label>
        <div>
          <span class="mb-1 block text-xs font-semibold text-[var(--color-text4)]">Adult Status</span>
          <div class="flex h-10 items-center rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 text-[13px] text-[var(--color-text2)]">{{ adultStatusLabel() }}</div>
        </div>
      </div>
      <div class="mt-3">
        <span class="mb-1 block text-xs font-semibold text-[var(--color-text4)]">Interests</span>
        <app-ui-dropdown [options]="interests" [selectedValues]="personaForm.interests" [multiSelect]="true" [showSelectedChips]="true" placeholder="Select up to 3 interests" (valuesChange)="onInterestChange($event)"></app-ui-dropdown>
      </div>
    }

    @if (mode() === 'profile') {
      <div class="grid gap-3">
        <div>
          <span class="mb-1 block text-xs font-semibold text-[var(--color-text4)]">Platform</span>
          <app-ui-dropdown [options]="platforms" [selected]="profileForm.platform" [searchable]="false" placeholder="Select platform" (valueChange)="onPlatformChange($event)"></app-ui-dropdown>
        </div>
        <label class="block">
          <span class="mb-1 block text-xs font-semibold text-[var(--color-text4)]">Profile Name</span>
          <input [(ngModel)]="profileForm.profile_name" class="h-10 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 text-[13px] text-[var(--color-text1)] outline-none" />
        </label>
        <label class="block">
          <span class="mb-1 block text-xs font-semibold text-[var(--color-text4)]">Profile Username</span>
          <input [(ngModel)]="profileForm.profile_username" class="h-10 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 text-[13px] text-[var(--color-text1)] outline-none" />
        </label>
      </div>
    }

    <div class="mt-5 flex justify-end gap-2">
      <button type="button" (click)="close()" class="rounded-[8px] border border-[var(--color-border)] px-4 py-2 text-[12px] font-semibold text-[var(--color-text2)] hover:bg-[var(--color-blue-720)]">Cancel</button>
      <button type="button" [disabled]="isSaving" (click)="save()" class="rounded-[8px] border border-[var(--color-blue-640)] bg-[var(--color-blue-640)] px-4 py-2 text-[12px] font-semibold text-white disabled:opacity-60">{{ primaryButtonLabel() }}</button>
    </div>
  </div>
</div>
