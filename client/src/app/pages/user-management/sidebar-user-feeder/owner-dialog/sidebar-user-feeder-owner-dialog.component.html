<div class="ui-graph-popup-overlay fixed inset-0 z-50 flex items-center justify-center p-4" (click)="closed.emit()">
  <div data-testid="feeder-owner-dialog" class="ui-graph-popup-panel ui-popup-shell w-full max-w-[620px] rounded-xl p-6" (click)="$event.stopPropagation()">
    <div class="ui-popup-title text-lg font-semibold">{{ 'Change Script Owner' | translate }}</div>
    <div class="ui-popup-subtitle mt-1 text-sm">
      {{ 'Reassign' | translate }}
      <span class="font-semibold text-[var(--color-text1)]">{{ script?.file_name }}</span>.
    </div>
    <div class="mt-2 text-xs text-[var(--color-text4)]">
      {{ 'Admin-only action. Only active feeder users are available.' | translate }}
    </div>

    @if (isOwnerLoading) {
      <div class="mt-4">
        <div class="ui-shimmer h-[42px] w-full rounded-[10px] bg-[var(--color-divider)]"></div>
        <div class="ui-shimmer mt-3 h-[42px] w-[140px] rounded-[10px] bg-[var(--color-divider)]"></div>
      </div>
    } @else {
      <div class="mt-4">
        <label class="ui-popup-label mb-1.5 block text-sm font-medium">{{ 'Feeder User' | translate }}</label>
        <select data-testid="feeder-owner-select" [(ngModel)]="selectedOwnerUserId" class="ui-popup-select w-full rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 py-2.5 text-sm text-[var(--color-text1)] outline-none [body.light-theme_&]:bg-white">
          <option value="">{{ 'Select feeder user' | translate }}</option>
          @for (user of getAvailableOwnerUsers(); track user.id) {
            <option [attr.data-testid]="'feeder-owner-option-' + user.username" [value]="user.id">{{ user.username }}{{ user.email ? ' (' + user.email + ')' : '' }}</option>
          }
        </select>
      </div>
    }

    <div class="ui-popup-footer mt-5 flex items-center justify-end gap-2">
      <button data-testid="feeder-owner-cancel" type="button" class="ui-popup-btn-secondary px-4 py-2 text-sm font-semibold" (click)="closed.emit()">{{ 'common.actions.cancel' | translate }}</button>
      <button data-testid="feeder-owner-submit" type="button" class="ui-popup-btn-primary px-4 py-2 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-60" [disabled]="isOwnerLoading || isOwnerSaving || !selectedOwnerUserId" (click)="confirmOwnerTransfer()">
        {{ (isOwnerSaving ? 'Updating...' : 'Change Owner') | translate }}
      </button>
    </div>
  </div>
</div>
