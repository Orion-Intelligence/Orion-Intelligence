<div class="fixed inset-0 z-[1200] flex overflow-y-auto overscroll-contain p-4 backdrop-blur-sm" [ngClass]="isLightTheme ? 'bg-slate-900/25' : 'bg-[#020617]/75'">
  <section data-testid="tenant-scan-dialog" class="m-auto w-full max-w-[460px] overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-800)] text-[var(--color-text1)] shadow-xl animate-alert-card-stagger-in motion-reduce:animate-none [.light-theme_&]:border-[#d7dee8] [.light-theme_&]:bg-white" role="dialog" aria-modal="true" aria-labelledby="tenant-scan-title" aria-describedby="tenant-scan-description" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
    <div class="p-5 sm:p-6">
      <div class="flex items-center gap-3">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-[#57a5eb18] [.light-theme_&]:bg-sky-50" aria-hidden="true">
          <span class="block h-6 w-6 animate-spin rounded-full border-[3px] border-[#57a5eb40] border-t-[var(--color-blue-640)] motion-reduce:animate-none"></span>
        </div>
        <div>
          <h2 id="tenant-scan-title" tabindex="-1" cdkFocusInitial class="text-lg font-semibold leading-6 outline-none">{{ 'Scanning data' | translate }}</h2>
          <p class="mt-1 text-xs text-[var(--color-text4)]">{{ 'Checking your monitored IOCs for alerts.' | translate }}</p>
        </div>
      </div>

      <p id="tenant-scan-description" class="mt-5 text-[13px] leading-6 text-[var(--color-text2)]">{{ 'This may take a moment. Please keep this tab open.' | translate }}</p>

      <div class="mt-4 flex items-center justify-between text-xs font-medium text-[var(--color-text4)]">
        <span>{{ 'Scan in progress' | translate }}</span>
        <span>{{ 'Please wait' | translate }}</span>
      </div>
      <div data-testid="tenant-scan-progress" class="mt-2 h-2 overflow-hidden rounded-full bg-[#3b526e] [.light-theme_&]:bg-[#d5e2f0]" role="progressbar" [attr.aria-label]="'Scanning data' | translate" [attr.aria-valuetext]="'Scan in progress' | translate">
        <span data-testid="tenant-scan-progress-fill" class="block h-full w-full origin-left animate-loader-indeterminate rounded-full bg-[var(--color-blue-640)] motion-reduce:w-2/5 motion-reduce:animate-none"></span>
      </div>
    </div>

    @if (licenseService.getLicenses().includes('maintainer')) {
      <div class="flex justify-end border-t border-[var(--color-border)] px-5 py-4 sm:px-6 [.light-theme_&]:border-[#d7dee8]">
        <button data-testid="tenant-scan-cancel" type="button" class="inline-flex h-[35px] min-w-[112px] shrink-0 items-center justify-center rounded-lg border px-6 text-sm font-semibold outline-none transition-[background-color,border-color,color] focus-visible:ring-1 focus-visible:ring-[var(--color-blue-640)]/55 disabled:cursor-not-allowed disabled:opacity-65 border-[#213f5c] bg-[linear-gradient(135deg,rgba(87,165,235,0.22),rgba(43,144,238,0.12))] text-[var(--color-text1)] hover:border-[#28557d] hover:bg-[linear-gradient(135deg,rgba(87,165,235,0.30),rgba(43,144,238,0.18))] [.light-theme_&]:border-[#b7cbe1] [.light-theme_&]:bg-[#eef5fc] [.light-theme_&]:hover:border-[#8fb3d8] [.light-theme_&]:hover:bg-[#e4effa]" (click)="cancelScan()">
          <span>{{ 'common.actions.cancel' | translate }}</span>
        </button>
      </div>
    }
  </section>
</div>
