<div data-testid="tenant-alert-modal" class="[&&]:!z-[9999] [&&]:!bg-[rgba(2,6,23,0.64)] backdrop-blur-[4px] overflow-y-auto [animation:uiModalOverlayFade_200ms_ease-out_both] [&.items-center]:[align-items:safe_center] fixed inset-0 z-[9999] flex items-center justify-center p-3 [body.light-theme_&&]:!bg-[rgba(23,34,53,0.18)]" @overlayAnimation (click)="$event.target === $event.currentTarget && cancleAlert(false)">
  <div class="ui-popup-shell [&&]:!border [&&]:!border-[#2c3a4a] [&&]:!bg-[#1b2a3b] [&&]:!text-[#e1e8f0] [&&]:!shadow-[0_12px_40px_rgba(0,0,0,0.40)] [animation:slideUp_0.2s_ease-out_both] [body.light-theme_&&]:!border-[#d2deec] [body.light-theme_&&]:!bg-[#f7fbff] [body.light-theme_&&]:!text-[#172235] [body.light-theme_&&]:!shadow-[0_10px_28px_rgba(15,23,42,0.14)] relative w-full max-w-[1000px] max-h-[88vh] overflow-y-auto rounded-[14px] p-[30px] font-[Inter] max-[900px]:p-[18px]" @popupAnimation>
    <div>
      <div class="text-[24px] font-semibold leading-none">{{ heading() }}</div>
      <button class="absolute right-[20px] top-[20px] text-[28px] text-[#ccc] hover:text-white [body.light-theme_&]:text-[var(--color-text4)] [body.light-theme_&]:hover:text-[var(--color-text1)] [body.light-theme_&]:focus-visible:outline-none [body.light-theme_&]:focus-visible:ring-2 [body.light-theme_&]:focus-visible:ring-sky-500/30" [attr.aria-label]="'common.actions.close' | translate" (click)="cancleAlert(false)">×</button>
    </div>

    <form>
      <div class="mt-1 text-[12px] font-normal text-[var(--color-text2)]">{{ description() }}</div>

      <label class="mt-[18px] mb-[6px] block text-[16px] font-normal text-[var(--color-text2)]">{{ 'categoryAlerts.form.selectedType' | translate }}</label>
      <button class="flex w-full items-center justify-between rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-[14px] py-[12px] text-left text-[14px] text-[var(--color-text1)] opacity-80 [body.light-theme_&]:border-[#cfd9e7] [body.light-theme_&]:bg-[#edf5fd] [body.light-theme_&]:text-[#1f2e47]" type="button" disabled>
        {{ decodeURIComponent(router.url.split('/').pop() || '') | translate }}
      </button>

      <label class="mt-[18px] mb-[6px] block text-[16px] font-normal text-[var(--color-text2)]">{{ 'categoryAlerts.form.title' | translate }}</label>
      <input data-testid="tenant-alert-title" [(ngModel)]="alert.title" class="w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-[14px] py-[12px] text-[14px] text-[var(--color-text1)] outline-none placeholder:text-[#57718D] [body.light-theme_&]:border-[#cfd9e7] [body.light-theme_&]:bg-[#edf5fd] [body.light-theme_&]:text-[#1f2e47] [body.light-theme_&]:placeholder:text-[#7390ad] [body.light-theme_&]:focus:border-sky-500/50 [body.light-theme_&]:focus:ring-2 [body.light-theme_&]:focus:ring-sky-500/20" type="text" [placeholder]="'categoryAlerts.form.enterTitle' | translate" name="title" />

      <label class="mt-[18px] mb-[6px] block text-[16px] font-normal text-[var(--color-text2)]">{{ 'categoryAlerts.form.description' | translate }}</label>
      <textarea data-testid="tenant-alert-description" [(ngModel)]="alert.description" class="min-h-[110px] w-full resize-y rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-[14px] py-[12px] text-[14px] text-[var(--color-text1)] outline-none placeholder:text-[#57718D] [body.light-theme_&]:border-[#cfd9e7] [body.light-theme_&]:bg-[#edf5fd] [body.light-theme_&]:text-[#1f2e47] [body.light-theme_&]:placeholder:text-[#7390ad] [body.light-theme_&]:focus:border-sky-500/50 [body.light-theme_&]:focus:ring-2 [body.light-theme_&]:focus:ring-sky-500/20" [placeholder]="'categoryAlerts.form.enterDescription' | translate" name="alert_description" rows="4"></textarea>

      <label class="mt-[18px] mb-[6px] block text-[16px] font-normal text-[var(--color-text2)]">{{ 'categoryAlerts.form.selectIocType' | translate }}</label>
      <div class="relative">
        <button data-testid="tenant-alert-ioc-type-toggle" type="button" class="flex w-full cursor-pointer list-none items-center justify-between rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-[14px] py-[12px] text-[14px] text-[var(--color-text1)] [body.light-theme_&]:border-[#cfd9e7] [body.light-theme_&]:bg-[#edf5fd] [body.light-theme_&]:text-[#1f2e47]" (click)="toggleIocDropdown($event)">
          <span>{{ getIOCTypeLabel(alert.ioc_type!) | translate }}</span>
          <i class="bi text-[12px] text-[#57718D]" [ngClass]="iocDropdownOpen ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
        </button>
        @if (iocDropdownOpen) {
          <ul class="absolute left-0 right-0 z-20 mt-2 max-h-[250px] overflow-y-auto rounded-[12px] border border-[var(--color-border)] bg-[var(--color-blue-700)] p-1 shadow-[0_6px_16px_rgba(0,0,0,0.15)] [scrollbar-width:thin] [&::-webkit-scrollbar]:w-[6px] [&::-webkit-scrollbar-thumb]:rounded-[12px] [&::-webkit-scrollbar-thumb]:bg-[#888] [&::-webkit-scrollbar-thumb:hover]:bg-[#555] [body.light-theme_&]:bg-white [body.light-theme_&]:[&::-webkit-scrollbar-thumb]:bg-slate-300 [body.light-theme_&]:[&::-webkit-scrollbar-thumb:hover]:bg-slate-400" (click)="$event.stopPropagation()">
            @for (item of allowedIocTypes; track item; let last = $last) {
              <li>
                <button data-testid="tenant-alert-ioc-type-option" type="button" class="flex w-full items-center justify-between rounded-[6px] px-[10px] py-[8px] text-[14px] text-[var(--color-text1)] hover:bg-[var(--color-blue-810)]" (click)="onIOCTypeChange(item.key)" [class]="alert.ioc_type === item.key ? 'bg-[var(--color-blue-820)] text-[var(--color-text1)]' : ''">
                  <span>{{ item.title | translate }}</span>
                  @if (alert.ioc_type === item.key) {
                    <span>✓</span>
                  }
                </button>
              </li>
              @if (!last) {
                <li><div class="mx-3 h-px bg-[var(--color-border)]"></div></li>
              }
            }
          </ul>
        }
      </div>

      <label class="mt-[18px] mb-[6px] block text-[16px] font-normal text-[var(--color-text2)]">{{ 'categoryAlerts.fields.source' | translate }}</label>
      <input data-testid="tenant-alert-source" [(ngModel)]="alert.source" class="w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-[14px] py-[12px] text-[14px] text-[var(--color-text1)] outline-none placeholder:text-[#57718D] [body.light-theme_&]:border-[#cfd9e7] [body.light-theme_&]:bg-[#edf5fd] [body.light-theme_&]:text-[#1f2e47] [body.light-theme_&]:placeholder:text-[#7390ad] [body.light-theme_&]:focus:border-sky-500/50 [body.light-theme_&]:focus:ring-2 [body.light-theme_&]:focus:ring-sky-500/20" type="text" [placeholder]="'categoryAlerts.form.enterSource' | translate" name="source" />

      <label class="mt-[18px] mb-[6px] block text-[16px] font-normal text-[var(--color-text2)]">{{ 'categoryAlerts.fields.url' | translate }}</label>
      <input data-testid="tenant-alert-url" [(ngModel)]="alert.url" class="w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-[14px] py-[12px] text-[14px] text-[var(--color-text1)] outline-none placeholder:text-[#57718D] [body.light-theme_&]:border-[#cfd9e7] [body.light-theme_&]:bg-[#edf5fd] [body.light-theme_&]:text-[#1f2e47] [body.light-theme_&]:placeholder:text-[#7390ad] [body.light-theme_&]:focus:border-sky-500/50 [body.light-theme_&]:focus:ring-2 [body.light-theme_&]:focus:ring-sky-500/20" type="text" [placeholder]="'categoryAlerts.form.enterUrl' | translate" name="url" />

      <label class="mt-[18px] mb-[6px] block text-[16px] font-normal text-[var(--color-text2)]">{{ 'categoryAlerts.form.iocValue' | translate }}</label>
      <input data-testid="tenant-alert-ioc-value" [(ngModel)]="alert.ioc_value" (ngModelChange)="onIocValueChange($event)" class="w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-[14px] py-[12px] text-[14px] text-[var(--color-text1)] outline-none placeholder:text-[#57718D] [body.light-theme_&]:border-[#cfd9e7] [body.light-theme_&]:bg-[#edf5fd] [body.light-theme_&]:text-[#1f2e47] [body.light-theme_&]:placeholder:text-[#7390ad] [body.light-theme_&]:focus:border-sky-500/50 [body.light-theme_&]:focus:ring-2 [body.light-theme_&]:focus:ring-sky-500/20" type="text" [placeholder]="'categoryAlerts.form.enterIocValue' | translate" name="ioc_value" />
    </form>
    @if (formError) {
      <div class="mt-[8px] text-center">
        <div class="inline-block w-full rounded-lg bg-[#dc3545] bg-opacity-75 px-3 py-2 text-center text-white shadow-sm [body.light-theme_&]:border [body.light-theme_&]:border-red-600/30 [body.light-theme_&]:bg-red-100 [body.light-theme_&]:text-red-800">
          <i class="bi bi-exclamation-diamond-fill mr-2"></i>
          {{ formError | translate }}
        </div>
      </div>
    }

    <div class="mt-[26px] flex items-center justify-between gap-[15px]">
      <button class="h-[42px] rounded-[8px] !border !border-[rgba(148,163,184,0.35)] !bg-[rgba(79,100,121,0.12)] px-[24px] text-[14px] !text-[var(--color-text1)] transition-[background-color,border-color] duration-[180ms] ease-[ease] hover:!border-[rgba(148,163,184,0.55)] hover:!bg-[rgba(79,100,121,0.20)] [body.light-theme_&]:!border-[#c9d8e8] [body.light-theme_&]:!bg-white [body.light-theme_&]:!text-[#1f2e47] [body.light-theme_&]:hover:!border-[#7f9ab8] [body.light-theme_&]:hover:!bg-[#f8fbff]" (click)="cancleAlert(false)">{{ 'common.actions.cancel' | translate }}</button>
      <button data-testid="tenant-alert-save" class="h-[42px] rounded-[8px] bg-[#57A5EB] px-[24px] text-[14px] font-medium text-[#0e1626] [body.light-theme_&]:transition-colors [body.light-theme_&]:hover:bg-sky-500 [body.light-theme_&]:focus-visible:outline-none [body.light-theme_&]:focus-visible:ring-2 [body.light-theme_&]:focus-visible:ring-sky-500/30" (click)="saveAlert()">
        {{ (edit() ? 'categoryAlerts.form.saveAlert' : 'categoryAlerts.form.addAlert') | translate }}
      </button>
    </div>

  </div>
</div>
