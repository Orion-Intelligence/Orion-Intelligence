<app-entity-menu
  [isCollapsed]="isCollapsed()"
  (toggle)="toggle.emit()"
  (addEntityClicked)="openAddEntityModal($event)">
</app-entity-menu>

<app-add-entity-modal *ngIf="addEntityModalData() as data"
  [data]="data"
  (close)="closeAddEntityModal()"
  (addEntity)="confirmAddEntity($event)">
</app-add-entity-modal>
