<div class="w-full h-full relative">
  <button *ngIf="deleteButtonState().visible"
    (click)="deleteEdge(deleteButtonState().edgeId!)"
    (mouseenter)="cancelHideDeleteButton()"
    (mouseleave)="hideDeleteButton()"
    [style.--btn-x.px]="deleteButtonState().x"
    [style.--btn-y.px]="deleteButtonState().y"
    class="delete-edge-button z-10 flex items-center justify-center w-6 h-6 rounded-full bg-red-600 text-white shadow-lg transform -translate-x-1/2 -translate-y-1/2 hover:bg-red-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-red-500"
    title="Remove connection">
    <i class="bi bi-x-lg text-sm font-bold"></i>
  </button>
  <div #networkContainer class="w-full h-full absolute top-0 left-0"></div>
  <div class="absolute top-0 left-0 w-full h-full pointer-events-none">
    <div *ngFor="let node of iconOverlayNodes()">
        <button (click)="state.openFollowerScanPopup(node.nodeId); $event.stopPropagation()"
                class="absolute z-10 w-7 h-7 rounded-full bg-sky-500/80 text-white flex items-center justify-center
                      transform -translate-x-1/2 -translate-y-1/2 shadow-lg border-2 border-slate-900
                      hover:bg-sky-400 transition-colors duration-200 pointer-events-auto" 
                [style.left.px]="node.x" 
                [style.top.px]="node.y"
                title="Scan followers/following">
            <i class="bi bi-people-fill text-base"></i>
        </button>
    </div>
  </div>
</div>
