<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm animate-fade-in p-[30px]" (click)="close.emit()">
    <div class="flex flex-col bg-slate-800 rounded-lg border border-slate-700 shadow-2xl w-full max-w-lg h-[80vh] animate-fade-in-scale overflow-hidden" (click)="$event.stopPropagation()">

      <!-- HEADER -->
      <div class="p-3 flex items-start justify-between gap-3 border-b border-slate-700 bg-slate-900 flex-shrink-0 rounded-t-lg">
        <div class="flex items-center gap-3 min-w-0">
          <div
            class="platform-icon rounded-lg flex-shrink-0 flex items-center justify-center text-3xl font-bold text-white w-12 h-12 p-2"
            [style.background-color]="getPlatformColor(platform().platform)">
            <app-social-icon [platformName]="platform().platform"></app-social-icon>
          </div>
          <div class="min-w-0">
            <h3 class="text-xl font-bold text-slate-100">Scan Connections</h3>
            <p class="font-mono text-sm text-indigo-400 truncate">{{ platform().platform }} / {{ '@' + platform().username }}</p>
          </div>
        </div>
        <button (click)="close.emit()" type="button" class="h-8 w-8 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-700 hover:text-white transition-colors">
            <i class="bi bi-x-lg text-lg"></i>
        </button>
      </div>

      <!-- CONTENT -->
      <div class="flex-grow p-4 flex flex-col min-h-0">
        <div class="relative mb-3">
          <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
            <i class="bi bi-search w-5 h-5 text-slate-400"></i>
          </div>
          <input
            type="text"
            placeholder="Filter profiles..."
            [value]="searchTerm()"
            (input)="onSearchInput($event)"
            class="block w-full rounded-md border-0 bg-slate-900/50 py-2 pl-10 pr-4 text-white shadow-sm ring-1 ring-inset ring-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 sm:text-sm sm:leading-6"
          />
        </div>

        <div class="border-b border-slate-700 shrink-0">
          <nav class="-mb-px flex space-x-4" aria-label="Tabs">
            <button (click)="activeTab.set('followers')"
                    [class]="'flex items-center gap-2 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm ' + (activeTab() === 'followers' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-300 hover:border-slate-500')">
              <span>Followers</span>
              <span *ngIf="platform().followers_list" class="px-2 py-0.5 text-xs rounded-full" [class]="activeTab() === 'followers' ? 'bg-indigo-500/20 text-indigo-300' : 'bg-slate-700 text-slate-300'">{{ followers().length }}</span>
            </button>
            <button (click)="activeTab.set('following')"
                    [class]="'flex items-center gap-2 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm ' + (activeTab() === 'following' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-300 hover:border-slate-500')">
              <span>Following</span>
              <span *ngIf="platform().following_list" class="px-2 py-0.5 text-xs rounded-full" [class]="activeTab() === 'following' ? 'bg-indigo-500/20 text-indigo-300' : 'bg-slate-700 text-slate-300'">{{ following().
