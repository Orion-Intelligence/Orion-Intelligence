<div class="social-scanner-main w-screen flex flex-col bg-slate-900">
  <app-tab-bar></app-tab-bar>

  <ng-container *ngIf="tabManager.activeTab() as activeTab; else loading">
    <main class="flex-grow relative">
      <input type="file" #imageInput class="hidden" (change)="onImageSelected($event)" accept="image/png, image/jpeg, image/webp, image/gif">
      <div class="h-full w-full flex flex-col overflow-hidden text-slate-200" (click)="state.closeContextMenu(); closeMobileEntityPanel()">

        <div class="flex-grow flex flex-col lg:flex-row relative">

          <app-home-menu
            class="border-b lg:border-r border-slate-800 hidden lg:flex flex-col flex-shrink-0 bg-slate-900/70 backdrop-blur-md overflow-hidden"
            [isCollapsed]="isHomeMenuCollapsed()"
            [activeTab]="activeHomeMenuTab()"
            [searchTerm]="homeMenuSearchTerm()"
            [jobs]="jobs()"
            [customEntities]="customEntities()"
            [activeUsernames]="activeUsernames()"
            [viewMode]="viewMode()"
            [isSmallScreen]="isSmallScreen()"
            (toggle)="onHomeMenuToggled()"
            (tabSelected)="onHomeMenuTabSelected($event)"
            (searchChanged)="onHomeMenuSearchChanged($event)"
            (jobClicked)="handleCompletedJobClick($event)"
            (entityClicked)="addEntityToGraph($event)"
            (cancelScan)="cancelScan($event)"
            (cancelAllFetches)="cancelAllFetchesForUser($event)">
          </app-home-menu>

          <main class="flex-grow flex flex-col main-bg-grid relative">

            <app-toolbar
              [searchTerm]="searchTerm()"
              [isSearchDisabled]="isSearchDisabled()"
              [viewMode]="viewMode()"
              [isPhysicsEnabled]="isPhysicsEnabled()"
              [isEditMode]="isEditMode()"
              [canEditConnections]="canEditConnections()"
              (searchChanged)="onSearchChanged($event)"
              (scanTriggered)="triggerScan()"
              (imageUploadClicked)="triggerImageUpload()"
              (viewModeChanged)="onViewModeChanged($event)"
              (physicsToggled)="onPhysicsToggled()"
              (editModeToggled)="onEditModeToggled()">
            </app-toolbar>

            <div class="flex-grow w-full relative overflow-hidden">
              <ng-container *ngIf="viewMode() === 'graph'; else listView">
                <div *ngIf="networkData().nodes.length > 0" class="absolute top-4 right-4 z-10 animate-fade-in">
                  <div class="relative">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                      <i class="bi bi-search w-5 h-5 text-slate-400"></i>
                    </div>
                    <input 
                      type="text" 
                      placeholder="Search on graph..."
                      [value]="graphSearchTerm()"
                      (input)="onGraphSearchChanged($event)"
                      class="block w-64 rounded-full border-0 bg-slate-800/80 py-2 pl-10 pr-10 text-slate-200 shadow-lg ring-1 ring-inset ring-slate-700/50 backdrop-blur-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 sm:text-sm sm:leading-6"
                    />
                    <button *ngIf="graphSearchTerm()" (click)="clearGraphSearch()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-300 transition-colors">
                      <i class="bi bi-x-circle-fill"></i>
                    </button>
                  </div>
                </div>
                <app-network-graph
                  [data]="networkData()"
                  [focusNodeId]="state.nodeToFocus()"
                  [editMode]="isEditMode()"
                  [physicsEnabled]="isPhysicsEnabled()"
                  [searchTerm]="graphSearchTerm()"
                  [nodesWithFollows]="nodesWithFollows()"
                  (nodeClicked)="onNodeClicked($event)"
                  (platformNodeClicked)="onPlatformNodeClicked($event)"
                  (groupClicked)="handleGroupNodeClicked($event)"
                  (dragStart)="state.closeContextMenu()"
                  (zoom)="state.closeContextMenu()"
                  (edgeAdded)="handleEdgeAdded($event)"
                  (edgeDeleted)="handleEdgeDeleted($event)">
                </app-network-graph>

                <div *ngIf="networkData().nodes.length === 0" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center text-slate-600 select-none">
                  <div class="text-center">
                    <i class="bi bi-share text-5xl text-slate-800 mx-auto"></i>
                    <p class="text-2xl font-semibold mt-3 text-slate-700">Graph is Waiting for Data</p>
                    <p class="text-slate-700/80">Complete a scan or add an entity to begin visualization.</p>
                  </div>
                </div>

                <div *ngIf="networkData().nodes.length > 0" class="absolute bottom-4 left-4 bg-slate-800/70 backdrop-blur-sm border border-slate-700 rounded-lg p-3 shadow-lg select-none animate-fade-in">
                  <h3 class="font-semibold text-slate-300 text-sm mb-2 border-b border-slate-700 pb-1">Legend</h3>
                  <div class="flex flex-col gap-2">
                    <div class="flex items-center gap-2">
                      <div class="w-4 h-4 rounded-full border-2 border-indigo-400 bg-indigo-800 flex-shrink-0"></div>
                      <span class="text-xs text-slate-400">User Profile</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <div class="w-4 h-4 rounded-full border-2 border-teal-500 bg-slate-700 flex-shrink-0 flex items-center justify-center">
                        <i class="bi bi-at text-white text-[10px]"></i>
                      </div>
                      <span class="text-xs text-slate-400">Social Platform</span>
                    </div>
                     <div class="flex items-center gap-2">
                      <div class="w-4 h-4 flex items-center justify-center text-sky-400">
                        <i class="bi bi-stack"></i>
                      </div>
                      <span class="text-xs text-slate-400">Platform Group</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <div class="w-4 h-4 rounded-md border-2 border-green-400 bg-green-800 flex-shrink-0"></div>
                      <span class="text-xs text-slate-400">Custom Entity</span>
                    </div>
                    <div class="my-1 h-px bg-slate-700"></div>
                    <div class="flex items-center gap-2">
                      <div class="w-4 h-4 rounded-full border-2 border-sky-500 bg-slate-700 flex-shrink-0 flex items-center justify-center p-0.5">
                         <i class="bi bi-twitter-x text-[8px] text-white"></i>
                      </div>
                      <span class="text-xs text-slate-400">Platform Connection</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <div class="w-4 flex items-center text-slate-500">
                        &rarr;
                      </div>
                      <span class="text-xs text-slate-400">Connection Direction</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <div class="w-4 flex items-center">
                        <div class="w-full h-px border-t-2 border-dashed border-entity-connection"></div>
                      </div>
                      <span class="text-xs text-slate-400">Entity Connection</span>
                    </div>
                  </div>
                </div>
              </ng-container>
              <ng-template #listView>
                  <app-list-view *ngIf="viewMode() === 'list'"
                    [networkData]="networkData()"
                    [scanResults]="scanResults()"
                    [customEntities]="customEntities()"
                    [isSmallScreen]="isSmallScreen()"
                    [expandedPlatformNodeId]="expandedPlatformNodeId()"
                    (nodeClicked)="onNodeClicked($event)"
                    (platformNodeClicked)="onPlatformNodeClicked($event)"
                    (deleteCustomEntity)="deleteCustomEntity($event)">
                  </app-list-view>
              </ng-template>
            </div>
          </main>

          <app-entity-manager #entityManager
            class="border-t lg:border-l border-slate-800 hidden lg:flex flex-col flex-shrink-0 bg-slate-900/70 backdrop-blur-md overflow-hidden"
            [isCollapsed]="isEntityMenuCollapsed()"
            [activeTabState]="activeTab.state"
            (toggle)="onEntityMenuToggled()">
          </app-entity-manager>
        </div>

        <div *ngIf="isSmallScreen()">
          <div *ngIf="isMobileEntityPanelOpen()" (click)="closeMobileEntityPanel()" class="fixed inset-0 bg-slate-900/60 z-30 animate-fade-in"></div>

          <aside class="fixed inset-y-0 right-0 z-40 w-72 bg-slate-900 border-l border-slate-700 shadow-xl transition-transform duration-300 ease-in-out flex flex-col"
                [class.translate-x-0]="isMobileEntityPanelOpen()"
                [class.translate-x-full]="!isMobileEntityPanelOpen()"
                (click)="$event.stopPropagation()">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between shrink-0">
              <h2 class="text-md font-semibold text-slate-300 whitespace-nowrap">Add Entity</h2>
              <button (click)="closeMobileEntityPanel()" class="w-10 h-10 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-700 hover:text-white transition-colors active:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500">
                <i class="bi bi-x-lg text-xl"></i>
              </button>
            </div>
            <div class="p-3 flex flex-col gap-2 overflow-y-auto">
              <button (click)="entityManager.openAddEntityModal('wallet'); closeMobileEntityPanel();" class="w-full flex items-center gap-3 p-3 text-sm text-left font-medium text-slate-300 rounded-lg bg-slate-800/50 hover:bg-slate-700/50 border border-slate-700 transition-colors">
                <i class="bi bi-wallet2 w-5 h-5 text-green-400"></i>
                <span>Add Wallet</span>
              </button>
              <button (click)="entityManager.openAddEntityModal('email'); closeMobileEntityPanel();" class="w-full flex items-center gap-3 p-3 text-sm text-left font-medium text-slate-300 rounded-lg bg-slate-800/50 hover:bg-slate-700/50 border border-slate-700 transition-colors">
                <i class="bi bi-envelope-at w-5 h-5 text-yellow-400"></i>
                <span>Add Email</span>
              </button>
              <button (click)="entityManager.openAddEntityModal('domain'); closeMobileEntityPanel();" class="w-full flex items-center gap-3 p-3 text-sm text-left font-medium text-slate-300 rounded-lg bg-slate-800/50 hover:bg-slate-700/50 border border-slate-700 transition-colors">
                <i class="bi bi-globe w-5 h-5 text-sky-400"></i>
                <span>Add Domain</span>
              </button>
            </div>
          </aside>

          <button (click)="toggleMobileEntityPanel($event)"
                  class="fixed bottom-6 right-6 z-20 w-14 h-14 rounded-full bg-indigo-600 text-white shadow-lg flex items-center justify-center
                         hover:bg-indigo-500 transition-transform active:scale-95 duration-200 ease-in-out
                         focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-indigo-500">
            <i class="bi bi-diagram-3-fill text-2xl"></i>
          </button>
        </div>
        
        <app-notification-bar *ngIf="state.notification()" [data]="state.notification()"></app-notification-bar>
        
        <app-context-menu *ngIf="state.contextMenuData()" [data]="state.contextMenuData()" (action)="handleContextMenuAction($event)"></app-context-menu>

      </div>
    </main>
  </ng-container>
  <ng-template #loading>
    <div class="flex-grow flex items-center justify-center text-slate-500">
      <p>Loading session...</p>
    </div>
  </ng-template>

  <!-- Component Popups -->
  <app-metadata-popup *ngIf="state.isMetadataPopupVisible() && state.selectedPlatformData()"
    [data]="state.selectedPlatformData()!"
    [isScanInProgress]="isMetadataUserScanInProgress()"
    (close)="state.closeMetadataPopup()"
    (fetchProfile)="fetchProfileDetails($event)"
    (fetchPosts)="handleFetchSocialPosts($event)"
    (fetchImages)="handleFetchImagesForPlatform($event)"
    (fetchFollowers)="handleFetchFollowers($event)"
    (fetchFollowing)="handleFetchFollowing($event)"
    (cancelFetchProfile)="cancelFetchProfileDetails($event)"
    (cancelFetchPosts)="handleCancelFetchSocialPosts($event)"
    (cancelFetchImages)="handleCancelFetchImagesForPlatform($event)"
    (cancelFetchFollowers)="handleCancelFetchFollowers($event)"
    (cancelFetchFollowing)="handleCancelFetchFollowing($event)">
  </app-metadata-popup>

  <app-profile-summary-popup *ngIf="state.summaryPopupData() as data"
    [username]="data.username"
    [platforms]="data.platforms"
    [email]="data.email"
    [isScanInProgress]="isUserScanInProgress()"
    (close)="state.closeSummaryPopup()"
    (fetchProfile)="fetchProfileDetails($event)"
    (fetchPosts)="handleFetchSocialPosts($event)"
    (fetchFollowers)="handleFetchFollowers($event)"
    (fetchFollowing)="handleFetchFollowing($event)"
    (fetchPlatformImages)="handleFetchImagesForPlatform($event)"
    (rescan)="handleRescan($event)"
    (cancelFetchProfile)="cancelFetchProfileDetails($event)"
    (cancelFetchPosts)="handleCancelFetchSocialPosts($event)"
    (cancelFetchFollowers)="handleCancelFetchFollowers($event)"
    (cancelFetchFollowing)="handleCancelFetchFollowing($event)"
    (cancelFetchPlatformImages)="handleCancelFetchImagesForPlatform($event)"
    (cancelAllFetches)="cancelAllFetchesForUser($event)">
  </app-profile-summary-popup>

  <app-follower-scan-popup *ngIf="state.followerScanPopupData() as data"
    [platform]="data.platform"
    (close)="state.closeFollowerScanPopup()"
    (scan)="handleFollowerScan($event)"
    (fetchFollowers)="handleFetchFollowers(data.platform)"
    (fetchFollowing)="handleFetchFollowing(data.platform)">
  </app-follower-scan-popup>

  <app-manage-profiles-modal *ngIf="state.manageProfilesModalData() as data"
      [data]="data"
      (close)="state.closeManageProfilesModal()"
      (updateGraph)="updateGraphFromModal($event)">
  </app-manage-profiles-modal>

  <app-confirmation-modal *ngIf="state.deleteConfirmationData() as data"
      [data]="data"
      (confirm)="confirmDeletion()"
      (cancel)="state.closeDeleteConfirmation()">
  </app-confirmation-modal>

  <app-info-modal *ngIf="state.infoModalData() as data"
      [data]="data"
      (close)="state.closeInfoModal()">
  </app-info-modal>
</div>
