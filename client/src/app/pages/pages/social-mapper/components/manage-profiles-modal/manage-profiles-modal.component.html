<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm animate-fade-in p-[30px]" (click)="close.emit()">
    <div class="flex flex-col bg-slate-800 rounded-lg border border-slate-700 shadow-2xl w-full max-w-2xl h-full animate-fade-in-scale overflow-hidden" (click)="$event.stopPropagation()">
      <div class="p-3 flex items-start justify-between gap-3 border-b border-slate-700 bg-slate-900 flex-shrink-0 rounded-t-lg">
        <div class="flex items-center gap-3 min-w-0">
          <div class="h-12 w-12 rounded-full ring-2 ring-slate-600 flex-shrink-0 flex items-center justify-center bg-slate-700">
            <i class="bi bi-person-fill text-3xl text-slate-400"></i>
          </div>
          <div class="min-w-0">
            <h3 class="text-lg font-bold text-slate-100 truncate">Manage Profiles for<span class="mx-2 text-slate-600 font-light">|</span><span class="text-indigo-400">{{ data()!.username }}</span></h3>
            <span class="inline-block bg-slate-700 text-slate-300 text-xs font-medium px-2 py-0.5 rounded-full mt-1">
              {{ data()!.platforms.length }} platforms found
            </span>
          </div>
        </div>
        <button (click)="close.emit()" type="button" class="h-8 w-8 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-700 hover:text-white transition-colors">
          <i class="bi bi-x-lg text-lg"></i>
        </button>
      </div>

      <div class="p-3 border-b border-slate-700 space-y-3">
        <div class="relative">
          <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
            <i class="bi bi-search w-5 h-5 text-slate-400"></i>
          </div>
          <input
            type="text"
            placeholder="Filter platforms..."
            [value]="searchTerm()"
            (input)="onSearchChanged($event)"
            class="block w-full rounded-md border-0 bg-slate-900/50 py-2 pl-10 pr-10 text-white shadow-sm ring-1 ring-inset ring-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 sm:text-sm sm:leading-6"
          />
          <button *ngIf="searchTerm()" (click)="clearSearch()" type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-300 transition-colors">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-500">Active Profiles</span>
          <div class="flex items-center gap-2">
            <button (click)="selectAllVisible()" [disabled]="areAllVisibleSelected()" class="px-2.5 py-1 text-xs font-medium text-slate-300 bg-slate-700 rounded-md hover:bg-slate-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
              Select All
            </button>
            <button (click)="deselectAllVisible()" [disabled]="areAllVisibleDeselected()" class="px-2.5 py-1 text-xs font-medium text-slate-300 bg-slate-700 rounded-md hover:bg-slate-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
              Deselect All
            </button>
          </div>
        </div>
      </div>

      <div class="flex-grow p-3 overflow-y-auto min-h-[20rem] custom-scrollbar">
        <ng-container *ngIf="hasMatches()">
          <div class="flex flex-col gap-2">
            <ng-container *ngFor="let platform of displayPlatforms(); let i = index">
              <div *ngIf="i > 0 && platform.status !== 'active' && displayPlatforms()[i - 1].status === 'active'" class="flex items-center py-2 animate-fade-in-up">
                <div class="flex-grow h-px bg-slate-700"></div>
                <span class="flex-shrink-0 text-xs text-slate-500 px-4 font-semibold uppercase tracking-wider">Suggested Profiles</span>
                <div class="flex-grow h-px bg-slate-700"></div>
              </div>
              <div class="rounded-lg animate-fade-in-up">
                <div (click)="toggleSelection(platform)"
                     class="flex items-center p-3 rounded-lg cursor-pointer border transition-colors"
                     [class.bg-slate-700]="platform.isSelected"
                     [class.border-slate-500]="platform.isSelected"
                     [class.border-slate-700]="!platform.isSelected">
                  <div class="platform-icon flex-shrink-0 rounded-full mr-4 flex items-center justify-center text-lg font-bold text-white h-10 w-10 p-2"
                       [style.background-color]="getPlatformColor(platform.platform)">
                    <app-social-icon [platformName]="platform.platform"></app-social-icon>
                  </div>
                  <div class="flex-grow min-w-0">
                    <div class="flex items-center gap-2">
                      <p class="font-bold text-slate-200 truncate">{{ platform.platform }}</p>
                      <span *ngIf="platform.status === 'active'" class="flex items-center gap-1 text-xs text-green-400 bg-green-500/10 px-2 py-0.5 rounded-full">
                        <i class="bi bi-check-circle-fill"></i> Active
                      </span>
                      <span *ngIf="platform.status !== 'active'" class="flex items-center gap-1 text-xs text-yellow-400 bg-yellow-500/10 px-2 py-0.5 rounded-full">
                        <i class="bi bi-lightbulb-fill"></i> Suggested
                      </span>
                    </div>
                    <p class="text-sm text-slate-400 truncate mb-0">{{ platform.username }}</p>
                  </div>
                  <div class="ml-4 flex-shrink-0">
                    <button type="button"
                            (click)="$event.stopPropagation(); toggleSelection(platform)"
                            class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-800 transition-colors ease-in-out duration-300"
                            role="switch" [attr.aria-checked]="platform.isSelected"
                            [class.bg-indigo-600]="platform.isSelected"
                            [class.bg-slate-600]="!platform.isSelected">
                      <span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition-transform ease-in-out duration-300"
                            [class.translate-x-5]="platform.isSelected"
                            [class.translate-x-0]="!platform.isSelected"></span>
                    </button>
                  </div>
                </div>
              </div>
            </ng-container>
          </div>
          <div *ngIf="!searchTerm() && displayPlatforms().length < platformsWithFilter().length" class="mt-4">
            <button (click)="loadMore()" class="w-full text-center px-4 py-2 text-sm font-medium text-indigo-400 bg-slate-800/50 rounded-md hover:bg-slate-700 transition-colors">
              Load More
            </button>
          </div>
        </ng-container>

        <div *ngIf="!hasMatches()" class="h-full flex flex-col items-center justify-center text-center py-8 text-slate-500">
          <i class="bi bi-search text-3xl text-slate-600"></i>
          <p class="mt-2 text-sm">No platforms match your search.</p>
        </div>
      </div>

      <div class="p-4 bg-slate-900 flex justify-end items-center gap-4 flex-shrink-0 rounded-b-lg border-t border-slate-700">
        <button (click)="close.emit()" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-300 bg-slate-700 rounded-md hover:bg-slate-600 transition-colors">
          <i class="bi bi-x-circle"></i>
          <span>Cancel</span>
        </button>
        <button (click)="onUpdateGraph()" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 transition-colors">
          <i class="bi bi-check-circle"></i>
          <span>Update Graph</span>
        </button>
      </div>
    </div>
</div>
