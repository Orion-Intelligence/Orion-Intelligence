<div class="context-menu-wrapper w-56 bg-white rounded-lg shadow-xl ring-1 ring-black ring-opacity-5 focus:outline-none animate-context-menu-in"
     [style.--menu-x.px]="data()!.x"
     [style.--menu-y.px]="data()!.y"
     (click)="$event.stopPropagation()">
    <ng-container [ngSwitch]="data()!.type">
        <ng-container *ngSwitchCase="'user'">
            <div>
                <div class="p-1">
                    <div class="px-2 pt-2 pb-1 text-xs font-semibold text-slate-500 uppercase tracking-wider">Analysis</div>
                    <button (click)="action.emit('fetchLinks')" class="w-full text-left flex items-center gap-3 px-3 py-1.5 text-sm text-slate-700 rounded-md hover:bg-indigo-500 hover:text-white transition-colors group">
                        <i class="bi bi-link-45deg w-5 h-5 text-slate-400 group-hover:text-white transition-colors"></i>
                        <span class="flex-grow">Fetch exposed post links</span>
                    </button>
                    <div class="my-1 h-px bg-slate-200"></div>
                    <button (click)="action.emit('clearConnections')" class="w-full text-left flex items-center gap-3 px-3 py-1.5 text-sm text-slate-700 rounded-md hover:bg-slate-100 hover:text-slate-900 transition-colors group">
                        <i class="bi bi-x-circle w-5 h-5 text-slate-400 group-hover:text-slate-500 transition-colors"></i>
                        <span class="flex-grow">Clear Connections</span>
                    </button>
                    <button (click)="action.emit('deleteProfile')" class="w-full text-left flex items-center gap-3 px-3 py-1.5 text-sm text-red-600 rounded-md hover:bg-red-50 hover:text-red-700 transition-colors group">
                        <i class="bi bi-trash3-fill w-5 h-5 text-red-400 group-hover:text-red-600 transition-colors"></i>
                        <span class="flex-grow">Delete Profile</span>
                    </button>
                </div>
            </div>
        </ng-container>
        <ng-container *ngSwitchCase="'platform'">
            <div>
                <div class="p-1">
                    <button (click)="action.emit('removeNode')" class="w-full text-left flex items-center gap-3 px-3 py-1.5 text-sm text-red-600 rounded-md hover:bg-red-50 hover:text-red-700 transition-colors group">
                        <i class="bi bi-trash3-fill w-5 h-5 text-red-400 group-hover:text-red-600 transition-colors"></i>
                        <span>Remove from Graph</span>
                    </button>
                </div>
            </div>
        </ng-container>
        <ng-container *ngSwitchCase="'group'">
            <div>
                <div class="p-1">
                    <button (click)="action.emit('removeNode')" class="w-full text-left flex items-center gap-3 px-3 py-1.5 text-sm text-red-600 rounded-md hover:bg-red-50 hover:text-red-700 transition-colors group">
                        <i class="bi bi-trash3-fill w-5 h-5 text-red-400 group-hover:text-red-600 transition-colors"></i>
                        <span>Remove Group from Graph</span>
                    </button>
                </div>
            </div>
        </ng-container>
        <ng-container *ngSwitchCase="'customEntity'">
            <div>
                <div class="p-1">
                    <button (click)="action.emit('deleteEntity')" class="w-full text-left flex items-center gap-3 px-3 py-1.5 text-sm text-red-600 rounded-md hover:bg-red-50 hover:text-red-700 transition-colors group">
                        <i class="bi bi-trash3-fill w-5 h-5 text-red-400 group-hover:text-red-600 transition-colors"></i>
                        <span>Delete Entity</span>
                    </button>
                </div>
            </div>
        </ng-container>
    </ng-container>
</div>
