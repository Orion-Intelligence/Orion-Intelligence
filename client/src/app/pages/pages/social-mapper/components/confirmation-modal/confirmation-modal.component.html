<div class="fixed inset-0 z-[101] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm animate-fade-in" (click)="cancel.emit()">
    <div class="bg-slate-800 rounded-lg border border-slate-700 shadow-2xl w-full max-w-sm animate-fade-in-scale overflow-hidden" (click)="$event.stopPropagation()">
      <div class="p-5 text-center">
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-red-500/10">
          <i class="bi bi-exclamation-triangle h-6 w-6 text-red-500"></i>
        </div>
        <h3 class="mt-4 text-lg font-semibold text-white">{{ data()!.title }}</h3>
        <p class="mt-2 text-sm text-slate-400" [innerHTML]="data()!.message"></p>
      </div>
      <div class="p-4 bg-slate-800/50 border-t border-slate-700 flex justify-end gap-3 rounded-b-lg">
        <button (click)="cancel.emit()" class="px-4 py-2 text-sm font-medium text-slate-300 bg-slate-700 rounded-md hover:bg-slate-600 transition-colors">
          Cancel
        </button>
        <button (click)="confirm.emit()" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700 transition-colors">
          {{ data()!.confirmText }}
        </button>
      </div>
    </div>
</div>
