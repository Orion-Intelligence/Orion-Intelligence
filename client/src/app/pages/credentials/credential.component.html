<div class="rounded-xl border border-[var(--color-border)] p-3 max-[640px]:p-2">
  <app-credentials-search-bar (searchTriggered)="triggerSearch($event)"></app-credentials-search-bar>
</div>

<app-result (onToggleSort)="onToggleSort($event)" [domain]="true" [showNoResult]="false"
  (reloadData)="fetchSearchResults()" [disableScroll]="true" [searchQuery]="'-'"
  [filterModel]="filters" (reloadFilters)="reloadFilters($event)"
  [result_count]="currentResultCount"></app-result>

<div class="mt-4 flex flex-wrap items-center gap-4 rounded-xl border border-[var(--color-border)] px-4 py-3 max-[640px]:gap-3 max-[640px]:px-3 max-[640px]:py-2">
  <div class="flex items-center gap-2">
    <img alt="Search" src="assets/images/shared/search_elapsed_time.svg" class="h-5 w-5">
    <div class="text-sm font-semibold text-[var(--color-text1)]">{{getApiTime()}} ms</div>
    <div class="text-xs text-[var(--color-text4)]">Search Elapsed</div>
  </div>

  <div class="hidden h-6 w-px bg-[var(--color-divider)] md:block"></div>

  <div class="hidden items-center gap-2 md:flex">
    <img alt="Search" src="assets/images/shared/results_found.svg" class="h-5 w-5">
    <div class="text-sm font-semibold text-[var(--color-text1)]">{{getTotalResultCount()}}</div>
    <div class="text-xs text-[var(--color-text4)]">Results</div>
  </div>

  <div class="hidden h-6 w-px bg-[var(--color-divider)] lg:block"></div>

  <div class="hidden items-center gap-2 lg:flex">
    <img alt="Search" src="assets/images/shared/assets_searched.svg" class="h-5 w-5">
    <div class="text-sm font-semibold text-[var(--color-text1)]">{{getAssetSearched()}}</div>
    <div class="text-xs text-[var(--color-text4)]">Assets</div>
  </div>

  <div class="hidden h-6 w-px bg-[var(--color-divider)] xl:block"></div>

  <div class="hidden items-center gap-2 xl:flex">
    <img alt="Search" src="assets/images/shared/aggregated_data_well.svg" class="h-5 w-5">
    <div class="text-sm font-semibold text-[var(--color-text1)]">{{getAggregatedDataWells()}}</div>
    <div class="text-xs text-[var(--color-text4)]">Aggregated</div>
  </div>

  <div class="ml-auto flex items-center gap-2">
    <button class="ui-consolidated-inner inline-flex h-9 w-9 items-center justify-center rounded-md border border-[var(--color-border)]" (click)="openScheme()">
      <img alt="scheme" src="assets/images/shared/passschema.svg" class="h-4 w-4">
    </button>
    <div class="h-6 w-px bg-[var(--color-divider)]"></div>
    <button class="ui-consolidated-inner inline-flex h-9 w-9 items-center justify-center rounded-md border border-[var(--color-border)]" (click)="openSubdomains()">
      <img alt="scheme" src="assets/images/sidebar/theme/scanner.svg" class="h-4 w-4">
    </button>
    <div class="h-6 w-px bg-[var(--color-divider)]"></div>
    <button class="ui-consolidated-inner inline-flex h-9 w-9 items-center justify-center rounded-md border border-[var(--color-border)]" (click)="onDownload()">
      <img alt="Download" src="assets/images/shared/theme/download.svg" class="h-4 w-4">
    </button>
  </div>
</div>

<div @fadeInDashboardItem *ngIf="firstTrigger" class="mt-4">
  <app-empty-query></app-empty-query>
</div>

<ng-container *ngIf="!firstTrigger">
  <div class="mt-4" @fadeInDashboardItem>
    <div class="credential_section_title">Stealers</div>
    <div class="mt-2 h-px w-full bg-[var(--color-divider)]"></div>
    <app-credential-list [stealerData$]="this.dashboardService.stealerlogCallbackModel" [isLoading]="isLoading"
      [type]="type" [currentPage]="this.dashboardService.consolidatedParamModel.page" [rankedResult]="rankedResult"
      [searchQuery]="searchQuery"></app-credential-list>
  </div>
</ng-container>

<div *ngIf="!firstTrigger && ( this.stealerlogCallbackModel.Page_Count> this.dashboardService.consolidatedParamModel.page ||
      this.rankedResult.pageCount > this.dashboardService.consolidatedParamModel.page
    )&& !isLoading" @fadeInDashboardItem class="mt-4">
  <app-pagination (pageChange)="onPageChange($event)" [currentPage]="this.dashboardService.consolidatedParamModel.page"
    [maxPages]="maxPages"></app-pagination>
</div>

<app-password-schema [isOpen]="showPasswordscheme" (close)="closeScheme()"
  (search)="onPasswordSearch($event)"></app-password-schema>

<app-scan-helper [isOpen]="showSubdomains" (close)="showSubdomains = false" (search)="onSubdomainSearch($event)">
</app-scan-helper>
