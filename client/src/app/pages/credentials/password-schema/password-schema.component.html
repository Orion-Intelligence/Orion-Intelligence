<div class="password-schema-overlay" *ngIf="isOpen" (click)="onClose()">
  <div class="password-schema-popup" (click)="$event.stopPropagation()">
    <div class="password-schema-header">
      <div>
        <div class="password-schema-title">Password Scheme Filter</div>
        <div class="password-schema-subtitle">Length range and character requirements</div>
      </div>
      <button class="password-schema-close-btn" type="button" aria-label="Close" (click)="onClose()">×</button>
    </div>

    <div class="password-schema-body">
      <div class="password-schema-grid">
        <div class="password-schema-field">
          <label class="password-schema-label">Min Length</label>
          <input class="password-schema-input" type="number" min="0" inputmode="numeric" placeholder="0" [(ngModel)]="filter.minLength" (ngModelChange)="normalizeRange()" />
        </div>

        <div class="password-schema-field">
          <label class="password-schema-label">Max Length</label>
          <input class="password-schema-input" type="number" min="0" inputmode="numeric" placeholder="0" [(ngModel)]="filter.maxLength" (ngModelChange)="normalizeRange()" />
        </div>
      </div>

      <div class="password-schema-divider"></div>

      <div class="password-schema-checklist">
        <label class="password-schema-check">
          <input type="checkbox" [(ngModel)]="filter.hasAlphabets" />
          <span>Has Alphabets</span>
        </label>

        <label class="password-schema-check">
          <input type="checkbox" [(ngModel)]="filter.hasNumbers" />
          <span>Has Numbers</span>
        </label>

        <label class="password-schema-check">
          <input type="checkbox" [(ngModel)]="filter.hasSpecialChars" />
          <span>Has Special Characters</span>
        </label>
      </div>
    </div>

    <div class="password-schema-actions">
      <button class="password-schema-btn password-schema-cancel" type="button" (click)="onClose()">
        Cancel
      </button>
      <button class="password-schema-btn password-schema-search" type="button" (click)="onSearch()">
        Search
      </button>
    </div>
  </div>
</div>
