<div class="password-schema-overlay" *ngIf="isOpen">
    <div class="password-schema-popup" (click)="$event.stopPropagation()">
        <div class="password-schema-heading">Password Scheme Filter</div>

        <div class="password-schema-field-row">
            <label>Min Length</label>
            <input type="number" min="0" [(ngModel)]="filter.minLength" (ngModelChange)="normalizeRange()" />
        </div>

        <div class="password-schema-field-row">
            <label>Max Length</label>
            <input type="number" min="0" [(ngModel)]="filter.maxLength" (ngModelChange)="normalizeRange()" />
        </div>

        <div class="password-schema-checkbox-row">
            <label>
                <input type="checkbox" [(ngModel)]="filter.hasAlphabets" />
                Has Alphabets
            </label>

            <label>
                <input type="checkbox" [(ngModel)]="filter.hasNumbers" />
                Has Numbers
            </label>

            <label>
                <input type="checkbox" [(ngModel)]="filter.hasSpecialChars" />
                Has Special Characters
            </label>
        </div>

        <div class="password-schema-actions">
            <button class="password-schema-btn password-schema-cancel" (click)="onClose()">Cancel</button>
            <button class="password-schema-btn password-schema-search" (click)="onSearch()">Search</button>
        </div>
    </div>
</div>
