<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" *ngIf="isOpen" (click)="onClose()">
  <div class="w-full max-w-[520px] rounded-2xl border border-[var(--color-border)] bg-[var(--color-blue-700)] p-6 shadow-[0_24px_80px_rgba(0,0,0,0.35)]" (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between">
      <div>
        <div class="text-lg font-semibold text-[var(--color-text1)]">Password Scheme Filter</div>
        <div class="text-sm text-[var(--color-text4)]">Length range and character requirements</div>
      </div>
      <button class="text-2xl leading-none text-[var(--color-text4)]" type="button" aria-label="Close" (click)="onClose()">×</button>
    </div>

    <div class="mt-6 space-y-4">
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="text-xs font-semibold text-[var(--color-text4)]">Min Length</label>
          <input class="mt-2 w-full rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)] px-3 py-2 text-sm text-[var(--color-text1)]" type="number" min="0" inputmode="numeric" placeholder="0" [(ngModel)]="filter.minLength" (ngModelChange)="normalizeRange()" />
        </div>

        <div>
          <label class="text-xs font-semibold text-[var(--color-text4)]">Max Length</label>
          <input class="mt-2 w-full rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)] px-3 py-2 text-sm text-[var(--color-text1)]" type="number" min="0" inputmode="numeric" placeholder="0" [(ngModel)]="filter.maxLength" (ngModelChange)="normalizeRange()" />
        </div>
      </div>

      <div class="h-px w-full bg-[var(--color-divider)]"></div>

      <div class="space-y-2">
        <label class="flex items-center gap-2 text-sm text-[var(--color-text3)]">
          <input type="checkbox" class="h-4 w-4 accent-[var(--color-blue-640)]" [(ngModel)]="filter.hasAlphabets" />
          <span>Has Alphabets</span>
        </label>

        <label class="flex items-center gap-2 text-sm text-[var(--color-text3)]">
          <input type="checkbox" class="h-4 w-4 accent-[var(--color-blue-640)]" [(ngModel)]="filter.hasNumbers" />
          <span>Has Numbers</span>
        </label>

        <label class="flex items-center gap-2 text-sm text-[var(--color-text3)]">
          <input type="checkbox" class="h-4 w-4 accent-[var(--color-blue-640)]" [(ngModel)]="filter.hasSpecialChars" />
          <span>Has Special Characters</span>
        </label>
      </div>
    </div>

    <div class="mt-6 flex items-center justify-end gap-2">
      <button class="rounded-md border border-[var(--color-border)] px-4 py-2 text-sm font-semibold text-[var(--color-text3)]" type="button" (click)="onClose()">Cancel</button>
      <button class="rounded-md bg-[var(--color-blue-640)] px-4 py-2 text-sm font-semibold text-white" type="button" (click)="onSearch()">Search</button>
    </div>
  </div>
</div>
