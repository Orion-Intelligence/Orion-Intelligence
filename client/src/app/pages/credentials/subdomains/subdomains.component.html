<div class="subdomain-overlay" *ngIf="isOpen" (click)="onClose()">
  <div class="subdomain-popup" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="subdomain-header">
      <div>
        <div class="subdomain-title">Subdomain Finder</div>
        <div class="subdomain-subtitle">Enter a domain to fetch subdomains</div>
      </div>
      <button class="subdomain-close-btn" type="button" (click)="onClose()" aria-label="Close">×</button>
    </div>

    <!-- Body -->
    <div class="subdomain-body">
      <!-- Input -->
      <div class="subdomain-field">
        <label class="subdomain-label" for="domain-input">Domain</label>
        <input
          id="domain-input"
          class="subdomain-input"
          [class.invalid]="!isValidDomain && domain.trim().length > 0"
          type="text"
          placeholder="e.g. bbc.com"
          [(ngModel)]="domain"
          (ngModelChange)="validateDomain()"
          (keyup.enter)="onSearch()"
          [disabled]="loading"
        />
        <div class="subdomain-validation-hint" *ngIf="!isValidDomain && domain.trim().length > 0">
          Please enter a valid domain (e.g., example.com)
        </div>
      </div>

      <div class="subdomain-divider"></div>

      <!-- Loading Progress -->
      <div *ngIf="loading" class="subdomain-progress-section">
        <div class="subdomain-progress-container">
          <div class="subdomain-progress-bar" [style.width.%]="progress"></div>
          <span class="subdomain-progress-text">{{ progress }}%</span>
        </div>
        <div class="subdomain-status-message">
          {{ statusMessage }}
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="error && !loading" class="subdomain-error" role="alert">
        {{ error }}
      </div>

      <!-- Success Results -->
      <div *ngIf="subdomains.length > 0 && !loading" class="subdomain-results">
        <div class="subdomain-success-header">
          <span class="subdomain-success-icon">✓</span>
          <span class="subdomain-success-text">
            Found <strong>{{ count }}</strong> subdomain{{ count !== 1 ? 's' : '' }}
          </span>
        </div>

        <div class="subdomain-list-container">
          <ul class="subdomain-list">
            <li *ngFor="let s of subdomains" class="subdomain-item">
              <span class="subdomain-bullet">▪</span>
              <a
                [href]="getSubdomainUrl(s)"
                target="_blank"
                rel="noopener noreferrer"
                class="subdomain-link"
                [title]="'Open ' + s + ' in new tab'"
              >
                {{ s }}
              </a>
              <span class="subdomain-external-icon">↗</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="!loading && !error && subdomains.length === 0 && domain" class="subdomain-empty">
        <p>No results yet. Click "Search" to start scanning.</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="subdomain-actions">
      <button
        class="subdomain-btn cancel"
        type="button"
        (click)="onClose()"
        [disabled]="loading">
        Cancel
      </button>
      <button
        class="subdomain-btn search"
        type="button"
        (click)="onSearch()"
        [disabled]="loading || !domain.trim() || !isValidDomain">
        <span *ngIf="!loading">Search</span>
        <span *ngIf="loading">Scanning...</span>
      </button>
    </div>

  </div>
</div>
