<div class="flex flex-wrap items-center gap-3">
  <div class="flex flex-wrap gap-2" *ngIf="!isAdvanced">
    <div *ngFor="let tag of [SearchTag.ALL, SearchTag.DOMAIN, SearchTag.EMAIL, SearchTag.CREDITCARD, SearchTag.IP]"
      (click)="selectBasicTag(tag)"
      [ngClass]="selectedTag === tag ? 'bg-[var(--color-blue-640)] text-white' : 'bg-[var(--color-blue-720)] text-[var(--color-text3)]'"
      class="cursor-pointer rounded-full px-4 py-1.5 text-xs font-semibold transition">
      {{ FILTER_LABELS[tag] }}
    </div>
  </div>

  <div *ngIf="isAdvanced" class="flex flex-col">
    <span class="text-sm font-semibold text-[var(--color-text1)]">Advanced Filter Builder</span>
    <span class="text-xs text-[var(--color-text4)]">Combine multiple filters with AND/OR for precise results</span>
  </div>

  <div class="ml-auto flex items-center gap-3">
    <button class="rounded-md border border-[var(--color-border)] px-3 py-2 text-xs font-semibold text-[var(--color-text3)]" (click)="toggleAdvanced()">
      <i class="bi me-2" [ngClass]="isAdvanced ? 'bi-search':'bi-sliders'"></i>
      {{ isAdvanced ? 'Basic':'Advanced' }}
    </button>

    <div class="h-6 w-px bg-[var(--color-divider)]"></div>

    <label (click)="sidebarService.openSidebar()" appTooltip="Customize Results" class="flex cursor-pointer items-center gap-2 rounded-md border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 py-2 text-xs font-semibold text-[var(--color-text3)]">
      <img alt="Filter Icon" height="18" src="assets/images/shared/theme/filter_icon.svg" priority width="18">
      <span>Filter</span>
    </label>
  </div>
</div>

<div class="mt-4">
  <div *ngIf="!isAdvanced" class="w-full">
    <form (submit)="$event.preventDefault(); triggerSearch()" @fadeInDashboardItem class="relative flex w-full items-center gap-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 py-2" [ngClass]="isBasicInvalid() ? 'ring-1 ring-[var(--color-border-red)]' : ''">
      <img alt="Search" src="assets/images/shared/theme/magnifyingglassblack.svg" class="h-4 w-4">

      <input [(ngModel)]="basicQuery" (ngModelChange)="onBasicQueryChange($event)" (input)="filterBasicInput($event)" name="searchQuery" class="flex-1 bg-transparent text-sm text-[var(--color-text1)] outline-none" type="text" placeholder="Search..." />

      <div class="text-xs text-[var(--color-text4)]" *ngIf="isBasicInvalid()">
        {{getBasicErrorMessage()}}
      </div>
      <div class="text-red-500" *ngIf="isBasicInvalid()">
        <i class="bi bi-exclamation-circle-fill"></i>
      </div>
    </form>
  </div>

  <div *ngIf="isAdvanced" class="space-y-3" @fadeInDashboardItem>
    <div *ngFor="let filter of advancedFilters; let i = index" class="grid items-center gap-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-720)] p-3 md:grid-cols-[120px_1fr_2fr_auto]">
      <div class="text-xs font-semibold text-[var(--color-text4)]">
        <span *ngIf="i === 0">WHERE</span>
        <select *ngIf="i > 0" [(ngModel)]="advancedFilters[i-1].operator" class="w-full rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)] px-2 py-1 text-xs text-[var(--color-text1)]">
          <option value="&&">AND</option>
          <option value="||">OR</option>
        </select>
      </div>

      <select [(ngModel)]="filter.tag" class="w-full rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)] px-3 py-2 text-xs text-[var(--color-text1)]">
        <option *ngFor="let tag of FILTER_LABELS | keyvalue" [value]="tag.key">{{ tag.value }}</option>
      </select>

      <input [(ngModel)]="filter.value" type="text" placeholder="Enter value..." class="w-full rounded-md border bg-[var(--color-blue-730)] px-3 py-2 text-xs text-[var(--color-text1)]" [ngClass]="isAdvancedInvalid(filter) ? 'border-[var(--color-border-red)]' : 'border-[var(--color-border)]'" />

      <div class="flex items-center gap-2">
        <button (click)="removeFilter(filter.id)" [disabled]="advancedFilters.length === 1" class="inline-flex h-8 w-8 items-center justify-center rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)]">
          <img alt="delete filter" src="assets/images/shared/theme/bin.svg" class="h-4 w-4">
        </button>

        <button *ngIf="i === advancedFilters.length - 1" (click)="addFilter()" class="inline-flex h-8 w-8 items-center justify-center rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)]">
          <img alt="add filter" src="assets/images/shared/theme/plus.svg" class="h-4 w-4">
        </button>
      </div>
    </div>

    <div class="flex justify-end">
      <button (click)="triggerSearch()" class="inline-flex items-center gap-2 rounded-md bg-[var(--color-blue-640)] px-4 py-2 text-xs font-semibold text-white">
        <img alt="Search" src="assets/images/shared/theme/magnifyingglasswhite.svg" class="h-4 w-4">
        Execute
      </button>
    </div>
  </div>
</div>
