<div class="credentials-search_search-header">
    <div class="credentials-search_tag-list animate-fade-in" *ngIf="!isAdvanced">
        <div *ngFor="let tag of [SearchTag.ALL, SearchTag.DOMAIN, SearchTag.EMAIL, SearchTag.CREDITCARD,SearchTag.IP]"
            (click)="selectBasicTag(tag)" [class.active]="selectedTag === tag" class="credentials-search_tag-btn">
            {{ FILTER_LABELS[tag] }}
        </div>
    </div>

    <div class="credentials-search_advanced-label animate-fade-in" *ngIf="isAdvanced">
        <div class="advanced-title-section">
            <div class="advanced-title-wrapper">
                <span class="advanced-title">Advanced Filter Builder</span>
                <span class="advanced-subtitle">Combine multiple filters with AND/OR for precise results</span>
            </div>
        </div>
    </div>

    <div class="credentials-search_toggle-wrapper">
        <span class="credentials-search_toggle-label">
            {{ isAdvanced ? 'Advanced' : 'Basic' }}
        </span>
        <label class="credentials-search_switch">
            <input type="checkbox" [checked]="isAdvanced" (change)="toggleAdvanced()">
            <span class="credentials-search_slider"></span>
        </label>
    </div>
</div>

<div class="credentials-search_search-body">
    <div *ngIf="!isAdvanced" class="search-filter-row d-flex align-items-center justify-content-between gap-3">
        <form (submit)="$event.preventDefault(); triggerSearch()" @fadeInDashboardItem
            class="credential_search_wrapper animate-fade-in" [class.invalid]="isBasicInvalid()">

            <img alt="Search" src="assets/images/shared/theme/magnifyingglassblack.svg">

            <input [(ngModel)]="basicQuery" name="searchQuery" class="credential_search_input" type="text"
                placeholder="Search" />


            <div class="clear-icon" aria-label="Clear" *ngIf="basicQuery" (click)="basicQuery=''; triggerSearch()">
                <img src="/assets/images/shared/cross-dark.svg" alt="" width="14" height="14">
            </div>
        </form>

        <div class="filter-button-wrapper side-menu-container d-flex align-items-start justify-content-start gap-3">
            <label (click)="sidebarService.openSidebar()" appTooltip="Customize Results"
                class="filters-button d-flex align-items-center"> <img alt="Filter Icon" height="24"
                    src="assets/images/shared/theme/filter_icon.svg" priority width="24">
                <span class="ms-2">Filter</span>
            </label>
        </div>
    </div>

    <div *ngIf="isAdvanced" class="credentials-search_advanced-builder animate-fade-in">
        <div *ngFor="let filter of advancedFilters; let i = index" class="credentials-search_filter-row">

            <div class="credentials-search_connector-cell">
                <span *ngIf="i === 0" class="credentials-search_where-label">WHERE</span>
                <select *ngIf="i > 0" [(ngModel)]="advancedFilters[i-1].operator"
                    class="credentials-search_operator-select">
                    <option value="&&">AND</option>
                    <option value="||">OR</option>
                </select>
            </div>

            <select [(ngModel)]="filter.tag" class="credentials-search_tag-select">
                <option *ngFor="let tag of FILTER_LABELS | keyvalue" [value]="tag.key">
                    {{ tag.value }}
                </option>
            </select>

            <input [(ngModel)]="filter.value" type="text" placeholder="Enter value..."
                class="credentials-search_filter-input" [class.invalid]="isAdvancedInvalid(filter)" />

            <div class="credentials-search_row-actions">
                <button (click)="removeFilter(filter.id)" [disabled]="advancedFilters.length === 1"
                    class="credentials-search_btn-icon credentials-search_delete">
                    <img alt="delete filter" src="assets/images/shared/theme/bin.svg">
                </button>

                <button *ngIf="i === advancedFilters.length - 1" (click)="addFilter()"
                    class="credentials-search_btn-icon credentials-search_add">
                    <img alt="add filter" src="assets/images/shared/theme/plus.svg">
                </button>
            </div>
        </div>

        <div class="credentials-search_advanced-footer">
            <div class="filter-button-wrapper side-menu-container d-flex align-items-start justify-content-start gap-3">
                <label (click)="sidebarService.openSidebar()" appTooltip="Customize Results"
                    class="filters-button d-flex align-items-center"> <img alt="Filter Icon" height="24"
                        src="assets/images/shared/theme/filter_icon.svg" priority width="24">
                    <span class="ms-2">Filter</span>
                </label>
            </div>
            <button (click)="triggerSearch()" class="credentials-search_execute-btn">
                <img alt="Search" src="assets/images/shared/theme/magnifyingglasswhite.svg">
                Execute
            </button>
        </div>
    </div>
</div>
