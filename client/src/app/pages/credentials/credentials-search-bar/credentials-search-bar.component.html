<div class="flex w-full flex-wrap items-center gap-3 bg-[var(--color-blue-760)] py-[15px] max-[640px]:gap-2">
  <div class="flex flex-nowrap gap-2 overflow-x-auto max-w-full whitespace-nowrap [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden [mask-image:linear-gradient(to_right,black_0%,black_85%,transparent_100%)] [mask-size:100%_100%] [mask-repeat:no-repeat]" *ngIf="!isAdvanced">
    <div *ngFor="let tag of [SearchTag.ALL, SearchTag.DOMAIN, SearchTag.EMAIL, SearchTag.CREDITCARD, SearchTag.IP]" (click)="selectBasicTag(tag)" [ngClass]="selectedTag === tag ? 'border-[var(--color-blue-640)] bg-[var(--color-blue-640)] text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.15)]' : 'border-[var(--color-border)] bg-[var(--color-blue-720)] text-[var(--color-text3)] hover:bg-[var(--color-blue-710)] hover:text-[var(--color-text1)]'" class="cursor-pointer rounded-full border px-4 py-1.5 text-[12px] font-semibold transition-colors">
      {{ FILTER_LABELS[tag] }}
    </div>
  </div>

  <div *ngIf="isAdvanced" class="flex flex-col">
    <span class="text-sm font-semibold text-[var(--color-text1)]">Advanced Filter Builder</span>
    <span class="text-xs text-[var(--color-text4)]">Combine multiple filters with AND/OR for precise results</span>
  </div>

  <div class="ml-auto flex items-center gap-2 max-[640px]:w-full max-[640px]:justify-end">
    <button class="ui-cred-toolbar-btn inline-flex h-10 items-center gap-2 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 text-xs font-semibold text-[var(--color-text2)] transition-[background-color,border-color,color,transform] duration-150 hover:border-[var(--color-blue-640)] hover:bg-[var(--color-blue-710)] hover:text-[var(--color-text1)] hover:-translate-y-[1px]" (click)="toggleAdvanced()">
      <i class="bi inline-flex h-4 w-4 items-center justify-center text-[15px]" [ngClass]="isAdvanced ? 'bi-search' : 'bi-sliders2-vertical'"></i>
      {{ isAdvanced ? 'Basic':'Advanced' }}
    </button>

    <div class="h-6 w-px bg-[var(--color-divider)]"></div>

    <label (click)="sidebarService.openSidebar()" appTooltip="Customize Results" class="ui-cred-toolbar-btn inline-flex h-10 cursor-pointer items-center gap-2 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 text-xs font-semibold text-[var(--color-text2)] transition-[background-color,border-color,color,transform] duration-150 hover:border-[var(--color-blue-640)] hover:bg-[var(--color-blue-710)] hover:text-[var(--color-text1)] hover:-translate-y-[1px]">
      <img alt="Filter Icon" height="16" src="assets/images/shared/theme/filter_icon.svg" priority width="16" class="h-4 w-4 shrink-0 ui-action-icon">
      <span>Filter</span>
    </label>
  </div>
</div>

<div class="mt-4">
  <div *ngIf="!isAdvanced" class="w-full">
    <form (submit)="$event.preventDefault(); triggerSearch()" @fadeInDashboardItem class="relative flex w-full items-center gap-3 rounded-[10px] border border-[var(--color-border)] bg-white px-3 py-2" [ngClass]="isBasicInvalid() ? 'ring-1 ring-[var(--color-border-red)]' : ''">
      <i class="bi bi-search text-[14px] text-[#0e1626]/70"></i>

      <input [(ngModel)]="basicQuery" (ngModelChange)="onBasicQueryChange($event)" (input)="filterBasicInput($event)" name="searchQuery" class="flex-1 bg-transparent text-sm text-[#0e1626] outline-none placeholder:text-[#0e1626]/45" [ngClass]="isBasicInvalid() ? 'pr-[250px] max-[900px]:pr-[170px] max-[640px]:pr-[36px]' : ''" type="text" placeholder="Search..." />

      <div *ngIf="isBasicInvalid()" class="pointer-events-none absolute right-2 top-1/2 inline-flex max-w-[240px] -translate-y-1/2 items-center gap-1 rounded-md bg-red-500/85 px-2 py-[3px] text-[12px] font-semibold text-white max-[900px]:max-w-[160px] max-[640px]:max-w-[28px]">
        <i class="bi bi-exclamation-triangle-fill text-[12px] text-white"></i>
        <span class="truncate max-[640px]:hidden">{{ getBasicErrorMessage() }}</span>
      </div>
    </form>
  </div>

  <div *ngIf="isAdvanced" class="space-y-2.5" @fadeInDashboardItem>
    <div *ngFor="let filter of advancedFilters; let i = index; trackBy: trackByFilterId" @advancedRowMotion class="ui-ioc-adv-row grid items-center gap-2 rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-700)] p-2.5 shadow-[inset_0_1px_0_rgba(255,255,255,0.03)] md:grid-cols-[110px_1fr_2fr_auto]">
      <div class="text-xs font-semibold text-[var(--color-text4)]">
        <div class="relative">
          <select class="ui-ioc-adv-control h-11 w-full appearance-none rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 pr-11 text-xs font-semibold text-[var(--color-text1)] outline-none transition-colors focus:border-[var(--color-blue-640)] disabled:cursor-not-allowed disabled:opacity-75" [disabled]="i === 0" [ngModel]="i === 0 ? '__where__' : advancedFilters[i-1].operator" (ngModelChange)="i > 0 ? (advancedFilters[i-1].operator = $event) : null">
            <option value="__where__">WHERE</option>
            <option value="&&">AND</option>
            <option value="||">OR</option>
          </select>
          <i class="bi bi-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-[var(--color-text4)]"></i>
        </div>
      </div>

      <div class="relative">
        <select [(ngModel)]="filter.tag" class="ui-ioc-adv-control h-11 w-full appearance-none rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 pr-11 text-xs font-semibold text-[var(--color-text1)] outline-none transition-colors focus:border-[var(--color-blue-640)]">
          <option *ngFor="let tag of FILTER_LABELS | keyvalue" [value]="tag.key">{{ tag.value }}</option>
        </select>
        <i class="bi bi-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-[var(--color-text4)]"></i>
      </div>

      <input [(ngModel)]="filter.value" type="text" placeholder="Enter value..." class="ui-ioc-adv-control h-11 w-full rounded-lg border bg-[var(--color-blue-720)] px-3 text-[13px] font-medium text-[var(--color-text1)] placeholder:text-[var(--color-text4)] outline-none transition-colors focus:border-[var(--color-blue-640)]" [ngClass]="isAdvancedInvalid(filter) ? 'border-[var(--color-border-red)]' : 'border-[var(--color-border)]'" />

      <div class="flex items-center gap-2">
        <button (click)="removeFilter(filter.id)" [disabled]="advancedFilters.length === 1" class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-720)] text-[var(--color-text2)] transition-[background-color,border-color,transform] duration-150 hover:border-[var(--color-blue-640)] hover:bg-[var(--color-blue-710)] hover:-translate-y-[1px] disabled:cursor-not-allowed disabled:opacity-45">
          <img alt="delete filter" src="assets/images/shared/theme/bin.svg" class="h-4 w-4 ui-action-icon">
        </button>

        <button *ngIf="i === advancedFilters.length - 1" (click)="addFilter()" class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-720)] text-[var(--color-text2)] transition-[background-color,border-color,transform] duration-150 hover:border-[var(--color-blue-640)] hover:bg-[var(--color-blue-710)] hover:-translate-y-[1px]">
          <img alt="add filter" src="assets/images/shared/theme/plus.svg" class="h-4 w-4 ui-action-icon">
        </button>
      </div>
    </div>

    <div class="flex justify-end">
      <button (click)="triggerSearch()" class="inline-flex items-center gap-2 rounded-md bg-[var(--color-blue-640)] px-4 py-2 text-xs font-semibold text-white">
        <img alt="Search" src="assets/images/shared/theme/magnifyingglasswhite.svg" class="h-4 w-4">
        Execute
      </button>
    </div>
  </div>
</div>
