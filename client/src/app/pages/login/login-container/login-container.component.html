<img alt="background" class="app-background app-background-dark img-fluid w-100 h-100 object-fit-cover" src="/assets/images/shared/Bg.webp">
<ng-container>
  <app-header></app-header>
</ng-container>

<div class="login_wrapper">
  <img alt="background" class="login_background img-fluid w-100 h-100 object-fit-cover" src="assets/images/shared/Bg.webp">
</div>

<div *ngIf="!authenticated" class="login_container" id="content">
  <div class="login_box">
    <div class="login_header">
      <img alt="logo" height="41" src="assets/images/shared/home-logo.svg" width="232">
    </div>

    <p *ngIf="errorMessage" [ngClass]="{'login-error-message': errorMessage}">
      {{ errorMessage }} </p>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
      <div class="login_form-group">
        <label class="login_hidden-label" for="id_username">Username</label> <input [(ngModel)]="user.username" class="login_input login_input-username" id="id_username" name="username" placeholder="Username" required type="text">
      </div>

      <div class="login_form-group">
        <label class="login_hidden-label" for="id_password">Password</label> <input [(ngModel)]="user.password" class="login_input" id="id_password" minlength="6" name="password" placeholder="Password" required type="password">
      </div>

      <div class="login-button-container">
        <input [disabled]="!loginForm.valid" [class.login_btn-submit]="loginForm.valid" [class.login_btn-disabled]="!loginForm.valid" type="submit" value="Log in"/>
      </div>
    </form>
  </div>
</div>

<footer class="login_footer"></footer>
