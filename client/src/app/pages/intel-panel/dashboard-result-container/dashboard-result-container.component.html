<app-result
  (onToggleSort)="onToggleSort($event)"
  (reloadData)="fetchSearchResults()"
  (reloadFilters)="reloadFilters($event)"
  (updateQuery)="onUpdateQuery($event)"
  [filterModel]="general_filters"
  [isLoading]="isResponseLoading()"
  [result_count]="Math.ceil(currentResultModel?.length ?? 0)"
  [searchQuery]="currentParamModel.q"
  [type]="type">
</app-result>

<div *ngIf="!isResponseLoading() && currentResultModel?.length > 0" @fadeInDashboardItem>
  <app-dashboard-result-defacement
    *ngIf="currentResultModel[0].rank_index === 'defacement_model'"
    [isLoading]="isResponseLoading()"
    [isExpandAble]="false"
    [isList]="true"
    [searchResults]="currentResultModel">
  </app-dashboard-result-defacement>
</div>

<div *ngIf="!isResponseLoading()" @fadeInDashboardItem>
  <div *ngFor="let item of currentResultModel" class="space-y-4">
    <div class="rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-700)] p-2">
      <app-dashboard-results-general-grid
        *ngIf="item.rank_index === 'leak_model' || item.rank_index === 'generic_model'"
        [query]="currentQuery"
        [searchResults]="[item]"
        [isExpandAble]="false"
        [type]="item.rank_index === 'generic_model' ? 'Strategic' : 'leak'">
      </app-dashboard-results-general-grid>

      <app-dashboard-result-exploit
        *ngIf="item.rank_index === 'exploit_model'"
        [isExpandAble]="false"
        [searchResults]="[item]">
      </app-dashboard-result-exploit>

      <app-dashboard-result-social
        *ngIf="item.rank_index === 'social_model'"
        [isExpandAble]="false"
        [searchResults]="[item]">
      </app-dashboard-result-social>
    </div>
  </div>
</div>

<div *ngIf="currentResultModel?.length>0" @fadeInDashboardItem class="mt-4">
  <app-pagination
    (pageChange)="onPageChange($event)"
    [currentPage]="currentParamModel.page"
    [maxPages]="Math.ceil(currentResultModel?.length ?? 0)">
  </app-pagination>
</div>
