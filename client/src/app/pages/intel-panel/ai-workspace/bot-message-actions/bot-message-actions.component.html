<ul class="absolute bottom-3 right-3 z-10 inline-flex items-center gap-2">
  <li (click)="copyMessage($event)" class="relative list-none cursor-pointer rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 py-1.5 text-xs font-semibold text-[var(--color-text3)] transition hover:bg-[var(--color-blue-710)]">
    Copy
    @if (copied()) {
      <span class="absolute -top-7 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-md bg-[var(--color-blue-640)] px-2 py-1 text-[10px] font-semibold text-white">Copied!</span>
    }
  </li>
  <li (click)="shareDialog.open($event)" class="relative list-none cursor-pointer rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 py-1.5 text-xs font-semibold text-[var(--color-text3)] transition hover:bg-[var(--color-blue-710)]">
    Share
  </li>
</ul>

<app-share-response-dialog #shareDialog [text]="message.text"></app-share-response-dialog>
