@if (visible()) {
  <div class="ui-graph-popup-overlay fixed inset-0 z-[1200] flex items-center justify-center p-4" (click)="close()">
    <div class="ui-graph-popup-panel ui-popup-shell w-full max-w-[520px] overflow-hidden rounded-xl" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between gap-3 border-b border-[var(--color-border)] px-5 py-4">
        <div class="flex items-center gap-3">
          <span class="inline-flex h-10 w-10 items-center justify-center rounded-[12px] bg-[var(--color-blue-720)]">
            <img src="assets/images/shared/share-black.svg" alt="" class="h-5 w-5 [filter:brightness(0)_invert(1)]">
          </span>
          <div>
            <h3 class="ui-popup-title text-[16px] font-semibold">Share Response</h3>
            <p class="text-[12px] text-[var(--color-text4)]">Choose where to send this Nexus answer.</p>
          </div>
        </div>
        <button type="button" (click)="close()" appTooltip="Close" class="ui-popup-close inline-flex items-center justify-center text-[20px]" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="px-5 py-5">
        <div class="mb-5 flex items-start gap-3 overflow-x-auto pb-1 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">
          @if (canNativeShare()) {
            <button type="button" (click)="shareViaNative()" class="group flex w-[72px] shrink-0 flex-col items-center gap-2 text-center">
              <span class="inline-flex h-12 w-12 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)] transition group-hover:bg-[var(--color-blue-710)]">
                <img src="assets/images/shared/share-black.svg" alt="" class="h-5 w-5 [filter:brightness(0)_invert(1)]">
              </span>
              <span class="text-[11px] font-medium text-[var(--color-text3)]">System</span>
            </button>
          }
          <a [href]="shareUrl('whatsapp')" target="_blank" rel="noopener" (click)="close()" class="group flex w-[72px] shrink-0 flex-col items-center gap-2 text-center">
            <span class="inline-flex h-12 w-12 items-center justify-center rounded-full border border-emerald-400/25 bg-emerald-500/15 text-[15px] font-bold text-emerald-200 transition group-hover:bg-emerald-500/25">W</span>
            <span class="text-[11px] font-medium text-[var(--color-text3)]">WhatsApp</span>
          </a>
          <a [href]="shareUrl('telegram')" target="_blank" rel="noopener" (click)="close()" class="group flex w-[72px] shrink-0 flex-col items-center gap-2 text-center">
            <span class="inline-flex h-12 w-12 items-center justify-center rounded-full border border-sky-400/25 bg-sky-500/15 transition group-hover:bg-sky-500/25">
              <img src="assets/images/sidebar/sub_telegram.svg" alt="" class="h-5 w-5">
            </span>
            <span class="text-[11px] font-medium text-[var(--color-text3)]">Telegram</span>
          </a>
          <a [href]="shareUrl('x')" target="_blank" rel="noopener" (click)="close()" class="group flex w-[72px] shrink-0 flex-col items-center gap-2 text-center">
            <span class="inline-flex h-12 w-12 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)] transition group-hover:bg-[var(--color-blue-710)]">
              <img src="assets/images/sidebar/sub_twitter.svg" alt="" class="h-5 w-5">
            </span>
            <span class="text-[11px] font-medium text-[var(--color-text3)]">X</span>
          </a>
          <a [href]="shareUrl('email')" (click)="close()" class="group flex w-[72px] shrink-0 flex-col items-center gap-2 text-center">
            <span class="inline-flex h-12 w-12 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)] transition group-hover:bg-[var(--color-blue-710)]">
              <img src="assets/images/shared/email.svg" alt="" class="h-5 w-5 [filter:brightness(0)_invert(1)]">
            </span>
            <span class="text-[11px] font-medium text-[var(--color-text3)]">Email</span>
          </a>
        </div>
        <div class="rounded-[14px] border border-[var(--color-border)] bg-[var(--color-blue-790)] p-3">
          <p class="mb-3 max-h-[120px] overflow-y-auto text-[12px] leading-5 text-[var(--color-text3)]">
            {{ text }}
          </p>
          <button type="button" (click)="copyText()" class="flex w-full items-center justify-between gap-3 rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 py-2.5 text-left transition hover:bg-[var(--color-blue-710)]">
            <span class="flex min-w-0 items-center gap-2">
              <img src="assets/images/shared/copy.svg" alt="" class="h-4 w-4 shrink-0 [filter:brightness(0)_invert(1)]">
              <span class="text-[13px] font-medium text-[var(--color-text1)]">{{ copied() ? 'Copied' : 'Copy text' }}</span>
            </span>
            <span class="text-[11px] text-[var(--color-text5)]">Clipboard</span>
          </button>
        </div>
      </div>
    </div>
  </div>
}
