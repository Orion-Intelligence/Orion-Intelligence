<ul class="m-0 flex w-full list-none items-center justify-end gap-1 px-1 pt-1.5" [attr.aria-label]="'Message actions' | translate">
  <li class="list-none">
    <button type="button" (click)="copyMessage($event)" class="ui-ai-action-button relative inline-flex h-8 w-8 items-center justify-center border-0 bg-transparent p-0 text-white/75 drop-shadow-[0_1px_1px_rgba(0,0,0,0.35)] transition-colors duration-150 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#57A5EB]/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-blue-700)] motion-reduce:transition-none" [ngClass]="copied() ? 'text-emerald-200 hover:text-emerald-100' : ''" [title]="(copied() ? 'Copied!' : 'Copy message') | translate" [attr.aria-label]="(copied() ? 'Copied!' : 'Copy message') | translate">
      @if (copied()) {
        <i class="bi bi-check-lg text-[16px] leading-none" aria-hidden="true"></i>
        <span role="status" aria-live="polite" class="absolute right-[calc(100%+6px)] top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md border border-[var(--color-blue-640)] bg-[var(--color-blue-640)] px-2.5 py-1.5 text-[11px] font-semibold leading-none text-white shadow-lg">
          {{ 'Copied!' | translate }}
        </span>
      } @else {
        <i class="bi bi-copy text-[15px] leading-none" aria-hidden="true"></i>
      }
    </button>
  </li>
  <li class="list-none">
    <button type="button" (click)="shareDialog.open($event)" class="ui-ai-action-button inline-flex h-8 w-8 items-center justify-center border-0 bg-transparent p-0 text-white/75 drop-shadow-[0_1px_1px_rgba(0,0,0,0.35)] transition-colors duration-150 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#57A5EB]/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-blue-700)] motion-reduce:transition-none" [title]="'Share message' | translate" [attr.aria-label]="'Share message' | translate" aria-haspopup="dialog">
      <i class="bi bi-share-fill text-[15px] leading-none" aria-hidden="true"></i>
    </button>
  </li>
</ul>

<app-share-response-dialog #shareDialog [text]="message.text"></app-share-response-dialog>
