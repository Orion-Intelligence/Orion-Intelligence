<ul class="flex justify-end gap-2 px-1 pt-1.5">
  <li (click)="copyMessage($event)" class="relative flex h-[30px] w-[30px] list-none cursor-pointer items-center justify-center rounded-full border border-white/15 bg-white/10 text-white/80 transition hover:bg-white/15 hover:text-white" title="Copy message" aria-label="Copy message">
    <i class="bi bi-copy text-[12px] leading-none"></i>
    @if (copied()) {
      <span class="absolute -top-7 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-md bg-[var(--color-blue-640)] px-2 py-1 text-[10px] font-semibold text-white">Copied!</span>
    }
  </li>
  <li (click)="shareDialog.open($event)" class="relative flex h-[30px] w-[30px] list-none cursor-pointer items-center justify-center rounded-full border border-white/15 bg-white/10 text-white/80 transition hover:bg-white/15 hover:text-white" title="Share message" aria-label="Share message">
    <i class="bi bi-share-fill text-[12px] leading-none"></i>
  </li>
</ul>

<app-share-response-dialog #shareDialog [text]="message.text"></app-share-response-dialog>
