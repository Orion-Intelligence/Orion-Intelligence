@if (isOpen()) {
  <div class="ui-graph-popup-overlay fixed inset-0 z-50 flex items-center justify-center p-4" (click)="onClose()">
    <div data-testid="password-scheme-modal" class="ui-graph-popup-panel ui-popup-shell w-full max-w-[520px] rounded-2xl p-6" (click)="$event.stopPropagation()">
      <div class="flex items-start justify-between">
        <div>
          <div data-testid="password-scheme-title" class="ui-popup-title text-lg font-semibold">Password Scheme Filter</div>
          <div class="ui-popup-subtitle text-sm">Length range and character requirements</div>
        </div>
        <button class="ui-popup-close" type="button" aria-label="Close" (click)="onClose()">×</button>
      </div>
      <div class="mt-6 space-y-4">
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label class="text-xs font-semibold text-[var(--color-text4)]">Min Length</label>
            <input data-testid="password-scheme-min-length" class="ui-popup-input mt-2 w-full rounded-md px-3 py-2 text-sm" type="number" min="0" inputmode="numeric" placeholder="0" [(ngModel)]="filter.minLength" (ngModelChange)="normalizeRange()" />
          </div>
          <div>
            <label class="text-xs font-semibold text-[var(--color-text4)]">Max Length</label>
            <input data-testid="password-scheme-max-length" class="ui-popup-input mt-2 w-full rounded-md px-3 py-2 text-sm" type="number" min="0" inputmode="numeric" placeholder="0" [(ngModel)]="filter.maxLength" (ngModelChange)="normalizeRange()" />
          </div>
        </div>
        <div class="h-px w-full bg-[var(--color-divider)]"></div>
        <div class="space-y-2">
          <label class="flex items-center gap-2 text-sm text-[var(--color-text3)]">
            <input data-testid="password-scheme-has-alphabets" type="checkbox" class="h-4 w-4 accent-[var(--color-blue-640)]" [(ngModel)]="filter.hasAlphabets" />
            <span>Has Alphabets</span>
          </label>
          <label class="flex items-center gap-2 text-sm text-[var(--color-text3)]">
            <input data-testid="password-scheme-has-numbers" type="checkbox" class="h-4 w-4 accent-[var(--color-blue-640)]" [(ngModel)]="filter.hasNumbers" />
            <span>Has Numbers</span>
          </label>
          <label class="flex items-center gap-2 text-sm text-[var(--color-text3)]">
            <input type="checkbox" class="h-4 w-4 accent-[var(--color-blue-640)]" [(ngModel)]="filter.hasSpecialChars" />
            <span>Has Special Characters</span>
          </label>
        </div>
      </div>
      <div class="mt-6 flex items-center justify-end gap-2">
        <button class="ui-popup-btn-secondary px-4 py-2 text-sm font-semibold" type="button" (click)="onClose()">Cancel</button>
        <button data-testid="password-scheme-search" class="ui-popup-btn-primary px-4 py-2 text-sm font-semibold" type="button" (click)="onSearch()">Search</button>
      </div>
    </div>
  </div>
}
