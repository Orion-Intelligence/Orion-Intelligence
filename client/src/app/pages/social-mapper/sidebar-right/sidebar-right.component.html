<div class="h-full flex flex-col"
    [class.w-64]="!isCollapsed()"
    [class.w-20]="isCollapsed()">
    <div class="p-3 border-b border-slate-800 flex items-center shrink-0"
        [class.gap-3]="!isCollapsed()"
        [class.justify-between]="!isCollapsed()"
        [class.justify-center]="isCollapsed()">
      <div class="overflow-hidden transition-all duration-300"
           [class.flex-grow]="!isCollapsed()"
           [class.w-0]="isCollapsed()"
           [class.opacity-0]="isCollapsed()"
           [class.pointer-events-none]="isCollapsed()">
        <h2 class="text-md font-semibold text-slate-300 whitespace-nowrap">Add Entity</h2>
      </div>
      <button (click)="toggle.emit()" class="p-2 rounded-md text-slate-400 hover:bg-slate-700 hover:text-white transition-colors active:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500">
        <i class="bi bi-list text-2xl"></i>
      </button>
    </div>

    <div class="relative flex-grow">
      <!-- Expanded Content -->
      <div class="absolute inset-0 p-3 flex flex-col gap-2 transition-opacity duration-150 overflow-y-auto"
           [class.opacity-100]="!isCollapsed()"
           [class.opacity-0]="isCollapsed()"
           [class.pointer-events-none]="isCollapsed()"
           [class.delay-150]="!isCollapsed()">
        <button (click)="addEntityClicked.emit('wallet')" class="w-full flex items-center gap-3 p-3 text-sm text-left font-medium text-slate-300 rounded-lg bg-slate-800/50 hover:bg-slate-700/50 border border-slate-700 transition-colors">
          <i class="bi bi-wallet2 w-5 h-5 text-green-400"></i>
          <span>Add Wallet</span>
        </button>
        <button (click)="addEntityClicked.emit('email')" class="w-full flex items-center gap-3 p-3 text-sm text-left font-medium text-slate-300 rounded-lg bg-slate-800/50 hover:bg-slate-700/50 border border-slate-700 transition-colors">
          <i class="bi bi-envelope-at w-5 h-5 text-yellow-400"></i>
          <span>Add Email</span>
        </button>
        <button (click)="addEntityClicked.emit('domain')" class="w-full flex items-center gap-3 p-3 text-sm text-left font-medium text-slate-300 rounded-lg bg-slate-800/50 hover:bg-slate-700/50 border border-slate-700 transition-colors">
          <i class="bi bi-globe w-5 h-5 text-sky-400"></i>
          <span>Add Domain</span>
        </button>
      </div>

      <!-- Collapsed Content -->
      <div class="absolute inset-0 flex flex-col items-center py-4 gap-4 transition-opacity duration-150"
           [class.opacity-100]="isCollapsed()"
           [class.opacity-0]="!isCollapsed()"
           [class.pointer-events-none]="!isCollapsed()"
           [class.delay-150]="isCollapsed()">
        <button (click)="addEntityClicked.emit('wallet')" class="p-3 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white" title="Add Wallet">
            <i class="bi bi-wallet2 text-2xl text-green-400"></i>
        </button>
        <button (click)="addEntityClicked.emit('email')" class="p-3 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white" title="Add Email">
            <i class="bi bi-envelope-at text-2xl text-yellow-400"></i>
        </button>
        <button (click)="addEntityClicked.emit('domain')" class="p-3 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white" title="Add Domain">
            <i class="bi bi-globe text-2xl text-sky-400"></i>
        </button>
      </div>
    </div>
 </div>
