<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm animate-fade-in" (click)="close.emit()">
    <div class="bg-slate-800 rounded-lg border border-slate-700 shadow-2xl w-full max-w-sm animate-fade-in-scale overflow-hidden" (click)="$event.stopPropagation()">
        <div>
            <div class="p-3 flex justify-between items-start border-b border-slate-700 bg-slate-900 rounded-t-lg">
                <div class="flex items-start gap-3">
                    <i [class]="getIconForEntityType(data()!.type) + ' text-2xl w-8 text-center'"></i>
                    <div>
                        <h3 class="text-lg font-semibold leading-6 text-white">{{ getModalTitle() }}</h3>
                        <p class="text-sm text-slate-400 mt-1">{{ data()?.mode === 'edit' ? 'Update existing entity details.' : 'Enter the details for the new entity.' }}</p>
                    </div>
                </div>
                <button (click)="close.emit()" type="button" class="h-8 w-8 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-700 hover:text-white transition-colors">
                    <i class="bi bi-x-lg text-lg"></i>
                </button>
            </div>

            <div class="p-5">
                <label for="entityValue" class="block text-sm font-medium leading-6 text-slate-300">{{ data()?.type | titlecase }} Value</label>
                <div class="mt-2">
                    <input type="text" id="entityValue" name="entityValue" autocomplete="off" [placeholder]="'Enter ' + (data()?.type | titlecase)" [value]="entityValue()" (input)="onEntityValueChange($event)" (keyup.enter)="confirm()" [class]="'block w-full rounded-md border-0 py-1.5 px-3 text-white shadow-sm ring-1 ring-inset placeholder:text-slate-400 focus:outline-none sm:text-sm sm:leading-6 ' + ((isTouched() && validationError()) ? 'bg-red-950/30 ring-red-500/60' : 'bg-slate-900/50 ring-slate-700')">
                </div>
                <p *ngIf="isTouched() && validationError()" class="mt-2 text-xs text-red-400">{{ validationError() }}</p>

                <label for="entityLabel" class="block text-sm font-medium leading-6 text-slate-300 mt-4">Label (Optional)</label>
                <div class="mt-2">
                    <input type="text" id="entityLabel" name="entityLabel" autocomplete="off" placeholder="Shown on graph and lists" [value]="entityLabel()" (input)="onEntityLabelChange($event)" (keyup.enter)="confirm()" class="block w-full rounded-md border-0 py-1.5 px-3 text-white shadow-sm ring-1 ring-inset bg-slate-900/50 ring-slate-700 placeholder:text-slate-400 focus:outline-none sm:text-sm sm:leading-6">
                </div>
                <p class="mt-1 text-xs text-slate-500">If left empty, value will be used as label.</p>
            </div>

            <div class="p-4 bg-slate-900 border-t border-slate-700 flex justify-end gap-3 rounded-b-lg">
                <button (click)="close.emit()" type="button" class="px-4 py-2 text-sm font-medium text-slate-300 bg-slate-700 rounded-md hover:bg-slate-600 transition-colors">
                    Cancel
                </button>
                <button type="button" (click)="confirm()" [disabled]="!isValidInput()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 transition-colors disabled:bg-slate-600 disabled:cursor-not-allowed">
                    {{ getSubmitLabel() }}
                </button>
            </div>
        </div>
    </div>
</div>
