<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm animate-fade-in" (click)="onClose()">
  <div class="bg-slate-800 rounded-lg border border-slate-700 shadow-2xl w-full max-w-4xl h-[90vh] animate-fade-in-scale flex flex-col"
       (click)="$event.stopPropagation()">
    
    <div class="p-4 flex justify-between items-center border-b border-slate-700 flex-shrink-0">
      <div>
        <h3 class="text-lg font-semibold leading-6 text-white">Image Results for <span class="text-indigo-400">{{ username() }}</span></h3>
        <p class="text-sm text-slate-400 mt-1">{{ images().length }} images found.</p>
      </div>
       <button (click)="onClose()" type="button" class="p-1 rounded-full text-slate-400 hover:bg-slate-700 hover:text-white transition-colors">
        <i class="bi bi-x-lg w-6 h-6"></i>
       </button>
    </div>
    
    <div class="p-4 overflow-y-auto">
      <div *ngIf="images().length > 0; else noImages" 
           class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <div *ngFor="let image of images()" class="group relative rounded-lg overflow-hidden border-2 border-slate-700 hover:border-indigo-500 transition-colors">
          <a [href]="image.image_url" target="_blank" rel="noopener noreferrer">
            <img [src]="image.thumbnail" [alt]="image.title" class="w-full h-48 object-cover transition-transform duration-300 group-hover:scale-105">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
            <div class="absolute bottom-0 left-0 p-3">
              <h4 class="text-xs font-semibold text-white truncate group-hover:whitespace-normal group-hover:text-indigo-300">{{ image.title }}</h4>
              <p class="text-xs text-slate-400">{{ image.source }}</p>
            </div>
          </a>
        </div>
      </div>
      <ng-template #noImages>
        <div class="flex items-center justify-center h-full text-slate-500">
          <p>No images found.</p>
        </div>
      </ng-template>
    </div>

  </div>
</div>
