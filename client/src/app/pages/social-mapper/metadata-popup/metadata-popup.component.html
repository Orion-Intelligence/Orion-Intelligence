
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm animate-fade-in" (click)="onClose()">
  <div class="bg-slate-800 rounded-lg border border-slate-700 shadow-2xl w-full max-w-md animate-fade-in-scale flex flex-col"
       (click)="$event.stopPropagation()" style="max-height: 90vh;">

    <div class="p-5 relative flex-shrink-0">
      <div class="flex items-start gap-4">
        <img [src]="'https://logo.clearbit.com/' + data().url.split('/')[2]" class="object-contain rounded-full bg-white p-2" [alt]="data().platform + ' logo'" style="width: 5rem; height: 5rem;"/>
        <div class="flex-grow">
          <h3 class="text-2xl font-bold text-slate-100">{{ data().platform }}</h3>
          <p class="font-mono text-sm text-indigo-400">{{ data().username }}</p>
        </div>
      </div>

      <p *ngIf="data().description" class="text-slate-400 mt-3 text-sm">{{ data().description }}</p>

      <div class="flex items-center gap-4 text-slate-400 text-sm mt-4">
        <div *ngIf="data().joiningDate" class="flex items-center gap-2">
          <i class="bi bi-calendar3"></i>
          <span>Joined {{ data().joiningDate }}</span>
        </div>
        <div *ngIf="data().followers !== undefined" class="flex items-center gap-2">
          <i class="bi bi-people"></i>
          <strong class="text-slate-200">{{ formatFollowers(data().followers) }}</strong> followers
        </div>
      </div>
    </div>

    <div class="px-5 pb-4 overflow-y-auto">
      <h4 class="text-sm font-semibold text-slate-400 border-b border-slate-700 pb-2 mb-3">All Available Data</h4>
      <dl class="text-sm">
        <div *ngFor="let item of getMetadataEntries()" class="grid grid-cols-3 gap-4 py-2 border-b border-slate-700/50">
          <dt class="font-medium text-slate-400 truncate">{{ formatKey(item.key) }}</dt>
          <dd class="col-span-2 text-slate-200 break-words">
            <ng-container *ngIf="isImageUrl(item.value)">
              <img [src]="item.value" class="rounded-lg max-w-full h-auto max-h-40" [alt]="item.key"/>
            </ng-container>
            <ng-container *ngIf="isUrl(item.value) && !isImageUrl(item.value)">
              <a [href]="item.value" target="_blank" rel="noopener noreferrer" class="text-indigo-400 hover:underline">{{ item.value }}</a>
            </ng-container>
             <ng-container *ngIf="!isUrl(item.value)">
              {{ item.value }}
            </ng-container>
          </dd>
        </div>
      </dl>
    </div>

    <div class="p-4 bg-slate-900/50 flex justify-between items-center gap-4 flex-shrink-0 mt-auto rounded-b-lg border-t border-slate-700">
       <a [href]="data().url" target="_blank" rel="noopener noreferrer" class="font-semibold text-decoration-none flex items-center gap-2 text-sm text-indigo-400 hover:text-indigo-300">
          <span>Visit Profile</span>
          <i class="bi bi-box-arrow-up-right"></i>
       </a>
      <button (click)="onClose()" class="px-3 py-1 text-sm font-medium text-slate-300 bg-slate-700 rounded-md hover:bg-slate-600 transition-colors">
        Done
      </button>
    </div>
  </div>
</div>
