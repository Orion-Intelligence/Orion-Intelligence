<ng-container>
  <span id="top"></span>
  <div class="w-full p-3 md:p-4">
    <div class="ui-page-container w-full max-w-[2400px]">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="ui-page-title">Audit Logs</h1>
          <p class="ui-page-description">Track user and tenant activity across the platform.</p>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" class="ui-btn ui-btn-primary" (click)="exportAuditLogs()">
            <i class="bi bi-download me-2"></i>
            Export
          </button>
          <button type="button" (click)="openSidebar()" class="inline-flex h-10 items-center rounded-md border border-[var(--color-border)] bg-[var(--color-blue-680)] px-3 text-[15px] font-medium text-[var(--color-text1)] transition hover:bg-[var(--color-blue-750)]">
            <img alt="Filter Icon" height="16" ngSrc="assets/images/shared/theme/filter_icon.svg" priority width="16" class="ui-filter-icon">
            <span class="ml-2">Filter</span>
          </button>
          <div
            *ngIf="isFilterOpen$ | async"
            class="fixed inset-0 z-50 bg-[#0b1220]/55 backdrop-blur-[1px]"
            (click)="closeSidebar()"
          ></div>
          <div
            class="ui-filter-drawer fixed right-0 top-0 z-[60] h-screen w-[320px] max-w-[92vw] bg-[#2A5784] shadow-[0_12px_32px_rgba(0,0,0,0.35)] transition-transform duration-200 max-[450px]:w-screen"
            [ngClass]="(isFilterOpen$ | async) ? 'translate-x-0' : 'translate-x-full'"
          >
            <app-filters (filterChanged)="applyFilters($event)" (filterClose)="closeSidebar()"
                         (filterReset)="resetFilters()" [filterModel]="filterModel"
                         [isFilterOpen]="isFilterOpen$ | async"></app-filters>
          </div>
        </div>
      </div>
      <app-auditlog-list [isLoading]="isLoading()"></app-auditlog-list>
    </div>
    <app-pagination (pageChange)="onPageChange($event)" [maxPages]="totalPages"></app-pagination>
  </div>
  <span id="bottom"></span>
</ng-container>
