<span id="top"></span>
<div class="directory">
  <app-toolbar></app-toolbar>
  <div class="directory__container">
    <div class="directory__main-container">
      <div class="directory__upper-heading">
        <div class="directory__pagination-heading ">
          <p class="directory__header">Live Onion Services</p>
        </div>

        <div class="directory-pagination col-4">
          <app-directory-pagination></app-directory-pagination>
        </div>

        <div class="directory__filters-button-div">
          <label class="directory__filters-button" (click)="openSidebar()">
            <img ngSrc="assets/images/shared/filter_icon.svg" alt="Trustly Logo" width="24" height="24" priority="true">
            Filter
          </label>
          <div class="directory__filters-container"
               [class.directory__filters-container-enable]="isFilterOpen$ | async"
               [class.directory__filters-container-disable]="!(isFilterOpen$ | async)">
            <app-filters></app-filters>
          </div>
        </div>
      </div>
      <app-directory-list></app-directory-list>
    </div>
  </div>
</div>

<span id="bottom"></span>

<app-footer></app-footer>
