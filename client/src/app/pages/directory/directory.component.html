<div class="w-full p-3 md:p-4">
  <span id="top"></span>

  <div class="ui-page-container w-full max-w-[2400px]">
    <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
      <div>
        <h1 class="ui-page-title">Directory</h1>
        <p class="ui-page-description">Live onion services and monitoring status.</p>
      </div>

      <button type="button" (click)="openSidebar()" class="ui-btn ui-btn-secondary gap-2">
        <img alt="Filter Icon" height="16" ngSrc="/assets/images/shared/theme/filter_icon.svg" width="16" class="ui-filter-icon">
        Filter
      </button>

      @if (isFilterOpen$ | async) {
        <div class="ui-filter-sidebar-overlay fixed inset-0 z-[1190]" (click)="closeSidebar()"></div>
      }
      <div class="ui-filter-sidebar-panel fixed top-0 z-[1200] h-screen w-[300px] overflow-hidden rounded-tl-[15px] border-l border-l-[#ffffff15] bg-[var(--color-blue-700)] shadow-[0_3px_8px_rgba(0,0,0,0.24)] transition-[right] duration-200 max-[450px]:w-full" [ngClass]="{ 'right-[-300px] max-[450px]:right-[-100vw]': !(isFilterOpen$ | async), 'right-0': (isFilterOpen$ | async) }">
        <app-filters (filterChanged)="applyFilters($event)" (filterClose)="closeSidebar()"
          (filterReset)="resetFilters()" [filterModel]="filterModel"
        [isFilterOpen]="isFilterOpen$ | async"></app-filters>
      </div>
    </div>

    <app-directory-list></app-directory-list>
  </div>

  <app-pagination (pageChange)="onPageChange($event)" [maxPages]="totalPages"></app-pagination>
  <span id="bottom"></span>
</div>
