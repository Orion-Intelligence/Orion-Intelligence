<ng-container *ngIf="showResults && result.length > 0">
  <section (click)="toggleCollapse()" class="rounded-xl border border-slate-700/70 bg-slate-900/85 p-3 text-slate-200 backdrop-blur-sm">
    <header class="flex items-center justify-between text-sm font-semibold text-indigo-300">
      <div class="flex items-center gap-2">
        <img src="/assets/images/shared/theme/info.svg" alt="icon" class="h-4 w-4" appTooltip="View graph listing" />
        <span>Listings</span>
      </div>
      <img [class.rotate-180]="collapseToggle" alt="icon" class="h-4 w-4" src="/assets/images/shared/search_side_dropdown_icon.svg" />
    </header>

    <div (click)="$event.stopPropagation()" [class.hidden]="!collapseToggle" class="mt-3">
      <div class="flex items-center gap-2">
        <input [(ngModel)]="searchText" placeholder="Search..."
          class="w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <button (click)="onSearchClick()" type="button"
          class="h-9 w-9 flex items-center justify-center rounded-md border border-slate-700 bg-slate-800 text-slate-300 transition-colors hover:bg-slate-700 hover:text-white">
          <i class="bi bi-search"></i>
        </button>
      </div>

      <div class="mt-3 max-h-64 space-y-2 overflow-y-auto pr-1">
        <ng-container *ngIf="onSearchClick().length > 0; else noResults">
          <button *ngFor="let doc of onSearchClick()"
            (click)="viewReport(doc.m_document_id, doc.path)"
            type="button"
            class="w-full rounded-lg border border-slate-700/80 bg-slate-800/40 p-2 text-left transition-colors hover:bg-slate-700/60">
            <div class="truncate text-xs text-slate-400">{{ doc.m_document_id }}</div>
            <div class="mt-0.5 text-xs font-semibold text-slate-200">{{ formatPropertyName(doc.property) }}</div>
            <div class="mt-0.5 text-[11px] text-slate-300">Value: {{ doc.value }}</div>
          </button>
        </ng-container>
      </div>

      <ng-template #noResults>
        <div class="text-sm text-slate-500">No results found.</div>
      </ng-template>
      <span *ngIf="copied" class="fixed right-4 top-14 z-[1001] rounded-full bg-emerald-500/90 px-3 py-1 text-xs font-semibold text-white shadow-lg">Copied!</span>
    </div>
  </section>
</ng-container>
