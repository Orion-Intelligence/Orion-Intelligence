<ng-container *ngIf="showResults">
  <br>
  <div class="graph-filters__details graph-pointer cursor-pointer user-select-none" (click)="toggleCollapse()">
    <div class="graph-filters__details-header d-flex justify-content-between align-items-center">
      <span>Listings</span>
      <img src="/assets/images/shared/search_side_dropdown_icon.svg" class="chevron" [class.rotate]="collapseToggle" alt="" />
    </div>
    <div id="detailsCollapse" (click)="$event.stopPropagation()" class="collapse" [class.show]="collapseToggle">
      <br>
      <div class="row filter__input_date-container">
        <div class="col-12">
          <div class="d-flex align-items-center">
            <input class="filter__input filter__input_date text-start justify-content-between align-items-center" placeholder="Search..." [(ngModel)]="searchText" />
            <button class="btn date_picker_button_bg ms-2 filter__input_date-button" type="button" (click)="onSearchClick()">
              <img src="assets/images/shared/magnifyingglasswhite.svg" alt="Search" class="date_picker_button_image" />
            </button>
          </div>
        </div>
      </div>
      <br>

      <ng-container *ngIf="onSearchClick().length > 0; else noResults">
        <ng-container *ngFor="let doc of onSearchClick(); let last = last">
          <div class="doc-item">
            <div class="left" #myBtn (click)="viewReport(doc.m_document_id, doc.path)">
              <div class="doc-id-line">
                <span class="doc-id">{{ doc.m_document_id }}</span>
              </div>
              <div class="doc-title">
                {{ formatPropertyName(doc.property) }}
              </div>
              <div class="doc-cluster">
                Value: {{ doc.value }}
              </div>
            </div>
          </div>
          <div class="divider" *ngIf="!last"></div>
        </ng-container>
      </ng-container>

      <ng-template #noResults>
        <div class="text-muted opacity-70">No results found.</div>
      </ng-template>
      <span *ngIf="copied" class="floating-copied" [style]="{ top: copiedY + 'px', left: copiedX + 'px' }">Copied!</span>
    </div>
  </div>
</ng-container>
