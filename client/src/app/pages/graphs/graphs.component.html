<div #networkContainer class="graph-container d-none d-md-block"></div>

<graph-sidebar class="d-none d-md-block" (filtersApplied)="onSidebarApply($event)"></graph-sidebar>

<app-graph-info class="d-none d-md-block" (physicsToggled)="onPhysicsToggled($event)" (onResetAll)="onResetAll()" (ruleSetChange)="ruleSetChange($event)" [(ruleSet)]="ruleSet"
  (expandToggled)="onExpandToggled($event)" [selectedType]="selectedType" [singleInput]="singleInput"
  [propertyType]="propertyType" [physicsEnabled]=physicsEnabled [propertyValue]="propertyValue" [nodeSet]="nodeSet"
  [rawEdges]="rawEdges" [result]="resultReference">
</app-graph-info>


<div id="customContextMenu" class="context-menu">
  <button class="dropdown-item button-content" (click)="expandGroupNode()">
    <img src="assets/images/shared/expand.svg" width="15" height="15" style="margin-right: 8px;" alt="">
    Expand</button>

  <hr class="dropdown-divider mx-3">

  <button class="dropdown-item button-content" (click)="collapseGroupNode()">
    <img src="assets/images/shared/collapse.svg" width="15" height="15" style="margin-right: 8px;" alt="">
    Collapse</button>
  <hr class="dropdown-divider mx-3">

  <button class="dropdown-item button-content" (click)="openCTI()">
    <img src="assets/images/shared/share-black.svg" width="15" height="15" style="margin-right: 8px;"
      class="share-wrapper" alt="">
    Open CTI
  </button>
  <hr class="dropdown-divider mx-3">
  <button class="dropdown-item button-content" (click)="copyNodeLabel($event)">
    <img src="assets/images/shared/label.svg" width="15" height="15" style="margin-right: 8px;"
      class="share-wrapper" alt="">
    Copy Label
  </button>
  <hr class="dropdown-divider mx-3">
  <button class="dropdown-item button-content" (click)="viewReport()">
    <img src="assets/images/shared/redirect-black.svg" width="15" height="15" style="margin-right: 8px;"
      class="share-wrapper" alt="">
    Open Report
  </button>

</div>
<span *ngIf="copied" class="floating-copied " [style]="{ top: copiedY + 'px', left: copiedX + 'px' }">Copied!</span>


<div class="graph-notification" *ngIf="limitReached">
  <div class="default-notification-banner default-notification-banner-cti">
    <span>
      <img src="assets/images/shared/hint.svg" class="default-notification-banner-icon" alt="Info Icon">
      <span>
        You can see 200 nodes at a time, results containing more than 200 nodes will scale down;
      </span>

    </span>
  </div>
</div>

<div *ngIf="this.isEmpty" @fadeInDashboardItem class="graph-container-empty d-none d-md-block">
  <img src="assets/images/shared/cti-empty.svg" alt="No Data" class="img-fluid w-auto" />
</div>

<div class="blocked-media d-block d-md-none text-center p-4">
  <h5 class="mb-3">Mobile Access Not Supported</h5>
  <p class="mb-0">
    This CTI Graph is designed for desktop use only.<br>
    Please switch to a larger screen for the best experience.
  </p>
</div>
