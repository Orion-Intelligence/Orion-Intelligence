@if (isMobile && !isCollapsed) {
  <div class="absolute inset-0 z-30 bg-slate-950/60 backdrop-blur-sm [body.light-theme_&]:bg-[var(--color-blue-850)]/20 md:hidden" (click)="onMobileBackdropClick()"></div>
}

<aside class="relative z-40 h-full border-r border-slate-800 bg-slate-900/90 backdrop-blur-md transition-[width,padding] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-[var(--color-blue-820-light)]" [class.w-[300px]]="!isCollapsed" [class.min-w-[300px]]="!isCollapsed" [class.w-[70px]]="isCollapsed && !isMobile" [class.min-w-[70px]]="isCollapsed && !isMobile" [class.w-[68px]]="isCollapsed && isMobile" [class.min-w-[68px]]="isCollapsed && isMobile">
  <app-graph-sidebar-shell [isCollapsed]="isCollapsed" (toggleClicked)="toggleCollapsed()">
    <form sidebar-expanded class="h-full p-3 flex flex-col gap-3 overflow-y-auto">
      <div class="rounded-lg border border-slate-700 bg-slate-800/50 p-3 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white/90 [body.light-theme_&]:shadow-[0_8px_24px_rgba(15,23,42,0.06)]">
        <label class="text-xs uppercase tracking-wider text-slate-500 [body.light-theme_&]:text-[var(--color-text2)]">{{ 'categoryAlerts.export.type' | translate }}</label>
        <select data-testid="cti-filter-type-select" [(ngModel)]="selectedType" (ngModelChange)="onTypeChange($event)" name="selectedType" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white [body.light-theme_&]:text-[var(--color-text1)]">
          @for (type of graphTypeOptions; track type) {
            <option [ngValue]="type">{{ type | titlecase }}</option>
          }
        </select>
      </div>

      @if (selectedType === 'cluster') {
        <div class="rounded-lg border border-slate-700 bg-slate-800/50 p-3 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white/90 [body.light-theme_&]:shadow-[0_8px_24px_rgba(15,23,42,0.06)]">
          <label class="text-xs uppercase tracking-wider text-slate-500 [body.light-theme_&]:text-[var(--color-text2)]">{{ 'Cluster Type' | translate }}</label>
          <select [(ngModel)]="singleInput" (ngModelChange)="emitDraftFilters()" name="singleInputCluster" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white [body.light-theme_&]:text-[var(--color-text1)]">
            @for (option of graphClusterOptions; track option) {
              <option [ngValue]="option">{{ option | titlecase }}</option>
            }
          </select>
        </div>
      }

      @if (selectedType === 'property') {
        <div class="rounded-lg border border-slate-700 bg-slate-800/50 p-3 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white/90 [body.light-theme_&]:shadow-[0_8px_24px_rgba(15,23,42,0.06)]">
          <label class="text-xs uppercase tracking-wider text-slate-500 [body.light-theme_&]:text-[var(--color-text2)]">{{ 'Property Type' | translate }}</label>
          <select [(ngModel)]="propertyType" (ngModelChange)="emitDraftFilters()" name="propertyType" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white [body.light-theme_&]:text-[var(--color-text1)]">
            <option value="all">{{ 'All' | translate }}</option>
            @for (property of graphAllowedProperties; track property) {
              <option [ngValue]="property.key">{{ property.label }}</option>
            }
          </select>
          <label class="mt-3 block text-xs uppercase tracking-wider text-slate-500 [body.light-theme_&]:text-[var(--color-text2)]">{{ 'Property Value' | translate }}</label>
          <input [(ngModel)]="propertyValue" (ngModelChange)="emitDraftFilters()" name="propertyValue" type="text" [placeholder]="'Enter value' | translate" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white [body.light-theme_&]:text-[var(--color-text1)] [body.light-theme_&]:placeholder:text-[var(--color-text4)]">
        </div>
      }

      @if (selectedType === 'document') {
        <div class="rounded-lg border border-slate-700 bg-slate-800/50 p-3 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white/90 [body.light-theme_&]:shadow-[0_8px_24px_rgba(15,23,42,0.06)]">
          <label class="text-xs uppercase tracking-wider text-slate-500 [body.light-theme_&]:text-[var(--color-text2)]">{{ 'Document ID' | translate }}</label>
          <input [(ngModel)]="singleInput" (ngModelChange)="emitDraftFilters()" name="singleInputDoc" type="text" [placeholder]="'Enter ID' | translate" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white [body.light-theme_&]:text-[var(--color-text1)] [body.light-theme_&]:placeholder:text-[var(--color-text4)]">
        </div>
      }

      <div class="rounded-lg border border-slate-700 bg-slate-800/50 p-3 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white/90 [body.light-theme_&]:shadow-[0_8px_24px_rgba(15,23,42,0.06)]">
        <label class="text-xs uppercase tracking-wider text-slate-500 [body.light-theme_&]:text-[var(--color-text2)]">{{ 'Maximum Nodes (20-800)' | translate }}</label>
        <input (blur)="validateMaxNodes()" [(ngModel)]="maxNodes" (ngModelChange)="emitDraftFilters()" name="maxNodes" type="number" min="20" max="800" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white [body.light-theme_&]:text-[var(--color-text1)]">

        <label class="mt-3 block text-xs uppercase tracking-wider text-slate-500 [body.light-theme_&]:text-[var(--color-text2)]">{{ 'Maximum Depth (1-5)' | translate }}</label>
        <input (blur)="validateMaxDepth()" [(ngModel)]="maxDepth" (ngModelChange)="emitDraftFilters()" name="maxDepth" type="number" min="1" max="5" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-white [body.light-theme_&]:text-[var(--color-text1)]">
      </div>

      <div class="mt-auto flex gap-2">
        <button data-testid="cti-filter-apply" (click)="applyFilters()" type="button" class="flex-1 rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-500">{{ 'common.actions.apply' | translate }}</button>
        <button data-testid="cti-filter-reset" (click)="resetFilters()" type="button" class="flex-1 rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-700 [body.light-theme_&]:border-[var(--color-border)] [body.light-theme_&]:bg-[var(--color-blue-720)] [body.light-theme_&]:text-[var(--color-text2)] [body.light-theme_&]:hover:bg-[var(--color-blue-710)]">{{ 'common.actions.reset' | translate }}</button>
      </div>
    </form>

    <div sidebar-collapsed class="h-full flex flex-col items-center">
      <div class="py-4 flex flex-col items-center gap-4">
        <button (click)="onTypeChange('cluster')" [class]="selectedType === 'cluster' ? 'w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600/90 text-white shadow-lg shadow-indigo-900/30' : 'w-9 h-9 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white [body.light-theme_&]:text-[var(--color-text4)] [body.light-theme_&]:hover:bg-[var(--color-blue-720)] [body.light-theme_&]:hover:text-[var(--color-text1)]'" [title]="'Cluster' | translate">
          <i class="bi bi-diagram-3 text-lg leading-none"></i>
        </button>
        <button (click)="onTypeChange('document')" [class]="selectedType === 'document' ? 'w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600/90 text-white shadow-lg shadow-indigo-900/30' : 'w-9 h-9 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white [body.light-theme_&]:text-[var(--color-text4)] [body.light-theme_&]:hover:bg-[var(--color-blue-720)] [body.light-theme_&]:hover:text-[var(--color-text1)]'" [title]="'Document' | translate">
          <i class="bi bi-file-earmark-text text-lg leading-none"></i>
        </button>
        <button (click)="onTypeChange('property')" [class]="selectedType === 'property' ? 'w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600/90 text-white shadow-lg shadow-indigo-900/30' : 'w-9 h-9 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white [body.light-theme_&]:text-[var(--color-text4)] [body.light-theme_&]:hover:bg-[var(--color-blue-720)] [body.light-theme_&]:hover:text-[var(--color-text1)]'" [title]="'Property' | translate">
          <i class="bi bi-tags text-lg leading-none"></i>
        </button>
        <button (click)="applyFilters()" class="w-9 h-9 flex items-center justify-center rounded-xl text-indigo-300 bg-indigo-500/20 hover:bg-indigo-500/30" [title]="'common.actions.apply' | translate">
          <i class="bi bi-play-fill text-lg leading-none"></i>
        </button>
      </div>
    </div>
  </app-graph-sidebar-shell>
</aside>
