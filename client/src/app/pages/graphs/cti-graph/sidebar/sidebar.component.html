<div *ngIf="isMobile && !isCollapsed" class="absolute inset-0 z-30 bg-slate-950/60 backdrop-blur-sm md:hidden" (click)="onMobileBackdropClick()"></div>

<aside class="relative h-full z-40 border-r border-slate-800 bg-slate-900/90 backdrop-blur-md transition-all duration-300 ease-in-out" [class.w-80]="!isCollapsed" [class.w-20]="isCollapsed && !isMobile" [class.w-16]="isCollapsed && isMobile">
  <app-graph-sidebar-shell [isCollapsed]="isCollapsed" (toggleClicked)="toggleCollapsed()">
    <form sidebar-expanded class="h-full p-3 flex flex-col gap-3 overflow-y-auto">
      <div class="rounded-lg border border-slate-700 bg-slate-800/50 p-3">
        <label class="text-xs uppercase tracking-wider text-slate-500">Type</label>
        <select data-testid="cti-filter-type-select" [(ngModel)]="selectedType" (ngModelChange)="onTypeChange($event)" name="selectedType" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option *ngFor="let type of graphTypeOptions" [ngValue]="type">{{ type | titlecase }}</option>
        </select>
      </div>

      <div *ngIf="selectedType === 'cluster'" class="rounded-lg border border-slate-700 bg-slate-800/50 p-3">
        <label class="text-xs uppercase tracking-wider text-slate-500">Cluster Type</label>
        <select [(ngModel)]="singleInput" name="singleInputCluster" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option *ngFor="let option of graphClusterOptions" [ngValue]="option">{{ option | titlecase }}</option>
        </select>
      </div>

      <div *ngIf="selectedType === 'property'" class="rounded-lg border border-slate-700 bg-slate-800/50 p-3">
        <label class="text-xs uppercase tracking-wider text-slate-500">Property Type</label>
        <select [(ngModel)]="propertyType" name="propertyType" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">All</option>
          <option *ngFor="let property of graphAllowedProperties" [ngValue]="property.key">{{ property.label }}</option>
        </select>

        <label class="mt-3 block text-xs uppercase tracking-wider text-slate-500">Property Value</label>
        <input [(ngModel)]="propertyValue" name="propertyValue" type="text" placeholder="Enter value" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div *ngIf="selectedType === 'document'" class="rounded-lg border border-slate-700 bg-slate-800/50 p-3">
        <label class="text-xs uppercase tracking-wider text-slate-500">Document ID</label>
        <input [(ngModel)]="singleInput" name="singleInputDoc" type="text" placeholder="Enter ID" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="rounded-lg border border-slate-700 bg-slate-800/50 p-3">
        <label class="text-xs uppercase tracking-wider text-slate-500">Maximum Nodes (20-800)</label>
        <input (blur)="validateMaxNodes()" [(ngModel)]="maxNodes" name="maxNodes" type="number" min="20" max="800" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <label class="mt-3 block text-xs uppercase tracking-wider text-slate-500">Maximum Depth (1-5)</label>
        <input (blur)="validateMaxDepth()" [(ngModel)]="maxDepth" name="maxDepth" type="number" min="1" max="5" class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="mt-auto flex gap-2">
        <button data-testid="cti-filter-apply" (click)="applyFilters()" type="button" class="flex-1 rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-500">Apply</button>
        <button data-testid="cti-filter-reset" (click)="resetFilters()" type="button" class="flex-1 rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-700">Reset</button>
      </div>
    </form>

    <div sidebar-collapsed class="h-full flex flex-col items-center">
      <div class="py-4 flex flex-col items-center gap-4">
        <button (click)="onTypeChange('cluster')" [class]="selectedType === 'cluster' ? 'w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600/90 text-white shadow-lg shadow-indigo-900/30' : 'w-9 h-9 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white'" title="Cluster">
          <i class="bi bi-diagram-3 text-lg leading-none"></i>
        </button>
        <button (click)="onTypeChange('document')" [class]="selectedType === 'document' ? 'w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600/90 text-white shadow-lg shadow-indigo-900/30' : 'w-9 h-9 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white'" title="Document">
          <i class="bi bi-file-earmark-text text-lg leading-none"></i>
        </button>
        <button (click)="onTypeChange('property')" [class]="selectedType === 'property' ? 'w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600/90 text-white shadow-lg shadow-indigo-900/30' : 'w-9 h-9 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white'" title="Property">
          <i class="bi bi-tags text-lg leading-none"></i>
        </button>
        <button (click)="applyFilters()" class="w-9 h-9 flex items-center justify-center rounded-xl text-indigo-300 bg-indigo-500/20 hover:bg-indigo-500/30" title="Apply">
          <i class="bi bi-play-fill text-lg leading-none"></i>
        </button>
      </div>
    </div>
  </app-graph-sidebar-shell>
</aside>
