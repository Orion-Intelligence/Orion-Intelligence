<button data-testid="cti-expand-groups-toggle" type="button" [attr.aria-label]="(isExpanded() ? 'Collapse Groups' : 'Expand Groups') | translate" [title]="(isExpanded() ? 'Collapse Groups' : 'Expand Groups') | translate" (click)="toggled.emit(undefined)" class="cti-toolbar-action cti-toolbar-action--icon inline-flex h-10 w-10 shrink-0 items-center justify-center border-0 p-[5px] text-xs transition-colors duration-300">
  <i [class]="'bi ' + (isExpanded() ? 'bi-arrows-angle-contract' : 'bi-arrows-angle-expand')"></i>
</button>
