<button type="button" [title]="isExpanded() ? 'Collapse Groups' : 'Expand Groups'" (click)="toggled.emit()" class="absolute top-0 left-0 w-10 h-10 flex items-center justify-center rounded-full bg-slate-800/85 text-slate-300 shadow-lg ring-1 ring-inset ring-slate-700/60 hover:bg-slate-700/90 hover:text-white transition-all duration-300 ease-out opacity-100 scale-100">
  <i [class]="'bi ' + (isExpanded() ? 'bi-arrows-collapse' : 'bi-arrows-expand')"></i>
</button>
