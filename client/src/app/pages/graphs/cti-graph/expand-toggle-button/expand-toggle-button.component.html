<button data-testid="cti-expand-groups-toggle" type="button" [title]="isExpanded() ? 'Collapse Groups' : 'Expand Groups'" (click)="toggled.emit(undefined)" class="absolute left-0 top-0 flex h-10 w-10 scale-100 items-center justify-center rounded-full bg-[var(--color-blue-800)]/90 text-[var(--color-text2)] shadow-lg ring-1 ring-inset ring-[var(--color-border)] transition-all duration-300 ease-out opacity-100 hover:bg-[var(--color-blue-720)] hover:text-[var(--color-text1)]">
  <i [class]="'bi ' + (isExpanded() ? 'bi-arrows-collapse' : 'bi-arrows-expand')"></i>
</button>
