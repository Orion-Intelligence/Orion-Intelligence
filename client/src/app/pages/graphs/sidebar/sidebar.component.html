<div
  *ngIf="isMobile && !isCollapsed"
  class="fixed inset-x-0 bottom-0 top-12 z-30 bg-slate-950/60 backdrop-blur-sm md:hidden"
  (click)="onMobileBackdropClick()">
</div>

<aside class="fixed bottom-0 left-0 top-12 z-40 border-r border-slate-800 bg-slate-900/90 backdrop-blur-md transition-all duration-300 ease-in-out"
  [class.w-80]="!isCollapsed"
  [class.w-20]="isCollapsed && !isMobile"
  [class.w-16]="isCollapsed && isMobile">
  <div class="h-full w-full flex flex-col transition-all duration-300 ease-in-out">
    <div class="p-3 border-b border-slate-800 flex items-center shrink-0"
      [class.gap-3]="!isCollapsed"
      [class.justify-between]="!isCollapsed"
      [class.justify-center]="isCollapsed">
      <a href="/" title="Orion Intelligence Home"
        class="hidden lg:flex items-center overflow-hidden transition-all duration-300"
        [class.flex-grow]="!isCollapsed"
        [class.w-0]="isCollapsed"
        [class.opacity-0]="isCollapsed"
        [class.pointer-events-none]="isCollapsed">
        <img [src]="appService.getConfig().appSettings.logo_wide_dark" alt="Orion Intelligence" class="h-8 object-contain">
      </a>
      <button (click)="toggleCollapsed()"
        [class]="isCollapsed ? 'w-10 h-10 flex items-center justify-center rounded-xl bg-indigo-500/20 text-indigo-300 ring-1 ring-indigo-400/50 transition-colors' : 'w-10 h-10 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white transition-colors active:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500'">
        <i class="bi bi-list text-xl leading-none"></i>
      </button>
    </div>

    <div class="relative flex-grow overflow-hidden">
      <form class="absolute top-0 left-0 h-full w-80 p-3 flex flex-col gap-3 overflow-y-auto transition-all duration-300 ease-out"
        [class.opacity-100]="!isCollapsed"
        [class.opacity-0]="isCollapsed"
        [class.translate-x-0]="!isCollapsed"
        [class.-translate-x-3]="isCollapsed"
        [class.pointer-events-none]="isCollapsed">
        <div class="rounded-lg border border-slate-700 bg-slate-800/50 p-3">
          <label class="text-xs uppercase tracking-wider text-slate-500">Type</label>
          <select [(ngModel)]="selectedType" (ngModelChange)="onTypeChange($event)" name="selectedType"
            class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option *ngFor="let type of graphTypeOptions" [ngValue]="type">{{ type | titlecase }}</option>
          </select>
        </div>

        <div *ngIf="selectedType === 'cluster'" class="rounded-lg border border-slate-700 bg-slate-800/50 p-3">
          <label class="text-xs uppercase tracking-wider text-slate-500">Cluster Type</label>
          <select [(ngModel)]="singleInput" name="singleInputCluster"
            class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option *ngFor="let option of graphClusterOptions" [ngValue]="option">{{ option | titlecase }}</option>
          </select>
        </div>

        <div *ngIf="selectedType === 'property'" class="rounded-lg border border-slate-700 bg-slate-800/50 p-3">
          <label class="text-xs uppercase tracking-wider text-slate-500">Property Type</label>
          <select [(ngModel)]="propertyType" name="propertyType"
            class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="all">All</option>
            <option *ngFor="let property of graphAllowedProperties" [ngValue]="property.key">{{ property.label }}</option>
          </select>

          <label class="mt-3 block text-xs uppercase tracking-wider text-slate-500">Property Value</label>
          <input [(ngModel)]="propertyValue" name="propertyValue" type="text" placeholder="Enter value"
            class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div *ngIf="selectedType === 'document'" class="rounded-lg border border-slate-700 bg-slate-800/50 p-3">
          <label class="text-xs uppercase tracking-wider text-slate-500">Document ID</label>
          <input [(ngModel)]="singleInput" name="singleInputDoc" type="text" placeholder="Enter ID"
            class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="rounded-lg border border-slate-700 bg-slate-800/50 p-3">
          <label class="text-xs uppercase tracking-wider text-slate-500">Maximum Nodes (20-800)</label>
          <input (blur)="validateMaxNodes()" [(ngModel)]="maxNodes" name="maxNodes" type="number" min="20" max="800"
            class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">

          <label class="mt-3 block text-xs uppercase tracking-wider text-slate-500">Maximum Depth (1-5)</label>
          <input (blur)="validateMaxDepth()" [(ngModel)]="maxDepth" name="maxDepth" type="number" min="1" max="5"
            class="mt-2 w-full rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="mt-auto flex gap-2">
          <button (click)="applyFilters()" type="button"
            class="flex-1 rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-500">
            Apply
          </button>
          <button (click)="resetFilters()" type="button"
            class="flex-1 rounded-md border border-slate-700 bg-slate-800 px-3 py-2 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-700">
            Reset
          </button>
        </div>
      </form>

      <div class="absolute top-0 left-0 h-full w-20 flex flex-col items-center transition-all duration-300 ease-in"
        [class.opacity-100]="isCollapsed"
        [class.opacity-0]="!isCollapsed"
        [class.translate-x-0]="isCollapsed"
        [class.translate-x-2]="!isCollapsed"
        [class.pointer-events-none]="!isCollapsed">
        <div class="py-4 flex flex-col items-center gap-4">
          <button (click)="onTypeChange('cluster')" [class]="selectedType === 'cluster' ? 'w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600/90 text-white shadow-lg shadow-indigo-900/30' : 'w-9 h-9 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white'" title="Cluster">
            <i class="bi bi-diagram-3 text-lg leading-none"></i>
          </button>
          <button (click)="onTypeChange('document')" [class]="selectedType === 'document' ? 'w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600/90 text-white shadow-lg shadow-indigo-900/30' : 'w-9 h-9 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white'" title="Document">
            <i class="bi bi-file-earmark-text text-lg leading-none"></i>
          </button>
          <button (click)="onTypeChange('property')" [class]="selectedType === 'property' ? 'w-9 h-9 flex items-center justify-center rounded-xl bg-indigo-600/90 text-white shadow-lg shadow-indigo-900/30' : 'w-9 h-9 flex items-center justify-center rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white'" title="Property">
            <i class="bi bi-tags text-lg leading-none"></i>
          </button>
          <button (click)="applyFilters()" class="w-9 h-9 flex items-center justify-center rounded-xl text-indigo-300 bg-indigo-500/20 hover:bg-indigo-500/30" title="Apply">
            <i class="bi bi-play-fill text-lg leading-none"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</aside>
