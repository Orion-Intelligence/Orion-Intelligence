<div data-testid="add-entity-modal-overlay" class="ui-graph-popup-overlay fixed inset-0 z-50 flex items-center justify-center" (click)="close.emit()">
  <div data-testid="add-entity-modal" class="ui-graph-popup-panel w-full max-w-sm overflow-hidden rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-800)] shadow-2xl" (click)="$event.stopPropagation()">
    <div>
      <div class="flex items-start justify-between border-b border-[var(--color-border)] bg-[var(--color-blue-850)] p-3 rounded-t-lg">
        <div class="flex items-start gap-3">
          <i [class]="getIconForEntityType(data()!.type) + ' text-2xl w-8 text-center'"></i>
          <div>
            <h3 class="text-lg font-semibold leading-6 text-[var(--color-text1)]">{{ getModalTitle() }}</h3>
            <p class="mt-1 text-sm text-[var(--color-text4)]">{{ data()?.mode === 'edit' ? 'Update existing entity details.' : 'Enter the details for the new entity.' }}</p>
          </div>
        </div>
        <button (click)="close.emit()" type="button" class="flex h-8 w-8 items-center justify-center rounded-full text-[var(--color-text4)] transition-colors hover:bg-[var(--color-blue-720)] hover:text-[var(--color-text1)]">
          <i class="bi bi-x-lg text-lg"></i>
        </button>
      </div>

      <div class="p-5">
        @if (data()?.mode !== 'edit') {
          <div class="mb-4 flex items-center gap-2 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-850)] p-1">
            <button data-testid="add-entity-mode-api" type="button" (click)="setInputMode('api')" [ngClass]="inputMode() === 'api' ? 'bg-[var(--color-blue-700)] text-[var(--color-text1)]' : 'text-[var(--color-text4)]'" class="flex-1 rounded-md px-3 py-2 text-xs font-semibold transition-colors">From API</button>
            <button data-testid="add-entity-mode-manual" type="button" (click)="setInputMode('manual')" [ngClass]="inputMode() === 'manual' ? 'bg-[var(--color-blue-700)] text-[var(--color-text1)]' : 'text-[var(--color-text4)]'" class="flex-1 rounded-md px-3 py-2 text-xs font-semibold transition-colors">Manual</button>
          </div>
        }

        @if (inputMode() === 'manual') {
          <div>
            <label for="entityValue" class="block text-sm font-medium leading-6 text-[var(--color-text2)]">{{ data()?.type | titlecase }} Value</label>
            <div class="mt-2">
              <input data-cy="add-entity-value-input" data-testid="add-entity-value-input" type="text" id="entityValue" name="entityValue" autocomplete="off" [placeholder]="'Enter ' + (data()?.type | titlecase)" [value]="entityValue()" (input)="onEntityValueChange($event)" (keyup.enter)="confirm()" [class]="'block w-full rounded-md border-0 py-1.5 px-3 text-[var(--color-text1)] shadow-sm ring-1 ring-inset placeholder:text-[var(--color-text4)] focus:outline-none sm:text-sm sm:leading-6 ' + ((isTouched() && validationError()) ? 'bg-red-950/30 ring-red-500/60' : 'bg-[var(--color-blue-700)] ring-[var(--color-border)]')">
            </div>
          </div>
        } @else {
          <label for="apiQuery" class="block text-sm font-medium leading-6 text-[var(--color-text2)]">{{ data()?.type | titlecase }} Value</label>
          <div class="mt-2">
            <input data-cy="add-entity-api-query-input" data-testid="add-entity-api-query-input" type="text" id="apiQuery" name="apiQuery" autocomplete="off" [placeholder]="'Enter ' + (data()?.type | titlecase)" [value]="apiQuery()" (input)="onApiQueryChange($event)" (keyup.enter)="confirm()" [class]="'block w-full rounded-md border-0 py-1.5 px-3 text-[var(--color-text1)] shadow-sm ring-1 ring-inset placeholder:text-[var(--color-text4)] focus:outline-none sm:text-sm sm:leading-6 ' + ((isTouched() && validationError()) ? 'bg-red-950/30 ring-red-500/60' : 'bg-[var(--color-blue-700)] ring-[var(--color-border)]')">
          </div>
        }


        @if (isTouched() && validationError()) {
          <p class="mt-2 text-xs text-red-400">{{ validationError() }}</p>
        }

        <label for="entityLabel" class="mt-4 block text-sm font-medium leading-6 text-[var(--color-text2)]">Label (Optional)</label>
        <div class="mt-2">
          <input data-cy="add-entity-label-input" type="text" id="entityLabel" name="entityLabel" autocomplete="off" placeholder="Shown on graph and lists" [value]="entityLabel()" (input)="onEntityLabelChange($event)" (keyup.enter)="confirm()" class="block w-full rounded-md border-0 bg-[var(--color-blue-700)] px-3 py-1.5 text-[var(--color-text1)] shadow-sm ring-1 ring-inset ring-[var(--color-border)] placeholder:text-[var(--color-text4)] focus:outline-none sm:text-sm sm:leading-6">
        </div>
      </div>

      <div class="flex justify-end gap-3 border-t border-[var(--color-border)] bg-[var(--color-blue-850)] p-4 rounded-b-lg">
        <button (click)="close.emit()" type="button" class="rounded-md bg-[var(--color-blue-720)] px-4 py-2 text-sm font-medium text-[var(--color-text2)] transition-colors hover:bg-[var(--color-blue-710)]">
          Cancel
        </button>
        <button data-cy="add-entity-submit" data-testid="add-entity-submit" type="button" (click)="confirm()" [disabled]="!isValidInput()" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-[var(--color-blue-710)] disabled:text-[var(--color-text4)]">
          {{ getSubmitLabel() }}
        </button>
      </div>
    </div>
  </div>
</div>
