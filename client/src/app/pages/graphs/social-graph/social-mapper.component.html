<div data-testid="social-graph-root" class="ui-social-root-bg flex h-[100dvh] min-h-0 w-screen flex-col overflow-hidden text-[var(--color-text2)]">
  @if (isTailwindReady()) {
    @if (tabManager.activeTab()) {
      <main class="relative min-h-0 flex-grow">
        <input data-testid="social-image-file-input" type="file" #imageInput class="hidden" (change)="onImageSelected($event)" accept="image/png, image/jpeg, image/webp, image/gif">
        <div class="flex h-full min-h-0 w-full flex-col overflow-hidden">
          <div class="relative flex min-h-0 flex-grow flex-row">
            <app-home-menu
              class="flex flex-shrink-0 flex-col overflow-hidden border-r border-[#ffffff12] bg-[#172235]"
              [isCollapsed]="effectiveHomeMenuCollapsed()"
              [searchTerm]="homeMenuSearchTerm()"
              [jobs]="jobs()"
              [resultUsernames]="resultUsernames()"
              [isSmallScreen]="isSmallScreen()"
              (toggle)="onHomeMenuToggled()"
              (historyTabClicked)="onHomeMenuHistoryTabClicked()"
              (searchChanged)="onHomeMenuSearchChanged($event)"
              (jobClicked)="handleCompletedJobClick($event)"
              (cancelScan)="cancelScan($event)"
              (cancelAllFetches)="cancelAllFetchesForUser($event)"
              (scanRequested)="triggerScan()"
              (imageUploadRequested)="triggerImageUpload()">
            </app-home-menu>

            @if (!(isSmallScreen() && isMobileHomeMenuOpen())) {
            <main class="ui-social-dashboard-shell relative flex min-h-0 flex-grow flex-col bg-transparent">
              <div class="ui-social-topbar relative z-[1100] flex h-[60px] w-full flex-shrink-0 items-center justify-between overflow-visible border-b border-[var(--color-border)] bg-[var(--color-mono)] p-0">
                <div data-testid="social-header-breadcrumb" class="ml-[10px] flex min-w-0 flex-1 items-center overflow-hidden pr-[20px] pl-3 text-[15px] text-white max-[943px]:ml-0 max-[943px]:pl-3">
                  <img routerLink="/dashboard/home" data-testid="social-header-back" alt="Back" aria-label="Back to homepage" title="Back to homepage" class="ui-breadcrumb-chevron mt-[-1px] mr-[10px] h-[50px] w-[50px] cursor-pointer p-[10px]" height="30" ngSrc="assets/images/shared/theme/arrow.svg" width="30" />
                  <span class="inline-flex min-w-0 items-center font-[Inter,sans-serif] text-[16px] font-medium text-[var(--color-text1)]">
                    <span data-testid="social-header-breadcrumb-root" class="max-w-[180px] overflow-hidden text-ellipsis whitespace-nowrap max-[943px]:max-w-[110px]">Social</span>
                    <img alt="breadcrumb" class="ui-breadcrumb-chevron ml-[5px] mr-[5px] inline-block" height="20" ngSrc="assets/images/shared/theme/nav-next.svg" priority width="20" />
                    <span data-testid="social-header-breadcrumb-current" class="max-w-[240px] overflow-hidden text-ellipsis whitespace-nowrap max-[943px]:max-w-[130px]">Intel</span>
                  </span>
                </div>

                <div class="mr-0 flex shrink-0 items-center">
                  <app-profile></app-profile>
                </div>
              </div>

              <div class="ui-social-dashboard-body ui-dashboard-grid-bg flex min-h-0 flex-1 flex-col overflow-hidden">
                <div class="flex-shrink-0 py-4">
                  <div class="mx-auto w-full max-w-[1480px] px-4">
                  <div data-testid="social-scan-control" class="relative w-full lg:w-full lg:max-w-md">
                    <div class="pointer-events-none absolute inset-y-0 left-0 z-10 flex items-center pl-4">
                      <i class="bi bi-search h-5 w-5 leading-none text-[var(--color-text4)]"></i>
                    </div>
                    <input data-testid="social-scan-input" type="text" placeholder="Search username or handle..." [value]="homeMenuSearchTerm()" (input)="onDashboardScanInput($event)" (keyup.enter)="triggerScan()" (keydown.arrowleft)="$event.stopPropagation()" (keydown.arrowright)="$event.stopPropagation()" (keydown.home)="$event.stopPropagation()" (keydown.end)="$event.stopPropagation()" class="ui-graph-toolbar-input relative z-0 block h-10 w-full rounded-full border-0 bg-[var(--color-blue-800)]/90 pl-11 pr-36 text-[var(--color-text2)] shadow-lg ring-1 ring-inset ring-[var(--color-border)] backdrop-blur-sm placeholder:text-[var(--color-text4)] focus:outline-none focus:ring-2 focus:ring-[var(--color-blue-640)] sm:text-sm sm:leading-6" />
                    <div class="ui-graph-toolbar-action-shell absolute inset-y-1 right-1 flex items-center rounded-full bg-[var(--color-blue-720)]/80 py-1 pl-1 pr-0">
                      <button data-testid="social-image-upload-trigger" type="button" title="Scan by image" aria-label="Scan by image" (click)="$event.stopPropagation(); triggerImageUpload()" class="flex h-8 w-8 items-center justify-center rounded-full text-[var(--color-text2)] transition-colors hover:bg-[var(--color-blue-710)]">
                        <i class="bi bi-image"></i>
                      </button>
                      <button data-testid="social-scan-submit" type="button" (click)="triggerScan()" [disabled]="homeMenuSearchTerm().trim().length === 0" [class.has-value]="!!homeMenuSearchTerm().trim()" class="ui-graph-toolbar-search-btn ml-1 flex h-8 items-center rounded-full bg-[var(--color-blue-640)] px-4 text-sm font-semibold text-white transition-colors hover:bg-[var(--color-blue-630)] disabled:cursor-not-allowed disabled:bg-[var(--color-blue-710)] disabled:text-[var(--color-text4)]">
                        Search
                      </button>
                    </div>
                  </div>
                  </div>
                </div>
                <app-list-view
                  class="block min-h-0 flex-1"
                  [scanResults]="scanResults()"
                  (sidebarPlatformClicked)="onSidebarPlatformClicked($event)"
                  (fetchPostsInline)="handleFetchSocialPosts($event)"
                  (fetchImagesInline)="handleFetchImagesForPlatform($event)"
                  (fetchFollowersInline)="handleFetchFollowers($event)"
                  (fetchFollowingInline)="handleFetchFollowing($event)"
                  (fetchOnlinePresenceInline)="handleFetchOnlinePresence($event)"
                  (fetchStealerLogsInline)="handleFetchStealerLogs($event)"
                  (fetchMetadataInline)="fetchProfileDetails($event)">
                </app-list-view>
              </div>
            </main>
            }
          </div>

          @if (state.notification()) {
            <app-notification-bar [data]="state.notification()"></app-notification-bar>
          }
        </div>
      </main>
    } @else {
      <app-graph-loading
        [title]="'Restoring Social Session'"
        [subtitle]="'Loading saved scan state.'">
      </app-graph-loading>
    }

    @if (state.deleteConfirmationData(); as data) {
      <app-confirmation-popup [message]="data.message" (confirmed)="onDeleteConfirmation($event)"></app-confirmation-popup>
    }
    @if (state.manageProfilesModalData(); as data) {
      <app-manage-profiles-modal
        [data]="data"
        (close)="state.closeManageProfilesModal()"
        (updateGraph)="updateProfilesFromModal($event)"
        (searchUsername)="handleImageFlowSearch($event)">
      </app-manage-profiles-modal>
    }
  } @else {
    <app-graph-loading
      [title]="'Loading Social Intelligence'"
      [subtitle]="'Loading styles.'">
    </app-graph-loading>
  }
</div>
