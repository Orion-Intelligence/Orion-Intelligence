<button data-testid="social-graph-search-trigger" type="button" [title]="'Search on graph' | translate" (click)="triggered.emit(undefined)" class="absolute left-0 top-0 flex h-10 w-10 items-center justify-center rounded-full bg-[var(--color-blue-800)]/90 text-[var(--color-text2)] shadow-lg ring-1 ring-inset ring-[var(--color-border)] transition-all duration-300 ease-out hover:bg-[var(--color-blue-720)] hover:text-[var(--color-text1)]" [class.opacity-100]="!isExpanded()" [class.opacity-0]="isExpanded()" [class.scale-100]="!isExpanded()" [class.scale-90]="isExpanded()" [class.pointer-events-none]="isExpanded()">
  <i class="bi bi-search text-base"></i>
</button>
