<button
  type="button"
  title="Search on graph"
  (click)="triggered.emit()"
  class="absolute top-0 left-0 w-10 h-10 flex items-center justify-center rounded-full bg-slate-800/85 text-slate-300 shadow-lg ring-1 ring-inset ring-slate-700/60 hover:bg-slate-700/90 hover:text-white transition-all duration-300 ease-out"
  [class.opacity-100]="!isExpanded()"
  [class.opacity-0]="isExpanded()"
  [class.scale-100]="!isExpanded()"
  [class.scale-90]="isExpanded()"
  [class.pointer-events-none]="isExpanded()">
  <i class="bi bi-search text-base"></i>
</button>
