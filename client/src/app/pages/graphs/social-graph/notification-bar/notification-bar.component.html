<div class="fixed bottom-5 left-1/2 z-[10000] -translate-x-1/2 animate-[social-mapper-slide-in-up_0.4s_cubic-bezier(0.175,0.885,0.32,1.275)_forwards]">
  @if (data(); as notification) {
    <div class="flex items-center gap-3 text-sm font-medium px-4 py-2 rounded-full shadow-lg backdrop-blur-sm" [ngClass]="notification.style">
      <i class="w-5 h-5" [ngClass]="notification.icon"></i>
      <span>{{ notification.message }}</span>
    </div>
  }
</div>
