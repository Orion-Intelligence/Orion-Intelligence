<div *ngIf="!isSmallScreen()" class="h-full min-h-0 flex flex-col transition-all duration-300 ease-in-out" [class.w-72]="!isCollapsed()" [class.w-14]="isCollapsed()">
  <div class="flex shrink-0 items-center border-b border-[var(--color-border)] p-3" [class.gap-3]="!isCollapsed()" [class.justify-between]="!isCollapsed()" [class.justify-center]="isCollapsed()">
    <div class="overflow-hidden transition-all duration-300" [class.flex-grow]="!isCollapsed()" [class.w-0]="isCollapsed()" [class.opacity-0]="isCollapsed()" [class.pointer-events-none]="isCollapsed()">
      <h2 class="text-md whitespace-nowrap font-semibold text-[var(--color-text2)]">Add Entity</h2>
    </div>
    <button (click)="toggle.emit()" [class]="isCollapsed() ? 'flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-500/20 text-indigo-300 ring-1 ring-indigo-400/50 transition-colors' : 'flex h-10 w-10 items-center justify-center rounded-xl text-[var(--color-text4)] transition-colors hover:text-[var(--color-text1)] active:bg-transparent focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500'">
      <i class="bi bi-list text-xl leading-none"></i>
    </button>
  </div>

  <div class="flex-grow min-h-0 overflow-hidden h-full">
    <div *ngIf="!isCollapsed()" class="h-full min-h-0 w-72 p-3 flex flex-col gap-2 overflow-y-auto transition-all duration-300 ease-out">
      <div class="mb-1">
        <input type="text" [value]="addSearchTerm()" (input)="onAddSearchInput($event)" placeholder="Quick filter add options..." class="block h-9 w-full rounded-md border-0 bg-[var(--color-blue-690)] px-3 text-sm text-[var(--color-text1)] shadow-sm ring-1 ring-inset ring-[var(--color-border)] placeholder:text-[var(--color-text4)] focus:outline-none">
      </div>
      <button [attr.data-testid]="'add-entity-option-' + option.type" *ngFor="let option of filteredEntityAddOptions" (click)="addEntityClicked.emit(option.type)" class="flex w-full items-center gap-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-800)]/85 px-3 py-2 text-left text-sm font-medium text-[var(--color-text2)] transition-colors hover:bg-[var(--color-blue-720)]">
        <i [class]="option.iconClass + ' w-4 h-4'"></i>
        <span>{{ option.label }}</span>
      </button>

      <div class="my-2 h-px bg-[var(--color-border)]"></div>
      <div class="px-1 text-xs uppercase tracking-wider text-[var(--color-text4)]">Saved Entities</div>
      <div *ngIf="customEntities().length === 0" class="px-1 py-1 text-xs text-[var(--color-text4)]">No entities added yet.</div>
      <div *ngFor="let entity of customEntities()" class="w-full rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-800)]/75 p-2">
        <div class="flex items-center justify-between gap-2">
          <button (click)="entityClicked.emit(entity.id)" class="flex min-w-0 flex-grow items-center gap-2 text-left text-sm text-[var(--color-text2)] transition-colors hover:text-[var(--color-text1)]">
            <i [class]="getIconForEntityType(entity.type)"></i>
            <span class="truncate">{{ entity.label }}</span>
            <span class="ml-1 text-[11px] uppercase tracking-wide text-[var(--color-text4)]">{{ entity.type.replace('-', ' ') }}</span>
          </button>
          <button (click)="deleteEntityClicked.emit(entity.id)" title="Delete Entity" class="flex h-7 w-7 items-center justify-center rounded-full text-[var(--color-text4)] transition-colors hover:bg-red-500/20 hover:text-red-400">
            <i class="bi bi-trash3 leading-none block"></i>
          </button>
        </div>
      </div>
    </div>
    <div *ngIf="isCollapsed()" class="h-full w-14 flex flex-col items-center py-4 gap-4 transition-all duration-300 ease-in opacity-100">
      <button [attr.data-testid]="'add-entity-option-' + option.type" *ngFor="let option of entityAddOptions" (click)="addEntityClicked.emit(option.type)" class="rounded-lg p-2 text-[var(--color-text4)] hover:bg-[var(--color-blue-720)] hover:text-[var(--color-text1)]" [title]="option.label">
        <i [class]="option.iconClass + ' text-xl'"></i>
      </button>
    </div>
  </div>
</div>

<div *ngIf="isSmallScreen()">
  <div *ngIf="mobilePanelOpen()" (click)="closeMobilePanel()" class="fixed inset-0 z-30 bg-[var(--color-blue-850)]/60 animate-[social-mapper-fade-in_0.4s_ease-in-out]"></div>

  <aside class="fixed inset-y-0 right-0 z-40 flex w-[28rem] flex-col border-l border-[var(--color-border)] bg-[var(--color-blue-820-light)] transition-transform duration-300 ease-in-out" [class.translate-x-0]="mobilePanelOpen()" [class.translate-x-full]="!mobilePanelOpen()" (click)="$event.stopPropagation()">
    <div class="flex shrink-0 items-center justify-between border-b border-[var(--color-border)] p-3">
      <h2 class="text-md whitespace-nowrap font-semibold text-[var(--color-text2)]">Add Entity</h2>
      <button (click)="closeMobilePanel()" class="flex h-10 w-10 items-center justify-center rounded-full text-[var(--color-text4)] transition-colors hover:bg-[var(--color-blue-720)] hover:text-[var(--color-text1)] active:bg-[var(--color-blue-710)] focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500">
        <i class="bi bi-x-lg text-xl"></i>
      </button>
    </div>
    <div class="p-3 flex flex-col gap-2 overflow-y-auto">
      <div class="mb-1">
        <input type="text" [value]="addSearchTerm()" (input)="onAddSearchInput($event)" placeholder="Quick filter add options..." class="block h-9 w-full rounded-md border-0 bg-[var(--color-blue-690)] px-3 text-sm text-[var(--color-text1)] shadow-sm ring-1 ring-inset ring-[var(--color-border)] placeholder:text-[var(--color-text4)] focus:outline-none">
      </div>
      <button [attr.data-testid]="'add-entity-option-' + option.type" *ngFor="let option of filteredEntityAddOptions" (click)="addEntityClicked.emit(option.type); closeMobilePanel();" class="flex w-full items-center gap-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-800)]/85 p-3 text-left text-sm font-medium text-[var(--color-text2)] transition-colors hover:bg-[var(--color-blue-720)]">
        <i [class]="option.iconClass + ' w-5 h-5'"></i>
        <span>{{ option.label }}</span>
      </button>

      <div class="my-1 h-px bg-[var(--color-border)]"></div>
      <div class="px-1 text-xs uppercase tracking-wider text-[var(--color-text4)]">Saved Entities</div>
      <div *ngIf="customEntities().length === 0" class="px-1 py-1 text-xs text-[var(--color-text4)]">No entities added yet.</div>
      <div *ngFor="let entity of customEntities()" class="w-full rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-800)]/75 p-2">
        <div class="flex items-center justify-between gap-2">
          <button (click)="entityClicked.emit(entity.id); closeMobilePanel();" class="flex min-w-0 flex-grow items-center gap-2 text-left text-sm text-[var(--color-text2)] transition-colors hover:text-[var(--color-text1)]">
            <i [class]="getIconForEntityType(entity.type)"></i>
            <span class="truncate">{{ entity.label }}</span>
            <span class="ml-1 text-[11px] uppercase tracking-wide text-[var(--color-text4)]">{{ entity.type.replace('-', ' ') }}</span>
          </button>
          <button (click)="deleteEntityClicked.emit(entity.id)" title="Delete Entity" class="flex h-7 w-7 items-center justify-center rounded-full text-[var(--color-text4)] transition-colors hover:bg-red-500/20 hover:text-red-400">
            <i class="bi bi-trash3 leading-none block"></i>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <button (click)="toggleMobilePanel($event)" class="fixed bottom-6 right-6 z-20 flex h-14 w-14 items-center justify-center rounded-full bg-indigo-600 text-white shadow-lg transition-transform duration-200 ease-in-out hover:bg-indigo-500 active:scale-95 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-[var(--color-blue-850)]">
    <i class="bi bi-diagram-3-fill text-2xl"></i>
  </button>
</div>
