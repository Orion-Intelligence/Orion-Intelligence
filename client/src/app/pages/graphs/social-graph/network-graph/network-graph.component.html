<div class="w-full h-full relative">
  <button *ngIf="deleteButtonState().visible" (click)="deleteEdge(deleteButtonState().edgeId!)" (mouseenter)="cancelHideDeleteButton()" (mouseleave)="hideDeleteButton()" class="network-graph-delete-edge-button z-10 flex items-center justify-center w-6 h-6 rounded-full bg-red-600 text-white shadow-lg hover:bg-red-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-red-500" title="Remove connection">
    <i class="bi bi-x-lg text-sm font-bold"></i>
  </button>
  <div class="absolute inset-0 z-10 pointer-events-none">
    <ng-container *ngIf="iconOverlayNodes().length > 0">
      <button *ngFor="let overlay of iconOverlayNodes(); trackBy: trackByOverlayNodeId" type="button" class="network-graph-followers-overlay pointer-events-auto" [style.left.px]="overlay.x" [style.top.px]="overlay.y" [style.width.px]="overlay.size" [style.height.px]="overlay.size" (click)="onFollowersShortcutClick($event, overlay.nodeId)">
        <svg viewBox="0 0 16 16" class="network-graph-followers-overlay-svg" [style.width.px]="overlay.size * 0.6" [style.height.px]="overlay.size * 0.6" aria-hidden="true">
          <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1H7z"></path>
          <path d="M4.5 8a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM12.5 8a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path>
        </svg>
      </button>
    </ng-container>
  </div>
  <div #networkContainer class="w-full h-full absolute top-0 left-0"></div>
</div>
