<div class="rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-820-light)] p-4" [ngClass]="isEditing ? 'ring-2 ring-sky-400/20 border-sky-400/35' : ''">
  <div class="ui-section-title">Network Configuration</div>
  <div class="ui-section-description">Mail delivery settings.</div>
  <div class="mt-3 grid grid-cols-1 gap-3 lg:grid-cols-2">
    <div>
      <label class="mb-1 flex items-center gap-1 text-xs font-semibold uppercase tracking-wide text-[var(--color-text6)]">
        ACCOUNT MAIL
        @if (isEditing) {
          <img src="assets/images/shared/edit.svg" width="11" alt="editable" class="opacity-70" />
        }
      </label>
      <input class="h-10 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 text-sm font-medium text-[var(--color-text1)] outline-none placeholder:text-[var(--color-text4)] focus:border-sky-400/35 focus:ring-2 focus:ring-sky-400/20 disabled:cursor-not-allowed disabled:opacity-80" type="text" [(ngModel)]="form.accounts_mail" [disabled]="!isEditing" />
    </div>

    <div>
      <label class="mb-1 flex items-center gap-1 text-xs font-semibold uppercase tracking-wide text-[var(--color-text6)]">
        ACCOUNT MAIL PASSWORD
        @if (isEditing) {
          <img src="assets/images/shared/edit.svg" width="11" alt="editable" class="opacity-70" />
        }
      </label>
      <div class="relative">
        <input class="!pr-12 h-10 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 text-sm font-medium text-[var(--color-text1)] outline-none placeholder:text-[var(--color-text4)] focus:border-sky-400/35 focus:ring-2 focus:ring-sky-400/20 disabled:cursor-not-allowed disabled:opacity-80" type="password" [(ngModel)]="form.accounts_mail_password" [disabled]="!isEditing" placeholder="test" appPasswordToggle="dark" />
      </div>
    </div>

    <div>
      <label class="mb-1 flex items-center gap-1 text-xs font-semibold uppercase tracking-wide text-[var(--color-text6)]">
        ACCOUNT SMTP SERVER
        @if (isEditing) {
          <img src="assets/images/shared/edit.svg" width="11" alt="editable" class="opacity-70" />
        }
      </label>
      <input class="h-10 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 text-sm font-medium text-[var(--color-text1)] outline-none placeholder:text-[var(--color-text4)] focus:border-sky-400/35 focus:ring-2 focus:ring-sky-400/20 disabled:cursor-not-allowed disabled:opacity-80" type="text" [(ngModel)]="form.accounts_smtp_server" [disabled]="!isEditing" placeholder="mailpit" />
    </div>

    <div>
      <label class="mb-1 flex items-center gap-1 text-xs font-semibold uppercase tracking-wide text-[var(--color-text6)]">
        ACCOUNT SMTP PORT
        @if (isEditing) {
          <img src="assets/images/shared/edit.svg" width="11" alt="editable" class="opacity-70" />
        }
      </label>
      <input class="h-10 w-full rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 text-sm font-medium text-[var(--color-text1)] outline-none placeholder:text-[var(--color-text4)] focus:border-sky-400/35 focus:ring-2 focus:ring-sky-400/20 disabled:cursor-not-allowed disabled:opacity-80" type="text" [(ngModel)]="form.accounts_smtp_port" [disabled]="!isEditing" placeholder="1025" />
    </div>

    <div class="lg:col-span-2 flex flex-wrap items-center gap-3">
      <button type="button" class="inline-flex h-9 items-center justify-center gap-2 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 text-xs font-semibold text-[var(--color-text2)] transition hover:bg-[var(--color-blue-810)] disabled:cursor-not-allowed disabled:opacity-70" [disabled]="isVerifyingMail" (click)="verifyMailConfiguration()">
        @if (isVerifyingMail) {
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-sky-400/25 border-t-sky-400"></span>
        }
        Verify Configuration
      </button>
    </div>

    @if (errorState || verifyError || mailConfigurationStatus) {
      <div class="lg:col-span-2 rounded-[8px] border px-3 py-2 text-sm" [ngClass]="mailConfigurationStatus === 'working' && !errorState && !verifyError ? 'border-emerald-400/30 bg-emerald-400/10 text-emerald-300' : 'border-rose-400/30 bg-rose-400/10 text-rose-300'">
        {{ mailConfigurationStatus === 'working' && !errorState && !verifyError ? 'Mail configuration is working' : 'Mail configuration is not working' }}
      </div>
    }
  </div>
</div>
