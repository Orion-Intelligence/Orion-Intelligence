<li class="sidebar__item">
  <div (click)="selectSection()" [ngClass]="{'active': (selectionStore.selectedSection$ | async) === category}" [routerLink]="routePrefix" appTooltip="{{tooltip}}" class="sidebar__item-dropdown" queryParamsHandling="merge">
    <img [alt]="title" [ngSrc]="icon" appTooltip="{{title}}" class="sidebar__icon" height="20" width="20">
  </div>

  <ul [ngClass]="{'sidebar__subitems-fast': items.length < 4, 'show': (selectionStore.selectedSection$ | async) === category}" class="sidebar__subitems">
    <ng-container *ngFor="let item of items">
      <div (click)="selectOption(item)" [ngClass]="{'sidebar__selected': (selectionStore.selectedOption$ | async | lower) === (item | lower)}" [routerLink]="routePrefix + '/' + item.toLowerCase()" class="sidebar__subitem" queryParamsHandling="merge">
        <div [ngClass]="{'sidebar__subitem-selected': (selectionStore.selectedOption$ | async | lower) === (item | lower)}" appTooltip="{{itemTooltips[item]}}" class="sidebar__subitem-content">
          <img [alt]="item" class="sidebar__icon-min" height="20" ngSrc="assets/images/sidebar/sub_{{item.toLowerCase()}}.svg" width="20">
        </div>
      </div>
    </ng-container>
  </ul>
</li>
