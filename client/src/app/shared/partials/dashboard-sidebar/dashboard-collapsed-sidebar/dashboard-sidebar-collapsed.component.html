<li class="my-[6px] rounded-[8px] select-none">
  <div (click)="selectSection()" [ngClass]="{ 'bg-[var(--color-blue-880)] text-white border border-[rgba(255,255,255,0.06)]': (selectionStore.selectedSection$ | async) === category }" [routerLink]="routePrefix" appTooltip="{{tooltip}}" class="dashboard-collapsed-nav-btn flex h-[46px] w-[54px] shrink-0 items-center justify-center rounded-[8px] border border-transparent p-0 text-[14px] font-medium font-[Inter] text-[#A0B8D1] transition-colors duration-300 cursor-pointer hover:bg-[var(--color-blue-870)] hover:text-white" queryParamsHandling="merge">
    <img [alt]="title" [ngClass]="{ 'dashboard-scanner-collapsed-icon': icon.includes('scanner.svg') }" [ngSrc]="'/' + icon" appTooltip="{{title}}" class="h-[20px] w-[20px] shrink-0 opacity-100" height="20" width="20">
  </div>

  <ul [ngClass]="{ 'opacity-100 max-h-[500px] translate-y-0 mt-[15px] overflow-y-scroll pointer-events-auto': (selectionStore.selectedSection$ | async) === category, 'transition-none': items.length <4 && (selectionStore.selectedSection$ | async) !== category }" class="list-none ml-0 pl-0 border-l-0 opacity-0 max-h-0 -translate-y-2 transition-[opacity,max-height,transform,margin-top] duration-200 ease-out pointer-events-none">
    <ng-container *ngFor="let item of items">
      <div (click)="selectOption(item)" [ngClass]="{ 'border-l-0 text-white font-medium h-[40px]': (selectionStore.selectedOption$ | async | lower) === (item | lower) }" [routerLink]="routePrefix + '/' + item.toLowerCase()" class="mt-[5px] text-[rgba(255,255,255,0.44)] font-[Roboto] cursor-pointer" queryParamsHandling="merge">
        <div [ngClass]="{ 'bg-[var(--color-blue-880)]': (selectionStore.selectedOption$ | async | lower) === (item | lower) }" appTooltip="{{ getItemTooltip(item) }}" class="ml-[5px] flex h-[40px] w-[40px] items-center justify-center rounded-[6px] font-[Inter] hover:bg-[var(--color-blue-880)]">
          <img [alt]="item" class="h-[17px] w-[17px]" height="20" [ngSrc]="'/assets/images/sidebar/sub_' + item.toLowerCase() + '.svg'" width="20">
        </div>
      </div>
    </ng-container>
  </ul>
</li>
