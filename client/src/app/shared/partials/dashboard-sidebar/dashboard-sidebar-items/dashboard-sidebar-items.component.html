<li class="sidebar__item">
  <div class="sidebar__item-dropdown" [ngClass]="{'active': (selectionStore.selectedSection$ | async) === category}"
    (click)="selectSection()" [routerLink]="[routePrefix]" queryParamsHandling="merge" [matTooltip]="tooltip"
    matTooltipPosition="above" matTooltipClass="mat-tooltip">
    <img src="{{icon}}" [alt]="title" height="20" width="20" class="sidebar__icon">
    {{ title }}
    <img class="sidebar__dropdown-icon" ngSrc="../../../../../assets/images/shared/search_side_dropdown_icon.svg"
      alt="Drop Down" height="20" width="20">
  </div>
  <ul class="sidebar__subitems"
    [ngClass]="{'sidebar__subitems-fast': items.length < 4, 'show': (selectionStore.selectedSection$ | async) === category}">
    <li *ngFor="let item of items">
      <div class="sidebar__subitem" (click)="selectOption(item)"
        [ngClass]="{'sidebar__selected': (selectionStore.selectedOption$ | async) === item}"
        [routerLink]="[routePrefix, item.toLowerCase()]" queryParamsHandling="merge">
        <div class="sidebar__subitem-content"
          [ngClass]="{'sidebar__subitem-selected': (selectionStore.selectedOption$ | async) === item}">
          {{ item }}
        </div>
      </div>
    </li>
  </ul>
</li>
