<div class="mt-[12px] overflow-hidden rounded-[10px] border border-[var(--color-divider)] bg-[var(--color-blue-720)] ui-result-card p-[12px] shadow-none">
  <div (click)="toggle()" class="flex cursor-pointer items-start justify-between gap-3">
    <div class="min-w-0">
      <div class="flex items-center gap-2 text-[13px] font-semibold text-[var(--color-text1)]">
        <span class="truncate">Code snippet</span>
        <img src="/assets/images/shared/theme/info.svg" alt="Icon" class="h-4 w-4 shrink-0 ui-action-icon" appTooltip="Shows the original exploit code associated with this report.">
      </div>
      <p class="mt-1 text-[11px] leading-relaxed text-[var(--color-text4)]">Original exploit code associated with this report.</p>
    </div>
    <div [attr.aria-label]="isExpanded ? 'Collapse' : 'Expand'" class="mt-[2px] flex h-7 w-7 shrink-0 items-center justify-center rounded-[7px] border border-[var(--color-border)] bg-[var(--color-blue-790)] ui-result-card-soft transition hover:bg-[var(--color-blue-710)]">
      <img [ngClass]="{ 'rotate-180': !isExpanded }" alt="toggle icon" class="h-[15px] w-[15px] transition ui-action-icon" src="/assets/images/shared/theme/search_side_dropdown_icon_dark.svg">
    </div>
  </div>

  @if (isExpanded) {
    <div class="mt-3 text-xs text-[var(--color-text4)]">
      Shows the original exploit code associated with this report.
    </div>
  }
  @if (isExpanded) {
    <div class="mt-3 max-h-[320px] overflow-auto rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-810)] p-3">
      <code [innerText]="code()" class="block whitespace-pre-wrap text-xs text-[var(--color-text1)]"></code>
    </div>
  }
</div>
