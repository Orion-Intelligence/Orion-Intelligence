<div class="mt-4 mx-[12px] sm:mx-[15px] lg:mx-[30px] overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-700)] ui-result-card bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.014)_0px,rgba(255,255,255,0.014)_1px,transparent_1px,transparent_12px)] p-4 shadow-[0_6px_18px_var(--color-shadow-light)]">
  <div (click)="toggle()" class="flex cursor-pointer items-start justify-between gap-3">
    <div class="min-w-0">
      <div class="flex items-center gap-2 text-sm font-semibold text-[var(--color-text1)]">
        <span class="truncate">Code snippet</span>
        <img src="/assets/images/shared/theme/info.svg" alt="Icon" class="h-5 w-5 shrink-0 ui-action-icon" appTooltip="Shows the original exploit code associated with this report.">
      </div>
      <p class="mt-1 text-[12px] leading-relaxed text-[var(--color-text4)]">Original exploit code associated with this report.</p>
    </div>
    <div [attr.aria-label]="isExpanded ? 'Collapse' : 'Expand'" class="mt-[2px] flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-790)] ui-result-card-soft transition hover:bg-[var(--color-blue-720)]">
      <img [ngClass]="{ 'rotate-180': !isExpanded }" alt="toggle icon" class="h-[18px] w-[18px] transition ui-action-icon" src="/assets/images/shared/theme/search_side_dropdown_icon_dark.svg">
    </div>
  </div>

  @if (isExpanded) {
    <div class="mt-3 text-xs text-[var(--color-text4)]">
      Shows the original exploit code associated with this report.
    </div>
  }
  @if (isExpanded) {
    <div class="mt-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-810)] p-3">
      <code [innerText]="code()" class="block whitespace-pre-wrap text-xs text-[var(--color-text1)]"></code>
    </div>
  }
</div>
