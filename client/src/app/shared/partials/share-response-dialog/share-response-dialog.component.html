@if (visible()) {
  <div class="ui-graph-popup-overlay fixed inset-0 z-[1300] flex items-center justify-center p-4" (click)="close()">
    <section role="dialog" aria-modal="true" aria-labelledby="share-response-dialog-title" class="ui-graph-popup-panel ui-popup-shell w-full max-w-[540px] overflow-hidden rounded-xl border border-[var(--color-border)] shadow-[0_30px_80px_rgba(2,6,23,0.65)]" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between gap-4 border-b border-[var(--color-border)] px-5 py-4">
        <div class="min-w-0">
          <h3 id="share-response-dialog-title" class="ui-popup-title text-[16px] font-semibold">{{ title }}</h3>
          <p class="mt-0.5 text-[12px] leading-5 text-[var(--color-text4)]">{{ description }}</p>
        </div>
        <button type="button" (click)="close()" [appTooltip]="'common.actions.close' | translate" class="ui-popup-close inline-flex h-9 w-9 shrink-0 items-center justify-center text-[18px]" [attr.aria-label]="'common.actions.close' | translate">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="px-5 py-5">
        <div>
          <div class="flex items-center justify-between gap-4">
            <span class="inline-flex min-w-0 items-center gap-2 text-[12px] font-semibold text-[var(--color-text2)]">
              <i class="bi bi-body-text text-[14px] leading-none text-[#A7D5FF]" aria-hidden="true"></i>
              <span>{{ 'Message' | translate }}</span>
              <span class="font-normal tabular-nums text-[var(--color-text5)]">· {{ characterCount }} {{ 'chars' | translate }}</span>
            </span>
            <button type="button" (click)="copyText()" class="ui-ai-action-button inline-flex h-7 shrink-0 items-center gap-1.5 border-0 bg-transparent p-0 text-[11px] font-semibold text-[#A7D5FF] transition-colors hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#57A5EB]/55" [attr.aria-label]="(copied() ? 'Copied!' : 'Copy message') | translate">
              @if (copied()) {
                <i class="bi bi-check-lg text-[13px] leading-none text-emerald-300" aria-hidden="true"></i>
              } @else {
                <i class="bi bi-copy text-[12px] leading-none" aria-hidden="true"></i>
              }
              <span>{{ (copied() ? 'Copied!' : 'Copy message') | translate }}</span>
            </button>
          </div>

          <p class="mt-3 max-h-[160px] overflow-y-auto whitespace-pre-wrap break-words border-l-2 border-[#57A5EB]/30 pl-4 pr-1 text-[13px] leading-6 text-[var(--color-text3)] [scrollbar-color:rgba(167,213,255,0.3)_transparent] [scrollbar-width:thin]">{{ shareText }}</p>
        </div>

        <div class="mt-5 border-t border-[var(--color-border)] pt-4">
          <h4 class="mb-2 text-[11px] font-semibold uppercase tracking-[0.12em] text-[var(--color-text5)]">{{ 'Share via' | translate }}</h4>
          <div class="grid grid-cols-[repeat(auto-fit,minmax(68px,1fr))] gap-1">
            @if (canNativeShare()) {
              <button type="button" (click)="shareViaNative()" class="group flex min-w-0 flex-col items-center gap-1.5 rounded-lg border-0 bg-transparent px-2 py-2.5 text-center transition-colors hover:bg-white/[0.04] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#57A5EB]/45">
                <i class="bi bi-share-fill text-[19px] leading-none text-[#A7D5FF] group-hover:text-white" aria-hidden="true"></i>
                <span class="w-full truncate text-[10px] font-medium text-[var(--color-text4)] group-hover:text-[var(--color-text2)]">{{ 'System' | translate }}</span>
              </button>
            }

            @for (destination of destinations; track destination.target) {
              <a [href]="shareUrl(destination.target)" [attr.target]="destination.target === 'email' ? null : '_blank'" [attr.rel]="destination.target === 'email' ? null : 'noopener noreferrer'" [attr.aria-label]="('Share via' | translate) + ' ' + destination.label" (click)="close()" class="group flex min-w-0 flex-col items-center gap-1.5 rounded-lg px-2 py-2.5 text-center transition-colors hover:bg-white/[0.04] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#57A5EB]/45">
                <i [class]="'bi text-[19px] leading-none transition-colors ' + destination.iconClass" [ngClass]="destination.icon" aria-hidden="true"></i>
                <span class="w-full truncate text-[10px] font-medium text-[var(--color-text4)] group-hover:text-[var(--color-text2)]">{{ destination.label }}</span>
              </a>
            }
          </div>
        </div>
      </div>
    </section>
  </div>
}
