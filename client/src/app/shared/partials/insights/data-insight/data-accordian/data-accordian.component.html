<div class="data-accordion__main-div">
  <ng-container *ngFor="let category of objectKeys(categories)">
    <div class="data-accordion__container">
      <input type="checkbox" [id]="category + '-toggle'" class="accordion-toggle">
      <label class="data-accordion__header" [for]="category + '-toggle'">
        <div>
          <img class="category__icons" ngSrc="assets/images/shared/document_count.svg" height="20" width="20" alt="">
          {{ category }}
        </div>
        <img class="dropdown-icon" ngSrc="assets/images/shared/dropdown_left.svg" alt="Dropdown Arrow" width="20" height="20">
      </label>
      <div class="data-accordion__content">
        <div *ngFor="let item of categories[category]; let i = index" class="data-accordion__row">
          <div class="data-accordion__column" *ngIf="item && true">
            {{ i + 1 }}. {{ item.length > 20 ? (item | slice:0:20) + '...' : item }}
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
