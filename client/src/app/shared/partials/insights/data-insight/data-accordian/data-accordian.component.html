<div class="data-accordion__main-div">
  <ng-container *ngFor="let category of categories">
    <div *ngIf="analytics[category.key]?.length > 0" class="data-accordion__container data-accordion__container-background">
      <input type="checkbox" [id]="category.key + '-toggle'" checked>
      <label class="data-accordion__header" [for]="category.key + '-toggle'">
        <div>
          <img class="category__icons" ngSrc="{{category.icon}}" alt="{{category.label}}" height="20" width="20">
          {{ category.label }}
        </div>
        <img ngSrc="../../../../../../assets/images/shared/dropdown_left.svg" alt="Dropdown Arrow" width="20" height="20">
      </label>

      <div class="data-accordion__content">
        <div *ngFor="let item of analytics[category.key]; let i = index" class="data-accordion__row">
          <div class="data-accordion__column">
            {{ i + 1 }}. {{ item.length > 20 ? (item | slice:0:20) + '...' : item }}
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
