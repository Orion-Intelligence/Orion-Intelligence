<div class="ui-graph-popup-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="ui-graph-popup-panel w-full max-w-[460px] rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-700)] p-6 shadow-[0_20px_60px_rgba(0,0,0,0.35)]">
    <div class="text-lg font-semibold text-[var(--color-text1)]">Important System Notice</div>
    <div class="mt-3 text-sm text-[var(--color-text3)]">{{ message }}</div>
    <div class="mt-6 flex justify-end">
      <button class="rounded-md bg-[var(--color-blue-640)] px-4 py-2 text-sm font-semibold text-white transition hover:bg-[var(--color-blue-630)]" (click)="dismiss()" autofocus>Dismiss</button>
    </div>
  </div>
</div>
