<div class="ui-graph-popup-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="ui-graph-popup-panel ui-popup-shell w-full max-w-[460px] rounded-xl p-6">
    <div class="ui-popup-title text-lg font-semibold">Important System Notice</div>
    <div class="mt-3 text-sm text-[var(--color-text3)]">{{ message() }}</div>
    <div class="mt-6 flex justify-end">
      <button data-testid="tenant-message-dismiss" class="ui-popup-btn-primary px-4 py-2 text-sm font-semibold" (click)="dismiss()" autofocus>Dismiss</button>
    </div>
  </div>
</div>
