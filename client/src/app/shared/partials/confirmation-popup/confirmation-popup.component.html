<div class="ui-graph-popup-overlay fixed inset-0 z-50 flex items-center justify-center p-4" @popupAnimation data-role="backdrop" (click)="onBackdrop($event)">
  <div data-testid="confirmation-popup" class="ui-graph-popup-panel ui-popup-shell w-full max-w-[420px] rounded-xl p-6">
    <div class="ui-popup-title text-lg font-semibold">{{ 'confirmation.title' | translate }}</div>

    <div class="mt-3 break-all text-sm text-[var(--color-text3)]">
      {{ message() | translate }}
    </div>

    <div class="mt-6 flex justify-end gap-2">
      <button triggerAutoFocus data-testid="confirmation-yes-button" class="ui-popup-btn-primary px-4 py-2 text-sm font-semibold" (click)="onYes()">{{ 'confirmation.yesConfirm' | translate }}</button>
      <button class="ui-popup-btn-secondary px-4 py-2 text-sm font-semibold" (click)="onNo()">{{ 'common.actions.cancel' | translate }}</button>
    </div>
  </div>
</div>
