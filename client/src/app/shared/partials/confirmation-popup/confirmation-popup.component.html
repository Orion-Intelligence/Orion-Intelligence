<div class="ui-graph-popup-overlay fixed inset-0 z-50 flex items-center justify-center p-4" @popupAnimation data-role="backdrop" (click)="onBackdrop($event)">
  <div class="ui-graph-popup-panel w-full max-w-[420px] rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-700)] p-6 shadow-[0_20px_60px_rgba(0,0,0,0.35)]">
    <div class="text-lg font-semibold text-[var(--color-text1)]">Confirmation!</div>

    <div class="mt-3 text-sm text-[var(--color-text3)]">
      {{ message }}
    </div>

    <div class="mt-6 flex justify-end gap-2">
      <button triggerAutoFocus class="rounded-md bg-[var(--color-blue-640)] px-4 py-2 text-sm font-semibold text-white transition hover:bg-[var(--color-blue-630)]" (click)="onYes()">Yes, Confirm</button>
      <button class="rounded-md border border-[var(--color-border)] px-4 py-2 text-sm font-semibold text-[var(--color-text3)]" (click)="onNo()">Cancel</button>
    </div>
  </div>
</div>
