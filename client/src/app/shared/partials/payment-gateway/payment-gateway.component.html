<app-pro-subscription *ngIf="showSubscription && this.dashboardService.showSubscription()" (close)="hideSubscription()" [permanent]="false"></app-pro-subscription>
<ng-container *ngIf="!subscriptionService.checkSubscription()&&!subscriptionService.checkAdmin()&& subscriptionService.getTrialDaysLeft()<=0">
  <ng-container>
    <app-header></app-header>
  </ng-container>
  <img alt="background" class="app-background app-background-dark img-fluid w-100 h-100 object-fit-cover" src="/assets/images/shared/Bg.webp">
  <div class="welcome-page-wrapper">
    <div class="welcome-page__card">
      <img src="/assets/images/shared/welcom_icon.svg" alt="Tick">
      <div class="welcome-page__card-heading"> Your Trial Has Ended</div>
      <div class="welcome-page__card-paragraph"> Your trial period has ended. To continue enjoying full access, please upgrade your subscription.</div>
      <button (click)="upgradeNow()">Upgrade Now</button>
    </div>
  </div>
</ng-container>
