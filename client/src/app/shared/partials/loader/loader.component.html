<div [ngClass]="(isLoading$ | async) ? 'opacity-100 visible' : 'opacity-0 invisible'" class="fixed left-0 top-0 z-[3] h-[5px] w-full bg-[#0e355650] transition-opacity duration-300 ease-in-out">
  <div class="h-[4px] w-full overflow-hidden bg-[#295884]">
    <div class="ui-main-loader-bar h-full w-full origin-left bg-[#08c]"></div>
  </div>
</div>
