<div class="header-bar">
  <ng-container *ngIf="!authService.getIsMobileDemo()">
    <div class="header-bar_title-container">
      <img (click)="goBack()" [class.disabled]="breadcrumb.length <= 2&& breadcrumb[0].label !== 'ctigraph'" alt="Back" class="header-bar_left-arrow" height="30" ngSrc="assets/images/shared/theme/arrow.svg" width="30" />

      <span *ngFor="let crumb of breadcrumb; let i = index; let last = last">
        <span *ngIf="!last" (click)="navigateToCrumb(i)" [class.inactive]="breadcrumb.length <= 2" class="breadcrumb-item">
          {{ crumb.label.replace('-', ' ') | titlecase }}
          <img alt="breadcrumb" class="header-bar__breadcrum" height="20" ngSrc="assets/images/shared/theme/nav-next.svg" priority width="20" />
        </span>

        <span *ngIf="last" class="breadcrumb-item breadcrumb-active">
          <ng-container *ngIf="crumb.label.toLowerCase() !== 'login'; else loginLogo">
            {{ crumb.label.replace('-', ' ') | titlecase }}
          </ng-container>
        </span>

        <ng-template #loginLogo>
          <div class="sidebar__header">
            <a href=""><img alt="Logo" height="35" width="197" [src]="appService.getConfig().appSettings.logo_wide_dark" /></a>
          </div>
        </ng-template>

      </span>
    </div>
  </ng-container>
  <ng-container *ngIf="authService.getIsMobileDemo()">
    <div class="header-bar_title-container">
      <span class="breadcrumb-item breadcrumb-item-large breadcrumb-active ml-3">
        {{ this.appService.getConfig().appSettings.app_name }}
      </span>
    </div>
  </ng-container>

  <div class="header-bar_profile" *ngIf="!authService.getIsMobileDemo()">
    <app-profile (openPopup)="supportOpenPopup()"></app-profile>
  </div>
</div>
<app-support *ngIf="supportPopup" (closePopup)="supportClosePopup()"></app-support>
