<div class="header-bar">
  <div class="header-bar_title-container">
    <img (click)="goBack()" [class.inactive]="breadcrumb.length <= 2" alt="Back" class="header-bar_left-arrow" height="30" ngSrc="assets/images/shared/arrow.svg" width="30"/>

    <span *ngFor="let crumb of breadcrumb; let i = index; let last = last">
      <span *ngIf="!last" (click)="navigateToCrumb(i)" [class.inactive]="breadcrumb.length <= 2" class="breadcrumb-item">
        {{ crumb.label.replace('-', ' ') | titlecase }}
        <img alt="breadcrumb" class="header-bar__breadcrum" height="20" ngSrc="assets/images/shared/nav-next.svg" priority width="20"/>
      </span>

      <span *ngIf="last" class="breadcrumb-item breadcrumb-active">
        {{ crumb.label.replace('-', ' ') | titlecase }}
      </span>
    </span>
  </div>

  <div appTooltip="User Login" class="header-bar_profile">
    <app-profile></app-profile>
  </div>
</div>
