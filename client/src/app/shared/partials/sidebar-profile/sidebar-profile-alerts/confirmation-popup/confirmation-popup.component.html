<div class="confirmation-popup_backdrop">
  <div class="confirmation-popup_box">

    <div class="confirmation-popup_title">Confirmation!</div>

    <div class="confirmation-popup_text">
      Are you sure you want to flush all alerts?
    </div>

    <div class="confirmation-popup_actions">
      <button class="confirmation-popup_btn-primary" (click)="onYes()">Yes, Confirm</button>
      <button class="confirmation-popup_btn-secondary" (click)="onNo()">Cancel</button>
    </div>

  </div>
</div>
