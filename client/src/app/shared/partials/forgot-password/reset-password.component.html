<app-header [forceDark]="true"></app-header>

<img alt="background" src="/assets/images/shared/Bg.webp" class="app-background app-background-dark img-fluid w-100 h-100 object-fit-cover opacity-[0.25]">

<div class="reset-page-wrapper relative z-[1] min-h-[calc(100dvh-60px)] w-screen">
  <div class="reset-page-overlay flex min-h-[calc(100dvh-60px)] w-full items-start justify-center bg-[#0e1626d9] px-4 pt-[20vh] max-[640px]:p-[10px]">
    <div class="reset-page__card mt-0 w-full max-w-[500px] rounded-[16px] border border-[#fcfcfc14] bg-[rgba(23,34,53,0.5)] px-9 py-[42px] font-[Inter] text-white shadow-[0_16px_40px_rgba(0,0,0,0.28)] max-[1300px]:mx-[15px]">
      <div class="mb-2 text-[34px] font-semibold leading-[1.05] tracking-[-0.02em]">Reset Password</div>

      <p *ngIf="!hasToken" class="mb-6 text-[14px] font-normal leading-[1.55] text-[#9ab2cd]">
        Enter your registered email to get password reset link!
      </p>

      <p *ngIf="hasToken" class="mb-6 text-[14px] font-normal leading-[1.55] text-[#9ab2cd]">
        Enter your new password
      </p>

      <form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" class="flex flex-col">
        <div *ngIf="!hasToken" class="mb-5 flex flex-col">
          <label class="mb-[6px] text-[14px] font-medium text-white">Register Mail</label>
          <div class="relative">
            <i class="bi bi-envelope-fill pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[14px] text-[#5d6f85]"></i>
            <input [(ngModel)]="email" id="id_companymail" placeholder="Enter your registered mail" class="h-[44px] w-full rounded-[8px] border border-[#fcfcfc12] bg-white pl-10 pr-3 text-[14px] text-[#0e1626] shadow-[0_1px_2px_rgb(16_24_40/5%)] outline-none" name="companymail" required type="email"/>
          </div>
        </div>

        <div *ngIf="hasToken">
          <div class="mb-5 flex flex-col">
            <label class="mb-[6px] text-[14px] font-medium text-white">New Password</label>
            <input [(ngModel)]="password" (input)="onPasswordInput(password)" type="password" placeholder="Enter new password" class="h-[44px] w-full rounded-[8px] border border-[#fcfcfc12] bg-white px-3 text-[14px] text-[#0e1626] shadow-[0_1px_2px_rgb(16_24_40/5%)] outline-none" name="password" required/>

            <div *ngIf="showPasswordMeter">
              <div class="mt-2 h-[6px] w-full overflow-hidden rounded-[4px] bg-[#e0e0e0]">
                <div class="h-full transition-[width] duration-300" [ngClass]="{ 'bg-[#dc354580] w-1/3': passwordStrength === 'weak', 'bg-[#ffc10780] w-2/3': passwordStrength === 'medium', 'bg-[#19875480] w-full': passwordStrength === 'strong' }"></div>
              </div>

              <ul class="mt-[10px] list-none p-0 text-[12px] text-[#a0b8d1]">
                <li *ngIf="currentUnmetCheck">{{ currentUnmetCheck }}</li>
              </ul>
            </div>
          </div>

          <div class="mb-5 flex flex-col">
            <label class="mb-[6px] text-[14px] font-medium text-white">Confirm Password</label>
            <input [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm new password" class="h-[44px] w-full rounded-[8px] border border-[#fcfcfc12] bg-white px-3 text-[14px] text-[#0e1626] shadow-[0_1px_2px_rgb(16_24_40/5%)] outline-none" required minlength="8" type="password"/>
          </div>

          <div *ngIf="password && confirmPassword && password !== confirmPassword && (!showPasswordMeter || passwordStrength === 'strong')" class="mt-2 w-full rounded-lg bg-[#dc3545cc] px-3 py-2 text-white shadow-sm">
            <i class="bi bi-exclamation-diamond-fill mr-2"></i>
            Password and confirm password do not match
          </div>
        </div>

        <div *ngIf="errorMessage" class="mt-2 w-full rounded-lg bg-[#dc3545cc] px-3 py-2 text-white shadow-sm">
          <i class="bi bi-exclamation-diamond-fill mr-2"></i>
          {{ errorMessage }}
        </div>

        <div>
          <input [disabled]="hasToken ? (!forgotForm.valid || password !== confirmPassword || !allPasswordRequirementsMet) : !forgotForm.valid" [class]="hasToken ? (forgotForm.valid && password === confirmPassword && allPasswordRequirementsMet ? 'mt-5 h-[44px] w-full cursor-pointer rounded-[8px] bg-[#57a5eb] text-[14px] font-medium text-white shadow-[0_1px_2px_rgb(16_24_40/5%)]' : 'mt-5 h-[44px] w-full cursor-not-allowed rounded-[8px] bg-[#57a5eb] text-[14px] font-medium text-white opacity-50 shadow-[0_1px_2px_rgb(16_24_40/5%)]') : (forgotForm.valid ? 'mt-5 h-[44px] w-full cursor-pointer rounded-[8px] bg-[#57a5eb] text-[14px] font-medium text-white shadow-[0_1px_2px_rgb(16_24_40/5%)]' : 'mt-5 h-[44px] w-full cursor-not-allowed rounded-[8px] bg-[#57a5eb] text-[14px] font-medium text-white opacity-50 shadow-[0_1px_2px_rgb(16_24_40/5%)]')" type="submit" [value]="hasToken ? 'Reset Password' : 'Get reset link'" />
        </div>
      </form>
    </div>
  </div>
</div>
