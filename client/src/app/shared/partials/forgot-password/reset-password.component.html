<ng-container>
  <app-header></app-header>
</ng-container>

<div class="min-h-screen bg-[var(--color-blue-700)] px-4 py-10">
  <div class="mx-auto w-full max-w-[520px] rounded-2xl border border-[var(--color-border)] bg-[var(--color-blue-700)] px-8 py-10 shadow-[0_24px_80px_rgba(0,0,0,0.35)]">
    <div class="text-2xl font-semibold text-[var(--color-text1)]">Reset Password</div>

    <p *ngIf="!hasToken" class="mt-2 text-sm text-[var(--color-text4)]">
      Enter your registered email to get password reset link!
    </p>

    <p *ngIf="hasToken" class="mt-2 text-sm text-[var(--color-text4)]">
      Enter your new password
    </p>

    <form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" class="mt-6 space-y-4">
      <div *ngIf="!hasToken" class="space-y-2">
        <label class="text-sm font-semibold text-[var(--color-text3)]">Register Mail</label>
        <input [(ngModel)]="email" id="id_companymail" placeholder="Enter your registered mail" class="w-full rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)] px-3 py-2 text-sm text-[var(--color-text1)] placeholder:text-[var(--color-text4)]" name="companymail" required type="email"/>
      </div>

      <div *ngIf="hasToken" class="space-y-4">
        <div class="space-y-2">
          <label class="text-sm font-semibold text-[var(--color-text3)]">New Password</label>
          <input [(ngModel)]="password" (input)="onPasswordInput(password)" type="password" placeholder="Enter new password" class="w-full rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)] px-3 py-2 text-sm text-[var(--color-text1)] placeholder:text-[var(--color-text4)]" name="password" required/>

          <div *ngIf="showPasswordMeter" class="space-y-2">
            <div class="h-2 w-full overflow-hidden rounded-full bg-[var(--color-blue-810)]">
              <div class="h-full transition-all" [ngClass]="{ 'bg-[var(--color-border-red)]': passwordStrength === 'weak', 'bg-[var(--color-orange-200)]': passwordStrength === 'medium', 'bg-[var(--color-blue-640)]': passwordStrength === 'strong' }" [style.width.%]="passwordStrength === 'weak' ? 33 : passwordStrength === 'medium' ? 66 : 100"></div>
            </div>

            <ul class="text-xs text-[var(--color-text4)]">
              <li *ngIf="currentUnmetCheck">{{ currentUnmetCheck }}</li>
            </ul>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold text-[var(--color-text3)]">Confirm Password</label>
          <input [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm new password" class="w-full rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)] px-3 py-2 text-sm text-[var(--color-text1)] placeholder:text-[var(--color-text4)]" required minlength="8" type="password"/>
        </div>

        <div *ngIf="password && confirmPassword && password !== confirmPassword && (!showPasswordMeter || passwordStrength === 'strong')" class="rounded-lg border border-[var(--color-border-red)] bg-[var(--color-red-200)] px-3 py-2 text-sm text-[var(--color-text1)] shadow-sm">
          <i class="bi bi-exclamation-diamond-fill me-2"></i>
          Password and confirm password do not match
        </div>
      </div>

      <div *ngIf="errorMessage" class="rounded-lg border border-[var(--color-border-red)] bg-[var(--color-red-200)] px-3 py-2 text-sm text-[var(--color-text1)] shadow-sm">
        <i class="bi bi-exclamation-diamond-fill me-2"></i>
        {{ errorMessage }}
      </div>

      <div>
        <input [disabled]="hasToken ? (!forgotForm.valid || password !== confirmPassword || !allPasswordRequirementsMet) : !forgotForm.valid" [ngClass]="hasToken ? (forgotForm.valid && password === confirmPassword && allPasswordRequirementsMet) ? 'cursor-pointer bg-[var(--color-blue-640)] text-white' : 'cursor-not-allowed bg-[var(--color-blue-810)] text-[var(--color-text4)]' : forgotForm.valid ? 'cursor-pointer bg-[var(--color-blue-640)] text-white' : 'cursor-not-allowed bg-[var(--color-blue-810)] text-[var(--color-text4)]'" class="w-full rounded-md px-4 py-2 text-sm font-semibold transition" type="submit" [value]="hasToken ? 'Reset Password' : 'Get reset link'" />
      </div>
    </form>
  </div>
</div>
