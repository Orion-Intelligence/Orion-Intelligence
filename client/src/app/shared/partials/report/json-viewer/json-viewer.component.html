<ul class="json-node" [style.marginLeft.px]="level * 20">
    <ng-container *ngFor="let key of keys(json)">
        <li *ngIf="key !== '__expanded'">
            <span *ngIf="isObject(json[key])">
                <button (click)="toggle(json[key])">
                    {{ json[key].__expanded ? '▼' : '▶' }}
                </button>
                <strong>{{ key }}:</strong>
                <ng-container *ngIf="json[key].__expanded">
                    <app-json-viewer [json]="json[key]" [level]="level + 1"></app-json-viewer>
                </ng-container>
            </span>
            <span *ngIf="!isObject(json[key])">
                <strong>{{key}}:</strong> <span class="value">{{ json[key] }}</span>
            </span>
        </li>
    </ng-container>
</ul>
