<img ngSrc="/assets/images/shared/Bg.webp" alt="background" class="app-background img-fluid w-100 h-100 object-fit-cover" priority fill="true">

<div class="d-flex justify-content-start">
  <div class="btn-group report-menu-option-container">
    <button class="p-0 report-menu-option" (click)="downloadCSV()">
      <img ngSrc="../../../../../assets/images/shared/download.svg" alt="background" height="25" width="25">
    </button>
    <div class="vr report-menu-divider"></div>
    <button class="p-0 report-menu-option" (click)="langUpdate()">
      <img ngSrc="../../../../../assets/images/shared/translate.svg" alt="background" height="25" width="25">
    </button>
    <div class="vr report-menu-divider"></div>
    <button class="p-0 report-menu-option" (click)="printPage()">
      <img ngSrc="../../../../../assets/images/shared/print.svg" alt="background" height="25" width="25">
    </button>
    <div class="vr report-menu-divider"></div>
    <button class="p-0 report-menu-option" (click)="shareResult()">
      <img ngSrc="../../../../../assets/images/shared/share.svg" alt="background" height="22" width="22">
    </button>
    <div class="vr report-menu-divider"></div>
    <button class="p-0 report-menu-option" (click)="redirectToUrl()">
      <img ngSrc="../../../../../assets/images/shared/redirect.svg" alt="background" height="25" width="25">
    </button>
  </div>
</div>
<div class="dashboard__defacement-detail-container">
  <div class="dashboard__defacement-detail-header">
    <div class="dashboard__defacement-detail-header-url">{{ defacementData?.m_web_url }}</div>
    <div class="dashboard__defacement-detail-header-row">
      <div class="dashboard__defacement-detail-header-items"><strong>Saved on:</strong> {{ defacementData?.m_date_of_leak }}
      </div>
      <div class="dashboard__defacement-detail-header-items"><strong>Defacer:</strong> {{ defacementData?.m_attacker }}
      </div>
      <div class="dashboard__defacement-detail-header-items"><strong>Team:</strong> {{ defacementData?.m_team }}</div>
      <div class="dashboard__defacement-detail-header-items"><strong>Web Server:</strong> {{ defacementData?.m_web_server }}
      </div>
      <div class="dashboard__defacement-detail-header-items"><strong>IP:</strong> {{ defacementData?.m_ip }}</div>
      <div class="dashboard__defacement-detail-header-items"><strong>Location:</strong> {{ defacementData?.m_location }}
      </div>
    </div>
  </div>
  <div class="dashboard__defacement-detail-preview">
    <h3 class="dashboard__defacement-detail-preview-heading">Preview</h3>
    <iframe src="https://zone-xsec.com/view/defaced/~/709356" sandbox="" class="dashboard__defacement-preview w-full h-[500px]"></iframe>
  </div>
</div>
