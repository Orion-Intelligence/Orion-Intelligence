<div class="directory-list__container">
    <table class="table table-striped directory-list__table clear-paddings">
        <thead>
            <tr>
                <th scope="col" class="directory-list__column-id">ID</th>
                <th scope="col" class="directory-list__column-service-url">Mapping To</th>
                <th scope="col" class="directory-list__column-category">Mapping On</th>
            </tr>
        </thead>
        <tbody>
            <ng-container *ngFor="let item of filteredItems; let i = index">
                <tr (click)="viewReport(extractId(item.edge._id))">
                    <td data-label="ID">
                        {{ (i + 1) }}
                    </td>
                    <td data-label="Service URL">
                        <a class="directory-list__table-url text-decoration-none text-reset">
                            {{ extractId(item.edge._id) }}
                            <!-- {{ result[i].m_document_id }} -->
                        </a>
                    </td>

                    <td data-label="Category">
                        <div class="d-flex flex-wrap">
                            <div class="directory-list__content-category px-2 py-1">
                                {{ extractProperty(item.edge._id) }}
                                <!-- {{ formatPropertyName(result[i].property) }} -->
                            </div>
                        </div>
                    </td>
                </tr>
            </ng-container>
        </tbody>
    </table>
</div>
