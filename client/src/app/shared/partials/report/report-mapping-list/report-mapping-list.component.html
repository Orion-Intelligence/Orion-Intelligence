<ng-container *ngIf="filteredItems.length>0">
  <div class="search__result-detail">
    <div (click)="toggleContent()" class="search__result__section__heading">
      <div class="left-content">
        Related Documents
        <img src="/assets/images/shared/info.svg" alt="Icon" appTooltip="Related Documents">
      </div>
      <div [attr.aria-label]="isExpanded ? 'Collapse' : 'Expand'" class="toggle-btn">
        <img [ngClass]="{ 'rotated': !isExpanded }" alt="toggle icon"
          src="/assets/images/shared/search_side_dropdown_icon.svg">
      </div>
    </div>
    <div *ngIf="isExpanded" class="content p-3">
      <div class="directory-list__container report-mapping">
        <table class="table table-striped directory-list__table clear-paddings mb-0">
          <thead>
            <tr>
              <th class="narrow-col" scope="col">ID</th>
              <th scope="col">Mapping To</th>
              <th class="mid-col" scope="col">Mapping On</th>
              <th scope="col">Mapping Value</th>
            </tr>
          </thead>
          <tbody>
            <ng-container *ngFor="let item of filteredItems; let i = index">
              <tr (click)="viewReport(extractId(item.edge._id))" class="cursor-pointer">
                <td data-label="ID">
                  {{ (i + 1) }}
                </td>
                <td data-label="Service URL">
                  <a class="directory-list__table-url text-decoration-none text-reset">
                    {{ extractId(item.edge._id) }}
                  </a>
                </td>
                <td data-label="Category">
                  <div class="d-flex flex-wrap">
                    <div class="directory-list__content-category px-2 py-1 text-truncate">
                      {{ extractProperty(item.edge._id, "key") }}
                    </div>
                  </div>
                </td>
                <td data-label="Category">
                  <div class="d-flex flex-wrap">
                    <div class="directory-list__content-category px-2 py-1 text-truncate">
                      {{ extractProperty(item.edge._id, "value") }}
                    </div>
                  </div>
                </td>
              </tr>
            </ng-container>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</ng-container>
