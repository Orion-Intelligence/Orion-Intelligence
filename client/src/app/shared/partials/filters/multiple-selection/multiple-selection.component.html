<div class="multiselection_dropdown dropdown">
  <button
    aria-expanded="false"
    class="btn dropdown-toggle sidebar_input w-100 text-start d-flex justify-content-between align-items-center dropdown-select" data-bs-toggle="dropdown" id="multiDropdown{{ key }}" type="button">
    {{ getOptionLabel() }}
  </button>
  <ul class="dropdown-menu w-100 p-1 mt-2 border-0 shadow sidebar_dropdown-animation rounded-3">
    <li (click)="$event.stopPropagation()" *ngFor="let option of filterModel.filters[key]?.options">
      <label class="dropdown-item py-0 d-flex align-items-center sidebar_dropdown-item">
        <input (click)="onMultiSelectionToggle(option.key)" [checked]="(mSelectedFilters[key] ?? []).includes(option.key)"
               class="form-check-input me-2"
               type="checkbox">
        {{ option.label }}
      </label>
    </li>
  </ul>
</div>
