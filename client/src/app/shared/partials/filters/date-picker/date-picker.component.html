<form class="row">
  <div class="col-12">
    <div class="d-flex align-items-center">
      <input ngbDatepicker #datepicker="ngbDatepicker"
        class="filter__input text-start justify-content-between align-items-center " [autoClose]="'outside'"
        (dateSelect)="onDateSelection($event)" [displayMonths]="1" [dayTemplate]="t" outsideDays="hidden"
        [startDate]="fromDate!" tabindex="-1" [value]="formatDateRange()" readonly placeholder="Select date range"
        (click)="datepicker.toggle()" />

      <form class="row filter__input_date-container">
        <div class="col-12">
          <div class="d-flex align-items-center">
            <input ngbDatepicker #datepicker="ngbDatepicker"
              class="filter__input filter__input_date text-start justify-content-between align-items-center "
              [autoClose]="'outside'" (dateSelect)="onDateSelection($event)" [displayMonths]="1" [dayTemplate]="t"
              outsideDays="hidden" [startDate]="fromDate!" tabindex="-1" [value]="formatDateRange()" readonly
              placeholder="Select date range" (click)="datepicker.toggle()" />

            <button class="btn date_picker_button_bg ms-2 filter__input_date-button" (click)="datepicker.toggle()"
              type="button">
              <img src="assets/images/shared/calendar.png" alt="Send" class="date_picker_button_image" />
            </button>
          </div>

          <ng-template #t let-date let-focused="focused">
            <span class="custom-day" [class.focused]="focused" [class.range]="isRange(date)"
              [class.faded]="isHovered(date) || isInside(date)" (mouseenter)="hoveredDate = date"
              (mouseleave)="hoveredDate = null">
              {{ date.day }}
            </span>
          </ng-template>
        </div>
      </form>
