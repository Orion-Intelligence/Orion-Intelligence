<form class="relative w-full overflow-visible">
  <button [attr.data-testid]="toggleTestId()" type="button" (click)="togglePicker()" [disabled]="disabled()" class="flex h-10 w-full items-center justify-between rounded-lg border border-[var(--color-border)] bg-[var(--color-white)] px-3 text-left text-sm font-medium text-[var(--color-text2)] shadow-sm transition hover:brightness-[0.98] outline-none focus:outline-none focus:ring-0 disabled:cursor-not-allowed disabled:opacity-60">
    <span class="truncate">{{ displayValue || filterModel()?.filters?.[key()]?.placeholder || ((selectionMode() === 'single' ? 'Select date' : 'Select date range') | translate) }}</span>
    @if (selectionMode() === 'single' && displayValue && !disabled()) {
      <span role="button" tabindex="0" (click)="clearSelection($event)" class="mr-2 inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-sm text-slate-500 transition hover:bg-slate-100 hover:text-slate-700">×</span>
    }
    <img alt="Calendar" class="h-4 w-4 shrink-0 opacity-70" src="assets/images/shared/theme/calendar.png" />
  </button>

  @if (isOpen) {
    <div class="fixed inset-0 z-40" (click)="closePicker()"></div>
  }

  @if (isOpen) {
    <div class="fixed inset-0 z-50 overflow-y-auto p-4 sm:absolute sm:right-0 sm:top-[46px] sm:mt-1 sm:w-full sm:overflow-visible sm:p-0">
      <div class="w-full rounded-xl border border-slate-200 bg-white p-3 shadow-xl sm:w-auto">
        <div class="mb-2 flex items-center justify-between">
          <button data-testid="side-filter-date-prev-month" type="button" (click)="prevMonth()" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-base text-slate-600 transition hover:bg-slate-100 outline-none focus:outline-none focus:ring-0">
            ‹
          </button>
          <div data-testid="side-filter-date-month-label" class="text-sm font-semibold text-slate-800">{{ monthLabel }}</div>
          <button data-testid="side-filter-date-next-month" type="button" (click)="nextMonth()" [disabled]="isNextMonthDisabled()" class="inline-flex h-8 w-8 items-center justify-center rounded-md text-base text-slate-600 transition hover:bg-slate-100 outline-none focus:outline-none focus:ring-0 disabled:cursor-not-allowed disabled:opacity-35 disabled:hover:bg-transparent">
            ›
          </button>
        </div>
        <div class="mb-1 grid grid-cols-7 gap-1 text-center text-[10px] font-semibold uppercase tracking-wide text-slate-500">
          @for (day of weekdays; track day) {
            <div>{{ day }}</div>
          }
        </div>
        <div class="grid grid-cols-7 gap-1">
          @for (cell of cells; track cell) {
            <button type="button" [attr.data-testid]="'side-filter-date-day-' + cell.date.getDate()" (click)="onSelect(cell)" [disabled]="isDateDisabled(cell)" class="h-8 rounded-md text-xs transition-colors outline-none focus:outline-none focus:ring-0 disabled:cursor-not-allowed" [ngClass]="{ 'text-slate-300 opacity-50': isDateDisabled(cell), 'text-slate-400': !cell.inCurrentMonth && !isDateDisabled(cell), 'text-slate-700 hover:bg-slate-100': cell.inCurrentMonth && !isDateDisabled(cell) && !isInRange(cell) && !isStart(cell) && !isEnd(cell), 'bg-sky-100 text-sky-900': !isDateDisabled(cell) && isInRange(cell), 'bg-sky-500 text-white font-semibold': !isDateDisabled(cell) && (isStart(cell) || isEnd(cell)) }">
              {{ cell.date.getDate() }}
            </button>
          }
        </div>
      </div>
    </div>
  }
</form>
