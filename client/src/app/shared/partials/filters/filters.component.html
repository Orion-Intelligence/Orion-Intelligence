<label class="directory__main-filter-header d-flex align-items-center" (click)="closeFilter()">
  <div class="justify-content-start">
    <h2 class="directory__main-filter-heading">Filters</h2>
  </div>
  <div class="col-12 d-flex justify-content-end directory__filters-close-label">
    <img ngSrc="assets/images/shared/nav-next.svg" alt="close" height="16" width="16">
  </div>
</label>

<form class="directory__main-filter-form">
  <div class="directory__main-filter-content">
    <div *ngFor="let key of Object.keys(filterModel.filters)">
      <label class="directory__main-filter-label">
        {{ filterModel.filters[key].title }}
      </label>
      <div class="dropdown">
        <select class="directory__main-filter-input form-select" name="{{ key }}" [(ngModel)]="selectedFilters[key]" (ngModelChange)="onSelectionChange(key, $event)">
          <!-- Default placeholder, displayed even when dropdown is closed -->
          <option value="Select {{ filterModel.filters[key].title }}" disabled>
            Select {{ filterModel.filters[key].title }}
          </option>

          <!-- Other selectable options -->
          <option *ngFor="let option of filterModel.filters[key].options" [value]="option">
            {{ option | titlecase }}
          </option>
        </select>
      </div>
    </div>
  </div>

  <div class="directory__main-filter-submit d-flex flex-column">
    <button type="button" class="btn btn-secondary mb-4 directory__main-submit-button" (click)="resetFilters()">
      Reset
    </button>
    <button type="button" class="btn btn-primary directory__main-submit-button" (click)="applyFilters()">
      Apply
    </button>
  </div>
</form>
