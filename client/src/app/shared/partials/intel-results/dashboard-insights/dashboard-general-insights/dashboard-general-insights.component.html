<div *ngIf="analytics" class="search__insight-general-div">
  <div *ngFor="let section of sections" class="search-insights__container search-insights__container-background">
    <input type="checkbox" [id]="section.title + '-toggle'" checked>
    <label class="search-insights__header" [for]="section.title + '-toggle'">
      {{ section.title }}
      <img ngSrc="../../../../../../assets/images/shared/dropdown_left.svg" alt="" width="16" height="16" alt="Dropdown Arrow">
    </label>
    <div class="search-insights__content">
      <div class="row">
        <div *ngFor="let item of section.items" class="col-3">
          <p class="search-insights__coverage-numbers">{{ item.value }}</p>
          <p class="search-insights__text">
            <span *ngIf="item.spanClass" [class]="item.spanClass"></span>{{ item.label }} </p>
        </div>
      </div>
    </div>
  </div>
</div>
