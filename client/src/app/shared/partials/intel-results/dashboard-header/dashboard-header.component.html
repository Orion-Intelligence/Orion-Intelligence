<div class="header-bar">
  <div class="header-bar__title-container">
      <span *ngFor="let crumb of breadcrumb; let last = last">
        <span *ngIf="!last" class="breadcrumb-item ">{{ crumb | titlecase }}
          <img ngSrc="assets/images/shared/nav-next.svg" class="header-bar__breadcrum" alt="breadcrumb" height="20" width="20">
        </span>

        <span *ngIf="last" class="breadcrumb-item breadcrumb-active">{{ crumb | titlecase }}</span>
      </span>
  </div>
  <div class="header-bar__profile">
    <app-profile></app-profile>
  </div>
</div>
