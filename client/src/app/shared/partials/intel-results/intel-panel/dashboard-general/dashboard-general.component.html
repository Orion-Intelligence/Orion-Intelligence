<app-result (onToggleSwitch)="onToggleAnalyticsTrigger()" [analyticsToggle]="onToggleAnalytics"  (updatePageNumber)="onPageChange($event)" [searchQuery]="query" [suggestion]="dashboardService.searchGeneralCallbackModel.Suggestions[0]" [isLoading]="isLoading" (reloadFilters)="reloadFilters($event)" (updateQuery)="onUpdateQuery($event)" (reloadData)="fetchSearchResults()" [result_count]="dashboardService.searchGeneralCallbackModel.Result.length"></app-result>


<div *ngIf="this.onToggleAnalytics && !isLoading" @fadeInDashboardItem>
  <app-insights [analytics]="analyticsData"></app-insights>
</div>
<div *ngIf="!isLoading && !this.onToggleAnalytics" @fadeInDashboardItem>
  <app-dashboard-results-grid [searchResults]="dashboardService.searchGeneralCallbackModel.Result" [query]="dashboardService.searchGeneralParamModel.q" @fadeInDashboardItem></app-dashboard-results-grid>
</div>

<div *ngIf="!this.onToggleAnalytics && !isLoading && !(dashboardService.searchGeneralCallbackModel.Result.length==0)" @fadeInDashboardItem>
  <app-pagination (pageChange)="onPageChange($event)" [maxPages]="Math.ceil(dashboardService.searchGeneralCallbackModel.Page_Count)"></app-pagination>
</div>
