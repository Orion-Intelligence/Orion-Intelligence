<app-dashboard-expanded-result (updatePageNumber)="onPageChange($event)" [suggestion]="dashboardService.searchGeneralCallbackModel.Suggestions[0]" [isLoading]="isLoading" (reloadFilters)="reloadFilters($event)" (updateQuery)="onUpdateQuery($event)" (reloadData)="fetchSearchResults()" [result_count]="dashboardService.searchGeneralCallbackModel.Result.length"></app-dashboard-expanded-result>
<app-dashboard-general-results-grid [query]="dashboardService.searchGeneralParamModel.q" *ngIf="!isLoading" @fadeInDashboardItem></app-dashboard-general-results-grid>

<div *ngIf="!isLoading && !(dashboardService.searchGeneralCallbackModel.Result.length==0)" @fadeInDashboardItem>
  <app-dashboard-pagination (pageChange)="onPageChange($event)" [maxPages]="Math.ceil(dashboardService.searchGeneralCallbackModel.Page_Count)"></app-dashboard-pagination>
</div>
