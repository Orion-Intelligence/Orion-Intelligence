<form class="default-input-container" (submit)="onSearchSubmit($event)" method="GET" action="" enctype="multipart/form-data">
  <img ngSrc="/assets/images/shared/Bg.webp" alt="background" class="app-background img-fluid w-100 h-100 object-fit-cover" priority  fill="true">
  <div class="row dashboard__api-search-input-div ">

    <div class="col-lg-5 col-12 input-container">
      <div class="input-group default-input-sub-container">
        <input autocomplete="off" autocapitalize="none" type="text" placeholder="Username" class="form-control default-input" maxlength="150" name="username" [(ngModel)]="username">
        <input type="hidden" value="1">
        <div class="btn btn-primary default-input-button default-input-button-light">
          <img ngSrc="assets/images/shared/user1.svg" alt="Search" priority  height="20" width="20">
        </div>
      </div>
    </div>

    <div class="col-lg-5 col-12 mt-lg-0 mt-2 input-container">
      <div class="input-group default-input-sub-container">
        <input autocomplete="off" autocapitalize="none" type="email" placeholder="Email" class="form-control default-input" maxlength="150" name="password" [(ngModel)]="email">
        <input type="hidden" value="1">
        <div class="btn btn-primary default-input-button default-input-button-light">
          <img ngSrc="assets/images/shared/email.svg" alt="Search" priority  height="20" width="20">
        </div>
      </div>
    </div>

    <div class="col-2 mt-lg-0 mt-2">
      <button class="dash-search-button">Search</button>
    </div>

  </div>
</form>

<div *ngIf="!loading && !error && this.dashboardService.searchDynamicEmailCallbackbackModel.cards_data.length > 0 && breachData && Object.keys(breachData).length > 0" @fadeInDashboardItem class="dashboard__search-table-container">


  <div class="dashboard__search-table-header">Data Breach List</div>

  <table class="dashboard__search-table">
    <thead>
    <tr>
      <th class="column-id">ID</th>
      <th class="column-key">Key</th>
      <th class="column-value">Value</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let key of (breachData ? Object.keys(breachData) : []); let i = index">
      <td class="cell">{{ i + 1 }}</td>
      <td class="cell">{{ key.replace("m_","").replace("_"," ").toUpperCase() }}</td>
      <td class="cell">
        <ng-container *ngIf="$any(breachData)[key] as value">
          <ng-container *ngIf="Array.isArray(value); else normalValue">
            <span *ngFor="let item of value" class="badge-red">{{ item }}</span>
          </ng-container>
          <ng-template #normalValue>
            <a *ngIf="typeof value === 'string' && value.startsWith('http')" [href]="value" target="_blank">{{ value }}</a>
            <span *ngIf="!(typeof value === 'string' && value.startsWith('http'))">{{ value }}</span>
          </ng-template>
        </ng-container>
        <span *ngIf="!$any(breachData)[key]">N/A</span>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<div *ngIf="loading" @fadeInDashboardItem>
  <app-loading-form></app-loading-form>
</div>

<div *ngIf="query_triggered && !loading && this.dashboardService.searchDynamicEmailCallbackbackModel.cards_data.length==0 " @fadeInDashboardItem>
  <app-dashboard-search-no-suggestion></app-dashboard-search-no-suggestion>
</div>
<div *ngIf="!query_triggered && !loading && this.dashboardService.searchDynamicEmailCallbackbackModel.cards_data.length==0 " @fadeInDashboardItem>
  <app-dashboard-no-result></app-dashboard-no-result>
</div>
