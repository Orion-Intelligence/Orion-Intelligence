<div class="search__result-detail-section-content" *ngIf="listItems.length > 0" [@fadeInUp]="activeTab">
  <ng-container *ngFor="let row of getRows(listItems, 3); let rowIndex = index; let last = last">
    <div class="row p-1">
      <ul class="grid-list">
        <li *ngFor="let item of row; let i = index">
          <span class="item-number">{{ rowIndex * 3 + i + 1 }}.</span> {{ item }}
        </li>
      </ul>
    </div>

    <div *ngIf="!last" class="border-bottom border-bottom-background border-secondary my-2"></div>
  </ng-container>
</div>
