<div class="directory-list__container">
  <table class="table table-striped directory-list__table clear-paddings">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Base URL</th>
        <th scope="col">IP Addresses</th>
        <th scope="col">Attacker</th>
        <th scope="col">Team</th>
        <th scope="col">Web Server</th>
        <th scope="col">Leak Date</th>
        <th scope="col">Web URL</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of (resultData$ | async); let i = index">
        <td>{{ i + 1 }}</td>
        <td>
          <a [href]="item.m_base_url" class="text-decoration-none text-reset">
            {{ item.m_base_url }}
          </a>
        </td>
        <td>{{ item.m_ip.join(', ') }}</td>
        <td>{{ item.m_attacker.join(', ') }}</td>
        <td>{{ item.m_team }}</td>
        <td>{{ item.m_web_server.join(', ') }}</td>
        <td>{{ item.m_leak_date ? item.m_leak_date : 'N/A' }}</td>
        <td>
          <a *ngIf="item.m_web_url.length" [href]="item.m_web_url[0]" class="text-decoration-none text-reset">
            View Leak
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
