<app-result (onToggleSwitch)="onToggleAnalyticsTrigger() " [analyticsToggle]="this.onToggleAnalytics" (updatePageNumber)="onPageChange($event)" [searchQuery]="dashboardService.searchLeakParamModel.q" [suggestion]="dashboardService.searchLeakCallbackModel.Suggestions[0]" [isLoading]="isLoading" (reloadFilters)="reloadFilters($event)" (updateQuery)="onUpdateQuery($event)" (reloadData)="fetchSearchResults()" [result_count]="dashboardService.searchLeakCallbackModel.Result.length"></app-result>

<div *ngIf="this.onToggleAnalytics && !isLoading" @fadeInDashboardItem>
  <app-insights [analytics]="analyticsData"></app-insights>
</div>
<div *ngIf="!isLoading &&  !this.onToggleAnalytics" @fadeInDashboardItem>
  <app-dashboard-results-grid [searchResults]="dashboardService.searchLeakCallbackModel.Result" [query]="dashboardService.searchGeneralParamModel.q" @fadeInDashboardItem></app-dashboard-results-grid>
</div>

<div *ngIf="!isLoading && !(dashboardService.searchLeakCallbackModel.Result.length==0)" @fadeInDashboardItem>
  <app-pagination (pageChange)="onPageChange($event)" [maxPages]="Math.ceil(dashboardService.searchLeakCallbackModel.Page_Count)"></app-pagination>
</div>
