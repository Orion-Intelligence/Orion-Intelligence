<div *ngIf="this.username()" class="relative flex items-center gap-[2px]">
  <ng-container *ngIf="licenseService.isMaintainer()">
    <a *ngIf="isMember()" (click)="openNotifications()" class="relative inline-flex cursor-pointer items-center justify-center px-[20px] pt-[18px] pb-[20px]">
      <div *ngIf="!this.appService.userSessionData().tenant.hasOnboarding" class="relative">
        <img alt="Settings" height="24" ngSrc="assets/images/shared/theme/notification.svg" priority width="24">
        <span
          class="absolute top-[18px] right-[18px] flex h-[13px] w-[13px] items-center justify-center rounded-full text-[6px] font-semibold text-white"
          [ngClass]="getUnseenAlertCount() === 0 ? 'bg-[#00C853]' : 'bg-[#F00]'">
          {{ getUnseenAlertCount() }}
        </span>
      </div>
    </a>
  </ng-container>

  <a *ngIf="router.url !== '/login'" (click)="toggleDropdown($event)" appTooltip="" class="inline-flex cursor-pointer items-center justify-center px-[20px] pt-[18px] pb-[20px]">
    <img alt="Logout" height="24" ngSrc="assets/images/shared/theme/profile-icon.svg" priority width="24">
  </a>

  <ul *ngIf="dropdownOpen()" class="absolute right-[10px] top-[calc(100%+8px)] z-[3] w-[220px] list-none rounded-[8px] bg-white p-[16px] pb-[8px] text-[15px] shadow-[0_4px_10px_#0000001a]">
    <div class="absolute top-[-10px] right-[15px] h-0 w-0 border-l-[8px] border-r-[8px] border-b-[10px] border-l-transparent border-r-transparent border-b-white"></div>

    <li class="flex min-w-full items-center">
      <div class="h-[48px] w-[48px] shrink-0 overflow-hidden rounded-full bg-[#e0e6ed]">
        <img [src]="this.appService.userSessionData().user.image" alt="" class="h-full w-full object-cover" />
      </div>
      <div class="flex flex-col px-[12px]">
        <div class="max-w-[130px] overflow-hidden text-ellipsis whitespace-nowrap text-[14px] font-medium text-[#344054]">{{ username() }}</div>
        <div class="max-w-[130px] overflow-hidden text-ellipsis whitespace-nowrap text-[12px] font-normal text-[#a0b8d1]" appTooltip="Active License">{{ licences }}</div>
      </div>
    </li>

    <li *ngIf="!this.appService.userSessionData().tenant.hasOnboarding && (licenseService.isMaintainer() || isAdmin())" class="mt-[8px] flex cursor-pointer items-center gap-[10px] rounded-[8px] px-[4px] py-[12px] hover:bg-[#f5f7fa]" (click)="auditlog();closeDropdown($event)">
      <img src="assets/images/shared/profile.svg" alt="Auditlog" class="h-[19px] w-[19px]" />
      <span class="text-[14px] font-medium text-[#172235]">Auditlog</span>
    </li>

    <li *ngIf="!isAdmin() &&licenseService.isMaintainer() && !this.appService.userSessionData().tenant.hasOnboarding" class="flex cursor-pointer items-center gap-[10px] rounded-[8px] px-[4px] py-[12px] hover:bg-[#f5f7fa]" (click)="manageIocs();closeDropdown($event)">
      <img src="assets/images/shared/info-dark.svg" alt="Manage IOC’s" class="h-[19px] w-[19px]" />
      <span class="text-[14px] font-medium text-[#172235]">Manage IOC’s</span>
    </li>

    <li *ngIf="!isAdmin() && !isDemo()" class="flex cursor-pointer items-center gap-[10px] rounded-[8px] px-[4px] py-[12px] hover:bg-[#f5f7fa]" (click)="changePassword()">
      <img src="assets/images/shared/forgot.svg" alt="Change Password" class="h-[19px] w-[19px]" />
      <span class="text-[14px] font-medium text-[#172235]">Change Password</span>
    </li>

    <li *ngIf="!this.appService.userSessionData().tenant.hasOnboarding && (licenseService.isMaintainer() ||isAdmin())" class="flex cursor-pointer items-center gap-[10px] rounded-[8px] px-[4px] py-[12px] hover:bg-[#f5f7fa]" (click)="openAccountSettings();closeDropdown($event)">
      <img src="assets/images/shared/settings.svg" alt="Account settings" class="h-[19px] w-[19px]" />
      <span class="text-[14px] font-medium text-[#172235]">Account settings</span>
    </li>
    <li *ngIf="isAdmin()" class="flex cursor-pointer items-center gap-[10px] rounded-[8px] px-[4px] py-[12px] hover:bg-[#f5f7fa]">
      <a class="flex items-center gap-[10px]" href="admin/" target="_blank">
        <img alt="Settings" height="15" ngSrc="assets/images/shared/settings.svg" priority width="15" class="h-[19px] w-[19px]">
        <span class="text-[14px] font-medium text-[#172235]">Settings</span>
      </a>
    </li>
    <li *ngIf="appService.userSessionData().tenant.hasOnboarding" (click)="toggleThemeByClick();closeDropdown($event)" class="flex cursor-pointer items-center gap-[10px] rounded-[8px] px-[4px] py-[12px] hover:bg-[#f5f7fa]">
      <div class="flex items-center gap-[10px]">
        <img alt="Settings" src="assets/images/shared/theme.svg" class="h-[19px] w-[19px]">
        <span class="text-[14px] font-medium text-[#172235]">Theme</span>
      </div>
      <span class="ml-auto inline-flex h-[18px] w-[30px] items-center rounded-full bg-[#000]">
        <span class="h-[14px] w-[14px] rounded-full bg-white transition" [ngClass]="isDarkTheme ? 'translate-x-[12px]' : 'translate-x-0'"></span>
      </span>
    </li>
    <li (click)="openSupportPopup();closeDropdown($event)" class="flex cursor-pointer items-center gap-[10px] rounded-[8px] px-[4px] py-[12px] hover:bg-[#f5f7fa]">
      <img alt="Support" src="assets/images/shared/support.svg" class="h-[19px] w-[19px]">
      <span class="text-[14px] font-medium text-[#172235]">Help & Support</span>
    </li>

    <li class="my-[6px] h-[1px] bg-[#e5e7eb]"></li>

    <li class="flex cursor-pointer items-center gap-[10px] rounded-[8px] px-[4px] py-[12px] hover:bg-[#f5f7fa]" (click)="logout();closeDropdown($event)">
      <img src="assets/images/shared/logout.svg" alt="Sign out" class="h-[19px] w-[19px]" />
      <span class="text-[14px] font-medium text-[#172235]">Sign out</span>
    </li>
  </ul>

  <div class="relative">
    <app-alert-notification [isNotificationOpen]="isNotificationOpen()" (closeNotification)="closeNotifications()"></app-alert-notification>
  </div>
</div>
