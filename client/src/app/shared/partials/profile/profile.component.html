<div *ngIf="this.username()" class="profile">
  <ng-container *ngIf="licenseService.isMaintainer()">
    <a *ngIf="isMember()" (click)="openNotifications()" class="profile-dropdown-toggle notification-icon">
      <div class="profile_category profile_logout_icon">
        <img alt="Settings" height="24" ngSrc="assets/images/shared/theme/notification.svg" priority width="24">
        <span class="notification-badge" [ngClass]="getUnseenAlertCount() === 0 ? 'green-badge' : 'red-badge'">
          {{ getUnseenAlertCount() }}
        </span>
      </div>
    </a>
  </ng-container>
  <a *ngIf="router.url !== '/login'" (click)="toggleDropdown($event)" appTooltip="" class="profile-dropdown-toggle">
    <div class="profile_category profile_logout_icon">
      <img alt="Logout" height="24" ngSrc="assets/images/shared/theme/profile-icon.svg" priority width="24">
    </div>
  </a>
  <ul [class.show]="dropdownOpen()" class="profile-dropdown profile-dropdown-width">
    <div class="profile-dropdown-arrow"></div>

    <li class="profile-section">
      <div class="profile-avatar">
        <img [src]="profile_image" alt="" />
      </div>
      <div class="profile-name-mail-container">
        <div class="profile-name">{{ username()}}</div>
        <div class="profile-email" appTooltip="Active License">{{ licences }}</div>
      </div>
    </li>

    <li *ngIf="licenseService.isMaintainer() || isAdmin()" class="profile-item" (click)="auditlog()">
      <img src="assets/images/shared/profile.svg" alt="Auditlog" />
      <span>Auditlog</span>
    </li>

    <li *ngIf="licenseService.isMaintainer()" class="profile-item" (click)="manageIocs()">
      <img src="assets/images/shared/info-dark.svg" alt="Manage IOC’s" />
      <span>Manage IOC’s</span>
    </li>

    <li *ngIf="!isAdmin()" class="profile-item" (click)="changePassword()">
      <img src="assets/images/shared/forgot.svg" alt="Change Password" />
      <span>Change Password</span>
    </li>

    <li *ngIf="licenseService.isMaintainer() ||isAdmin()" class="profile-item" (click)="openAccountSettings()">
      <img src="assets/images/shared/settings.svg" alt="Account settings" />
      <span>Account settings</span>
    </li>
    <li><a *ngIf="isAdmin()" class="profile-item" href="admin/" target="_blank"> <img alt="Settings" height="15"
          ngSrc="assets/images/shared/settings.svg" priority width="15"> <span>Settings</span></a>
    </li>
    <li *ngIf="appService.userSessionData().user.hasOnboarding" (click)="toggleThemeByClick()">
      <div class=" profile_theme-toggle profile-item">
        <img alt="Settings" (click)="toggleThemeByClick()" src="assets/images/shared/theme.svg">
        <span> Theme</span>
        <label class="small-switch">
          <span [class.active]="isDarkTheme" class="small-slider round"></span>
        </label>
      </div>
    </li>

    <li>
      <hr class="profile-divider" />
    </li>

    <li class="profile-item" (click)="logout()">
      <img src="assets/images/shared/logout.svg" alt="Sign out" />
      <span>Sign out</span>
    </li>
  </ul>
  <div [class.sidebar_container-disable]="!isNotificationOpen()" [class.filter__container-enable]="isNotificationOpen()"
    class="sidebar_container">
    <app-alert-notification [isNotificationOpen]="isNotificationOpen()"
      (closeNotification)="closeNotifications()"></app-alert-notification>
  </div>
</div>
