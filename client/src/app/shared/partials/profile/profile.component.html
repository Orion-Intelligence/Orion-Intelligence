<div *ngIf="this.username$|async" class="profile">
  <ng-container *ngIf="licenseService.isMaintainer()">
    <a *ngIf="isProfile()" (click)="openNotifications()" class="profile-dropdown-toggle notification-icon">
      <div class="profile_category profile_logout_icon">
        <img alt="Settings" height="24" ngSrc="assets/images/shared/theme/notification.svg" priority width="24">
        <span class="notification-badge" [ngClass]="getUnseenAlertCount() === 0 ? 'green-badge' : 'red-badge'">
          {{ getUnseenAlertCount() }}
        </span>
      </div>
    </a>
  </ng-container>
  <a *ngIf="router.url !== '/login'" (click)="toggleDropdown($event)" appTooltip="" class="profile-dropdown-toggle">
    <div class="profile_category profile_logout_icon">
      <img alt="Logout" height="24" ngSrc="assets/images/shared/theme/profile-icon.svg" priority width="24">
    </div>
  </a>
  <ul [class.show]="dropdownOpen()" class="profile-dropdown"
    [ngClass]="{'profile-dropdown-width': !isAdmin() && licenseService.isMaintainer()}">
    <div class="profile-dropdown-arrow"></div>
    <ng-container *ngIf="isAdmin(); else notAdmin">
      <li>
        <a class="dropdown-item disabled">
          <img alt="Settings" height="15" ngSrc="assets/images/shared/profile.svg" width="15" />
          &nbsp;{{ username$ | async }}
        </a>
      </li>

      <li class="dropdown-item d-flex align-items-center disabled">
        <span class="bg-success rounded-circle d-inline-block me-2 profile_user-active"></span>
        &nbsp;&nbsp;active
      </li>

      <li>
        <hr class="dropdown-divider mx-3" />
      </li>

      <li (click)="toggleThemeByClick()">
        <div class="dropdown-item profile_theme-toggle">
          <img alt="Theme" height="15" ngSrc="assets/images/shared/theme.svg" width="15" />
          &nbsp; Theme
          <label class="small-switch">
            <span [class.active]="isDarkTheme" class="small-slider round"></span>
          </label>
        </div>
      </li>
      <li>
        <a class="dropdown-item" href="admin/" target="_blank">
          <img alt="Settings" height="15" ngSrc="assets/images/shared/settings.svg" width="15" />
          &nbsp; Settings
        </a>
      </li>

      <li>
        <hr class="dropdown-divider mx-3" />
      </li>

      <li>
        <a (click)="logout()" class="dropdown-item">
          <img alt="Logout" height="15" ngSrc="assets/images/shared/logout.svg" width="15" />
          &nbsp; Logout
        </a>
      </li>
    </ng-container>

    <ng-template #notAdmin>

      <ng-container *ngIf="licenseService.isMaintainer(); else notMaintainer">
        <li class="profile-section">
          <div class="profile-avatar">
            <img [src]="currentImageUrl || 'assets/images/shared/default-profile.svg'" alt="" />
          </div>
          <div class="profile-name-mail-container">
            <div class="profile-name">{{ username$ | async }}</div>
            <div class="profile-email" appTooltip="Active License">{{ licences }}</div>
          </div>
        </li>

        <li class="profile-item" (click)="auditlog()">
          <img src="assets/images/shared/profile.svg" alt="Auditlog" />
          <span>Auditlog</span>
        </li>

        <li class="profile-item" (click)="manageIocs()">
          <img src="assets/images/shared/info-dark.svg" alt="Manage IOC’s" />
          <span>Manage IOC’s</span>
        </li>

        <li class="profile-item" (click)="openAccountSettings()">
          <img src="assets/images/shared/settings.svg" alt="Account settings" />
          <span>Account settings</span>
        </li>

        <li>
          <hr class="profile-divider" />
        </li>

        <li class="profile-item" (click)="logout()">
          <img src="assets/images/shared/logout.svg" alt="Sign out" />
          <span>Sign out</span>
        </li>
      </ng-container>

      <ng-template #notMaintainer>
        <li>
          <a class="dropdown-item disabled">
            <img alt="User" height="15" ngSrc="assets/images/shared/profile.svg" width="15" />
            &nbsp;{{ username$ | async }}
          </a>
        </li>

        <li class="dropdown-item d-flex align-items-center disabled">
          <span class="bg-success rounded-circle d-inline-block me-2 profile_user-active"></span>
          &nbsp;&nbsp;{{ licences }}
        </li>

        <li>
          <hr class="dropdown-divider mx-3" />
        </li>

        <li (click)="toggleThemeByClick()">
          <div class="dropdown-item profile_theme-toggle">
            <img alt="Theme" height="15" ngSrc="assets/images/shared/theme.svg" width="15" />
            &nbsp; Theme
            <label class="small-switch">
              <span [class.active]="isDarkTheme" class="small-slider round"></span>
            </label>
          </div>
        </li>
        <li>
          <hr class="dropdown-divider mx-3" />
        </li>

        <li>
          <a (click)="logout()" class="dropdown-item">
            <img alt="Logout" height="15" ngSrc="assets/images/shared/logout.svg" width="15" />
            &nbsp; Logout
          </a>
        </li>
      </ng-template>

    </ng-template>

  </ul>
  <div [class.sidebar_container-disable]="!(isNotificationOpen$ | async)"
    [class.filter__container-enable]="isNotificationOpen$ | async" class="sidebar_container">
    <app-alert-notification [isNotificationOpen]="isNotificationOpen$ |async"
      (closeNotification)="closeNotifications()"></app-alert-notification>
  </div>
</div>
