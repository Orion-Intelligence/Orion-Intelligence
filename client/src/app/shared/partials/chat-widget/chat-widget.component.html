<div class="chat-support">
  <div *ngIf="!chatOpen" class="chat-toggle" (click)="openChat()">
    <span><img src="assets/images/shared/chat.svg" alt="chat" /></span>
  </div>

  <div *ngIf="chatOpen" class="chat-window">
    <div class="chat-header">
      Support Bot
      <span class="close-btn" (click)="chatOpen = false">✖️</span>
    </div>

    <div class="chat-messages">
      <div *ngFor="let msg of chatMessages; trackBy: trackByIndex" class="chat-msg" [class.user]="msg.sender === 'user'" [class.bot]="msg.sender === 'bot'">
        <p class="chat-text">{{ msg.text }}</p>
        <span class="timestamp">{{ msg.time | date: 'shortTime' }}</span>
      </div>

      <div *ngIf="isBotTyping" class="chat-msg bot typing-indicator">
        <p class="chat-text">Typing...</p>
      </div>
    </div>

    <form class="chat-input" (submit)="sendMessage($event)">
      <input type="text" [(ngModel)]="newMessage" name="message" placeholder="Ask something..." required />
      <button type="submit"><img src="assets/images/shared/chat_small.svg" alt="chat"></button>
    </form>
  </div>
</div>
