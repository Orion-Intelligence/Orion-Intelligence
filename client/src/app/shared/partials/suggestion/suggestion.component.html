<div class="result-suggestion" *ngIf="suggestion.length<10 && suggestion.length!=0">
  <div>
    <h6 class="result-suggestion-error">
      <span class="result-suggestion-header">Did you mean: </span>
      <span class="result-suggestion-info">
          <a class="gc-clear-selection result-suggestion-select" (click)="onUpdateQuery()">&nbsp;<b>{{ suggestion }}</b>&nbsp;?</a>
        </span>
    </h6>
  </div>
</div>
