<div *ngIf="suggestion.length<10 && suggestion.length!=0" class="result-suggestion">
  <div>
    <h6 class="result-suggestion-error">
      <span class="result-suggestion-header">Did you mean: </span> <span class="result-suggestion-info">
          <a (click)="onUpdateQuery()" class="gc-clear-selection result-suggestion-select">&nbsp;<b>{{ suggestion }}</b>&nbsp;?</a>
        </span>
    </h6>
  </div>
</div>
