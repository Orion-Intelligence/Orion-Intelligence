<img src="/assets/images/shared/Bg.webp" alt="background" class="app-background img-fluid w-100 h-100 object-fit-cover">
<app-result [showAnalytics]="false" [type]="type" [filterModel]="defacement_filters" [searchQuery]="query"
  [isLoading]="isLoading" (reloadFilters)="reloadFilters($event)" (resetFilter)="resetFilters($event)"
  (updateQuery)="onUpdateQuery($event)" (reloadData)="fetchSearchResults()"
  [result_count]="Math.ceil(currentCallbackModel.Result.length)"></app-result>

<div *ngIf="!isLoading && this.defacementCallbackModel.Result.length" @fadeInDashboardItem>
  <app-dashboard-result-list [searchResults]="defacementCallbackModel.Result"></app-dashboard-result-list>
</div>

<div *ngIf="!isLoading && this.defacementCallbackModel.Result.length > 0" @fadeInDashboardItem
  class="pagination-margin">
  <app-pagination (pageChange)="onPageChange($event)"
    [maxPages]="Math.ceil(this.defacementParamModel.mSearchParamPage * this.defacementCallbackModel.Page_Count)"></app-pagination>
</div>
