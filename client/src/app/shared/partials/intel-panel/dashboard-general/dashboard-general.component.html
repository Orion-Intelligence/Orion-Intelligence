<img alt="background" class="app-background img-fluid w-100 h-100 object-fit-cover" src="/assets/images/shared/Bg.webp">
<app-result (onToggleSwitch)="onToggleAnalyticsTrigger()" (reloadData)="fetchSearchResults(true)" (reloadFilters)="reloadFilters($event)"
            (resetFilter)="resetFilters($event)" (updateQuery)="onUpdateQuery($event)"
            [analyticsToggle]="onToggleAnalytics" [filterModel]="general_filters"
            [isLoading]="isLoading" [result_count]="Math.ceil(currentCallbackModel.Result.length)"
            [searchQuery]="query" [suggestion]="currentCallbackModel.Suggestions[0]"
            [type]="type"></app-result>

<div *ngIf="onToggleAnalytics && !isLoading" @fadeInDashboardItem>
  <app-insights [analytics]="analyticsData"></app-insights>
</div>

<div *ngIf="!isLoading && !onToggleAnalytics" @fadeInDashboardItem>
  <app-dashboard-results-grid @fadeInDashboardItem [query]="currentQuery" [searchResults]="currentSearchResults"
                              [type]="type"></app-dashboard-results-grid>
</div>

<div *ngIf="!onToggleAnalytics && !isLoading && currentResultCount > 0" @fadeInDashboardItem class="pagination-margin">
  <app-pagination (pageChange)="onPageChange($event)"
                  [maxPages]="Math.floor(currentCallbackModel.Page_Count)"></app-pagination>
</div>
