<div class="dashboard__search-container">
  <ng-container *ngFor="let item of searchResults" class="dashboard__search-card">

    <div [id]="'item-' + item.m_hash" class="dashboard__search-main-div" [routerLink]="[currentUrl, item.m_hash]" [queryParams]="queryParams" (click)="scrollService.saveSession(item.m_hash)">

      <div class="dashboard__search-tags">
        <span *ngFor="let tag of item.m_content_type" class="dashboard__tag">{{ tag }}</span>
      </div>

      <h2 class="dashboard__search-title">{{ item.m_title }}</h2>
      <p class="dashboard__search-description" [innerHTML]="item.m_important_content.slice(0,600)"></p>

      <ng-container *ngIf="item.m_highlighted && item.m_highlighted.length>0">
        <span class="search__result-detail-description-span highlight"><b>Search Tracker</b></span>
        <p class="dashboard__search-description dashboard__search-description-light" [innerHTML]="highlightWords(item.m_highlighted)"></p>
      </ng-container>

      <div class="dashboard__search-link">{{ item.m_url }}</div>

      <div class="dashboard__search-info">
        <div class="dashboard__search-info-item">
          <span class="dashboard__info-label">Published on:</span>
            <span class="dashboard__info-value">{{ item?.m_leak_date ? (item.m_leak_date | date: 'MMM d, y') : 'Not found' }}</span>
        </div>
        <div class="dashboard__search-info-item">
          <span class="dashboard__info-label">Network:</span>
          <span class="dashboard__info-value">{{ item.m_network }}</span>
        </div>
        <div class="dashboard__search-info-item">
          <span class="dashboard__info-label">Updated on:</span>
          <span class="dashboard__info-value">{{ item?.m_creation_date | date: 'mediumDate' }}</span>
        </div>
        <div class="dashboard__search-status">
          <span class="dashboard__info-label">Status</span>
          <div class="d-flex align-items-center">
            <span class="dashboard__status-dot"></span>
            <span class="dashboard__status-text">&nbsp;active</span>
          </div>
        </div>
      </div>

    </div>
  </ng-container>
</div>
