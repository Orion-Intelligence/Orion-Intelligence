<div class="chart-container">
    <!-- "Statistics" text at the top left corner -->
    <div class="statistics-text">Statistics</div>

    <!-- Display the chart title -->
    <div *ngIf="graphModel?.title" class="chart-title">
        {{ graphModel.title }}
    </div>

    <!-- Horizontal line separator -->
    <div class="separator-line"></div>

    <!-- The canvas element where the chart will be drawn -->
    <canvas #chartCanvas class="chart-canvas" (mousemove)="onMouseMove($event)" (mouseleave)="onMouseLeave()">
    </canvas>
</div>
