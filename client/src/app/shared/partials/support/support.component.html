<ng-container *ngIf="isTailwindReady; else tailwindLoading">
  <div class="fixed inset-0 z-[2000] flex items-center justify-center bg-black/55 p-4" @overlayAnimation>
    <div class="w-full max-w-lg rounded-2xl border border-[var(--color-border)] bg-[var(--color-blue-830)] text-[var(--color-text1)] shadow-[0_0_30px_rgba(0,0,0,0.3)]" @popupAnimation>
      <div class="flex items-center justify-between border-b border-[var(--color-border)] px-5 py-4">
        <h2 class="text-lg font-semibold text-[var(--color-text1)]">Contact Support</h2>
        <button type="button" (click)="close()" class="inline-flex h-[42px] w-[42px] items-center justify-center rounded-[8px] text-[28px] leading-none text-[#ccc] transition-colors hover:text-[var(--color-blue-640)]" title="Close">
          ×
        </button>
      </div>

      <div class="space-y-4 px-5 py-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-[var(--color-text2)]">Email</label>
          <input type="email" name="email" [(ngModel)]="supportModel.email" #emailInput="ngModel" required email placeholder="your@email.com" [ngClass]="{ 'ring-rose-500 focus:ring-rose-500': emailInput.invalid && submitAttempted }" class="block w-full rounded-lg border-0 bg-[var(--color-blue-700)] px-3 py-2.5 text-[var(--color-text1)] ring-1 ring-inset ring-[var(--color-border)] placeholder:text-[var(--color-text4)] focus:outline-none focus:ring-2 focus:ring-[var(--color-blue-640)] sm:text-sm" />
          <div *ngIf="emailInput.invalid && submitAttempted" class="mt-1 text-xs text-rose-500">
            <span *ngIf="emailInput.errors?.['required']">Email cannot be empty</span>
            <span *ngIf="emailInput.errors?.['email']">Enter a valid email address</span>
          </div>
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-[var(--color-text2)]">Subject</label>
          <input type="text" [(ngModel)]="supportModel.subject" #subjectInput="ngModel" required placeholder="Write your subject" [ngClass]="{ 'ring-rose-500 focus:ring-rose-500': subjectInput.invalid && submitAttempted }" class="block w-full rounded-lg border-0 bg-[var(--color-blue-700)] px-3 py-2.5 text-[var(--color-text1)] ring-1 ring-inset ring-[var(--color-border)] placeholder:text-[var(--color-text4)] focus:outline-none focus:ring-2 focus:ring-[var(--color-blue-640)] sm:text-sm" />
          <div *ngIf="subjectInput.invalid && submitAttempted" class="mt-1 text-xs text-rose-500">
            Subject cannot be empty
          </div>
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-[var(--color-text2)]">Message</label>
          <textarea rows="5" [(ngModel)]="supportModel.message" #messageInput="ngModel" required placeholder="Write your message..." [ngClass]="{ 'ring-rose-500 focus:ring-rose-500': messageInput.invalid && submitAttempted }" class="block w-full rounded-lg border-0 bg-[var(--color-blue-700)] px-3 py-2.5 text-[var(--color-text1)] ring-1 ring-inset ring-[var(--color-border)] placeholder:text-[var(--color-text4)] focus:outline-none focus:ring-2 focus:ring-[var(--color-blue-640)] sm:text-sm"></textarea>
          <div *ngIf="messageInput.invalid && submitAttempted" class="mt-1 text-xs text-rose-500">
            Message cannot be empty
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 border-t border-[var(--color-border)] px-5 py-4">
        <div *ngIf="errorMessage" class="mr-auto text-xs text-rose-500">
          {{ errorMessage }}
        </div>
        <button type="button" (click)="close()" class="h-[42px] rounded-[8px] border border-[#A0B8D1] bg-transparent px-[24px] text-[14px] text-[var(--color-text1)] transition-colors hover:bg-[var(--color-blue-700)]">
          Cancel
        </button>
        <button type="button" (click)="submit()" [disabled]="isSubmitting" class="h-[42px] rounded-[8px] bg-[#57A5EB] px-[24px] text-[14px] font-medium text-[#0e1626] transition-colors hover:bg-[#4b98dc] disabled:cursor-not-allowed disabled:bg-[var(--color-blue-810)] disabled:text-[var(--color-text4)]">
          {{ isSubmitting ? 'Sending...' : 'Send Message' }}
        </button>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #tailwindLoading>
  <div class="fixed inset-0 z-[2000] bg-[rgba(2,6,23,0.5)]"></div>
</ng-template>
