<ul class="json-tree json-tree--depth-{{ level }}">
  <ng-container *ngFor="let key of keys(json); let last = last">
    <li [class.json-tree__node--last]="last" class="json-tree__node">
      <div (click)="isCollapsible(json[key]) && toggle(pathKey(parentPath, key))" class="json-tree__line">
        <span *ngIf="isCollapsible(json[key])" class="json-tree__toggle">
          <img *ngIf="isExpanded(pathKey(parentPath, key)); else collapsedIcon" src="/assets/images/shared/search_side_dropdown_icon_dark.svg" alt="Expanded" width="20" height="20"/>
          <ng-template #collapsedIcon>
            <img [ngClass]="{ 'rotated': !isExpanded(pathKey(parentPath, key)) }" src="/assets/images/shared/search_side_dropdown_icon_dark.svg" alt="Collapsed" width="20" height="20"/>
          </ng-template>
        </span> <span class="json-tree__key json-tree__key--faded ms-1">{{ key }}</span>
      </div>

      <div *ngIf="isExpanded(pathKey(parentPath, key))" class="json-tree__children">
        <ng-container *ngIf="isObject(json[key]); else jsonLeaf">
          <app-json-viewer [json]="json[key]" [level]="level + 1" [parentPath]="pathKey(parentPath, key)"></app-json-viewer>
        </ng-container>

        <ng-template #jsonLeaf>
          <ul class="json-tree json-tree--depth-{{ level + 1 }}">
            <li class="json-tree__node json-tree__node--last">
              <div class="json-tree__line json-tree__line--leaf">
                <strong class="json-tree__value">{{ json[key] }}</strong>
              </div>
            </li>
          </ul>
        </ng-template>
      </div>
    </li>
  </ng-container>
</ul>
