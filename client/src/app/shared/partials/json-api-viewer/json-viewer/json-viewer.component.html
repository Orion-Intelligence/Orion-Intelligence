<ul class="json-tree json-tree--depth-{{ level }}">
  <ng-container *ngFor="let key of keys(json); let last = last">
    <li class="json-tree__node" [class.json-tree__node--last]="last">
      <div class="json-tree__line" (click)="isCollapsible(json[key]) && toggle(pathKey(parentPath, key))">
        <span class="json-tree__toggle" *ngIf="isCollapsible(json[key])">
          {{ isExpanded(pathKey(parentPath, key)) ? '▼' : '▶' }}
        </span>
        <span class="json-tree__key json-tree__key--faded ms-1">{{ key }}</span>
      </div>

      <div class="json-tree__children" *ngIf="isExpanded(pathKey(parentPath, key))">
        <ng-container *ngIf="isObject(json[key]); else jsonLeaf">
          <app-json-viewer
            [json]="json[key]"
            [level]="level + 1"
            [parentPath]="pathKey(parentPath, key)">
          </app-json-viewer>
        </ng-container>

        <ng-template #jsonLeaf>
          <ul class="json-tree json-tree--depth-{{ level + 1 }}">
            <li class="json-tree__node json-tree__node--last">
              <div class="json-tree__line json-tree__line--leaf">
                <strong class="json-tree__value">{{ json[key] }}</strong>
              </div>
            </li>
          </ul>
        </ng-template>
      </div>
    </li>
  </ng-container>
</ul>
