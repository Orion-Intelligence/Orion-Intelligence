<div class="mt-4 mx-[12px] sm:mx-[15px] lg:mx-[30px] overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-700)] ui-result-card bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.014)_0px,rgba(255,255,255,0.014)_1px,transparent_1px,transparent_12px)] p-4 shadow-[0_6px_18px_var(--color-shadow-light)]">
  <div (click)="toggleContent()" class="flex cursor-pointer items-start justify-between gap-3">
    <div class="min-w-0">
      <div class="flex items-center gap-2 text-[16px] font-semibold leading-tight text-[var(--color-text1)]">
        <img src="/assets/images/shared/theme/info.svg" alt="Icon" class="h-5 w-5 shrink-0 ui-action-icon" appTooltip="The JSON response contains the complete data that would be returned in an actual API call">
        <span class="truncate">Json Response</span>
      </div>
      <p class="mt-1 text-[12px] leading-relaxed text-[var(--color-text4)]">Complete API payload for this report in structured JSON format.</p>
    </div>
    <div class="mt-[2px] flex shrink-0 items-center gap-2">
      <button type="button" (click)="copyJson($event)" class="relative inline-flex h-9 w-9 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-790)] ui-result-card-soft bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.014)_0px,rgba(255,255,255,0.014)_1px,transparent_1px,transparent_12px)] text-[var(--color-text1)] transition hover:bg-[var(--color-blue-720)]" appTooltip="Copy JSON">
        <i class="bi bi-clipboard-fill text-[17px] font-bold"></i>
        @if (copied) {
          <span class="absolute -bottom-6 left-1/2 -translate-x-1/2 whitespace-nowrap rounded bg-[var(--color-blue-640)] px-2 py-[2px] text-[10px] font-semibold text-white">Copied</span>
        }
      </button>
      <div [attr.aria-label]="isExpanded ? 'Collapse' : 'Expand'" class="flex h-9 w-9 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-790)] ui-result-card-soft bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.014)_0px,rgba(255,255,255,0.014)_1px,transparent_1px,transparent_12px)]">
        <img [ngClass]="{ 'rotate-180': !isExpanded }" alt="toggle icon" class="h-[18px] w-[18px] transition ui-action-icon" src="/assets/images/shared/theme/search_side_dropdown_icon_dark.svg">
      </div>
    </div>
  </div>
  @if (isExpanded) {
    <div class="mt-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-790)] ui-result-card-soft p-3">
      <app-json-viewer [json]="jsonData()" [showRootBraces]="true"></app-json-viewer>
    </div>
  }
</div>
