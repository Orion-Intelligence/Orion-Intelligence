<div class="collapsible-container">
  <div (click)="toggleContent()" class="file-header p-3">
    <span class="title">JSON API</span>
    <div [attr.aria-label]="isExpanded ? 'Collapse' : 'Expand'" class="toggle-btn">
      <img [ngClass]="{ 'rotated': !isExpanded }"
           alt="toggle icon" src="/assets/images/shared/search_side_dropdown_icon.svg">
    </div>
  </div>
  <div *ngIf="isExpanded" class="content p-3">
    <app-json-viewer [json]="jsonData"></app-json-viewer>
  </div>
</div>
