<div class="collapsible-container">
  <div class="file-header p-3"  (click)="toggleContent()">
    <span class="title">JSON API</span>
    <div class="toggle-btn" [attr.aria-label]="isExpanded ? 'Collapse' : 'Expand'">
      <img src="/assets/images/shared/search_side_dropdown_icon.svg"
           [ngClass]="{ 'rotated': !isExpanded }" alt="toggle icon">
    </div>
  </div>
  <div class="content p-3" *ngIf="isExpanded">
    <app-json-viewer [json]="jsonData"></app-json-viewer>
  </div>
</div>
