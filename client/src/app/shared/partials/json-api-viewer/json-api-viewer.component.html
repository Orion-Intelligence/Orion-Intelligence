<div class="mt-4 rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-700)] p-4">
  <div (click)="toggleContent()" class="flex cursor-pointer items-center justify-between">
    <div class="flex items-center gap-2 text-sm font-semibold text-[var(--color-text1)]">
      Json response <img src="/assets/images/shared/theme/info.svg" alt="Icon" appTooltip="The JSON response contains the complete data that would be returned in an actual API call">
    </div>
    <div [attr.aria-label]="isExpanded ? 'Collapse' : 'Expand'" class="flex h-8 w-8 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)]">
      <img [ngClass]="{ 'rotate-180': !isExpanded }" alt="toggle icon" class="transition" src="/assets/images/shared/theme/search_side_dropdown_icon_dark.svg">
    </div>
  </div>
  <div *ngIf="isExpanded" class="mt-3 text-xs text-[var(--color-text4)]">
    The JSON response contains the complete data that would be returned in an actual API call.
  </div>
  <div *ngIf="isExpanded" class="mt-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-810)] p-3">
    <app-json-viewer [json]="jsonData"></app-json-viewer>
  </div>
</div>
