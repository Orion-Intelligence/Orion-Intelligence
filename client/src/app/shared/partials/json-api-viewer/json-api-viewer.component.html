<div class="mt-4 mx-[12px] sm:mx-[15px] lg:mx-[30px] overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-700)] ui-result-card [&&]:!bg-[var(--color-blue-700)] [body.light-theme_&&]:!border-[#d7e2ee] [body.light-theme_&&]:!bg-white [body.light-theme_&&]:!bg-[repeating-linear-gradient(135deg,rgba(15,23,42,0.022)_0,rgba(15,23,42,0.022)_1px,transparent_1px,transparent_12px)] [body.light-theme_&&]:!shadow-none bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.014)_0px,rgba(255,255,255,0.014)_1px,transparent_1px,transparent_12px)] p-4 shadow-[0_6px_18px_var(--color-shadow-light)]">
  <div (click)="toggleContent()" class="flex cursor-pointer items-start justify-between gap-3">
    <div class="min-w-0">
      <div class="flex items-center gap-2 text-[16px] font-semibold leading-tight text-[var(--color-text1)]">
        <img src="/assets/images/shared/theme/info.svg" alt="" class="h-5 w-5 shrink-0 ui-action-icon" [appTooltip]="'The JSON response contains the complete data that would be returned in an actual API call' | translate">
        <span class="truncate">{{ 'Json Response' | translate }}</span>
      </div>
      <p class="mt-1 text-[12px] leading-relaxed text-[var(--color-text4)]">{{ 'Complete API payload for this report in structured JSON format.' | translate }}</p>
    </div>
    <div class="mt-[2px] flex shrink-0 items-center gap-2">
      <button type="button" (click)="copyJson($event)" class="relative inline-flex h-9 w-9 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-790)] [&&]:!bg-[var(--color-blue-790)] [body.light-theme_&&]:!bg-[#f6faff] bg-[repeating-linear-gradient(135deg,rgba(255,255,255,0.014)_0px,rgba(255,255,255,0.014)_1px,transparent_1px,transparent_12px)] text-[var(--color-text1)] transition hover:bg-[var(--color-blue-720)]" [appTooltip]="'Copy JSON' | translate">
        <i class="bi bi-clipboard-fill text-[17px] font-bold"></i>
        @if (copied) {
          <span class="absolute -bottom-6 left-1/2 -translate-x-1/2 whitespace-nowrap rounded bg-[var(--color-blue-640)] px-2 py-[2px] text-[10px] font-semibold text-white">{{ 'Copied' | translate }}</span>
        }
      </button>
      <div [attr.aria-label]="(isExpanded ? 'Collapse' : 'Expand') | translate" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-transparent transition-[border-color,transform] duration-150 hover:border-[var(--color-blue-640)] hover:-translate-y-[1px]">
        <img [ngClass]="{ 'rotate-180': !isExpanded }" alt="" aria-hidden="true" src="/assets/images/shared/theme/search_side_dropdown_icon_dark.svg" class="h-5 w-5 brightness-0 invert transition-transform duration-150 [body.light-theme_&]:[filter:none]">
      </div>
    </div>
  </div>
  @if (isExpanded) {
    <div class="mt-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-790)] [&&]:!bg-[var(--color-blue-790)] [body.light-theme_&&]:!bg-[#f6faff] p-3">
      <app-json-viewer [json]="jsonData()" [showRootBraces]="true"></app-json-viewer>
    </div>
  }
</div>
