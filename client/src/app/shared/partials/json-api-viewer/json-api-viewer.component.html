<div class="mt-4 ml-[30px] w-[calc(100%-60px)] overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-700)] p-4 shadow-[0_6px_18px_var(--color-shadow-light)] max-[1000px]:ml-[15px] max-[1000px]:w-[calc(100%-30px)]">
  <div class="mb-3 h-px w-full bg-[var(--color-divider)]"></div>
  <div (click)="toggleContent()" class="flex cursor-pointer items-start justify-between gap-3">
    <div class="min-w-0">
      <div class="flex items-center gap-2 text-[16px] font-semibold leading-tight text-[var(--color-text1)]">
        <span class="truncate">Json Response</span>
        <img src="/assets/images/shared/theme/info.svg" alt="Icon" class="h-5 w-5 shrink-0" appTooltip="The JSON response contains the complete data that would be returned in an actual API call">
      </div>
      <p class="mt-1 text-[12px] leading-relaxed text-[var(--color-text4)]">Complete API payload for this report in structured JSON format.</p>
    </div>
    <div [attr.aria-label]="isExpanded ? 'Collapse' : 'Expand'" class="mt-[2px] flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-790)]">
      <img [ngClass]="{ 'rotate-180': !isExpanded }" alt="toggle icon" class="h-[18px] w-[18px] transition" src="/assets/images/shared/theme/search_side_dropdown_icon_dark.svg">
    </div>
  </div>
  <div *ngIf="isExpanded" class="mt-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-790)] p-3">
    <app-json-viewer [json]="jsonData"></app-json-viewer>
  </div>
</div>
