<form class="dash-searchbar" (submit)="onSearchSubmit($event)" method="GET" action="" enctype="multipart/form-data">
  <div class="row dashboard__api-search-input-div ">
    <div class="col-md-6 col-sm-12 mb-2 mr-2">
      <div class="input-group dash-searchbar-div">
        <input autocomplete="off" autocapitalize="none" type="text" placeholder="Username" class="form-control dash-searchbar__input" maxlength="150" name="q" [(ngModel)]="username">
        <input type="hidden" value="1">
        <button class="btn btn-primary dash-searchbar__input-button" type="submit">
          <img ngSrc="assets/images/shared/user1.svg" alt="Search" priority="true" height="16" width="16">
        </button>
      </div>
    </div>
    <div class="col-md-6 col-sm-12 ">
      <div class="input-group dash-searchbar-div dash-email-div">
        <input autocomplete="off" autocapitalize="none" type="email" placeholder="Email" class="form-control dash-searchbar__input" maxlength="150" name="q" [(ngModel)]="email">
        <input type="hidden" value="1">
        <button class="btn btn-primary dash-searchbar__input-button" type="submit">
          <img ngSrc="assets/images/shared/email.svg" alt="Search" priority="true" height="16" width="16">
        </button>
      </div>
    </div>
  </div>
</form>
