<div class="d-flex">
  <div class="dashboard__search-main-div-outer">
    <div *ngFor="let item of dashboardService.searchGeneralCallbackModel.Result">
      <!--    {{ item.m_base_url }}-->

      <div class="dashboard__search-main-div">
        <div class="dashboard__search-tags">
          <span class="dashboard__tag">General</span>
          <span class="dashboard__tag">Leaks</span>
          <span class="dashboard__tag">Marketplace</span>
        </div>

        <h2 class="dashboard__search-title">{{ item.m_title }}</h2>

        <p class="dashboard__search-description">
          {{ item.m_content }}
        </p>

        <a href="#" class="dashboard__search-link">{{ item.m_url }}</a>

        <div class="dashboard__search-info">
          <div class="dashboard__search-info-item">
            <span class="dashboard__info-label">Published on:</span>
            <span class="dashboard__info-value">{{ item.m_creation_date }}</span>
          </div>
          <div class="dashboard__search-info-item">
            <span class="dashboard__info-label">Network:</span>
            <span class="dashboard__info-value">{{ item.m_network }}</span>
          </div>
          <div class="dashboard__search-info-item">
            <span class="dashboard__info-label">Updated on:</span>
            <span class="dashboard__info-value">{{ item.m_update_date }}</span>
          </div>
          <div class="dashboard__search-status">
            <span class="dashboard__info-label">Status</span>
            <div class="d-flex align-items-center">
              <span class="dashboard__status-dot"></span>
              <span class="dashboard__status-text"></span>
            </div>
          </div>
        </div>

        <div class="dashboard__search-table">
          <div class="dashboard__table-header">
            <span>Name</span>
            <span>Email</span>
            <span>Sections</span>
            <span>Content</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="dashboard__search-main-buttons-outer">
    abc
  </div>
</div>
