<!--{{dashboardService.searchGeneralCallbackModel.Result[0].m_content}}-->

<div class="d-flex search__results-main">
  <div class="search__results row">
    <div *ngFor="let item of dashboardService.searchGeneralCallbackModel.Result" class="search-result__content-webpages-container position-relative">
      <div class="search-result__content-webpages">
        <label class="search-content__webpages-header">{{ item.m_title }}</label>
        <br>
        <hr class="search-content__webpages-divider">
        <label class="search-content__webpages-description">{{ item.m_important_content }}</label>
        <label class="search-content__webpages-url">
          <a [href]="item.m_base_url" target="_blank">{{ item.m_base_url }}</a>
        </label>
        <div class="row search-content__webpages-data">
          <div class="col-3">
            <p>Published on:</p>
            <h6>{{ item.m_creation_date }}</h6>
          </div>
          <div class="col-3">
            <p>Network:</p>
            <h6>{{ item.m_network }}</h6>
          </div>
          <div class="col-3">
            <p>Updated on:</p>
            <h6>{{ item.m_update_date }}</h6>
          </div>
          <div class="col-3">
            <p>Status:</p>
            <!--            <h6>{{ item.status }}</h6>-->
          </div>


        </div>
      </div>
    </div>
  </div>
</div>
