<div *ngIf="vars && vars.mSearchCallbackRelevantSearchType === 'persona'">
  <p class="safe__search-warning">
    This demo API uses a queue due to server resource limitations, causing slower responses.
  </p>
</div>

<div *ngIf="!vars || vars.mSearchCallbackRelevantSearchType !== 'persona'" class="safe__search-toolbar">
  <div>
    <p *ngIf="vars && vars.mSearchCallbackRelevantDocument?.length > 0" class="safe__search-toolbar-results">
      About {{ vars.mSearchCallbackResultCount }} results found
    </p>

    <h6 *ngIf="vars && vars.mSearchCallbackQueryError?.length > 0" class="safe__search-toolbar-error">
      <span class="safe__search-toolbar-error-header">Did you mean: </span>
      <span class="safe__search-toolbar-error-info">
        <a class="gc-clear-selection safe__search-toolbar-error-info-ref"
           [href]="'/search?q=' + vars.mSearchCallbackQueryErrorURL + '&pSearchParamType=' + vars.mSearchCallbackRelevantSearchType + '&mSearchParamSafeSearch=' + vars.mSearchCallbackSaveSearch">
          {{ vars.mSearchCallbackQueryError }}
        </a>
      </span>
    </h6>
  </div>

  <form method="get" action="/search">
    <div class="safe__search-toolbar-right">
      <label for="safe-search" class="safe__search-toolbar-switch">
        <a [href]="'/search?q=' + vars.mSearchCallbackQuery + '&mSearchParamPage=1&pSearchParamType=' + vars.mSearchCallbackRelevantSearchType + '&mSearchParamSafeSearch=' + (vars.mSearchCallbackSaveSearch === 'True' ? 'False' : 'True')">
          <input type="checkbox" id="safe-search" [checked]="vars.mSearchCallbackSaveSearch === 'True'" />
          <span class="safe__search-toolbar--slider"></span>
        </a>
      </label>
      <span id="safe-search-label" class="safe__search-toolbar--text">Enable Safe Search</span>
    </div>
  </form>
</div>
