<nav class="search__side-nav">
  <img ngSrc="/assets/images/shared/Bg.png" alt="background" class="search__side-nav-background" height="789" width="1440" priority="true">

  <div class="search__side-nav-logo">
    <a href="../../..">
      <img ngSrc="assets/images/shared/search_nav_logo.svg" alt="Logo" priority="true" height="50" width="180"/>
    </a>
    <div class="close_menu_div">
      <img class="search__nav-close-button" ngSrc="assets/images/shared/nav-prev.svg" (click)="closeMenu()" alt="Close Menu" priority="true" height="24" width="24"/>
    </div>
  </div>

  <ul class="search__side-nav-items">
    <li class="search__side-nav-item">
      <div class="search__side-nav-item-dropdown" [ngClass]="{'active': dashboardService.tracker.getSelectedSection() === category.HOMEPAGE}" (click)="onSectionSelected(category.HOMEPAGE)">
        <img ngSrc="assets/images/shared/home.svg" alt="Leaks" height="20" width="20" class="search_side_icon">Homepage
      </div>
    </li>

    <li class="search__side-nav-item">
      <div class="search__side-nav-item-dropdown" [ngClass]="{'active': dashboardService.tracker.getSelectedSection() === category.GENERAL_INTELLIGENCE}" (click)="onSectionSelected(category.GENERAL_INTELLIGENCE)">
        <img ngSrc="assets/images/shared/search_side_general_intelligence_icon.svg" alt="General Intelligence" class="search_side_icon" height="20" width="20">
        General Intelligence
        <img class="search_side_dropdown_icon" ngSrc="assets/images/shared/search_side_dropdown_icon.svg" alt="Drop Down" height="20" width="20">
      </div>
      <ul class="search__side-nav-subitems" [ngClass]="{'show': dashboardService.tracker.getSelectedSection() === category.GENERAL_INTELLIGENCE}">
        <li *ngFor="let item of generalCategories">
          <a (click)="onOptionSelected(item)" [ngClass]="{'selected': dashboardService.tracker.getSelectedOption() === item}">
            {{ item }}
          </a>
        </li>
      </ul>
    </li>

    <li class="search__side-nav-item">
      <div class="search__side-nav-item-dropdown" [ngClass]="{'active': dashboardService.tracker.getSelectedSection() === category.LEAKS}" (click)="onSectionSelected(category.LEAKS)">
        <img ngSrc="assets/images/shared/leak.svg" alt="Leaks" height="20" width="20" class="search_side_icon">Leaks
      </div>
    </li>

    <li class="search__side-nav-item" *ngIf="apiAllowed">
      <div class="search__side-nav-item-dropdown" [ngClass]="{'active': dashboardService.tracker.getSelectedSection() === category.API}" (click)="onSectionSelected(category.API)">
        <img ngSrc="assets/images/shared/search_side_live_api_icon.svg" alt="Live APIs" height="20" width="20" class="search_side_icon">Live
        APIs
        <img class="search_side_dropdown_icon" ngSrc="assets/images/shared/search_side_dropdown_icon.svg" alt="Drop Down" height="20" width="20">
      </div>
      <ul class="search__side-nav-subitems" [ngClass]="{'show': dashboardService.tracker.getSelectedSection() === category.API}">
        <li *ngFor="let item of apiCategories">
          <a (click)="onOptionSelected(item)" [ngClass]="{'selected': dashboardService.tracker.getSelectedOption() === item}">
            {{ item }}
          </a>
        </li>
      </ul>
    </li>

    <li class="search__side-nav-item">
      <div class="search__side-nav-item-dropdown" [ngClass]="{'active': dashboardService.tracker.getSelectedSection() === category.DIRECTORY}" (click)="onSectionSelected(category.DIRECTORY)">
        <img ngSrc="assets/images/shared/directory.svg" alt="Leaks" height="20" width="20" class="search_side_icon">Links
      </div>
    </li>

    <a href="https://orion-search.readthedocs.io/en/latest/" target="_blank">
      <li class="search__side-nav-item">
        <div class="search__side-nav-item-dropdown">
          <img ngSrc="assets/images/shared/document_count.svg" alt="Documentation" height="20" width="20" class="search_side_icon">Documentation
        </div>
      </li>
    </a>
  </ul>
</nav>
