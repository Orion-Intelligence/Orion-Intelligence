<nav class="sidebar">
  <img ngSrc="/assets/images/shared/Bg.png" alt="background" class="sidebar__background" height="789" width="1440" priority="true">

  <div class="sidebar__logo">
    <a href="../../..">
      <img ngSrc="assets/images/shared/search_nav_logo.svg" alt="Logo" priority="true" height="50" width="180"/>
    </a>
  </div>

  <ul class="sidebar__items">
    <li class="sidebar__item">
      <div class="sidebar__item-dropdown" [ngClass]="{'active': dashboardService.tracker.getSelectedSection() === category.HOMEPAGE}" (click)="onSectionSelected(category.HOMEPAGE)"  [routerLink]="'home'">
        <img ngSrc="assets/images/shared/home.svg" alt="Home" height="20" width="20" class="sidebar__icon">Homepage
      </div>
    </li>

    <li class="sidebar__item">
      <div class="sidebar__item-dropdown" [ngClass]="{'active': dashboardService.tracker.getSelectedSection() === category.GENERAL_INTELLIGENCE}" (click)="onSectionSelected(category.GENERAL_INTELLIGENCE)">
        <img ngSrc="assets/images/shared/search_side_general_intelligence_icon.svg" alt="General Intelligence" class="sidebar__icon" height="20" width="20">
        General Intelligence
        <img class="sidebar__dropdown-icon" ngSrc="assets/images/shared/search_side_dropdown_icon.svg" alt="Drop Down" height="20" width="20">
      </div>
      <ul class="sidebar__subitems" [ngClass]="{'show': dashboardService.tracker.getSelectedSection() === category.GENERAL_INTELLIGENCE}">
        <div *ngFor="let item of generalCategories">
          <div class="sidebar__subitem" (click)="onOptionSelected(item)" [ngClass]="{'sidebar__selected': dashboardService.tracker.getSelectedOption() === item}">
            <img ngSrc="assets/images/shared/search_side_general_intelligence_icon.svg" alt="General Intelligence" class="sidebar__icon" height="20" width="20">
            <span>{{ item }}</span>
          </div>
        </div>
      </ul>
    </li>

    <li class="sidebar__item">
      <div class="sidebar__item-dropdown" [ngClass]="{'active': dashboardService.tracker.getSelectedSection() === category.LEAKS}" (click)="onSectionSelected(category.LEAKS)">
        <img ngSrc="assets/images/shared/leak.svg" alt="Leaks" height="20" width="20" class="sidebar__icon">Leaks
      </div>
    </li>

    <li class="sidebar__item" *ngIf="apiAllowed">
      <div class="sidebar__item-dropdown" [ngClass]="{'active': dashboardService.tracker.getSelectedSection() === category.API}" (click)="onSectionSelected(category.API)">
        <img ngSrc="assets/images/shared/search_side_live_api_icon.svg" alt="Live APIs" height="20" width="20" class="sidebar__icon">Live
        APIs
        <img class="sidebar__dropdown-icon" ngSrc="assets/images/shared/search_side_dropdown_icon.svg" alt="Drop Down" height="20" width="20">
      </div>
      <ul class="sidebar__subitems" [ngClass]="{'show': dashboardService.tracker.getSelectedSection() === category.API}">
        <li *ngFor="let item of apiCategories">
          <a (click)="onOptionSelected(item)" [ngClass]="{'sidebar__selected': dashboardService.tracker.getSelectedOption() === item}">
            {{ item }}
          </a>
        </li>
      </ul>
    </li>

    <li class="sidebar__item">
      <div class="sidebar__item-dropdown" [ngClass]="{'active': dashboardService.tracker.getSelectedSection() === category.DIRECTORY}" (click)="onSectionSelected(category.DIRECTORY)" [routerLink]="'directory'">
        <img ngSrc="assets/images/shared/directory.svg" alt="Links" height="20" width="20" class="sidebar__icon"> Links
      </div>
    </li>

    <a href="https://orion-search.readthedocs.io/en/latest/" target="_blank">
      <li class="sidebar__item">
        <div class="sidebar__item-dropdown">
          <img ngSrc="assets/images/shared/document_count.svg" alt="Documentation" height="20" width="20" class="sidebar__icon">Documentation
        </div>
      </li>
    </a>
  </ul>
</nav>
