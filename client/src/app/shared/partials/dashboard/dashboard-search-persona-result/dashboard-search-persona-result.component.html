<div *ngIf="isNoRecord(); else searchResults">
  <form method="GET" action="" class="search-persona__no-suggestion">
    <div class="row align-items-center">
      <div class="col">
        <p class="search-persona__no-suggestion-header mb-0">
          <ng-container *ngIf="mDynamicParserStatus !== 'false' && Object.keys(mSearchCallbackRelevantDocument).length === 0">
            No record found for - <strong>{{ mSearchCallbackQuery }}</strong>. Press "Try Again" if you want to fetch the data again.
            <input type="hidden" name="mDynamicCrawlTrigger" value="1">
          </ng-container>
          <ng-container *ngIf="mDynamicParserStatus === 'false' || Object.keys(mSearchCallbackRelevantDocument).length > 0">
            We are fetching results for - <strong>{{ mSearchCallbackQuery }}</strong>. Please wait for a few seconds and press "Sync Again."
          </ng-container>
        </p>
      </div>
      <div class="col-auto ms-auto">
        <input type="hidden" name="mSearchParamPage" value="1">
        <input type="hidden" name="q" [value]="mSearchCallbackQuery">
        <input type="hidden" name="mUsername" [value]="mUsernameQuery">
        <input type="hidden" name="mSearchParamSafeSearch" [value]="mSearchCallbackSaveSearch">
        <input type="hidden" name="pSearchParamType" [value]="mSearchCallbackRelevantSearchType">
        <button type="submit" class="search__reload-button">
          {{ mDynamicParserStatus !== 'false' && Object.keys(mSearchCallbackRelevantDocument).length === 0 ? 'Try Again' : 'Sync Again' }}
        </button>
      </div>
    </div>
  </form>
</div>

<ng-template #searchResults>
  <div class="searchbar__search-container-persona">
    <div class="card shadow searchbar__search-card-persona">
      <div class="card-header searchbar__search-card-header-persona text-white">
        <h6 class="mb-0">⚠️ Data Breach Detected</h6>
      </div>
      <div class="card-body searchbar__search-container-persona-body">
        <table class="table searchbar__search-card-table-persona searchbar__search-container-persona-border-color text-white">
          <tbody>
            <tr *ngFor="let entry of mSearchCallbackRelevantDocument | keyvalue; let i = index" [ngClass]="{'border-0': i === 0}">
              <td class="searchbar__search-container-persona-border-color">{{ entry.key | titlecase }}</td>
              <td class="searchbar__search-container-persona-border searchbar__search-container-persona-border-color">
                <ng-container *ngIf="entry.value?.length; else noData">
                  <div *ngFor="let item of entry.value" class="searchbar__search-container-persona-item">{{ item }}</div>
                </ng-container>
                <ng-template #noData>N/A</ng-template>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</ng-template>
