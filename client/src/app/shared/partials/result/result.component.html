<form class="default-input-container w-90" (submit)="onFormSubmit()" @fadeInDashboardItem>
  <div class="d-flex align-items-center justify-content-between w-100 flex-wrap">
    <div class="col-md-6 col-xl-6 col-sm-12 col-xs-12">
      <div class="input-group default-input-sub-container">
        <input autocomplete="off" autocapitalize="none" type="search" placeholder="Search..." class="form-control default-input dashboard-general-input" (ngModelChange)="onSearchChange($event)" maxlength="150" name="q" [(ngModel)]="searchQuery">
        <input type="hidden" value="1">
        <button class="btn btn-primary default-input-button" type="submit">
          <img ngSrc="../../../../assets/images/shared/magnifyingglasswhite.svg" alt="Search" priority height="16" width="16">
        </button>
      </div>
    </div>

    <div class="side-menu-container d-flex align-items-center justify-content-center mt-2 gap-3" *ngIf="!shrinkmenu">
      <div class="analytics d-flex align-items-center gap-2">
        <input type="checkbox" id="switch" (click)="onToggleAnalytics()"/>
        <label for="switch" class="mb-0"></label><span>&nbsp; Analytics</span>
      </div>

      <label class="filters-button d-flex align-items-center" (click)="sidebarService.openSidebar()">
        <img ngSrc="../../../../assets/images/shared/filter_icon.svg" alt="Filter Icon" width="24" height="24" priority >
        <span class="ms-2">Filter</span>
      </label>
    </div>

  </div>
</form>

<ng-container *ngIf="suggestion && suggestion.options.length > 0">
  <app-suggestion (update_query)="onUpdateSuggestion($event)" [suggestion]="onGetSuggestion()"></app-suggestion>
</ng-container>

<div *ngIf="filterModel && !shrinkmenu" class="filters-container" [class.filter__container-enable]="isFilterOpen$ | async" [class.filter__container-disable]="!(isFilterOpen$ | async)">
  <app-filters [filterModel]="filterModel" [isFilterOpen]="isFilterOpen$ | async" (filterChanged)="applyFilters($event)" (filterReset)="resetFilters()" (filterClose)="sidebarService.closeSidebar()"></app-filters>
</div>

<div *ngIf="isLoading" @fadeInDashboardItem>
  <app-loading-form></app-loading-form>
</div>
<div *ngIf="!this.result_triggered && !isLoading && !result_count && !analyticsToggle" @fadeInDashboardItem>
    <app-empty-query></app-empty-query>
</div>

<div *ngIf="this.result_triggered && !isLoading && (result_count==0)" @fadeInDashboardItem>
  <app-empty-result [searchQuery]="local_query"></app-empty-result>
</div>

<div *ngIf="!isLoading && !(result_count==0)" @fadeInDashboardItem>
  <div class="right-text label-text">
    <span> {{ result_count }}
      Results Found</span>
  </div>
</div>
