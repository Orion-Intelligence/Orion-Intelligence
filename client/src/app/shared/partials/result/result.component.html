<form (submit)="onFormSubmit()" @fadeInDashboardItem class="default-input-container default-input-sub-container-padded w-90">
  <div class="d-flex align-items-start justify-content-between w-100 flex-wrap">
    <div class="col-md-10 col-sm-12 col-xs-12">
      <div class="input-group default-input-sub-container">
        <input [(ngModel)]="local_query" autocapitalize="none" autocomplete="off" class="form-control default-input dashboard-general-input"
               maxlength="150" name="q" placeholder="Search..."
               type="search">
        <input type="hidden" value="1">
        <button class="btn btn-primary default-input-button" type="submit">
          <img alt="Search" height="16" ngSrc="../../../../assets/images/shared/magnifyingglasswhite.svg" priority
               width="16">
        </button>
      </div>
      <ng-container *ngIf="type == Category.STRATEGIC">
        <div class="default-notification-banner">
          <span>
            <img alt="Info Icon" class="default-notification-banner-icon"
                 src="../../../../assets/images/shared/hint.svg">
            <span>
              Current results are general and may lack accuracy. For precise insights, open the &nbsp;
              <u><b>
                  <a appTooltip="Go to Breach Details" class="cursor-pointer text-reset text-decoration-none"
                     queryParamsHandling="preserve" routerLink="/dashboard/breach/databases">
                    Data Breaches</a>
                </b></u> &nbsp; section in sidebar.
            </span>
          </span>
        </div>
      </ng-container>
    </div>

    <div *ngIf="!shrinkmenu && filterModel" class="side-menu-container d-flex align-items-center justify-content-center mt-2 gap-3">
      <label (click)="sidebarService.openSidebar()" appTooltip="Customize Results"
             class="filters-button d-flex align-items-center">
        <img alt="Filter Icon" height="24" ngSrc="../../../../assets/images/shared/filter_icon.svg" priority width="24">
        <span class="ms-2">Filter</span>
      </label>
    </div>

  </div>
</form>

<ul *ngIf="showTabs && (analyticsToggle || discussion)" class="nav nav-tabs default-input-container-tab" (click)="onTabClick($event)">
  <li class="nav-item">
    <a class="nav-link cursor-pointer active">Results</a>
  </li>
  <li class="nav-item" *ngIf="analyticsToggle">
    <a class="nav-link cursor-pointer">Analytics</a>
  </li>
  <li class="nav-item" *ngIf="discussion">
    <a class="nav-link cursor-pointer">Discussion</a>
  </li>
</ul>

<ng-container *ngIf="suggestion && suggestion.options.length > 0">
  <app-suggestion (update_query)="onUpdateSuggestion($event)" [suggestion]="onGetSuggestion()"></app-suggestion>
</ng-container>

<div *ngIf="filterModel && !shrinkmenu" [class.filter__container-disable]="!(isFilterOpen$ | async)"
     [class.filter__container-enable]="isFilterOpen$ | async"
     class="filters-container">
  <app-filters (filterChanged)="applyFilters($event)" (filterClose)="sidebarService.closeSidebar()" (filterReset)="resetFilters()"
               [filterModel]="filterModel" [isFilterOpen]="isFilterOpen$ | async"></app-filters>
</div>
<div *ngIf="isLoading" @fadeInDashboardItem>
  <app-loading-form></app-loading-form>
</div>
<div *ngIf="result_count && !this.result_triggered && !isLoading && !result_count" @fadeInDashboardItem>
  <app-empty-query></app-empty-query>
</div>

<div *ngIf="this.result_triggered && !isLoading && (result_count==0)" @fadeInDashboardItem>
  <app-empty-result [searchQuery]="local_query"></app-empty-result>
</div>

<div *ngIf="result_count && !isLoading && !(result_count==0)" @fadeInDashboardItem>
  <div class="right-text label-text">
    <span> {{ result_count }}
      Results Found</span>
  </div>
</div>

<div *ngIf="!isLoading && result_count>0 && !disableScroll">
  <app-scroll-top></app-scroll-top>
</div>
