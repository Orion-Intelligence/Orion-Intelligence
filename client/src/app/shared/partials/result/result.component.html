<form class="default-input-container w-90" (submit)="onFormSubmit()" @fadeInDashboardItem>
  <div class="d-flex align-items-start justify-content-between w-100 flex-wrap">
    <div class="col-md-10 col-sm-12 col-xs-12">
      <div class="input-group default-input-sub-container">
        <input autocomplete="off" autocapitalize="none" type="search" placeholder="Search..."
               class="form-control default-input dashboard-general-input" maxlength="150" name="q"
               [(ngModel)]="local_query">
        <input type="hidden" value="1">
        <button class="btn btn-primary default-input-button" type="submit">
          <img ngSrc="../../../../assets/images/shared/magnifyingglasswhite.svg" alt="Search" priority height="16"
               width="16">
        </button>
      </div>
      <ng-container *ngIf="type == Category.STRATEGIC">
        <div class="default-notification-banner">
          <span>
            <img src="../../../../assets/images/shared/hint.svg" class="default-notification-banner-icon"
                 alt="Info Icon">
              <span>
                Current results are general and may lack accuracy. For precise insights, open the &nbsp;
                <u><b>
                  <a
                    class="cursor-pointer text-reset text-decoration-none"
                    routerLink="/dashboard/breach/databases"
                    queryParamsHandling="preserve">
                    Data Breaches</a>
                </b></u> &nbsp; section in sidebar.
              </span>
          </span>
        </div>
      </ng-container>
    </div>

    <div class="side-menu-container d-flex align-items-center justify-content-center mt-2 gap-3" *ngIf="!shrinkmenu && filterModel">
      <div class="analytics d-flex align-items-center gap-2">
        <input type="checkbox" id="switch" (click)="onToggleAnalytics()"/>
        <label for="switch" class="mb-0"></label><span>&nbsp; Analytics</span>
      </div>

      <label class="filters-button d-flex align-items-center" (click)="sidebarService.openSidebar()">
        <img ngSrc="../../../../assets/images/shared/filter_icon.svg" alt="Filter Icon" width="24" height="24" priority>
        <span class="ms-2">Filter</span>
      </label>
    </div>

  </div>
</form>

<ng-container *ngIf="suggestion && suggestion.options.length > 0">
  <app-suggestion (update_query)="onUpdateSuggestion($event)" [suggestion]="onGetSuggestion()"></app-suggestion>
</ng-container>

<div *ngIf="filterModel && !shrinkmenu" class="filters-container"
     [class.filter__container-enable]="isFilterOpen$ | async"
     [class.filter__container-disable]="!(isFilterOpen$ | async)">
  <app-filters [filterModel]="filterModel" [isFilterOpen]="isFilterOpen$ | async" (filterChanged)="applyFilters($event)"
               (filterReset)="resetFilters()" (filterClose)="sidebarService.closeSidebar()"></app-filters>
</div>

<div *ngIf="isLoading" @fadeInDashboardItem>
  <app-loading-form></app-loading-form>
</div>
<div *ngIf="!this.result_triggered && !isLoading && !result_count && !analyticsToggle" @fadeInDashboardItem>
  <app-empty-query></app-empty-query>
</div>

<div *ngIf="this.result_triggered && !isLoading && (result_count==0)" @fadeInDashboardItem>
  <app-empty-result [searchQuery]="local_query"></app-empty-result>
</div>

<div *ngIf="!isLoading && !(result_count==0)" @fadeInDashboardItem>
  <div class="right-text label-text">
    <span> {{ result_count }}
      Results Found</span>
  </div>
</div>

<div *ngIf="!isLoading && result_count>0" @fadeInDashboardItem>
  <app-scroll-top></app-scroll-top>
</div>
