<div class="rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-700)] p-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 class="text-sm font-semibold text-[var(--color-text1)]">Manage IOCs</h2>
    <div class="flex items-center gap-2">
      <input type="text" class="w-full max-w-[220px] rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)] px-3 py-2 text-xs text-[var(--color-text1)]" placeholder="Search IOCs..." [(ngModel)]="iocSearchText" />
      <button appTooltip="clear all" class="inline-flex h-8 w-8 items-center justify-center rounded-md border border-[var(--color-border)] bg-[var(--color-blue-720)]" (click)="openConfirmationPopup()">
        <img alt="scan" src="assets/images/shared/theme/bin.svg" class="h-4 w-4" />
      </button>
    </div>
  </div>

  <div class="mt-4 relative">
    <div class="pointer-events-none absolute left-0 top-0 h-full w-8 bg-gradient-to-r from-[var(--color-blue-700)] to-transparent" *ngIf="showLeftFade"></div>

    <button class="absolute left-0 top-1/2 -translate-y-1/2 inline-flex h-8 w-8 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)]" (click)="scrollLeft()">
      <img src="assets/images/shared/onboarding_leftButton.svg" alt="filter icon" class="h-4 w-4" />
    </button>

    <div class="mx-10 overflow-x-auto" #categoryScroll>
      <div class="flex gap-2">
        <ng-container *ngIf="filteredIocs.length > 0; else noEntity">
          <div *ngFor="let category of filteredIocs" class="cursor-pointer rounded-full px-4 py-1.5 text-xs font-semibold" [ngClass]="category.ioc_id === selectedCategoryId ? 'bg-[var(--color-blue-640)] text-white' : 'bg-[var(--color-blue-720)] text-[var(--color-text3)]'" (click)="$event.stopPropagation();onCategoryClick(category.ioc_id)">
            {{ category.name }}
          </div>
        </ng-container>
        <ng-template #noEntity>
          <div class="text-xs text-[var(--color-text4)]">No entity filters available.</div>
        </ng-template>
      </div>
    </div>

    <button class="absolute right-0 top-1/2 -translate-y-1/2 inline-flex h-8 w-8 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)]" (click)="scrollRight()">
      <img src="assets/images/shared/onboarding_rightButton.svg" alt="filter" class="h-4 w-4" />
    </button>

    <div class="pointer-events-none absolute right-0 top-0 h-full w-8 bg-gradient-to-l from-[var(--color-blue-700)] to-transparent" *ngIf="showRightFade"></div>
  </div>

  <div class="mt-4 h-px w-full bg-[var(--color-divider)]"></div>

  <label class="mt-4 block text-xs font-semibold text-[var(--color-text4)]">Enter IOCs</label>
  <div class="mt-2 flex items-center gap-2">
    <input type="text" class="flex-1 rounded-md border border-[var(--color-border)] bg-[var(--color-blue-730)] px-3 py-2 text-xs text-[var(--color-text1)]" placeholder="Type" (keyup.enter)="addIoc(inputEl.value); inputEl.value=''" #inputEl />
    <button type="button" class="rounded-md bg-[var(--color-blue-640)] px-3 py-2 text-xs font-semibold text-white" (click)="addIoc(inputEl.value); inputEl.value=''">Add</button>
  </div>

  <div class="mt-4 h-px w-full bg-[var(--color-divider)]"></div>

  <p class="mt-4 text-sm font-semibold text-[var(--color-text1)]">Added IOCs</p>
  <div class="mt-3 max-h-[260px] space-y-3 overflow-y-auto">
    <div *ngIf="hasIocsWithValues(); else _noEntity">
      <div *ngFor="let ioc of onboardingData?.iocs">
        <ng-container *ngIf="ioc.values.length > 0">
          <p class="text-xs font-semibold text-[var(--color-text4)]">{{ ioc.name }}</p>
          <div class="mt-2 flex flex-wrap gap-2">
            <div class="flex items-center gap-2 rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 py-1 text-xs text-[var(--color-text3)]" appTooltip="remove IOC" *ngFor="let value of ioc.values" (click)="removeIoc(ioc.ioc_id, value)">
              <span>{{ value }}</span>
              <span class="text-[10px]">✕</span>
            </div>
          </div>
        </ng-container>
      </div>
    </div>

    <ng-template #_noEntity>
      <div class="text-xs text-[var(--color-text4)]">No IOCs added yet</div>
    </ng-template>
  </div>

  <div class="mt-5 flex justify-end">
    <button class="rounded-md border border-[var(--color-border)] px-4 py-2 text-xs font-semibold text-[var(--color-text3)]" (click)="goBack()">Back</button>
  </div>
</div>
<ng-container *ngIf="isConfirmationOpen">
  <app-confirmation-popup [message]="'Are you sure you want to clear your scan history?'"
    (confirmed)="clearAllIocs($event)"></app-confirmation-popup>
</ng-container>
