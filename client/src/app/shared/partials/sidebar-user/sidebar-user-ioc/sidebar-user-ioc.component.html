<div class="w-full p-3 md:p-4">
  <div class="ui-page-container w-full max-w-[2400px] rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-820-light)] p-4">
    <div class="ui-section-title">Manage IOCs</div>
    <div class="ui-section-description">Add, remove, and organize IOC values used by your tenant searches.</div>

    <div class="mt-3 rounded-[10px] border border-[var(--color-border)] bg-[var(--color-blue-700)] p-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <label class="text-xs font-semibold uppercase tracking-wide text-[var(--color-text6)]">IOC Categories</label>
        <div class="flex items-center gap-2">
          <input type="text" class="h-10 w-full max-w-[240px] rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-730)] px-3 text-xs text-[var(--color-text1)] outline-none focus:border-sky-400/35 focus:ring-2 focus:ring-sky-400/20" placeholder="Search IOCs..." [(ngModel)]="iocSearchText" />
          <button appTooltip="clear all" class="inline-flex h-10 w-10 items-center justify-center rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-720)] transition hover:bg-[var(--color-blue-710)]" (click)="openConfirmationPopup()">
            <img alt="scan" src="assets/images/shared/theme/bin.svg" class="h-4 w-4" />
          </button>
        </div>
      </div>

      <div class="relative mt-4">
        <div class="pointer-events-none absolute left-0 top-0 z-[1] h-full w-10 bg-gradient-to-r from-[var(--color-blue-700)] to-transparent" *ngIf="showLeftFade"></div>

        <button class="absolute left-0 top-1/2 z-[2] inline-flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)]" (click)="scrollLeft()">
          <img src="assets/images/shared/onboarding_leftButton.svg" alt="filter icon" class="h-4 w-4" />
        </button>

        <div class="mx-10 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" #categoryScroll>
          <div class="flex gap-2">
            <ng-container *ngIf="filteredIocs.length > 0; else noEntity">
              <div *ngFor="let category of filteredIocs" class="cursor-pointer rounded-full px-4 py-1.5 text-xs font-semibold transition-colors" [ngClass]="category.ioc_id === selectedCategoryId ? 'bg-[var(--color-blue-640)] text-white' : 'bg-[var(--color-blue-720)] text-[var(--color-text3)] hover:bg-[var(--color-blue-710)]'" (click)="$event.stopPropagation();onCategoryClick(category.ioc_id)">
                {{ category.name }}
              </div>
            </ng-container>
            <ng-template #noEntity>
              <div class="text-xs text-[var(--color-text4)]">No entity filters available.</div>
            </ng-template>
          </div>
        </div>

        <button class="absolute right-0 top-1/2 z-[2] inline-flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)]" (click)="scrollRight()">
          <img src="assets/images/shared/onboarding_rightButton.svg" alt="filter" class="h-4 w-4" />
        </button>

        <div class="pointer-events-none absolute right-0 top-0 z-[1] h-full w-10 bg-gradient-to-l from-[var(--color-blue-700)] to-transparent" *ngIf="showRightFade"></div>
      </div>

      <div class="mt-4 h-px w-full bg-[var(--color-divider)]"></div>

      <label class="mt-4 block text-xs font-semibold uppercase tracking-wide text-[var(--color-text6)]">Enter IOCs</label>
      <div class="mt-2 flex items-center gap-2">
        <input type="text" class="h-10 flex-1 rounded-[8px] border border-[var(--color-border)] bg-[var(--color-blue-730)] px-3 text-xs text-[var(--color-text1)] outline-none focus:border-sky-400/35 focus:ring-2 focus:ring-sky-400/20" placeholder="Type" (keyup.enter)="addIoc(inputEl.value); inputEl.value=''" #inputEl />
        <button type="button" class="inline-flex h-10 items-center rounded-[8px] bg-[var(--color-blue-640)] px-4 text-xs font-semibold text-white transition hover:brightness-110" (click)="addIoc(inputEl.value); inputEl.value=''">Add</button>
      </div>

      <div class="mt-4 h-px w-full bg-[var(--color-divider)]"></div>

      <p class="mt-4 text-sm font-semibold text-[var(--color-text1)]">Added IOCs</p>
      <div class="mt-3 max-h-[260px] space-y-3 overflow-y-auto">
        <div *ngIf="hasIocsWithValues(); else _noEntity">
          <div *ngFor="let ioc of onboardingData?.iocs">
            <ng-container *ngIf="ioc.values.length > 0">
              <p class="text-xs font-semibold text-[var(--color-text4)]">{{ ioc.name }}</p>
              <div class="mt-2 flex flex-wrap gap-2">
                <div class="flex items-center gap-2 rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 py-1 text-xs text-[var(--color-text3)] transition hover:bg-[var(--color-blue-710)]" appTooltip="remove IOC" *ngFor="let value of ioc.values" (click)="removeIoc(ioc.ioc_id, value)">
                  <span>{{ value }}</span>
                  <span class="text-[10px]">✕</span>
                </div>
              </div>
            </ng-container>
          </div>
        </div>

        <ng-template #_noEntity>
          <div class="text-xs text-[var(--color-text4)]">No IOCs added yet</div>
        </ng-template>
      </div>
    </div>

    <div class="mt-4 flex justify-end">
      <button class="inline-flex h-10 items-center rounded-[8px] border border-[var(--color-border)] px-4 text-xs font-semibold text-[var(--color-text3)] transition hover:bg-[var(--color-blue-700)]" (click)="goBack()">Back</button>
    </div>
  </div>
</div>
<ng-container *ngIf="isConfirmationOpen">
  <app-confirmation-popup [message]="'Are you sure you want to clear your scan history?'"
    (confirmed)="clearAllIocs($event)"></app-confirmation-popup>
</ng-container>
