<div @scanOverlayAnimation class="absolute inset-0 z-[20] grid place-items-center backdrop-blur-[8px]" [ngClass]="isLightTheme ? 'bg-[rgba(226,235,246,0.5)]' : 'bg-[#020617C7]'" role="dialog" aria-modal="true">
  <div @scanCardAnimation class="mt-[-200px] w-[calc(100%-32px)] max-w-[520px] rounded-[16px] border p-[22px_22px_18px] text-center" [ngClass]="isLightTheme ? 'border-[#c5d3e4] bg-white text-[#172235] shadow-[0_18px_44px_rgba(15,23,42,0.16)]' : 'border-[rgba(148,163,184,0.18)] bg-[rgba(15,23,42,0.92)] text-[#f8fafc] shadow-[0_24px_70px_rgba(0,0,0,0.55)]'">
    <div class="mb-[8px] flex items-center justify-center gap-[12px]">
      <div class="h-[38px] w-[38px] animate-spin rounded-full border-[3px] border-t-[var(--color-blue-640)]" [ngClass]="isLightTheme ? 'border-[rgba(23,35,53,0.2)]' : 'border-[rgba(248,250,252,0.18)]'"></div>
      <div class="text-[16px] font-extrabold">Scanning data</div>
    </div>

    <div class="mb-[14px] text-[13px]" [ngClass]="isLightTheme ? 'text-[#667085]' : 'text-[rgba(248,250,252,0.82)]'">This may take a moment. Please keep this tab open.</div>

    <div class="relative mb-[14px] h-[10px] overflow-hidden rounded-[999px] border" [ngClass]="isLightTheme ? 'border-[#d4deeb] bg-[#eaf1fb]' : 'border-[rgba(148,163,184,0.18)] bg-[rgba(148,163,184,0.16)]'">
      <span class="absolute left-[-40%] h-full w-[40%] rounded-[999px] bg-[linear-gradient(90deg,rgba(87,165,235,0.25),rgba(87,165,235,0.95),rgba(87,165,235,0.25))] animate-[indeterminate_1.2s_ease-in-out_infinite]"></span>
    </div>

    @if (this.licenseService.getLicenses().includes('maintainer')) {
      <div class="flex justify-center">
        <button data-testid="tenant-scan-cancel" type="button" class="ui-alert-cancel-btn rounded-full px-[16px] py-[9px] text-[13px] font-extrabold transition duration-150 ease-out hover:-translate-y-[1px] hover:shadow-[0_8px_20px_rgba(0,0,0,0.20)] active:translate-y-0 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-blue-640)] focus-visible:ring-offset-2" (click)="cancelScan()">
          Cancel
        </button>
      </div>
    } @else {
      <div class="h-[10px]"></div>
    }
  </div>
</div>
