@if (filteredItems.length > 0) {
  <div class="mt-4">
    <div class="flex flex-wrap gap-2">
      @for (item of filteredItems; track $index; let i = $index) {
        <li (click)="copyText(item, i)" class="relative list-none cursor-pointer rounded-full border border-[var(--color-border)] bg-[var(--color-blue-720)] px-3 py-1.5 text-xs font-semibold text-[var(--color-text3)] transition hover:bg-[var(--color-blue-710)]">
          {{ item }}
          @if (copiedIndex === i) {
            <span class="absolute -top-7 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-md bg-[var(--color-blue-640)] px-2 py-1 text-[10px] font-semibold text-white">Copied!</span>
          }
        </li>
      }
    </div>
  </div>
} @else {
  <div class="mt-3 text-sm font-semibold text-[var(--color-text1)]">No structured records found!</div>
  <div class="mt-1 text-xs text-[var(--color-text4)]">We’re watching this source — new breach or tracking data will appear here once detected.</div>
}
