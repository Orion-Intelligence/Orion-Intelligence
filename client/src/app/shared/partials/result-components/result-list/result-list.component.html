<div *ngIf="listItems.length > 0" class="search__result-detail-section-content">
  <div class="row p-1 flex-wrap">
    <li (click)="copyText(item, i)" *ngFor="let item of listItems; let i = index" class="copy-item">
      <span class="tag-item-content">
        {{ item }}
        <span *ngIf="copiedIndex === i" class="tooltip">Copied!</span>
      </span>
    </li>
  </div>
</div>
