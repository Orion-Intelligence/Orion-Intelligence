<div class="search__result-detail-section-content" *ngIf="listItems.length > 0">
  <div class="row p-1 flex-wrap">
    <li *ngFor="let item of listItems; let i = index" class="copy-item" (click)="copyText(item, i)">
      <span class="tag-item-content">
        {{ item }}
        <span class="tooltip" *ngIf="copiedIndex === i">Copied!</span>
      </span>
    </li>
  </div>
</div>
