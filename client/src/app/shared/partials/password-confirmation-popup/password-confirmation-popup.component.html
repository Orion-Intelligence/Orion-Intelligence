<div class="fixed inset-0 z-[1200] flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm" data-role="backdrop" @popupAnimation (click)="onBackdrop($event)">
  <form class="w-full max-w-[460px] overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-blue-820-light)] shadow-2xl" (ngSubmit)="confirm()">
    <div class="flex items-start justify-between gap-4 border-b border-[var(--color-border)] px-5 py-4">
      <div>
        <h3 class="text-base font-semibold text-[var(--color-text1)]">{{ 'Confirm your identity' | translate }}</h3>
        <p class="mt-1 text-xs leading-5 text-[var(--color-text4)]">{{ 'Enter your current password to authorize this security-sensitive change.' | translate }}</p>
      </div>
      <button type="button" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-[var(--color-text4)] transition hover:bg-white/5 hover:text-[var(--color-text1)]" [attr.aria-label]="'Close' | translate" (click)="close()">
        <svg class="h-4 w-4" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M2.146 2.854a.5.5 0 0 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
        </svg>
      </button>
    </div>

    <div class="px-5 py-5">
      <label for="password-confirmation-input" class="mb-2 block text-xs font-semibold text-[var(--color-text2)]">{{ 'Current password' | translate }}</label>
      <input id="password-confirmation-input" data-testid="password-confirmation-input" [(ngModel)]="password" name="password" type="password" required autocomplete="current-password" autofocus class="h-10 w-full rounded-lg border border-[var(--color-border)] bg-[var(--color-blue-700)] px-3 text-sm text-[var(--color-text1)] outline-none transition placeholder:text-[var(--color-text4)] focus:border-sky-400/50 focus:ring-2 focus:ring-sky-400/20" [placeholder]="'Enter current password' | translate">
      @if (error()) {
        <p class="mt-2 text-xs text-red-400">{{ error() }}</p>
      }
      <div class="mt-5 flex justify-end">
        <button data-testid="password-confirmation-submit" type="submit" class="rounded-lg bg-[var(--color-button-primary)] px-4 py-2 text-sm font-semibold text-white transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-50" [disabled]="!password">{{ 'Confirm' | translate }}</button>
      </div>
    </div>
  </form>
</div>
