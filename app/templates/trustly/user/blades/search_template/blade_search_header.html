<form class="searchbar" method="GET" action="" enctype="multipart/form-data">
  <div class="searchbar__profile-button">
    <a href="/admin" aria-label="Go to CMS Home">
      <img src="{{ url_for('static', path='trustly/images/profile-icon.svg') }}" alt="Brand Logo">
    </a>
  </div>
  <div class="searchbar__logo-grid">
    <div class="searchbar__logo-container d-flex">
      <div class="search__nav-menu-div">


{#        <div class="search__nav-mobile-container">#}
{#          {% include 'trustly/user/blades/search_template/blade_search_side_bar.html' %}#}
{#        </div>#}
      </div>
      <p class="searchbar__logo">
        General Intelligence
      </p>
    </div>

    <div class="searchbar__header">
      <div class="searchbar__searchbox">
        <div class="input-group">
          {% if mSearchCallbackRelevantSearchType == 'persona' %}
            <input autocomplete="off" autocapitalize="none" type="search" placeholder="Email" class="form-control searchbar__detail-header-search-input searchbar__detail-header-search-input-email" pattern="[^ ]*" maxlength="150" name="q" value="{{ mSearchCallbackQuery }}">
            <input autocomplete="off" autocapitalize="none" type="search" placeholder="Username" class="form-control searchbar__detail-header-search-input searchbar__detail-header-search-input-username" maxlength="150" name="mUsername" value="{{ mUsernameQuery }}">
          {% else %}
            <input autocomplete="off" autocapitalize="none" type="search" placeholder="Search..." class="form-control searchbar__detail-header-search-input" maxlength="150" name="q" value="{{ mSearchCallbackQuery }}">
          {% endif %}
          <input autocomplete="off" autocapitalize="none" type="hidden" name="mSearchParamPage" value="1">
          <input autocomplete="off" autocapitalize="none" type="hidden" name="mSearchParamSafeSearch" value="{{ mSearchCallbackSaveSearch }}">
          <button class="btn btn-primary searchbar__search-button-right {% if mSearchCallbackRelevantSearchType == 'persona' %}searchbar__search-button-right-persona{% endif %}" type="submit">
            <img class="searchbar__search-button-right-icon" src="
              {{ url_for('static', path='trustly/images/magnifyingglassblack.svg') }}" alt="Search">
          </button>
        </div>
      </div>
      <div class="searchbar__searchbox_switch-search">
        <a class="searchbar__searchbox_switch-search-button searchbar__searchbox_switch-search-button-active">Results</a>
        <a class="searchbar__searchbox_switch-search-button">Analytics</a>
      </div>
    </div>
  </div>
</form>
