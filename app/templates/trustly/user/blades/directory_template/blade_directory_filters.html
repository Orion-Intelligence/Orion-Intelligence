<input id="directory__filters-close-input" type="radio" name="filter" hidden>

<label for="directory__filters-close-input" class="directory__main-filter-header d-flex align-items-center w-100">
  <span class="directory__main-filter-heading">Filters</span>
  <span class="ms-auto directory__filters-close-label">
    <img src="{{ url_for('static', path='trustly/images/nav-next.svg') }}" alt="Close">
  </span>
</label>

<form method="GET" class="directory__main-filter-form">
  <div class="directory__main-filter">
    <div class="custom-dropdown">
      <label for="networkSelect" class="d-none">Select Network</label>
      <select id="networkSelect" name="network" class="form-select directory__main-filter-input">
        <option hidden value="">Network</option>
        <option value="all" {% if vars.mNetwork == "all" %}selected{% endif %}>All</option>
        <option value="onion" {% if vars.mNetwork == "onion" %}selected{% endif %}>Onion</option>
        <option value="i2p" {% if vars.mNetwork == "i2p" %}selected{% endif %}>I2p</option>
        <option value="clearnet" {% if vars.mNetwork == "clearnet" %}selected{% endif %}>Clearnet</option>
      </select>
    </div>
  </div>

  <div class="directory__main-filter">
    <div class="custom-dropdown">
      <label class="directory__main-filter-label directory__main-filter-label-mt-6">Index</label>
      <div class="mb-3">
        <label for="indexSelect" class="d-none">Select Index</label>
        <select id="indexSelect" name="index" class="form-select directory__main-filter-input">
          <option hidden value="">Index</option>
          <option value="all" {% if vars.mIndex == "all" %}selected{% endif %}>All</option>
          <option value="general" {% if vars.mIndex == "general" %}selected{% endif %}>General</option>
          <option value="leak" {% if vars.mIndex == "monitor" %}selected{% endif %}>Leak</option>
        </select>
      </div>
    </div>
  </div>

  <div class="directory__main-filter">
    <div class="custom-dropdown">
      <label class="directory__main-filter-label directory__main-filter-label-mt-6">Content</label>
      <label for="contentTypeSelect" class="d-none">Select Content Type</label>
      <select id="contentTypeSelect" name="content_type" class="form-select directory__main-filter-input">
        <option value="all" {% if vars.mContentType == "all" %}selected{% endif %}>All</option>
        <option value="general" {% if vars.mContentType == "general" %}selected{% endif %}>General</option>
        <option value="forums" {% if vars.mContentType == "forums" %}selected{% endif %}>Forums</option>
        <option value="news" {% if vars.mContentType == "news" %}selected{% endif %}>News</option>
        <option value="stolen" {% if vars.mContentType == "stolen" %}selected{% endif %}>Stolen</option>
        <option value="drugs" {% if vars.mContentType == "drugs" %}selected{% endif %}>Drugs</option>
        <option value="hacking" {% if vars.mContentType == "hacking" %}selected{% endif %}>Hacking</option>
        <option value="marketplaces" {% if vars.mContentType == "marketplaces" %}selected{% endif %}>Marketplaces</option>
        <option value="cryptocurrency" {% if vars.mContentType == "cryptocurrency" %}selected{% endif %}>Cryptocurrency
        </option>
        <option value="leaks" {% if vars.mContentType == "leaks" %}selected{% endif %}>Leaks</option>
        <option value="adult" {% if vars.mContentType == "adult" %}selected{% endif %}>Adult</option>
      </select>
    </div>
  </div>

<div class="directory__main-filter-submit d-flex flex-column">
  <a href="/directory" class="btn btn-secondary mb-4 directory__main-submit-button">
    Reset
  </a>
  <button type="submit" class="directory__main-submit-button btn btn-primary">
    Apply
  </button>
</div>
</form>
