<form class="disable-highlight clear-paddings directory__header-pagination-form" action="" method="GET">
  <input type="hidden" name="page" value="{{ vars.page }}">
  <div>
    <ul class="directory-pagination">
      <li class="{% if vars.page == 1 %}disabled{% endif %}">
        <button class="directory-pagination-navbtn" type="submit" name="page" value="1" {% if vars.page == 1 %}disabled{% endif %}>
          <img src="{{ url_for('static', path='trustly/images/nav-first.svg') }}" alt="start">
        </button>
      </li>

      <li class="{% if vars.page == 1 %}disabled{% endif %}">
        <button class="directory-pagination-navbtn" type="submit" name="page" value="{{ vars.page - 1 }}" {% if vars.page == 1 %}disabled{% endif %}>
          <img src="{{ url_for('static', path='trustly/images/nav-prev.svg') }}" alt="prev">
        </button>
      </li>

      {% for var_i in vars.mPagination %}
          <li class="{% if var_i == vars.page %}active{% endif %}">
              <button class="directory-pagination-navbtn"
                      type="submit"
                      name="page"
                      value="{{ var_i }}"
                      {% if var_i == vars.page %}disabled{% endif %}>
                  {{ var_i }}
              </button>
          </li>
      {% endfor %}

      <li class="{% if vars.page == vars.mTotalPage %}disabled{% endif %}">
        <button class="directory-pagination-navbtn" type="submit" name="page" value="{{ vars.page + 1 }}" {% if vars.page == 1 %}disabled{% endif %}>
          <img src="{{ url_for('static', path='trustly/images/nav-next.svg') }}" alt="next">
        </button>
      </li>

      <li class="{% if page == mTotalPage %}disabled{% endif %}">
        <button class="directory-pagination-navbtn" type="submit" name="page" value="{{ mTotalPage }}" {% if page == mTotalPage %}disabled{% endif %}>
          <img src="{{ url_for('static', path='trustly/images/nav-last.svg') }}"  alt="end">
        </button>
      </li>
    </ul>
  </div>
</form>
