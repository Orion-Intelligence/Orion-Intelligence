<div class="login"></div>
<img src="{{ url_for('static', path='trustly/images/Bg.png') }}" alt="back" class="login-background">

<div id="content" class="auth_form__container">
  <div class="auth_form__sub__container">
    <div class="d-flex justify-content-center">
      <img src="{{ url_for('static', path='trustly/images/home-logo.svg') }}" alt="" width="232" height="41">
    </div>
    <form action="/login" method="post" class="auth_form-form demo_auth_form">
      <div class="auth_form__form-row">
        <input type="text" id="id_username" name="username" class="auth_form__input auth_form__input--text auth_form__input-user" value="admin">
      </div>
      <div class="auth_form__form-row">
        <input type="password" id="id_password" name="password" class="auth_form__input" placeholder="Password" required>
      </div>
      <div class="submit-row">
        <input type="submit" class="auth_form__form-button" value="Log in"/>
      </div>
    </form>
  </div>
</div>
<footer class="auth_form__footer"></footer>
