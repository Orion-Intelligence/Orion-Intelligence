name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq docker-compose python3
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
          echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - run: |
          set -euo pipefail
          cd client
          npm install
          npx ng build

      - run: |
          set -euo pipefail
          echo "=== checking client build folder ==="
          if [ -d "client/build" ]; then
            echo "SUCCESS: client/build exists"
            find client/build -maxdepth 4 -type d -print || true
            find client/build -maxdepth 2 -type f -print | head -n 200 || true
          else
            echo "FAIL: client/build does not exist"
            ls -la client || true
            find client -maxdepth 3 -type d \( -name build -o -name dist -o -name public \) -print || true
            exit 1
          fi

      - run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh build -d

      - id: compose_loc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          targets = {"docker-compose.yml","docker-compose.yaml","compose.yml","compose.yaml"}
          found = None
          for root, dirs, files in os.walk("."):
            if root.count(os.sep) > 6:
              dirs[:] = []
              continue
            for f in files:
              if f in targets:
                found = os.path.abspath(os.path.join(root, f))
                break
            if found:
              break
          if not found:
            print("No compose file found", file=sys.stderr)
            sys.exit(1)
          d = os.path.dirname(found)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
            fp.write(f"dir={d}\n")
            fp.write(f"file={found}\n")
          print(found)
          PY

      - env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path(".env").write_text(os.environ["ENV_FILE"], encoding="utf-8")
          PY
          test -s .env

      - run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

      - run: |
          set -euo pipefail
          docker network inspect shared_bridge >/dev/null 2>&1 || docker network create shared_bridge

      - run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          export COMPOSE_PROJECT_NAME="ci_${{ github.run_id }}_${{ github.run_attempt }}"
          docker-compose -f "${{ steps.compose_loc.outputs.file }}" up -d --build

      - run: |
          set -euo pipefail
          echo "=== waiting for app (not 000 and not 502) ==="
          for i in $(seq 1 180); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080 || echo 000)"
            echo "http_code=$code"
            if [ "$code" != "000" ] && [ "$code" != "502" ]; then
              echo "READY"
              exit 0
            fi
            if [ $((i % 12)) -eq 0 ]; then
              docker ps --format 'table {{.Names}}\t{{.Ports}}\t{{.Status}}' || true
              docker logs trusted-web-main --tail=200 || true
              docker logs trusted-web-nginx --tail=200 || true
            fi
            sleep 5
          done
          echo "FAIL: app not ready"
          docker ps --format 'table {{.Names}}\t{{.Ports}}\t{{.Status}}' || true
          docker logs trusted-web-main --tail=5000 || true
          docker logs trusted-web-nginx --tail=5000 || true
          docker logs trusted-web-elastic --tail=5000 || true
          docker logs trustly-web-mongodb --tail=5000 || true
          docker logs trusted-web-arangodb --tail=5000 || true
          docker logs trusted-web-redis --tail=5000 || true
          exit 1

      - run: |
          set -euo pipefail
          cd client
          npm ci --include=dev || npm install --include=dev
          npx cypress verify
          npx cypress run --browser chrome --config baseUrl="http://127.0.0.1:8080"

      - run: |
          set -euo pipefail
          npm install -g lighthouse@11.7.1

      - run: |
          set -euo pipefail
          mkdir -p lighthouse-results
          lighthouse http://127.0.0.1:8080 \
            --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage" \
            --output=json \
            --output=html \
            --output-path=./lighthouse-results/lighthouse-report \
            --only-categories=performance,accessibility,best-practices,seo

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results/
          retention-days: 7

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            client/cypress/screenshots/
            client/cypress/videos/
          retention-days: 7

      - if: always()
        run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true
