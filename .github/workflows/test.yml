name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq docker-compose python3
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
          echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - run: |
          set -euo pipefail
          cd client
          npm install
          npx ng build --configuration=instrumented

      - run: |
          set -euo pipefail
          echo "=== checking client build folder ==="
          if [ -d "client/build" ]; then
            find client/build -maxdepth 4 -type d -print || true
            find client/build -maxdepth 2 -type f -print | head -n 200 || true
          else
            exit 1
          fi

      - run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh build -b

      - id: compose_loc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          targets = {"docker-compose.yml","docker-compose.yaml","compose.yml","compose.yaml"}
          found = None
          for root, dirs, files in os.walk("."):
            if root.count(os.sep) > 6:
              dirs[:] = []
              continue
            for f in files:
              if f in targets:
                found = os.path.abspath(os.path.join(root, f))
                break
            if found:
              break
          if not found:
            sys.exit(1)
          d = os.path.dirname(found)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
            fp.write(f"dir={d}\n")
            fp.write(f"file={found}\n")
          PY

      - env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path(".env").write_text(os.environ["ENV_FILE"], encoding="utf-8")
          PY
          test -s .env

      - run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

      - run: |
          set -euo pipefail
          docker network inspect shared_bridge >/dev/null 2>&1 || docker network create shared_bridge

      - run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          export COMPOSE_PROJECT_NAME="ci_${{ github.run_id }}_${{ github.run_attempt }}"
          docker-compose -f "${{ steps.compose_loc.outputs.file }}" up -d --build

      - run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080 || echo 000)"
            if [ "$code" != "000" ] && [ "$code" != "502" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - run: |
          set -euo pipefail
          cd client
          npm ci --include=dev || npm install --include=dev
          npx cypress verify
          CYPRESS=true npx cypress run --browser chrome --config baseUrl="http://127.0.0.1:8080"

      - run: |
          set -euo pipefail
          test -f client/coverage/lcov.info

      - run: |
          set -euo pipefail
          docker exec trusted-web-main sh -lc 'ls -la /app && ls -la /app/.coverage* || true'
          docker exec trusted-web-main sh -lc 'coverage combine || true'
          docker exec trusted-web-main sh -lc 'coverage xml -o /app/backend-coverage.xml || true'
          docker exec trusted-web-main sh -lc 'test -f /app/backend-coverage.xml'

      - run: |
          set -euo pipefail
          docker cp trusted-web-main:/app/backend-coverage.xml backend-coverage.xml

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: |
            client/coverage/lcov.info
            backend-coverage.xml

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            client/cypress/screenshots/
            client/cypress/videos/
          retention-days: 7

      - if: always()
        run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true
