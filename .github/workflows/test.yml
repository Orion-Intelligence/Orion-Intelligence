name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq docker-compose python3
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
          echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - run: |
          set -euo pipefail
          cd client
          export npm_config_loglevel=error
          export NODE_OPTIONS=--no-deprecation
          npm install
          npx ng build --configuration=instrumented

      - run: |
          set -euo pipefail
          echo "=== checking client build folder ==="
          if [ -d "client/build" ]; then
            find client/build -maxdepth 4 -type d -print || true
            find client/build -maxdepth 2 -type f -print | head -n 200 || true
          else
            exit 1
          fi

      - run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh build -b

      - id: compose_loc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          targets = {"docker-compose.yml","docker-compose.yaml","compose.yml","compose.yaml"}
          found = None
          for root, dirs, files in os.walk("."):
            if root.count(os.sep) > 6:
              dirs[:] = []
              continue
            for f in files:
              if f in targets:
                found = os.path.abspath(os.path.join(root, f))
                break
            if found:
              break
          if not found:
            sys.exit(1)
          d = os.path.dirname(found)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
            fp.write(f"dir={d}\n")
            fp.write(f"file={found}\n")
          PY

      - env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(".env")
          p.write_text(os.environ["ENV_FILE"], encoding="utf-8")
          with p.open("a", encoding="utf-8") as fp:
            fp.write("\nCOVERAGE_PROCESS_START=/app/.coveragerc\n")
            fp.write("COVERAGE_FILE=/app/.coverage\n")
            fp.write("TESTING_ENABLED=1\n")
          PY
          test -s .env

      - run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

      - run: |
          set -euo pipefail
          docker network inspect shared_bridge >/dev/null 2>&1 || docker network create shared_bridge

      - run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          export COMPOSE_PROJECT_NAME="ci_${{ github.run_id }}_${{ github.run_attempt }}"
          docker-compose -f "${{ steps.compose_loc.outputs.file }}" up -d --build

      - run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080 || echo 000)"
            if [ "$code" != "000" ] && [ "$code" != "502" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - run: |
          set -euo pipefail
          cd client
          export npm_config_loglevel=error
          export NODE_OPTIONS=--no-deprecation
          mkdir -p cypress/screenshots cypress/videos coverage
          npm ci --include=dev || npm install --include=dev
          npx cypress verify
          CYPRESS=true npx cypress run --browser chrome --config baseUrl="http://127.0.0.1:8080"

      - run: |
          set -euo pipefail
          test -s client/coverage/lcov.info

      - name: Run backend static tests with coverage
        run: |
          set -euo pipefail
          docker exec trusted-web-main sh -lc '
            set -e
            cd /app
            python -m pip install --quiet pytest pytest-cov
            TESTING_ENABLED=1 PYTHONPATH=/app python -m pytest -q tests/static \
              -m static --maxfail=1 --disable-warnings
          '

      - name: Run backend journey tests with coverage append
        run: |
          set -euo pipefail
          docker exec trusted-web-main sh -lc '
            set -e
            cd /app
            TESTING_ENABLED=1 PYTHONPATH=/app python -m pytest -q tests/journey \
              -m journey --cov-append --maxfail=1 --disable-warnings \
              --cov-report=xml:/tmp/backend-coverage.xml
          '

      - name: Run backend crawler tests with coverage append
        run: |
          set -euo pipefail
          docker exec trusted-web-main sh -lc '
            set -e
            cd /app
            TESTING_ENABLED=1 PYTHONPATH=/app python -m pytest -q tests/crawler \
              --cov-append --maxfail=1 --disable-warnings \
              --cov-report=xml:/tmp/backend-coverage.xml
          '

      - name: Generate backend coverage report
        run: |
          set -euo pipefail
          docker cp trusted-web-main:/tmp/backend-coverage.xml backend/coverage.xml
          test -s backend/coverage.xml

      - name: Upload combined coverage to Codacy
        if: always()
        id: codacy_reports
        run: |
          set -euo pipefail
          reports=""
          if [ -s client/coverage/lcov.info ]; then
            reports="client/coverage/lcov.info"
          fi
          if [ -s backend/coverage.xml ]; then
            if [ -n "$reports" ]; then
              reports="${reports},backend/coverage.xml"
            else
              reports="backend/coverage.xml"
            fi
          fi
          echo "reports=${reports}" >> "$GITHUB_OUTPUT"

      - name: Upload combined coverage to Codacy
        if: always() && steps.codacy_reports.outputs.reports != ''
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.codacy_reports.outputs.reports }}

      - name: Build merged coverage summary (client + backend)
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          lcov_path = root / "client" / "coverage" / "lcov.info"
          backend_xml = root / "backend" / "coverage.xml"
          out_dir = root / "coverage-merged"
          out_dir.mkdir(parents=True, exist_ok=True)

          client_total = 0
          client_covered = 0
          if lcov_path.exists() and lcov_path.stat().st_size > 0:
            # Parse LCOV line coverage.
            for raw in lcov_path.read_text(encoding="utf-8", errors="ignore").splitlines():
              if raw.startswith("DA:"):
                _, pair = raw.split("DA:", 1)
                parts = pair.split(",")
                if len(parts) != 2:
                  continue
                hits = int(parts[1])
                client_total += 1
                if hits > 0:
                  client_covered += 1

          backend_total = 0
          backend_covered = 0
          if backend_xml.exists() and backend_xml.stat().st_size > 0:
            # Parse backend Cobertura line coverage.
            cov = ET.parse(backend_xml).getroot()
            backend_total = int(cov.attrib.get("lines-valid", "0"))
            backend_covered = int(cov.attrib.get("lines-covered", "0"))

          if (client_total + backend_total) == 0:
            raise SystemExit("No client or backend coverage files were produced")

          total_lines = client_total + backend_total
          covered_lines = client_covered + backend_covered
          pct = (covered_lines / total_lines * 100.0) if total_lines else 0.0

          summary = {
            "client": {
              "covered_lines": client_covered,
              "total_lines": client_total,
              "line_coverage_percent": round((client_covered / client_total * 100.0) if client_total else 0.0, 2),
            },
            "backend": {
              "covered_lines": backend_covered,
              "total_lines": backend_total,
              "line_coverage_percent": round((backend_covered / backend_total * 100.0) if backend_total else 0.0, 2),
            },
            "combined": {
              "covered_lines": covered_lines,
              "total_lines": total_lines,
              "line_coverage_percent": round(pct, 2),
            },
          }

          (out_dir / "coverage-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          (out_dir / "coverage-summary.md").write_text(
            "\n".join(
              [
                "# Combined Coverage Summary",
                "",
                f"- Client (LCOV): {summary['client']['covered_lines']}/{summary['client']['total_lines']} ({summary['client']['line_coverage_percent']}%)",
                f"- Backend (Cobertura XML): {summary['backend']['covered_lines']}/{summary['backend']['total_lines']} ({summary['backend']['line_coverage_percent']}%)",
                f"- Combined: {summary['combined']['covered_lines']}/{summary['combined']['total_lines']} ({summary['combined']['line_coverage_percent']}%)",
                "",
              ]
            ),
            encoding="utf-8",
          )

          print((out_dir / "coverage-summary.md").read_text(encoding="utf-8"))
          PY

      - name: Detect artifact files
        if: always()
        id: artifact_files
        run: |
          set -euo pipefail
          has_cypress=false
          has_coverage=false

          if find client/cypress/screenshots client/cypress/videos -type f 2>/dev/null | grep -q .; then
            has_cypress=true
          fi

          if [ -s backend/coverage.xml ] || [ -s coverage-merged/coverage-summary.json ] || [ -s coverage-merged/coverage-summary.md ]; then
            has_coverage=true
          fi

          {
            echo "has_cypress=${has_cypress}"
            echo "has_coverage=${has_coverage}"
          } >> "$GITHUB_OUTPUT"

      - if: always() && steps.artifact_files.outputs.has_cypress == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            client/cypress/screenshots/
            client/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7

      - if: always() && steps.artifact_files.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            backend/coverage.xml
            coverage-merged/coverage-summary.json
            coverage-merged/coverage-summary.md
          if-no-files-found: ignore
          retention-days: 7

      - if: always()
        run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true
