name: Build & Lighthouse

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  build_and_lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq docker-compose python3
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
          echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - run: |
          set -euo pipefail
          cd client
          npm install
          npx ng build

      - run: |
          set -euo pipefail
          echo "=== checking client build folder ==="
          if [ -d "client/build" ]; then
            echo "SUCCESS: client/build exists"
            echo "=== tree client/build (depth 4) ==="
            find client/build -maxdepth 4 -type d -print || true
            echo "=== files sample ==="
            find client/build -maxdepth 2 -type f -print | head -n 200 || true
          else
            echo "FAIL: client/build does not exist"
            echo "=== client dir listing ==="
            ls -la client || true
            echo "=== search possible output dirs ==="
            find client -maxdepth 3 -type d \( -name build -o -name dist -o -name public \) -print || true
            exit 1
          fi

      - run: |
          ./run.sh build -b
