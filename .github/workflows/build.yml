name: Build & Lighthouse

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  build_and_lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq docker-compose python3
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
          echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh build -d

      - id: compose_loc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          targets = {"docker-compose.yml","docker-compose.yaml","compose.yml","compose.yaml"}
          found = None
          for root, dirs, files in os.walk("."):
            if root.count(os.sep) > 6:
              dirs[:] = []
              continue
            for f in files:
              if f in targets:
                found = os.path.abspath(os.path.join(root, f))
                break
            if found:
              break
          if not found:
            print("No compose file found", file=sys.stderr)
            sys.exit(1)
          d = os.path.dirname(found)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
            fp.write(f"dir={d}\n")
            fp.write(f"file={found}\n")
          print(found)
          PY

      - env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path(".env").write_text(os.environ["ENV_FILE"], encoding="utf-8")
          PY

      - run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

      - run: |
          set -euo pipefail
          docker network inspect shared_bridge >/dev/null 2>&1 || docker network create shared_bridge

      - run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          export COMPOSE_PROJECT_NAME="ci_${{ github.run_id }}_${{ github.run_attempt }}"
          docker-compose -f "${{ steps.compose_loc.outputs.file }}" up -d --build

      - run: |
          set -euo pipefail
          echo "=== docker ps (initial) ==="
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}' || true
          echo "=== docker networks ==="
          docker network ls || true
          echo "=== waiting for app (not 000 and not 502) ==="
          if ! timeout 900 bash -c 'until code=$(curl -s -o /dev/null -w '\''%{http_code}'\'' http://127.0.0.1:8080 || echo 000); echo "http_code=$code"; [ "$code" != "000" ] && [ "$code" != "502" ]; do sleep 5; done'; then
            echo "=== FAILED: app not ready ==="
            echo "=== docker ps ==="
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}' || true
            echo "=== docker inspect (health/status) ==="
            for c in trusted-web-nginx trusted-web-main trusted-web-elastic trustly-web-mongodb trusted-web-arangodb trusted-web-redis; do
              echo "--- inspect: $c ---"
              docker inspect "$c" --format '{{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' 2>/dev/null || true
            done
            echo "=== docker compose ps ==="
            cd "${{ steps.compose_loc.outputs.dir }}"
            docker-compose -f "${{ steps.compose_loc.outputs.file }}" ps || true
            echo "=== docker logs (tail 2000) ==="
            for c in trusted-web-nginx trusted-web-main trusted-web-elastic trustly-web-mongodb trusted-web-arangodb trusted-web-redis; do
              echo "--- logs: $c ---"
              docker logs "$c" --tail=2000 2>/dev/null || true
            done
            echo "=== docker events (last 2m) ==="
            timeout 10 docker events --since 2m --until 0s 2>/dev/null || true
            echo "=== docker stats (one-shot) ==="
            docker stats --no-stream 2>/dev/null || true
            echo "=== netstat/ss listening ports ==="
            ss -ltnp 2>/dev/null || true
            echo "=== curl verbose ==="
            curl -v http://127.0.0.1:8080 || true
            echo "=== curl to upstream container (if reachable) ==="
            docker exec trusted-web-nginx sh -lc 'curl -v http://web:8070 || true' 2>/dev/null || true
            exit 1
          fi

      - run: |
          set -euo pipefail
          npm install -g lighthouse@11.7.1

      - run: |
          set -euo pipefail
          mkdir -p lighthouse-results
          lighthouse http://127.0.0.1:8080 \
            --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage" \
            --output=json \
            --output=html \
            --output-path=./lighthouse-results/lighthouse-report \
            --only-categories=performance,accessibility,best-practices,seo

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results/
          retention-days: 7

      - if: always()
        run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          export COMPOSE_PROJECT_NAME="ci_${{ github.run_id }}_${{ github.run_attempt }}"
          docker-compose -f "${{ steps.compose_loc.outputs.file }}" down -v --remove-orphans || true
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
