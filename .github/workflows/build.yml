name: Build & Lighthouse

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  build_and_lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq docker-compose python3
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
          echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh build -d

      - id: compose_loc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          targets = {"docker-compose.yml","docker-compose.yaml","compose.yml","compose.yaml"}
          found = None
          for root, dirs, files in os.walk("."):
            if root.count(os.sep) > 6:
              dirs[:] = []
              continue
            for f in files:
              if f in targets:
                found = os.path.abspath(os.path.join(root, f))
                break
            if found:
              break
          if not found:
            sys.exit(1)
          d = os.path.dirname(found)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fp:
            fp.write(f"dir={d}\n")
            fp.write(f"file={found}\n")
          PY

      - env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path(".env").write_text(os.environ["ENV_FILE"], encoding="utf-8")
          PY

      - run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true

      - run: |
          set -euo pipefail
          docker network inspect shared_bridge >/dev/null 2>&1 || docker network create shared_bridge

      - run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          python3 - <<'PY'
          import pathlib
          pathlib.Path("ci.override.yml").write_text(
          'version: "3.8"\n'
          'services:\n'
          '  web:\n'
          '    networks:\n'
          '      backend:\n'
          '        ipv4_address: 172.20.1.2\n'
          '      shared_bridge: {}\n',
          encoding="utf-8")
          PY

      - run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          export COMPOSE_PROJECT_NAME="ci_${{ github.run_id }}_${{ github.run_attempt }}"
          docker-compose -f "${{ steps.compose_loc.outputs.file }}" -f ci.override.yml up -d --build

      - run: |
          set -euo pipefail
          if ! timeout 900 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080 || echo 000)" != "000" ] && [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080 || echo 000)" != "502" ]; do sleep 5; done'; then
            docker ps --format "table {{.Names}}\t{{.Ports}}\t{{.Status}}" || true
            docker logs trusted-web-nginx --tail=300 || true
            docker logs trusted-web-main --tail=300 || true
            exit 1
          fi

      - run: |
          set -euo pipefail
          npm install -g lighthouse@11.7.1

      - run: |
          set -euo pipefail
          mkdir -p lighthouse-results
          lighthouse http://127.0.0.1:8080 \
            --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage" \
            --output=json \
            --output=html \
            --output-path=./lighthouse-results/lighthouse-report \
            --only-categories=performance,accessibility,best-practices,seo

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results/
          retention-days: 7

      - if: always()
        run: |
          set -euo pipefail
          cd "${{ steps.compose_loc.outputs.dir }}"
          export COMPOSE_PROJECT_NAME="ci_${{ github.run_id }}_${{ github.run_attempt }}"
          docker-compose -f "${{ steps.compose_loc.outputs.file }}" -f ci.override.yml down -v --remove-orphans || true
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
