name: Codacy Repository Analysis

on:
  push:
    branches:
      - trusted-main
      - devel
  pull_request:
    branches:
      - trusted-main
  schedule:
    - cron: '47 6 * * 2'

permissions:
  contents: read

jobs:
  codacy-repository-analysis:
    runs-on: ubuntu-latest
    name: Codacy Repository Analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Upload Codacy repository analysis results
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          upload: true
          max-allowed-issues: 2147483647
