name: Codacy Security Scan

on:
  push:
    branches: [ "trusted-main", "devel" ]
  pull_request:
    branches: [ "trusted-main" ]
  schedule:
    - cron: '33 6 * * 2'

permissions: read-all

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4.4.5
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Debug SARIF file presence
        run: |
          echo "Checking if SARIF file was generated..."
          if [ -f results.sarif ]; then
            echo "SARIF file found:"
            ls -lh results.sarif
            echo "First few lines of SARIF file:"
            head -n 20 results.sarif
          else
            echo "ERROR: SARIF file not found!"
            exit 1
          fi

      - name: Validate SARIF file contents
        run: |
          echo "Validating SARIF file content..."
          if grep -q '"runs": \[' results.sarif; then
            echo "SARIF file appears valid."
          else
            echo "ERROR: SARIF file is empty or invalid!"
            exit 1
          fi

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3.28.9
        with:
          sarif_file: results.sarif

      - name: List workspace files (debug only)
        if: failure()
        run: |
          echo "Listing all files in workspace for debugging..."
          find . -type f
