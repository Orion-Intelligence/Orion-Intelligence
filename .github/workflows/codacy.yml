name: Codacy Security Scan

on:
  push:
    branches: ["trusted-main", "devel"]
  pull_request:
    branches: ["trusted-main"]
  schedule:
    - cron: '33 6 * * 2'

permissions: read-all

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4.4.5
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4.4.5
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Validate SARIF structure
        run: |
          echo "== Debug: Ensuring SARIF has runs =="
          if ! grep -q '"runs": \[' results.sarif; then
            echo "ERROR: SARIF missing expected 'runs' element"
            exit 1
          fi

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3.28.9
        with:
          sarif_file: results.sarif

      - name: List workspace files (on failure)
        if: failure()
        run: |
          echo "Workspace file listing for debug:"
          find . -type f

