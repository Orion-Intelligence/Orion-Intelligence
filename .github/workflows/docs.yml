name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  Docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bash curl git ca-certificates gnupg jq docker-compose python3 python3-pip
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
          echo "deb [signed-by=/usr/share/keyrings/google.gpg arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path(".env").write_text(os.environ["ENV_FILE"], encoding="utf-8")
          PY
          test -s .env

      - run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh -docs

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: |
            docs/_build/html/
            docs/screenshots/*-20260326.png
          retention-days: 7

      - if: always()
        run: |
          set -euo pipefail
          docker ps -aq | xargs -r docker rm -f || true
          docker network prune -f || true
          docker system prune -f --volumes || true
