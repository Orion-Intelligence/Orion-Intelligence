{% if mSearchCallbackMaxPagination > 1 %}
    <form class="search__pagination disable-highlight" method="GET" action="">
        <div class="search__pagination-container">
            {% if mSearchCallbackCurrentPageNumber == 1 %}
                <div class="search__pagination-navigation" disabled>
                    <img src="{% static 'backend/images/nav-prev.svg' %}" alt="nav-prev">
                </div>
            {% else %}
                <button type="submit" class="search__pagination-navigation" name="mSearchParamPage" value="1">
                    <img src="{% static 'backend/images/nav-first.svg' %}" alt="nav-first">
                </button>
                <button type="submit" class="search__pagination-navigation gc-clear-selection" name="mSearchParamPage" value="{{ mSearchCallbackCurrentPageNumber|add:-1 }}">
                    <img src="{% static 'backend/images/nav-prev.svg' %}" alt="nav-prev">
                </button>
            {% endif %}

            {% for page in mSearchCallbackPageNumber %}
                <button type="submit" class="search__navigation gc-clear-selection {% if page == mSearchCallbackCurrentPageNumber %}search__navigation--focus{% endif %}" name="mSearchParamPage" value="{{ page }}">
                    {{ page }}
                </button>
            {% endfor %}

            {% if mSearchCallbackCurrentPageNumber >= mSearchCallbackMaxPagination %}
                <div class="search__pagination-navigation" disabled>
                    &rsaquo;
                </div>
            {% else %}
                <button type="submit" class="search__pagination-navigation gc-clear-selection" name="mSearchParamPage" value="{{ mSearchCallbackCurrentPageNumber|add:1 }}">
                    <img src="{% static 'backend/images/nav-next.svg' %}" alt="nav-next">
                </button>
            {% endif %}
        </div>

        <!-- Hidden Fields -->
        <input type="hidden" name="q" value="{{ mSearchCallbackQuery }}">
        <input type="hidden" name="mSearchParamSafeSearch" value="{{ mSearchCallbackSaveSearch }}">
        <input type="hidden" name="pSearchParamType" value="{{ mSearchCallbackRelevantSearchType }}">
    </form>
{% endif %}
