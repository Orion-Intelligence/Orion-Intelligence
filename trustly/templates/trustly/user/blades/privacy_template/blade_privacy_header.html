{% load static %}

<div class="privacy__status-bar" >
    <a href="../../.." ><img class="privacy__status-image gs-disable-highlight" src="{% static 'trustly/images/favicon-home_white.png' %}" alt="Loading..."></a>

    <form method="GET" class="privacy-statusbar-form" action="../../search" >
        <input class="form-control privacy__statusbar-searchbox" maxlength="150" autocapitalize="none" autocomplete="off" type="text" name="q" placeholder="Search the web anonymously">
        <button class="privacy__searchbox-button disable-highlight" style="float: left" type="submit"><img class="privacy__searchbox-icon disable-highlight" src="{% static 'trustly/images/search-icon.png' %}" alt=""/></button>
        <input autocomplete="off" autocapitalize="none" type="hidden" class="form-control demo-login__passcode" name="mPage" value="1">
    </form>

    <div class="privacy-header--menu gs-disable-highlight">
        <span ><a href="/admin" class="privacy__statusbar-category privacy__statusbar-category--right">Login</a></span>
    </div>
</div>
