{% load static %}
<form method="GET" class="directory__main-filter-form">
  <div class="directory__main-filter">
    <div class="custom-dropdown">
      <select name="network" class="directory__main-filter-input">
        <option hidden value="">Network</option>
        <option value="all" {% if mNetwork == "all" %}selected{% endif %}>All</option>
        <option value="onion" {% if mNetwork == "onion" %}selected{% endif %}>Onion</option>
        <option value="i2p" {% if mNetwork == "i2p" %}selected{% endif %}>I2p</option>
        <option value="clearnet" {% if mNetwork == "clearnet" %}selected{% endif %}>clearnet</option>
      </select>
    </div>
  </div>

  <div class="directory__main-filter">
    <div class="custom-dropdown">
      <select name="index" class="directory__main-filter-input">
        <option hidden value="">Index</option>
        <option value="all" {% if mIndex == "all" %}selected{% endif %}>All</option>
        <option value="general" {% if mIndex == "general" %}selected{% endif %}>General</option>
        <option value="monitor" {% if mIndex == "monitor" %}selected{% endif %}>Monitor</option>
      </select>
    </div>
  </div>

  <div class="directory__main-filter">
    <div class="custom-dropdown">
      <select name="content_type" class="directory__main-filter-input">
        <option hidden value="">Content</option>
        <option value="all" {% if mContentType == "all" %}selected{% endif %}>All</option>
        <option value="general" {% if mContentType == "general" %}selected{% endif %}>General</option>
        <option value="forums" {% if mContentType == "forums" %}selected{% endif %}>Forums</option>
        <option value="news" {% if mContentType == "news" %}selected{% endif %}>News</option>
        <option value="stolen" {% if mContentType == "stolen" %}selected{% endif %}>Stolen</option>
        <option value="drugs" {% if mContentType == "drugs" %}selected{% endif %}>Drugs</option>
        <option value="hacking" {% if mContentType == "hacking" %}selected{% endif %}>Hacking</option>
        <option value="marketplaces" {% if mContentType == "marketplaces" %}selected{% endif %}>Marketplaces</option>
        <option value="cryptocurrency" {% if mContentType == "cryptocurrency" %}selected{% endif %}>Cryptocurrency</option>
        <option value="leaks" {% if mContentType == "leaks" %}selected{% endif %}>Leaks</option>
        <option value="adult" {% if mContentType == "adult" %}selected{% endif %}>Adult</option>
      </select>
    </div>
  </div>

  <div class="directory__main-filter-submit">
    <button type="submit" class="directory__main-submit-button">
      <img alt="filter" class="directory__main-filter-image" src="{% static 'trustly/images/filter_by.svg' %}">
    </button>
  </div>
</form>
