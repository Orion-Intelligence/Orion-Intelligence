{% load static %}
<form class="searchbar" method="GET" action="" enctype="multipart/form-data">
  <div class="searchbar__profile-button">
    <a href="/admin" aria-label="Go to CMS Home">
      <img src="{% static 'trustly/images/profile-icon.svg' %}" alt="Brand Logo">
    </a>
  </div>
  <div class="searchbar__logo-grid">
    <div class="searchbar__logo-container">
      <a href="../../.." class="searchbar__logo">
        <img src="{% static 'trustly/images/search-logo.svg' %}" alt="Brand Logo">
      </a>
    </div>

    <div class="searchbar__header">
      <div class="searchbar__searchbox">
        <div class="input-group">
          {% if mSearchCallbackRelevantSearchType == 'persona' %}
            <input autocomplete="off" autocapitalize="none" type="search" placeholder="Email" class="form-control searchbar__detail-header-search-input searchbar__detail-header-search-input-email" pattern="[^ ]*" maxlength="150" name="q" value="{{ mSearchCallbackQuery }}">
            <input autocomplete="off" autocapitalize="none" type="search" placeholder="Username" class="form-control searchbar__detail-header-search-input searchbar__detail-header-search-input-username" maxlength="150" name="mUsername" value="{{ mUsernameQuery }}">
          {% else %}
            <input autocomplete="off" autocapitalize="none" type="search" placeholder="Search..." class="form-control searchbar__detail-header-search-input" maxlength="150" name="q" value="{{ mSearchCallbackQuery }}">
          {% endif %}
          <input autocomplete="off" autocapitalize="none" type="hidden" name="mSearchParamPage" value="1">
          <input autocomplete="off" autocapitalize="none" type="hidden" name="mSearchParamSafeSearch" value="{{ mSearchCallbackSaveSearch }}">
          <button class="searchbar__search-button-right {% if mSearchCallbackRelevantSearchType == 'persona' %}searchbar__search-button-right-persona{% endif %}" type="submit">
            <img class="searchbar__search-button-right-icon" src="{% static 'trustly/images/magnifyingglasswhite.svg' %}" alt="Search">
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="searchbar__header-category-div">
    <span id="catagory_all">
      <button type="submit" name="pSearchParamType" value="all" class="{% if mSearchCallbackRelevantSearchType == 'all' %} searchbar__search-items-active-default {% endif %} gc-clear-selection searchbar__search-items searchbar__search-items--right disable-highlight">
        All
      </button>
    </span>
    <span id="catagory_images">
      <button type="submit" name="pSearchParamType" value="monitor" class="{% if mSearchCallbackRelevantSearchType == 'monitor' %} searchbar__search-items-active-default {% endif %} gc-clear-selection searchbar__search-items searchbar__search-items--width searchbar__search-items--left disable-highlight">
        Monitor
      </button>
    </span>
    <span id="catagory_images">
      <button type="submit" name="pSearchParamType" value="marketplaces" class="ml-3 {% if mSearchCallbackRelevantSearchType == 'marketplaces' %} searchbar__search-items-active-default {% endif %} gc-clear-selection searchbar__search-items searchbar__search-items--width searchbar__search-items--left disable-highlight">
        Market
      </button>
    </span>
    <span id="catagory_finance">
      <button type="submit" name="pSearchParamType" value="forums" class="ml-2 {% if mSearchCallbackRelevantSearchType == 'forums' %} searchbar__search-items-active-default {% endif %} gc-clear-selection searchbar__search-items searchbar__search-items--width searchbar__search-items--left disable-highlight">
        Forums
      </button>
    </span>
    <span id="catagory_news">
      <button type="submit" name="pSearchParamType" value="news" class="{% if mSearchCallbackRelevantSearchType == 'news' %} searchbar__search-items-active-default {% endif %} gc-clear-selection searchbar__search-items searchbar__search-items--left disable-highlight">
        News
      </button>
    </span>
    {% if mApiAccess == '1' %}
      <span id="catagory_email">
      <button type="submit" name="pSearchParamType" value="persona" class="{% if mSearchCallbackRelevantSearchType == 'persona' %} searchbar__search-items-active-default searchbar__search-items-persona {% endif %} gc-clear-selection searchbar__search-items searchbar__search-items--left disable-highlight searchbar__detail-header-catagories-margin-right-header">
        Email
      </button>
    </span>
    {% endif %}
    {% include 'trustly/user/blades/search_template/blade_search_header_network.html' %}

    <span id="catagory_analytics" class="searchbar__nav-right">
      <a href="/#analytics" class="searchbar__search-items searchbar__search-items--left disable-highlight searchbar__detail-header-catagories-margin-right searchbar__detail-header-catagories-margin-right-border">Analytics</a>
    </span>
    <span id="catagory_directory" class="searchbar__nav-right">
      <a href="/directory" class="searchbar__search-items searchbar__search-items--left disable-highlight searchbar__detail-header-catagories-margin-right">Links</a>
    </span>
    <span id="catagory_index" class="searchbar__nav-right">
      <a href="/" class="searchbar__search-items searchbar__search-items--left disable-highlight searchbar__detail-header-catagories-margin-right ">Home</a>
    </span>
  </div>
</form>
